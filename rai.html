rint(\"Так нельзя, выберите свободную клетку.\")\n    board[int(choice) - 1] = player\n    if any(all(board[i] == player for i in line) for line in lines):\n        show()\n        print(f\"Победил {player}!\")\n        break\n    player = \"O\" if player == \"X\" else \"X\"\nelse:\n    show()\n    print(\"Ничья!\")\n''')\n\ntask(\"guess\", r\"угада|загада\", \"Игра «Угадай число»\",\n     \"Компьютер загадывает число от 1 до 100, а вы угадываете. После каждой попытки — подсказка «больше» или «меньше».\",\n     python='''import random\n\nsecret = random.randint(1, 100)\ntries = 0\nprint(\"Я загадал число от 1 до 100. Угадайте!\")\n\nwhile True:\n    text = input(\"Ваш вариант: \")\n    if not text.isdigit():\n        print(\"Введите целое число.\")\n        continue\n    guess = int(text)\n    tries += 1\n    if guess < secret:\n        print(\"Больше!\")\n    elif guess > secret:\n        print(\"Меньше!\")\n    else:\n        print(f\"Угадали за {tries} попыток!\")\n        break\n''',\n     javascript='''const secret = Math.floor(Math.random() * 100) + 1;\nlet tries = 0;\n\nwhile (true) {\n  const text = prompt(\"Я загадал число от 1 до 100. Ваш вариант:\");\n  if (text === null) break;\n  const guess = Number(text);\n  tries++;\n  if (!Number.isInteger(guess)) {\n    alert(\"Введите целое число.\");\n  } else if (guess < secret) {\n    alert(\"Больше!\");\n  } else if (guess > secret) {\n    alert(\"Меньше!\");\n  } else {\n    alert(`Угадали за ${tries} попыток!`);\n    break;\n  }\n}\n''',\n     cpp='''#include <iostream>\n#include <cstdlib>\n#include <ctime>\n\nint main() {\n    std::srand(std::time(nullptr));\n    int secret = std::rand() % 100 + 1;\n    int guess = 0, tries = 0;\n    std::cout << \"Я загадал число от 1 до 100. Угадайте!\" << std::endl;\n    while (guess != secret) {\n        std::cout << \"Ваш вариант: \";\n        std::cin >> guess;\n        tries++;\n        if (guess < secret) std::cout << \"Больше!\" << std::endl;\n        else if (guess > secret) std::cout << \"Меньше!\" << std::endl;\n    }\n    std::cout << \"Угадали за \" << tries << \" попыток!\" << std::endl;\n    return 0;\n}\n''',\n     java='''import java.util.Random;\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        int secret = new Random().nextInt(100) + 1;\n        Scanner in = new Scanner(System.in);\n        int tries = 0;\n        System.out.println(\"Я загадал число от 1 до 100. Угадайте!\");\n        while (true) {\n            System.out.print(\"Ваш вариант: \");\n            int guess = in.nextInt();\n            tries++;\n            if (guess < secret) System.out.println(\"Больше!\");\n            else if (guess > secret) System.out.println(\"Меньше!\");\n            else { System.out.println(\"Угадали за \" + tries + \" попыток!\"); break; }\n        }\n    }\n}\n''')\n\ntask(\"calculator\", r\"калькулятор|calculator\", \"Калькулятор\",\n     \"Калькулятор: введите два числа и операцию (+, -, *, /). Деление на ноль обрабатывается.\",\n     python='''def calculate(a, op, b):\n    if op == \"+\":\n        return a + b\n    if op == \"-\":\n        return a - b\n    if op == \"*\":\n        return a * b\n    if op == \"/\":\n        if b == 0:\n            raise ZeroDivisionError(\"на ноль делить нельзя\")\n        return a / b\n    raise ValueError(f\"неизвестная операция {op}\")\n\n\nprint(\"Калькулятор. Пустая строка — выход.\")\nwhile True:\n    first = input(\"Первое число: \")\n    if not first:\n        break\n    try:\n        a = float(first)\n        op = input(\"Операция (+ - * /): \").strip()\n        b = float(input(\"Второе число: \"))\n        print(\"Ответ:\", calculate(a, op, b))\n    except ValueError as e:\n        print(\"Ошибка:\", e)\n    except ZeroDivisionError as e:\n        print(\"Ошибка:\", e)\n''',\n     html='''<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Калькулятор<\/title>\n<style>\n  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0c; font: 20px system-ui, sans-serif; }\n  .calc { background: #151517; padding: 16px; border-radius: 18px; width: 280px; border: 1px solid #2a2a2e; }\n  #display { width: 100%; box-sizing: border-box; font-size: 32px; text-align: right; padding: 12px; border: 0; border-radius: 10px; background: #0b0b0c; color: #fff; margin-bottom: 12px; }\n  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }\n  button { padding: 16px 0; font-size: 20px; border: 0; border-radius: 10px; background: #26262a; color: #fff; cursor: pointer; }\n  button.op { background: #e10600; }\n  button.wide { grid-column: span 2; }\n<\/style>\n<\/head>\n<body>\n<div class=\"calc\">\n  <input id=\"display\" readonly value=\"0\">\n  <div class=\"keys\" id=\"keys\"><\/div>\n<\/div>\n<script>\nconst display = document.getElementById(\"display\");\nconst layout = [\"C\", \"(\", \")\", \"/\", \"7\", \"8\", \"9\", \"*\", \"4\", \"5\", \"6\", \"-\", \"1\", \"2\", \"3\", \"+\", \"0\", \".\", \"=\"];\nlet expr = \"\";\n\nfunction press(key) {\n  if (key === \"C\") expr = \"\";\n  else if (key === \"=\") {\n    try {\n      if (!/^[\\\\d+\\\\-*/().\\\\s]+$/.test(expr)) throw new Error();\n      expr = String(Function('\"use strict\"; return (' + expr + ')')());\n    } catch (e) {\n      expr = \"\";\n      display.value = \"Ошибка\";\n      return;\n    }\n  } else expr += key;\n  display.value = expr || \"0\";\n}\n\nlayout.forEach(key => {\n  const b = document.createElement(\"button\");\n  b.textContent = key;\n  if (\"/*-+=\".includes(key)) b.className = \"op\";\n  if (key === \"0\") b.className = \"wide\";\n  b.onclick = () => press(key);\n  document.getElementById(\"keys\").append(b);\n});\ndocument.addEventListener(\"keydown\", e => {\n  if (/^[\\\\d+\\\\-*/().]$/.test(e.key)) press(e.key);\n  if (e.key === \"Enter\") press(\"=\");\n  if (e.key === \"Escape\" || e.key === \"Backspace\") press(\"C\");\n});\n<\/script>\n<\/body>\n<\/html>\n''',\n     cpp='''#include <iostream>\n\nint main() {\n    double a, b;\n    char op;\n    std::cout << \"Введите выражение, например 2 + 3: \";\n    std::cin >> a >> op >> b;\n    switch (op) {\n        case '+': std::cout << a + b << std::endl; break;\n        case '-': std::cout << a - b << std::endl; break;\n        case '*': std::cout << a * b << std::endl; break;\n        case '/':\n            if (b == 0) std::cout << \"На ноль делить нельзя\" << std::endl;\n            else std::cout << a / b << std::endl;\n            break;\n        default: std::cout << \"Неизвестная операция\" << std::endl;\n    }\n    return 0;\n}\n''',\n     javascript='''function calculate(a, op, b) {\n  switch (op) {\n    case \"+\": return a + b;\n    case \"-\": return a - b;\n    case \"*\": return a * b;\n    case \"/\":\n      if (b === 0) throw new Error(\"на ноль делить нельзя\");\n      return a / b;\n    default: throw new Error(\"неизвестная операция \" + op);\n  }\n}\n\nconsole.log(calculate(2, \"+\", 3));   // 5\nconsole.log(calculate(10, \"/\", 4));  // 2.5\nconsole.log(calculate(6, \"*\", 7));   // 42\n''')\n\ntask(\"fizzbuzz\", r\"fizz|физз\", \"FizzBuzz\",\n     \"Числа от 1 до 100: вместо кратных 3 — Fizz, кратных 5 — Buzz, кратных 15 — FizzBuzz.\",\n     python='''for i in range(1, 101):\n    if i % 15 == 0:\n        print(\"FizzBuzz\")\n    elif i % 3 == 0:\n        print(\"Fizz\")\n    elif i % 5 == 0:\n        print(\"Buzz\")\n    else:\n        print(i)\n''',\n     javascript='''for (let i = 1; i <= 100; i++) {\n  if (i % 15 === 0) console.log(\"FizzBuzz\");\n  else if (i % 3 === 0) console.log(\"Fizz\");\n  else if (i % 5 === 0) console.log(\"Buzz\");\n  else console.log(i);\n}\n''',\n     php='''<?php\nfor ($i = 1; $i <= 100; $i++) {\n    if ($i % 15 === 0) echo \"FizzBuzz\\\\n\";\n    elseif ($i % 3 === 0) echo \"Fizz\\\\n\";\n    elseif ($i % 5 === 0) echo \"Buzz\\\\n\";\n    else echo $i . \"\\\\n\";\n}\n''',\n     cpp='''#include <iostream>\n\nint main() {\n    for (int i = 1; i <= 100; i++) {\n        if (i % 15 == 0) std::cout << \"FizzBuzz\\\\n\";\n        else if (i % 3 == 0) std::cout << \"Fizz\\\\n\";\n        else if (i % 5 == 0) std::cout << \"Buzz\\\\n\";\n        else std::cout << i << \"\\\\n\";\n    }\n}\n''',\n     java='''public class Main {\n    public static void main(String[] args) {\n        for (int i = 1; i <= 100; i++) {\n            if (i % 15 == 0) System.out.println(\"FizzBuzz\");\n            else if (i % 3 == 0) System.out.println(\"Fizz\");\n            else if (i % 5 == 0) System.out.println(\"Buzz\");\n            else System.out.println(i);\n        }\n    }\n}\n''')\n\ntask(\"fibonacci\", r\"фибоначч|fibonacci\", \"Числа Фибоначчи\",\n     \"Первые N чисел Фибоначчи: каждое следующее — сумма двух предыдущих.\",\n     python='''def fibonacci(n):\n    \"\"\"Вернуть список из первых n чисел Фибоначчи.\"\"\"\n    numbers = []\n    a, b = 0, 1\n    for _ in range(n):\n        numbers.append(a)\n        a, b = b, a + b\n    return numbers\n\n\nprint(fibonacci(15))\n''',\n     javascript='''function fibonacci(n) {\n  const numbers = [];\n  let a = 0, b = 1;\n  for (let i = 0; i < n; i++) {\n    numbers.push(a);\n    [a, b] = [b, a + b];\n  }\n  return numbers;\n}\n\nconsole.log(fibonacci(15).join(\", \"));\n''',\n     cpp='''#include <iostream>\n\nint main() {\n    long long a = 0, b = 1;\n    for (int i = 0; i < 15; i++) {\n        std::cout << a << \" \";\n        long long next = a + b;\n        a = b;\n        b = next;\n    }\n    std::cout << std::endl;\n}\n''',\n     java='''public class Main {\n    public static void main(String[] args) {\n        long a = 0, b = 1;\n        for (int i = 0; i < 15; i++) {\n            System.out.print(a + \" \");\n            long next = a + b;\n            a = b;\n            b = next;\n        }\n    }\n}\n''',\n     php='''<?php\nfunction fibonacci(int $n): array {\n    $numbers = [];\n    [$a, $b] = [0, 1];\n    for ($i = 0; $i < $n; $i++) {\n        $numbers[] = $a;\n        [$a, $b] = [$b, $a + $b];\n    }\n    return $numbers;\n}\n\necho implode(\", \", fibonacci(15));\n''')\n\ntask(\"factorial\", r\"факториал|factorial\", \"Факториал\",\n     \"Факториал n! = 1 · 2 · … · n. Два способа: циклом и рекурсией.\",\n     python='''def factorial(n):\n    \"\"\"Факториал циклом.\"\"\"\n    result = 1\n    for i in range(2, n + 1):\n        result *= i\n    return result\n\n\ndef factorial_recursive(n):\n    \"\"\"Факториал рекурсией.\"\"\"\n    return 1 if n <= 1 else n * factorial_recursive(n - 1)\n\n\nfor n in (0, 1, 5, 10):\n    print(f\"{n}! = {factorial(n)} = {factorial_recursive(n)}\")\n''',\n     javascript='''const factorial = n => (n <= 1 ? 1 : n * factorial(n - 1));\n\n[0, 1, 5, 10].forEach(n => console.log(`${n}! = ${factorial(n)}`));\n''',\n     cpp='''#include <iostream>\n\nunsigned long long factorial(int n) {\n    return n <= 1 ? 1 : n * factorial(n - 1);\n}\n\nint main() {\n    for (int n : {0, 1, 5, 10}) std::cout << n << \"! = \" << factorial(n) << std::endl;\n}\n''',\n     java='''public class Main {\n    static long factorial(int n) {\n        return n <= 1 ? 1 : n * factorial(n - 1);\n    }\n\n    public static void main(String[] args) {\n        for (int n : new int[]{0, 1, 5, 10}) System.out.println(n + \"! = \" + factorial(n));\n    }\n}\n''')\n\ntask(\"prime\", r\"прост\\w* числ|prime\", \"Простые числа\",\n     \"Проверка числа на простоту и список простых чисел до 100 (решето Эратосфена).\",\n     python='''def is_prime(n):\n    if n < 2:\n        return False\n    i = 2\n    while i * i <= n:\n        if n % i == 0:\n            return False\n        i += 1\n    return True\n\n\ndef primes_up_to(limit):\n    \"\"\"Решето Эратосфена.\"\"\"\n    sieve = [True] * (limit + 1)\n    sieve[0:2] = [False, False]\n    for i in range(2, int(limit ** 0.5) + 1):\n        if sieve[i]:\n            for j in range(i * i, limit + 1, i):\n                sieve[j] = False\n    return [i for i, ok in enumerate(sieve) if ok]\n\n\nprint(is_prime(97), is_prime(100))\nprint(primes_up_to(100))\n''',\n     javascript='''function isPrime(n) {\n  if (n < 2) return false;\n  for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;\n  return true;\n}\n\nconst primes = [];\nfor (let n = 2; n <= 100; n++) if (isPrime(n)) primes.push(n);\nconsole.log(primes.join(\", \"));\n''',\n     cpp='''#include <iostream>\n\nbool isPrime(int n) {\n    if (n < 2) return false;\n    for (int i = 2; i * i <= n; i++) if (n % i == 0) return false;\n    return true;\n}\n\nint main() {\n    for (int n = 2; n <= 100; n++) if (isPrime(n)) std::cout << n << \" \";\n    std::cout << std::endl;\n}\n''')\n\ntask(\"sort\", r\"сортир|sort|пузырьк\", \"Сортировка\",\n     \"Сортировка пузырьком (чтобы понять алгоритм) и встроенная сортировка (для работы).\",\n     python='''def bubble_sort(items):\n    \"\"\"Сортировка пузырьком: меняем соседей местами, пока список не упорядочится.\"\"\"\n    items = list(items)\n    for end in range(len(items) - 1, 0, -1):\n        swapped = False\n        for i in range(end):\n            if items[i] > items[i + 1]:\n                items[i], items[i + 1] = items[i + 1], items[i]\n                swapped = True\n        if not swapped:\n            break\n    return items\n\n\nnumbers = [5, 3, 8, 1, 9, 2]\nprint(\"Пузырьком:\", bubble_sort(numbers))\nprint(\"Встроенная:\", sorted(numbers))\nprint(\"По убыванию:\", sorted(numbers, reverse=True))\n''',\n     javascript='''function bubbleSort(items) {\n  const a = [...items];\n  for (let end = a.length - 1; end > 0; end--) {\n    let swapped = false;\n    for (let i = 0; i < end; i++) {\n      if (a[i] > a[i + 1]) {\n        [a[i], a[i + 1]] = [a[i + 1], a[i]];\n        swapped = true;\n      }\n    }\n    if (!swapped) break;\n  }\n  return a;\n}\n\nconst numbers = [5, 3, 8, 1, 9, 2];\nconsole.log(\"Пузырьком:\", bubbleSort(numbers));\nconsole.log(\"Встроенная:\", [...numbers].sort((x, y) => x - y));\n''',\n     cpp='''#include <algorithm>\n#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int> numbers = {5, 3, 8, 1, 9, 2};\n    std::sort(numbers.begin(), numbers.end());\n    for (int n : numbers) std::cout << n << \" \";\n    std::cout << std::endl;\n}\n''')\n\ntask(\"binary_search\", r\"бинарн|двоичн\\w* поиск|binary search\", \"Бинарный поиск\",\n     \"Быстрый поиск в отсортированном списке: каждый шаг отбрасывает половину.\",\n     python='''def binary_search(items, target):\n    \"\"\"Индекс target в отсортированном списке или -1.\"\"\"\n    low, high = 0, len(items) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        if items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n\n\ndata = [1, 3, 5, 7, 9, 11, 13]\nprint(binary_search(data, 9))   # 4\nprint(binary_search(data, 4))   # -1\n''',\n     javascript='''function binarySearch(items, target) {\n  let low = 0, high = items.length - 1;\n  while (low <= high) {\n    const mid = Math.floor((low + high) / 2);\n    if (items[mid] === target) return mid;\n    if (items[mid] < target) low = mid + 1;\n    else high = mid - 1;\n  }\n  return -1;\n}\n\nconsole.log(binarySearch([1, 3, 5, 7, 9, 11, 13], 9)); // 4\n''')\n\ntask(\"files\", r\"файл|file\", \"Чтение и запись файла\",\n     \"Запись текста в файл, дозапись и чтение построчно.\",\n     python='''from pathlib import Path\n\npath = Path(\"notes.txt\")\n\n# Записать (файл создастся или перезапишется)\npath.write_text(\"Первая строка\\\\nВторая строка\\\\n\", encoding=\"utf-8\")\n\n# Дописать в конец\nwith path.open(\"a\", encoding=\"utf-8\") as f:\n    f.write(\"Третья строка\\\\n\")\n\n# Прочитать построчно\nwith path.open(encoding=\"utf-8\") as f:\n    for number, line in enumerate(f, 1):\n        print(number, line.rstrip())\n''',\n     javascript='''// Node.js\nconst fs = require(\"fs\");\n\nfs.writeFileSync(\"notes.txt\", \"Первая строка\\\\nВторая строка\\\\n\", \"utf8\");\nfs.appendFileSync(\"notes.txt\", \"Третья строка\\\\n\", \"utf8\");\n\nconst lines = fs.readFileSync(\"notes.txt\", \"utf8\").trim().split(\"\\\\n\");\nlines.forEach((line, i) => console.log(i + 1, line));\n''',\n     php='''<?php\n$path = __DIR__ . \"/notes.txt\";\nfile_put_contents($path, \"Первая строка\\\\nВторая строка\\\\n\");\nfile_put_contents($path, \"Третья строка\\\\n\", FILE_APPEND);\n\nforeach (file($path, FILE_IGNORE_NEW_LINES) as $i => $line) {\n    echo ($i + 1) . \" \" . $line . \"\\\\n\";\n}\n''')\n\ntask(\"http\", r\"http.?запрос|запрос к|api|fetch|скачать страниц|requests|получить данные с сайта\", \"HTTP-запрос к API\",\n     \"Запрос к открытому API и разбор JSON-ответа (пример — курс валют).\",\n     python='''import json\nimport urllib.request\n\nurl = \"https://open.er-api.com/v6/latest/USD\"\nwith urllib.request.urlopen(url, timeout=10) as response:\n    data = json.loads(response.read().decode(\"utf-8\"))\n\nprint(\"1 доллар =\", data[\"rates\"][\"RUB\"], \"рублей\")\nprint(\"1 доллар =\", data[\"rates\"][\"EUR\"], \"евро\")\n''',\n     javascript='''async function main() {\n  const response = await fetch(\"https://open.er-api.com/v6/latest/USD\");\n  if (!response.ok) throw new Error(\"Ошибка \" + response.status);\n  const data = await response.json();\n  console.log(\"1 доллар =\", data.rates.RUB, \"рублей\");\n  console.log(\"1 доллар =\", data.rates.EUR, \"евро\");\n}\n\nmain().catch(err => console.error(err.message));\n''',\n     php='''<?php\n$json = file_get_contents(\"https://open.er-api.com/v6/latest/USD\");\n$data = json_decode($json, true);\necho \"1 доллар = \" . $data[\"rates\"][\"RUB\"] . \" рублей\\\\n\";\n''')\n\ntask(\"server\", r\"сервер|server|бэкенд|backend|flask\", \"Простой веб-сервер\",\n     \"Минимальный веб-сервер: отвечает на запросы и отдаёт JSON по адресу /api/hello.\",\n     python='''from http.server import BaseHTTPRequestHandler, HTTPServer\nimport json\n\n\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path == \"/api/hello\":\n            body = json.dumps({\"message\": \"Привет от сервера!\"}, ensure_ascii=False).encode(\"utf-8\")\n            self.send_response(200)\n            self.send_header(\"Content-Type\", \"application/json; charset=utf-8\")\n        else:\n            body = \"<h1>Сервер работает<\/h1><p>Попробуйте /api/hello<\/p>\".encode(\"utf-8\")\n            self.send_response(200)\n            self.send_header(\"Content-Type\", \"text/html; charset=utf-8\")\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\n\nprint(\"Сервер: http://localhost:8000\")\nHTTPServer((\"0.0.0.0\", 8000), Handler).serve_forever()\n''',\n     javascript='''// Node.js: node server.js\nconst http = require(\"http\");\n\nhttp.createServer((req, res) => {\n  if (req.url === \"/api/hello\") {\n    res.writeHead(200, {\"Content-Type\": \"application/json; charset=utf-8\"});\n    res.end(JSON.stringify({message: \"Привет от сервера!\"}));\n  } else {\n    res.writeHead(200, {\"Content-Type\": \"text/html; charset=utf-8\"});\n    res.end(\"<h1>Сервер работает<\/h1><p>Попробуйте /api/hello<\/p>\");\n  }\n}).listen(8000, () => console.log(\"Сервер: http://localhost:8000\"));\n''',\n     php='''<?php\n// Запуск: php -S localhost:8000 index.php\nheader(\"Content-Type: application/json; charset=utf-8\");\n$path = parse_url($_SERVER[\"REQUEST_URI\"], PHP_URL_PATH);\nif ($path === \"/api/hello\") {\n    echo json_encode([\"message\" => \"Привет от сервера!\"], JSON_UNESCAPED_UNICODE);\n} else {\n    http_response_code(404);\n    echo json_encode([\"error\" => \"Не найдено\"], JSON_UNESCAPED_UNICODE);\n}\n''')\n\ntask(\"telegram\", r\"телеграм|telegram|\\bбот\", \"Телеграм-бот\",\n     \"Эхо-бот для Telegram. Получите токен у @BotFather, установите библиотеку: pip install pyTelegramBotAPI.\",\n     python='''import os\n\nimport telebot  # pip install pyTelegramBotAPI\n\n# Токен от @BotFather. Храните его в переменной окружения, а не в коде.\nbot = telebot.TeleBot(os.environ[\"BOT_TOKEN\"])\n\n\n@bot.message_handler(commands=[\"start\", \"help\"])\ndef start(message):\n    bot.reply_to(message, \"Привет! Я бот. Напишите что-нибудь — я повторю.\")\n\n\n@bot.message_handler(func=lambda message: True)\ndef echo(message):\n    bot.reply_to(message, f\"Вы написали: {message.text}\")\n\n\nprint(\"Бот запущен\")\nbot.infinity_polling()\n''')\n\ntask(\"todo\", r\"todo|туду|список дел|задач\", \"Список дел\",\n     \"Список дел в браузере: добавление, отметка «сделано», удаление. Задачи сохраняются в браузере.\",\n     html='''<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Список дел<\/title>\n<style>\n  body { margin: 0; background: #0b0b0c; color: #f3f1f1; font: 17px system-ui, sans-serif; display: flex; justify-content: center; padding: 40px 16px; }\n  .app { width: 100%; max-width: 480px; }\n  h1 { margin: 0 0 16px; }\n  form { display: flex; gap: 8px; }\n  input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #2a2a2e; background: #151517; color: #fff; font: inherit; }\n  button { padding: 12px 16px; border: 0; border-radius: 10px; background: #e10600; color: #fff; font: inherit; cursor: pointer; }\n  ul { list-style: none; padding: 0; }\n  li { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid #2a2a2e; }\n  li.done span { text-decoration: line-through; color: #777; }\n  li span { flex: 1; }\n  li button { background: transparent; color: #999; padding: 4px 8px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n  <h1>Список дел<\/h1>\n  <form id=\"form\"><input id=\"text\" placeholder=\"Новая задача\" required><button>Добавить<\/button><\/form>\n  <ul id=\"list\"><\/ul>\n<\/div>\n<script>\nlet todos = JSON.parse(localStorage.getItem(\"todos\") || \"[]\");\n\nfunction save() { localStorage.setItem(\"todos\", JSON.stringify(todos)); }\n\nfunction render() {\n  const list = document.getElementById(\"list\");\n  list.innerHTML = \"\";\n  todos.forEach((t, i) => {\n    const li = document.createElement(\"li\");\n    if (t.done) li.className = \"done\";\n    const box = document.createElement(\"input\");\n    box.type = \"checkbox\";\n    box.checked = t.done;\n    box.onchange = () => { t.done = box.checked; save(); render(); };\n    const text = document.createElement(\"span\");\n    text.textContent = t.text;\n    const del = document.createElement(\"button\");\n    del.textContent = \"✕\";\n    del.onclick = () => { todos.splice(i, 1); save(); render(); };\n    li.append(box, text, del);\n    list.append(li);\n  });\n}\n\ndocument.getElementById(\"form\").onsubmit = e => {\n  e.preventDefault();\n  const input = document.getElementById(\"text\");\n  todos.push({text: input.value.trim(), done: false});\n  input.value = \"\";\n  save();\n  render();\n};\nrender();\n<\/script>\n<\/body>\n<\/html>\n''')\n\ntask(\"timer\", r\"таймер|секундомер|timer|stopwatch|часы|clock\", \"Секундомер и часы\",\n     \"Страница с часами и секундомером: старт, пауза, сброс.\",\n     html='''<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Секундомер<\/title>\n<style>\n  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0c; color: #f3f1f1; font: 18px system-ui, sans-serif; text-align: center; }\n  #clock { color: #999; }\n  #time { font: 700 64px/1.2 ui-monospace, monospace; margin: 12px 0 20px; }\n  button { padding: 12px 20px; margin: 0 4px; border: 0; border-radius: 10px; font: inherit; cursor: pointer; background: #26262a; color: #fff; }\n  #start { background: #e10600; }\n<\/style>\n<\/head>\n<body>\n<div>\n  <div id=\"clock\"><\/div>\n  <div id=\"time\">00:00.00<\/div>\n  <button id=\"start\">Старт<\/button><button id=\"reset\">Сброс<\/button>\n<\/div>\n<script>\nlet startedAt = 0, elapsed = 0, timer = null;\nconst show = ms => {\n  const m = String(Math.floor(ms / 60000)).padStart(2, \"0\");\n  const s = String(Math.floor(ms / 1000) % 60).padStart(2, \"0\");\n  const cs = String(Math.floor(ms / 10) % 100).padStart(2, \"0\");\n  document.getElementById(\"time\").textContent = `${m}:${s}.${cs}`;\n};\ndocument.getElementById(\"start\").onclick = function () {\n  if (timer) {\n    clearInterval(timer); timer = null; elapsed += Date.now() - startedAt; this.textContent = \"Старт\";\n  } else {\n    startedAt = Date.now(); timer = setInterval(() => show(elapsed + Date.now() - startedAt), 31); this.textContent = \"Пауза\";\n  }\n};\ndocument.getElementById(\"reset\").onclick = () => {\n  clearInterval(timer); timer = null; elapsed = 0; show(0); document.getElementById(\"start\").textContent = \"Старт\";\n};\nsetInterval(() => { document.getElementById(\"clock\").textContent = new Date().toLocaleTimeString(\"ru-RU\"); }, 250);\n<\/script>\n<\/body>\n<\/html>\n''',\n     python='''import time\n\nseconds = int(input(\"Сколько секунд отсчитать? \"))\nfor left in range(seconds, 0, -1):\n    print(f\"Осталось: {left} с\")\n    time.sleep(1)\nprint(\"Время вышло!\")\n''')\n\ntask(\"password\", r\"парол\", \"Генератор паролей\",\n     \"Надёжные пароли с помощью модуля secrets: буквы, цифры и символы.\",\n     python='''import secrets\nimport string\n\n\ndef make_password(length=16):\n    alphabet = string.ascii_letters + string.digits + \"!@#$%^&*-_\"\n    while True:\n        password = \"\".join(secrets.choice(alphabet) for _ in range(length))\n        if (any(c.islower() for c in password) and any(c.isupper() for c in password)\n                and any(c.isdigit() for c in password)):\n            return password\n\n\nfor _ in range(5):\n    print(make_password())\n''',\n     javascript='''function makePassword(length = 16) {\n  const alphabet = \"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*-_\";\n  const values = crypto.getRandomValues(new Uint32Array(length));\n  return Array.from(values, v => alphabet[v % alphabet.length]).join(\"\");\n}\n\nfor (let i = 0; i < 5; i++) console.log(makePassword());\n''')\n\ntask(\"rps\", r\"камень|ножниц|rock.?paper\", \"Камень, ножницы, бумага\",\n     \"Игра против компьютера до трёх побед.\",\n     python='''import random\n\noptions = [\"камень\", \"ножницы\", \"бумага\"]\nbeats = {\"камень\": \"ножницы\", \"ножницы\": \"бумага\", \"бумага\": \"камень\"}\nme = pc = 0\n\nwhile me < 3 and pc < 3:\n    choice = input(\"камень, ножницы или бумага? \").strip().lower()\n    if choice not in options:\n        print(\"Не понял, попробуйте ещё раз.\")\n        continue\n    computer = random.choice(options)\n    print(\"Компьютер:\", computer)\n    if choice == computer:\n        print(\"Ничья\")\n    elif beats[choice] == computer:\n        me += 1\n        print(\"Вы выиграли раунд!\")\n    else:\n        pc += 1\n        print(\"Раунд за компьютером\")\n    print(f\"Счёт {me}:{pc}\")\n\nprint(\"Вы победили!\" if me == 3 else \"Победил компьютер\")\n''')\n\ntask(\"quiz\", r\"викторин|quiz|тест с вопрос\", \"Викторина\",\n     \"Викторина с вопросами и подсчётом очков.\",\n     python='''questions = [\n    (\"Сколько будет 2 + 2 * 2?\", \"6\"),\n    (\"Столица Франции?\", \"париж\"),\n    (\"Какой язык программирования назван в честь комик-группы?\", \"python\"),\n]\n\nscore = 0\nfor question, answer in questions:\n    reply = input(question + \" \").strip().lower()\n    if reply == answer:\n        print(\"Верно!\")\n        score += 1\n    else:\n        print(f\"Неверно, правильный ответ: {answer}\")\n\nprint(f\"Результат: {score} из {len(questions)}\")\n''')\n\ntask(\"temperature\", r\"температур|цельси|фаренгейт\", \"Перевод температуры\",\n     \"Перевод между градусами Цельсия и Фаренгейта.\",\n     python='''def c_to_f(c):\n    return c * 9 / 5 + 32\n\n\ndef f_to_c(f):\n    return (f - 32) * 5 / 9\n\n\nprint(f\"100 °C = {c_to_f(100):.1f} °F\")\nprint(f\"98.6 °F = {f_to_c(98.6):.1f} °C\")\n''',\n     javascript='''const cToF = c => c * 9 / 5 + 32;\nconst fToC = f => (f - 32) * 5 / 9;\n\nconsole.log(`100 °C = ${cToF(100).toFixed(1)} °F`);\nconsole.log(`98.6 °F = ${fToC(98.6).toFixed(1)} °C`);\n''')\n\ntask(\"palindrome\", r\"палиндром|переверн\\w* строк|reverse\", \"Палиндромы и переворот строки\",\n     \"Переворот строки и проверка на палиндром (без учёта пробелов и регистра).\",\n     python='''def is_palindrome(text):\n    letters = [c.lower() for c in text if c.isalnum()]\n    return letters == letters[::-1]\n\n\nprint(\"привет\"[::-1])\nprint(is_palindrome(\"А роза упала на лапу Азора\"))  # True\nprint(is_palindrome(\"Python\"))                      # False\n''',\n     javascript='''const reverse = s => [...s].reverse().join(\"\");\nconst isPalindrome = s => {\n  const clean = s.toLowerCase().replace(/[^\\\\p{L}\\\\p{N}]/gu, \"\");\n  return clean === reverse(clean);\n};\n\nconsole.log(reverse(\"привет\"));\nconsole.log(isPalindrome(\"А роза упала на лапу Азора\")); // true\n''')\n\ntask(\"wordcount\", r\"подсч\\w* слов|частот|сколько раз\", \"Частота слов\",\n     \"Подсчёт, какие слова встречаются в тексте чаще всего.\",\n     python='''from collections import Counter\nimport re\n\ntext = \"\"\"Python — простой язык. Python любят за простоту,\nа простой код легко читать.\"\"\"\n\nwords = re.findall(r\"\\\\w+\", text.lower())\nfor word, count in Counter(words).most_common(5):\n    print(f\"{word}: {count}\")\n''')\n\ntask(\"class\", r\"класс|ооп|объект\", \"Классы и ООП\",\n     \"Пример класса с конструктором, методами и наследованием.\",\n     python='''class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n    def __str__(self):\n        return f\"{self.__class__.__name__} {self.name}: {self.speak()}\"\n\n\nclass Dog(Animal):\n    def speak(self):\n        return \"Гав!\"\n\n\nclass Cat(Animal):\n    def speak(self):\n        return \"Мяу!\"\n\n\nfor pet in (Dog(\"Шарик\"), Cat(\"Мурка\")):\n    print(pet)\n''',\n     java='''class Animal {\n    protected String name;\n    Animal(String name) { this.name = name; }\n    String speak() { return \"...\"; }\n}\n\nclass Dog extends Animal {\n    Dog(String name) { super(name); }\n    @Override String speak() { return \"Гав!\"; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Animal pet = new Dog(\"Шарик\");\n        System.out.println(pet.name + \": \" + pet.speak());\n    }\n}\n''',\n     javascript='''class Animal {\n  constructor(name) { this.name = name; }\n  speak() { return \"...\"; }\n  toString() { return `${this.constructor.name} ${this.name}: ${this.speak()}`; }\n}\n\nclass Dog extends Animal { speak() { return \"Гав!\"; } }\nclass Cat extends Animal { speak() { return \"Мяу!\"; } }\n\n[new Dog(\"Шарик\"), new Cat(\"Мурка\")].forEach(p => console.log(String(p)));\n''')\n\ntask(\"json\", r\"json\", \"Работа с JSON\",\n     \"Преобразование данных в JSON и обратно.\",\n     python='''import json\n\nuser = {\"name\": \"Артём\", \"age\": 16, \"skills\": [\"Python\", \"HTML\"]}\ntext = json.dumps(user, ensure_ascii=False, indent=2)\nprint(text)\n\ndata = json.loads(text)\nprint(data[\"name\"], \"знает\", \", \".join(data[\"skills\"]))\n''',\n     javascript='''const user = {name: \"Артём\", age: 16, skills: [\"Python\", \"HTML\"]};\nconst text = JSON.stringify(user, null, 2);\nconsole.log(text);\n\nconst data = JSON.parse(text);\nconsole.log(`${data.name} знает ${data.skills.join(\", \")}`);\n''')\n\ntask(\"page\", r\"лендинг|страниц|сайт|визитк|веб-?страниц\", \"Веб-страница\",\n     \"Современная адаптивная страница: шапка, главный блок, карточки и подвал. Сайт целиком удобнее делать в AI Studio.\",\n     html='''<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Моя страница<\/title>\n<style>\n  :root { --bg: #0b0b0c; --fg: #f3f1f1; --muted: #9b9599; --accent: #e10600; --card: #151517; }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, sans-serif; }\n  header, section, footer { padding: 20px max(20px, calc(50% - 540px)); }\n  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2e; }\n  nav a { color: var(--fg); margin-left: 16px; text-decoration: none; }\n  .hero { padding-top: 90px; padding-bottom: 90px; }\n  .hero h1 { font-size: clamp(36px, 7vw, 64px); margin: 0 0 12px; line-height: 1.05; }\n  .hero p { color: var(--muted); max-width: 42ch; }\n  .btn { display: inline-block; background: var(--accent); color: #fff; padding: 12px 22px; border-radius: 12px; text-decoration: none; }\n  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }\n  .card { background: var(--card); border: 1px solid #2a2a2e; border-radius: 16px; padding: 20px; }\n  footer { color: var(--muted); border-top: 1px solid #2a2a2e; }\n<\/style>\n<\/head>\n<body>\n<header><b>Моя страница<\/b><nav><a href=\"#about\">О нас<\/a><a href=\"#contacts\">Контакты<\/a><\/nav><\/header>\n<section class=\"hero\">\n  <h1>Добро пожаловать<\/h1>\n  <p>Короткий рассказ о том, чем вы занимаетесь и почему это интересно.<\/p>\n  <a class=\"btn\" href=\"#about\">Подробнее<\/a>\n<\/section>\n<section id=\"about\">\n  <h2>Что мы делаем<\/h2>\n  <div class=\"cards\">\n    <div class=\"card\"><h3>Быстро<\/h3><p>Результат без долгого ожидания.<\/p><\/div>\n    <div class=\"card\"><h3>Надёжно<\/h3><p>Проверенные решения.<\/p><\/div>\n    <div class=\"card\"><h3>Удобно<\/h3><p>Всё понятно с первого взгляда.<\/p><\/div>\n  <\/div>\n<\/section>\n<footer id=\"contacts\">© 2026 · hello@example.com<\/footer>\n<\/body>\n<\/html>\n''')\n\ntask(\"form\", r\"форм[ау]|регистрац|валидац\", \"Форма с проверкой\",\n     \"Форма регистрации с проверкой полей прямо в браузере.\",\n     html='''<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Регистрация<\/title>\n<style>\n  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0c; color: #f3f1f1; font: 17px system-ui, sans-serif; }\n  form { background: #151517; padding: 24px; border-radius: 16px; width: min(360px, 92vw); display: grid; gap: 12px; }\n  label { display: grid; gap: 4px; font-size: 14px; color: #bbb; }\n  input { padding: 11px; border-radius: 10px; border: 1px solid #2a2a2e; background: #0b0b0c; color: #fff; font: inherit; }\n  input:invalid:not(:placeholder-shown) { border-color: #ff2a2a; }\n  button { padding: 12px; border: 0; border-radius: 10px; background: #e10600; color: #fff; font: inherit; cursor: pointer; }\n  #msg { min-height: 1.4em; margin: 0; }\n<\/style>\n<\/head>\n<body>\n<form id=\"form\" novalidate>\n  <h2>Регистрация<\/h2>\n  <label>Имя<input name=\"name\" required minlength=\"2\" placeholder=\" \"><\/label>\n  <label>Почта<input name=\"email\" type=\"email\" required placeholder=\" \"><\/label>\n  <label>Пароль (от 8 символов)<input name=\"password\" type=\"password\" required minlength=\"8\" placeholder=\" \"><\/label>\n  <button>Зарегистрироваться<\/button>\n  <p id=\"msg\"><\/p>\n<\/form>\n<script>\ndocument.getElementById(\"form\").onsubmit = e => {\n  e.preventDefault();\n  const form = e.target, msg = document.getElementById(\"msg\");\n  const bad = [...form.elements].find(el => el.willValidate && !el.checkValidity());\n  if (bad) {\n    msg.style.color = \"#ff6b6b\";\n    msg.textContent = bad.name === \"email\" ? \"Проверьте почту\" : bad.name === \"password\" ? \"Пароль короче 8 символов\" : \"Введите имя\";\n    bad.focus();\n    return;\n  }\n  msg.style.color = \"#3ccf7a\";\n  msg.textContent = \"Готово, \" + form.name.value + \"!\";\n};\n<\/script>\n<\/body>\n<\/html>\n''')\n\ntask(\"dice\", r\"кубик|dice\", \"Бросок кубика\",\n     \"Бросок двух кубиков и статистика выпадений.\",\n     python='''import random\nfrom collections import Counter\n\nrolls = [random.randint(1, 6) + random.randint(1, 6) for _ in range(1000)]\nstats = Counter(rolls)\nfor total in range(2, 13):\n    print(f\"{total:2}: {'#' * (stats[total] // 5)}\")\n''')\n\ntask(\"csv\", r\"csv|таблиц\\w* excel|эксел\", \"Работа с CSV\",\n     \"Запись и чтение CSV-таблицы, подсчёт суммы по столбцу.\",\n     python='''import csv\n\nrows = [\n    {\"товар\": \"Хлеб\", \"цена\": 60, \"количество\": 2},\n    {\"товар\": \"Молоко\", \"цена\": 90, \"количество\": 1},\n    {\"товар\": \"Сыр\", \"цена\": 350, \"количество\": 1},\n]\n\nwith open(\"покупки.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n    writer = csv.DictWriter(f, fieldnames=[\"товар\", \"цена\", \"количество\"])\n    writer.writeheader()\n    writer.writerows(rows)\n\ntotal = 0\nwith open(\"покупки.csv\", encoding=\"utf-8\") as f:\n    for row in csv.DictReader(f):\n        cost = int(row[\"цена\"]) * int(row[\"количество\"])\n        total += cost\n        print(f\"{row['товар']}: {cost} ₽\")\nprint(\"Итого:\", total, \"₽\")\n''')\n\ntask(\"hello\", r\"hello|привет,? мир|перв\\w* программ\", \"Hello, World\",\n     \"Первая программа — вывод приветствия.\",\n     python='print(\"Привет, мир!\")\\n', javascript='console.log(\"Привет, мир!\");\\n',\n     html='<!DOCTYPE html>\\n<html lang=\"ru\">\\n<head><meta charset=\"UTF-8\"><title>Привет<\/title><\/head>\\n<body><h1>Привет, мир!<\/h1><\/body>\\n<\/html>\\n',\n     php='<?php\\necho \"Привет, мир!\";\\n',\n     cpp='#include <iostream>\\n\\nint main() {\\n    std::cout << \"Привет, мир!\" << std::endl;\\n}\\n',\n     java='public class Main {\\n    public static void main(String[] args) {\\n        System.out.println(\"Привет, мир!\");\\n    }\\n}\\n')\n\nORDER = [\"snake\", \"tictactoe\", \"guess\", \"rps\", \"quiz\", \"calculator\", \"fizzbuzz\", \"fibonacci\", \"factorial\", \"prime\",\n         \"binary_search\", \"sort\", \"telegram\", \"todo\", \"timer\", \"password\", \"temperature\", \"palindrome\", \"wordcount\",\n         \"csv\", \"json\", \"http\", \"server\", \"files\", \"form\", \"dice\", \"class\", \"hello\", \"page\"]\n\n\ndef find_task(text):\n    low = (text or \"\").lower().replace(\"ё\", \"е\")\n    for key in ORDER:\n        if re.search(T[key][\"words\"], low):\n            return key\n    return None\n\n\ndef generate(prompt, lang=None):\n    \"\"\"Код по описанию: {\"code\", \"lang\", \"filename\", \"title\", \"about\"} или None.\"\"\"\n    key = find_task(prompt)\n    if not key:\n        return None\n    t = T[key]\n    explicit = lang_from_text(prompt)\n    # Игры и страницы по умолчанию делаем для браузера — их сразу видно в предпросмотре\n    browser_first = key in (\"snake\", \"tictactoe\", \"todo\", \"timer\", \"form\", \"page\")\n    wanted = explicit or (\"html\" if browser_first else lang) or \"python\"\n    if wanted == \"typescript\":\n        wanted = \"javascript\"\n    codes = t[\"codes\"]\n    note = \"\"\n    if wanted not in codes:\n        # Игры и страницы лучше всего работают в браузере, остальное — на Python\n        fallback = \"html\" if \"html\" in codes else \"python\" if \"python\" in codes else next(iter(codes))\n        names = {\"python\": \"Python\", \"javascript\": \"JavaScript\", \"html\": \"HTML\", \"php\": \"PHP\", \"cpp\": \"C++\",\n                 \"java\": \"Java\", \"csharp\": \"C#\"}\n        note = f\"\\n\\nНа {names.get(wanted, wanted)} этой программы у меня пока нет — сделал на {names[fallback]}.\"\n        wanted = fallback\n    # main.py, а не json.py/csv.py — иначе файл перекроет стандартный модуль Python\n    filename = {\"html\": \"index.html\", \"java\": \"Main.java\", \"php\": \"index.php\"}.get(wanted, f\"main.{EXT.get(wanted, 'txt')}\")\n    return {\"code\": codes[wanted], \"lang\": wanted, \"filename\": filename, \"title\": t[\"title\"],\n            \"about\": f\"**{t['title']}** — {t['about']}{note}\"}\n\n\ndef help_text():\n    names = \", \".join(T[k][\"title\"].lower() for k in ORDER[:18])\n    return (\"Напишу рабочую программу по описанию. Сейчас умею: \" + names +\n            \" и другие. Напишите, например: «напиши игру змейка» или «калькулятор на c++».\")\n", "brain.py": "\"\"\"Движок Rai: собственный ИИ без внешних API.\n\nКак отвечает Rai:\n1. команды памяти («запомни, что …», «как меня зовут») — Pro Plus / Pro Sun;\n2. встроенные навыки (калькулятор, время, конвертер, …);\n3. поиск по базе знаний knowledge.json (+ learned.json);\n4. поиск по запомненным фактам (Pro Sun);\n5. если ничего не подошло — честно говорит и предлагает похожие темы.\n\"\"\"\n\nimport json\nimport os\nimport random\nimport re\nimport threading\nimport time\nfrom collections import OrderedDict\n\nimport codeai\nimport codelib\nimport creative\nimport net\nimport nlp\nimport online\nimport proglangs\nimport skills\nfrom versions import Version\n\nBASE_DIR = os.path.dirname(os.path.abspath(__file__))\nKNOWLEDGE_PATH = os.environ.get(\"RAI_KNOWLEDGE_PATH\", os.path.join(BASE_DIR, \"knowledge.json\"))\nLEARNED_PATH = os.environ.get(\"RAI_LEARNED_PATH\", os.path.join(BASE_DIR, \"learned.json\"))\nGLOSSARY_PATH = os.environ.get(\"RAI_GLOSSARY_PATH\", os.path.join(BASE_DIR, \"glossary.json\"))\n\nMAX_MESSAGE_CHARS = int(os.environ.get(\"RAI_MAX_MESSAGE_CHARS\", \"4000\"))\nMAX_FACTS = 50\nDEFAULT_CITY = os.environ.get(\"RAI_DEFAULT_CITY\", \"Москва\")\n\n_NAME_RE = re.compile(\n    r\"(?:меня зовут|мое имя|моё имя|зови меня|называй меня|my name is)\\s+([A-Za-zА-Яа-яЁё-]{2,30})\",\n    re.I,\n)\n_ASK_NAME_RE = re.compile(r\"как меня зовут|ты помнишь как меня|мое имя\\??$|моё имя\\??$|who am i\", re.I)\n_MORE_RE = re.compile(r\"^(а\\s+)?(подробнее|ещ[её]|расскажи подробнее|расскажи ещ[её]|продолжай|дальше|и\\?)[\\s?!.]*$\", re.I)\n_REMEMBER_RE = re.compile(r\"^\\s*запомни(?:,)?\\s*(?:что|:)?\\s*(.+)$\", re.I | re.S)\n_RECALL_RE = re.compile(r\"что ты (?:помнишь|запомнил|знаешь обо мне)|что я тебе говорил\", re.I)\n_FORGET_RE = re.compile(r\"^\\s*забудь (?:вс[её]|об? мне)\", re.I)\n_ARCHIVE_RE = re.compile(r\"(сделай|собери|скачай|создай|упакуй|сохрани)\\w*\\s+(?:мне\\s+)?(?:весь\\s+)?(?:чат\\s+)?(?:в\\s+)?(архив|zip)|\"\n                         r\"^\\s*(архив|zip)(?:\\s+чата)?\\s*[.!?]*$\", re.I)\n_DEFINE_RE = re.compile(\n    r\"^\\s*(?:а\\s+)?(?:что такое|что это(?: такое)?|кто такой|кто такая|кто такие|что значит|что означает|\"\n    r\"что такое это|расскажи (?:про|о|об)|что ты знаешь (?:про|о|об)|что знаешь (?:про|о|об)|объясни(?: что такое)?)\"\n    r\"\\s+(.+?)[\\s?!.]*$|^\\s*(.+?)\\s*(?:[-—]\\s*)?это что[\\s?!.]*$\",\n    re.I,\n)\n\n\nclass RaiError(Exception):\n    \"\"\"Ошибка, текст которой можно показать пользователю.\"\"\"\n\n    def __init__(self, message: str, status: int = 400):\n        super().__init__(message)\n        self.status = status\n\n\nclass SessionStore:\n    \"\"\"Память разговоров в оперативной памяти сервера (с лимитом и сроком жизни).\"\"\"\n\n    def __init__(self, limit: int = 5000, ttl: int = 6 * 3600):\n        self.limit, self.ttl = limit, ttl\n        self._data = OrderedDict()\n        self._lock = threading.Lock()\n\n    def get(self, session_id):\n        if not session_id:\n            return {}\n        now = time.time()\n        with self._lock:\n            session = self._data.pop(session_id, None)\n            if session is None or now - session[\"_seen\"] > self.ttl:\n                session = {\"facts\": []}\n            session[\"_seen\"] = now\n            self._data[session_id] = session\n            while len(self._data) > self.limit:\n                self._data.popitem(last=False)\n            return session\n\n\ndef _clean_session_id(value):\n    if isinstance(value, str) and re.fullmatch(r\"[A-Za-z0-9_.-]{1,64}\", value):\n        return value\n    return None\n\n\nclass Brain:\n    def __init__(self, knowledge_path=KNOWLEDGE_PATH, learned_path=LEARNED_PATH, glossary_path=GLOSSARY_PATH):\n        self.knowledge_path = knowledge_path\n        self.learned_path = learned_path\n        self.glossary_path = glossary_path\n        self.sessions = SessionStore()\n        self._lock = threading.Lock()\n        self.reload()\n\n    # ------------------------------------------------------------ база знаний\n\n    def _read(self, path):\n        if not path or not os.path.exists(path):\n            return []\n        with open(path, encoding=\"utf-8\") as f:\n            return json.load(f).get(\"intents\", [])\n\n    def reload(self):\n        intents = self._read(self.knowledge_path) + self._read(self.learned_path)\n        by_id = {}\n        for intent in intents:\n            if intent.get(\"id\") and intent.get(\"patterns\") and intent.get(\"answers\"):\n                by_id[intent[\"id\"]] = intent\n        docs = [(i[\"id\"], p) for i in by_id.values() for p in i[\"patterns\"] + [i.get(\"title\", \"\")] if p]\n        indexes = {\n            \"keywords\": nlp.KeywordIndex(docs),\n            \"tfidf\": nlp.TfidfIndex(docs, fuzzy=False),\n            \"tfidf+fuzzy\": nlp.TfidfIndex(docs, fuzzy=True),\n        }\n        intent_tokens = {}\n        for key, text in docs:\n            intent_tokens.setdefault(key, set()).update(nlp.tokens(text))\n        glossary = []\n        if self.glossary_path and os.path.exists(self.glossary_path):\n            with open(self.glossary_path, encoding=\"utf-8\") as f:\n                for entry in json.load(f).get(\"terms\", []):\n                    keys = [tuple(nlp.tokens(t, keep_stopwords=True)) for t in entry[\"terms\"]]\n                    glossary.append(([k for k in keys if k], entry[\"text\"]))\n        # Слова из статей словаря тоже «известные», чтобы корректор их не «исправлял».\n        vocab = [text for _, text in docs] + [text for _, text in glossary] + [\n            \" \".join(k) for keys, _ in glossary for k in keys]\n        speller = nlp.SpellChecker(vocab)\n        with self._lock:\n            self.intents, self.indexes = by_id, indexes\n            self.intent_tokens, self.speller = intent_tokens, speller\n            self.glossary = glossary\n\n    def teach(self, patterns, answer, title=None):\n        \"\"\"Добавить знание в learned.json (админ-функция).\"\"\"\n        patterns = [p.strip() for p in patterns if isinstance(p, str) and p.strip()]\n        if not patterns or not isinstance(answer, str) or not answer.strip():\n            raise RaiError(\"Нужны patterns (список фраз) и answer (ответ).\")\n        with self._lock:\n            learned = self._read(self.learned_path)\n            intent_id = f\"learned_{len(learned) + 1}_{int(time.time())}\"\n            learned.append({\n                \"id\": intent_id,\n                \"title\": (title or patterns[0]).strip(),\n                \"patterns\": patterns,\n                \"answers\": [answer.strip()],\n            })\n            with open(self.learned_path, \"w\", encoding=\"utf-8\") as f:\n                json.dump({\"intents\": learned}, f, ensure_ascii=False, indent=2)\n        self.reload()\n        return intent_id\n\n    def define(self, version: Version, text: str, exact_only: bool = False):\n        \"\"\"Найти понятие в словаре: «что такое атом», «кто такой хакер», просто «фотосинтез».\"\"\"\n        m = _DEFINE_RE.match(text)\n        subject = (m.group(1) or m.group(2)) if m else None\n        if exact_only and not subject:\n            return None\n        target = subject if subject else text\n        if version.fuzzy:\n            target = self.speller.correct(target)\n        words = tuple(nlp.tokens(target, keep_stopwords=True))\n        if not words:\n            return None\n        best, best_len = None, 0\n        for keys, definition in self.glossary:\n            for key in keys:\n                exact = words == key\n                # «что такое X» — X может быть частью фразы («что такое оперативная память в компьютере»)\n                inside = subject and not exact_only and any(words[i:i + len(key)] == key for i in range(len(words)))\n                if (exact or inside) and len(key) > best_len:\n                    best, best_len = definition, len(key)\n        return best\n\n    def search(self, version: Version, text: str, limit: int = 5, correct: bool = True):\n        \"\"\"Найти подходящие темы: [(id, сходство)], только уверенные совпадения.\"\"\"\n        if version.fuzzy and correct:\n            text = self.speller.correct(text)\n        key = \"keywords\" if version.search == \"keywords\" else (\"tfidf+fuzzy\" if version.fuzzy else \"tfidf\")\n        results = self.indexes[key].search(text)\n        # Совпадение только по общим словам («что», «такое», «как»…) при наличии\n        # в вопросе значимых слов — не совпадение: «что такое рхп» ≠ «что такое python».\n        meaningful = set(nlp.tokens(text)) - nlp.GENERIC\n        if meaningful:\n            results = [(k, s) for k, s in results if meaningful & self.intent_tokens.get(k, set())]\n        return results[:limit]\n\n    # ------------------------------------------------------------ ответы\n\n    def answer(self, version: Version, message: str, session_id=None, history=None) -> dict:\n        message = (message or \"\").strip()\n        if not message:\n            raise RaiError(\"Пустой запрос.\")\n        if len(message) > MAX_MESSAGE_CHARS:\n            raise RaiError(f\"Запрос слишком длинный (больше {MAX_MESSAGE_CHARS} символов).\", 413)\n\n        session = self.sessions.get(_clean_session_id(session_id)) if version.context else {}\n        if version.context and not session.get(\"name\"):\n            session[\"name\"] = _name_from_history(history)\n\n        parts = [message]\n        if version.multi and not _REMEMBER_RE.match(message) and not codeai.extract_code(message)[0]:\n            parts = [p.strip() for p in re.split(r\"(?<=\\?)\\s+|\\n+\", message) if p.strip()] or [message]\n\n        answers, intents, attachments = [], [], []\n        for part in parts[:5]:\n            text, intent = self._answer_one(version, part, session, attachments)\n            answers.append(text)\n            intents.append(intent)\n\n        if len(answers) > 1:\n            text = \"\\n\\n\".join(f\"**{q}**\\n\\n{a}\" for q, a in zip(parts, answers))\n        else:\n            text = answers[0]\n        return {\n            \"answer\": text,\n            \"version\": version.id,\n            \"version_name\": version.name,\n            \"intent\": intents[0] if len(intents) == 1 else intents,\n            \"attachments\": attachments,\n        }\n\n    def _answer_one(self, version: Version, text: str, session: dict, attachments: list):\n        name_match = _NAME_RE.search(text)\n        if name_match:\n            name = name_match.group(1).capitalize()\n            if version.context:\n                session[\"name\"] = name\n                return f\"Приятно познакомиться, {name}! Запомнил.\", \"set_name\"\n            return f\"Приятно познакомиться, {name}! (Запоминать имя умеют Pro Plus и Pro Sun.)\", \"set_name\"\n\n        if _ASK_NAME_RE.search(text):\n            if not version.context:\n                return \"Запоминать имя умеют Rai Pro Plus и Rai Pro Sun.\", \"get_name\"\n            if session.get(\"name\"):\n                return f\"Вас зовут {session['name']}.\", \"get_name\"\n            return \"Вы ещё не говорили, как вас зовут. Напишите: «меня зовут …».\", \"get_name\"\n\n        if _MORE_RE.match(text):\n            if not version.context:\n                return \"Продолжать тему умеют Rai Pro Plus и Rai Pro Sun. Задайте вопрос целиком.\", \"more\"\n            if session.get(\"last_intent\") in self.intents:\n                return self._more(session), \"more\"\n            return \"О чём рассказать подробнее? Задайте вопрос.\", \"more\"\n\n        if _REMEMBER_RE.match(text) or _RECALL_RE.search(text) or _FORGET_RE.match(text):\n            if not version.memory:\n                return \"Запоминать факты умеет только Rai Pro Sun.\", \"memory\"\n            return self._memory(text, session), \"memory\"\n\n        if creative.is_slides_request(text):\n            if \"slides\" not in version.skills:\n                return \"Презентации умеют делать Rai Pro Plus и Rai Pro Sun.\", \"slides\"\n            return self._slides(version, text, attachments), \"slides\"\n\n        if creative.is_image_request(text):\n            if \"image\" not in version.skills:\n                return \"Картинки умеют рисовать Rai Pro, Pro Plus и Pro Sun.\", \"image\"\n            image = creative.make_image(text)\n            attachments.append(image)\n            if image.get(\"unknown\"):\n                return (\"Такой сюжет я пока рисовать не умею, поэтому нарисовал **абстракцию**. \"\n                        \"Умею: закат, рассвет, ночь, космос, горы, море, лес, город, пустыню, зиму, \"\n                        \"сердце, цветок и логотипы.\"), \"image\"\n            return f\"Готово: **{image['title']}**. Картинку можно скачать в PNG или SVG.\", \"image\"\n\n        # ---- навыки с интернетом\n        if \"translate\" in version.skills and online.is_translate_request(text):\n            return online.translate(text), \"translate\"\n        if \"weather\" in version.skills:\n            found = online.weather(text, session, DEFAULT_CITY)\n            if found:\n                reply, extra = found\n                attachments.extend(extra)\n                return reply, \"weather\"\n        if \"currency\" in version.skills:\n            reply = online.currency(text)\n            if reply:\n                return reply, \"currency\"\n        query = online.explicit_search(text)\n        if query:\n            if \"web\" not in version.skills:\n                return \"Искать в интернете умеют Rai Pro, Pro Plus и Pro Sun.\", \"web\"\n            return self._web(query, attachments) or (f\"В интернете ничего не нашёл про «{query}».\", \"web\")\n\n        # ---- архив: собрать чат (картинки, презентации, код) в ZIP\n        if _ARCHIVE_RE.search(text):\n            attachments.append({\"type\": \"archive\", \"scope\": \"chat\", \"title\": \"Архив чата\"})\n            return (\"Собрал архив: все ответы этого чата, картинки (SVG), презентации (HTML) и код — одним ZIP-файлом. \"\n                    \"Нажмите «Скачать архив».\"), \"archive\"\n\n        # ---- код: проверка, объяснение, исправление, генерация программ\n        code_answer = proglangs.answer(text)\n        if \"code\" not in version.skills and (codeai.extract_code(text)[0] or\n                                             (codelib.find_task(text) not in (None, \"hello\") and codeai.chat(text))):\n            return \"Проверять и писать код умеют Rai Pro Plus, Pro Sun и Pro Quasar — переключите версию сверху.\", \"code\"\n        if \"code\" in version.skills:\n            task = codelib.find_task(text)\n            if codeai.extract_code(text)[0] or (task and task != \"hello\") or not code_answer:\n                result = codeai.chat(text, version)\n                if result:\n                    if result.get(\"code\"):\n                        attachments.append({\"type\": \"code\", \"lang\": result[\"lang\"], \"code\": result[\"code\"],\n                                            \"filename\": result.get(\"filename\") or \"main.\" + codeai.EXT_OF.get(result[\"lang\"], \"txt\"),\n                                            \"title\": result.get(\"title\") or \"Код\"})\n                    return result[\"answer\"], \"code\"\n        if code_answer and (proglangs._LIST_RE.search(text) or proglangs._CODE_RE.search(text)):\n            return code_answer, \"proglang\"\n\n        reply = skills.run(text, version.skills)\n        if reply:\n            return reply, \"skill\"\n\n        # «Что такое X», где X точно есть в словаре, — отвечаем определением.\n        # Языки программирования отвечает справочник proglangs, а не словарь.\n        definition = None if code_answer else self.define(version, text, exact_only=True)\n        if definition:\n            return self._enrich(version, text, definition, attachments), \"glossary\"\n\n        results = self.search(version, text)\n        best = results[0][1] if results else 0.0\n\n        if version.memory:\n            fact, score = self._find_fact(text, session)\n            if fact and score >= best:\n                return f\"Вы мне говорили: {fact}.\", \"memory\"\n\n        if best < version.threshold:\n            if code_answer:\n                return code_answer, \"proglang\"\n            definition = self.define(version, text)\n            if definition:\n                return self._enrich(version, text, definition, attachments), \"glossary\"\n\n        if best >= version.threshold:\n            intent = self.intents[results[0][0]]\n            if version.context:\n                # «подробнее»/«ещё» имеют смысл только для тем с продолжением.\n                if intent.get(\"more\") or intent.get(\"repeatable\"):\n                    session[\"last_intent\"] = intent[\"id\"]\n                    session[\"more_used\"] = False\n                else:\n                    session.pop(\"last_intent\", None)\n            return self._render(intent, version, session), intent[\"id\"]\n\n        note = \"\"\n        if \"web\" in version.skills and self._worth_searching(text):\n            try:\n                found = self._web(self._subject(text) or text, attachments, raise_errors=True)\n            except net.NetError:\n                found, note = None, \"\\n\\n*Поискать в интернете не получилось: нет связи.*\"\n            if found:\n                return found\n        return self._fallback(version, results, text) + note, None\n\n    def _enrich(self, version, text, answer, attachments):\n        \"\"\"Quasar: дополнить короткое определение фактами из Википедии (если статья про то же самое).\"\"\"\n        subject = self._subject(text) or text\n        if not version.enrich or \"web\" not in version.skills:\n            return answer\n        try:\n            art = online.web_article(subject, langs=(\"ru\",))\n        except net.NetError:\n            return answer\n        if not art or not set(nlp.tokens(subject)) & set(nlp.tokens(art[\"title\"])):\n            return answer\n        extra = [s for s in creative._sentences(art[\"text\"]) if s not in answer][:3]\n        if not extra:\n            return answer\n        if art[\"image\"]:\n            attachments.append({\"type\": \"photo\", \"url\": art[\"image\"], \"title\": art[\"title\"], \"source\": art[\"link\"]})\n        return answer + \"\\n\\n**Из интернета:** \" + \" \".join(extra) + (f\"\\n\\nИсточник: [Википедия]({art['link']})\" if art[\"link\"] else \"\")\n\n    @staticmethod\n    def _subject(text):\n        m = _DEFINE_RE.match(text)\n        return ((m.group(1) or m.group(2)) if m else \"\").strip()\n\n    @staticmethod\n    def _worth_searching(text):\n        \"\"\"Искать в интернете только осмысленные вопросы, а не «ок» или «ыыы».\"\"\"\n        meaningful = [w for w in nlp.tokens(text) if w not in nlp.GENERIC and len(w) > 2]\n        return bool(meaningful) and bool(re.search(r\"[а-яa-z]{3,}\", text.lower()))\n\n    def _web(self, query, attachments, raise_errors=False):\n        try:\n            found = online.web_search(query)\n        except net.NetError as e:\n            if raise_errors:\n                raise\n            return f\"Поискать в интернете не получилось: нет связи ({e}).\", \"web\"\n        if not found:\n            return None\n        reply, extra = found\n        attachments.extend(extra)\n        return reply, \"web\"\n\n    def _slides(self, version, text, attachments):\n        topic = creative.slides_topic(text)\n        theme = creative.deck_theme(text)\n        results = self.search(version, topic, limit=4, correct=False) if topic else []\n        found = [self.intents[k] for k, score in results if score >= version.threshold * 0.8]\n        big = version.detailed\n        found = found[:4] if big else found[:2]\n        if len(found) < 2 and topic:\n            found += self._glossary_for(topic, limit=(6 if big else 3) - len(found))\n        photo = None\n        if topic and \"web\" in version.skills and (len(found) < 2 or version.enrich):\n            # Материала мало — дополняем статьёй из интернета (и берём оттуда настоящую фотографию)\n            try:\n                art = online.web_article(topic, langs=(\"ru\",))\n            except net.NetError:\n                art = None\n            if art:\n                photo = art[\"image\"]\n                found.append({\"title\": art[\"title\"], \"answers\": [art[\"text\"]], \"web\": True})\n        web = next((a for a in found if a.get(\"web\")), None)\n        if web and set(nlp.tokens(topic)) <= set(nlp.tokens(web[\"title\"])):\n            topic = web[\"title\"]  # «эйфелеву башню» -> «Эйфелева башня»\n        title = topic or \"Rteam\"\n        if re.fullmatch(r\"[a-z0-9+#]{1,5}\", title, re.I):\n            title = title.upper()  # html -> HTML, php -> PHP\n        elif found and found[0].get(\"key_match\") and len(title.split()) == 1:\n            title = found[0][\"title\"]  # «котов» -> «Кошка»\n        limit = version.slide_limit\n        deck = creative.make_slides(title, found, max_slides=limit, theme=theme, photo=photo)\n        if not deck:\n            hint = \"\" if \"web\" in version.skills else \" Rai Pro, Pro Plus и Pro Sun ещё и ищут материал в интернете.\"\n            return (f\"Про «{topic or text}» я пока не нашёл материала, поэтому презентацию не сделал — \"\n                    f\"не хочу показывать пустые слайды.{hint} Попробуйте другую тему, например «презентация про космос».\")\n        attachments.append(deck)\n        n = len(deck[\"slides\"])\n        count = f\"{n} \" + (\"слайд\" if n % 10 == 1 and n % 100 != 11 else\n                          \"слайда\" if 2 <= n % 10 <= 4 and not 12 <= n % 100 <= 14 else \"слайдов\")\n        colors = \" в ваших цветах\" if theme[\"custom\"] else \"\"\n        return (f\"Готово: презентация **«{deck['title']}»**{colors}, {count}. \"\n                \"Смотрите на весь экран, скачивайте файлом или ZIP-архивом.\")\n\n    def _glossary_for(self, topic, limit=3):\n        \"\"\"Понятия из словаря, связанные с темой, в виде статей для слайдов.\"\"\"\n        want = set(nlp.tokens(topic)) - nlp.GENERIC\n        if not want or limit <= 0:\n            return []\n        by_key, by_text = [], []\n        for keys, text in self.glossary:\n            key_words = {w for k in keys for w in k}\n            if want & key_words:\n                by_key.append((len(want & key_words), keys, text))\n            elif want & set(nlp.tokens(text)):\n                by_text.append((len(want & set(nlp.tokens(text))), keys, text))\n        # Сначала понятия, в названии которых есть тема, потом те, где она упоминается.\n        scored = [(True,) + x for x in sorted(by_key, key=lambda x: -x[0])] + \\\n                 [(False,) + x for x in sorted(by_text, key=lambda x: -x[0])]\n        out = []\n        for key_match, _, keys, text in scored[:limit]:\n            m = re.match(r\"\\*\\*(.+?)\\*\\*\", text)\n            title = m.group(1) if m else \" \".join(keys[0]).capitalize()\n            out.append({\"title\": title, \"key_match\": key_match,\n                        \"answers\": [re.sub(r\"^\\*\\*.+?\\*\\*\\s*(\\([^)]*\\)\\s*)?[—-]\\s*\", \"\", text)]})\n        return out\n\n    def _pick(self, intent, session):\n        \"\"\"Случайный вариант ответа, по возможности не тот же, что в прошлый раз.\"\"\"\n        options = [a for a in intent[\"answers\"] if a != session.get(\"last_answer\")] or intent[\"answers\"]\n        choice = random.choice(options)\n        session[\"last_answer\"] = choice\n        name = session.get(\"name\")\n        return choice.replace(\"{name}\", f\", {name}\" if name else \"\")\n\n    def _render(self, intent, version, session):\n        answer = self._pick(intent, session)\n        if version.detailed and intent.get(\"more\"):\n            answer += \"\\n\\n\" + intent[\"more\"]\n            session[\"more_used\"] = True\n        return answer\n\n    def _more(self, session):\n        intent = self.intents[session[\"last_intent\"]]\n        if intent.get(\"more\") and not session.get(\"more_used\"):\n            session[\"more_used\"] = True\n            return intent[\"more\"]\n        if len(intent[\"answers\"]) > 1:\n            return self._pick(intent, session)\n        return \"Больше по этой теме мне добавить нечего. Спросите что-нибудь ещё!\"\n\n    def _memory(self, text, session):\n        facts = session.setdefault(\"facts\", [])\n        m = _REMEMBER_RE.match(text)\n        if m:\n            fact = m.group(1).strip().rstrip(\".!\")\n            if len(facts) >= MAX_FACTS:\n                facts.pop(0)\n            facts.append(fact)\n            return f\"Запомнил: {fact}.\"\n        if _FORGET_RE.match(text):\n            facts.clear()\n            session.pop(\"name\", None)\n            return \"Хорошо, всё забыл.\"\n        if not facts and not session.get(\"name\"):\n            return \"Пока ничего не запомнил. Скажите: «запомни, что …».\"\n        lines = [f\"• вас зовут {session['name']}\"] if session.get(\"name\") else []\n        lines += [f\"• {f}\" for f in facts]\n        return \"Я помню:\\n\" + \"\\n\".join(lines)\n\n    def _find_fact(self, text, session):\n        \"\"\"Найти запомненный факт, похожий на вопрос: (факт, сходство).\"\"\"\n        facts = session.get(\"facts\") or []\n        if not facts:\n            return None, 0.0\n        index = nlp.TfidfIndex(list(enumerate(facts)), fuzzy=True)\n        results = index.search(text, 1)\n        meaningful = set(nlp.tokens(text)) - nlp.GENERIC\n        if results and results[0][1] >= 0.3:\n            fact = facts[results[0][0]]\n            if not meaningful or meaningful & set(nlp.tokens(fact)):\n                return fact, results[0][1]\n        return None, 0.0\n\n    def _fallback(self, version, results, text=\"\"):\n        m = _DEFINE_RE.match(text)\n        subject = ((m.group(1) or m.group(2)) if m else \"\").strip()\n        base = f\"Про «{subject}» я пока не знаю.\" if subject else \"Я пока не знаю ответа на это.\"\n        lines = [base]\n        if version.suggestions:\n            titles = [self.intents[k].get(\"title\", k) for k, s in results[:3] if s >= 0.1]\n            if titles:\n                lines.append(\"Возможно, вы имели в виду:\\n\" + \"\\n\".join(f\"- {t}\" for t in titles))\n        if version.memory:\n            example = subject or \"Rai\"\n            lines.append(f\"Научите меня: напишите «запомни, что {example} — это …», и я запомню.\")\n        else:\n            lines.append(\"Попробуйте спросить иначе или напишите «что ты умеешь».\")\n        return \"\\n\\n\".join(lines)\n\n\ndef _name_from_history(history):\n    if not isinstance(history, list):\n        return None\n    for item in reversed(history[-50:]):\n        if isinstance(item, dict) and item.get(\"role\") == \"user\":\n            text = item.get(\"content\", item.get(\"text\"))\n            m = _NAME_RE.search(text) if isinstance(text, str) else None\n            if m:\n                return m.group(1).capitalize()\n    return None\n", "knowledge.json": "{\n  \"intents\": [\n    {\n      \"id\": \"greeting\",\n      \"title\": \"Приветствие\",\n      \"patterns\": [\n        \"привет\",\n        \"здравствуй\",\n        \"здравствуйте\",\n        \"добрый день\",\n        \"доброе утро\",\n        \"добрый вечер\",\n        \"хай\",\n        \"салют\",\n        \"hello\",\n        \"hi\",\n        \"приветствую\",\n
