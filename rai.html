}\\n```\"\n    return text\n\n\ndef answer(text: str):\n    \"\"\"Ответ про язык программирования или None.\"\"\"\n    if _LIST_RE.search(text):\n        rows = \"\\n\".join(f\"| **{e[0]}** | {e[2]} | {e[3]} |\" for e in LANGUAGES)\n        return (f\"## Языки программирования, которые я знаю ({len(LANGUAGES)})\\n\\n\"\n                f\"| Язык | Год | Для чего |\\n|---|---|---|\\n{rows}\\n\\n\"\n                \"Спросите про любой: «что такое Rust», «hello world на Go».\")\n    entry = find_language(text)\n    if not entry:\n        return None\n    if _CODE_RE.search(text):\n        name, _, _, _, _, lang, code = entry\n        return f\"**Hello, World на {name}:**\\n\\n```{lang}\\n{code}\\n```\"\n    if _ABOUT_RE.search(text) or _norm(text).strip(\" ?!.\") in [_norm(a) for a in [entry[0]] + entry[1]]:\n        return describe(entry)\n    return None\n", "creative.py": "\"\"\"Свои картинки (SVG) и презентации Rai — без внешних сервисов.\n\nКартинка собирается из «сцен» по словам в запросе: небо (день, закат, ночь, космос),\nгоры, море, лес, город, пустыня, зима, сердце, цветок, абстракция, логотип.\nПрезентация собирается из базы знаний Rai.\n\"\"\"\n\nimport math\nimport random\nimport re\nimport zlib\nfrom xml.sax.saxutils import escape\n\nimport nlp\n\nW, H = 1200, 800\n\nCOLORS = {\n    \"красн\": \"#e10600\", \"алый\": \"#ff2a2a\", \"син\": \"#1e5bff\", \"голуб\": \"#4fc3f7\",\n    \"зелен\": \"#2ecc71\", \"желт\": \"#ffd200\", \"оранж\": \"#ff7a00\", \"фиолет\": \"#8e44ad\",\n    \"розов\": \"#ff5fa2\", \"бирюз\": \"#1abc9c\", \"золот\": \"#d4af37\", \"серебр\": \"#c0c0c0\",\n    \"бел\": \"#f2f2f2\", \"черн\": \"#151515\",\n}\n\n# Сцены: имя -> начала слов, по которым их узнаём.\nSCENES = [\n    (\"logo\", (\"логотип\", \"лого\", \"эмблем\", \"значок\")),\n    (\"space\", (\"космос\", \"галактик\", \"планет\", \"вселенн\")),\n    (\"night\", (\"ноч\", \"луна\", \"луну\", \"луной\", \"звезд\")),\n    (\"sunset\", (\"закат\", \"вечер\")),\n    (\"sunrise\", (\"рассвет\", \"утро\", \"утрен\")),\n    (\"winter\", (\"зим\", \"снег\", \"снеж\", \"мороз\")),\n    (\"desert\", (\"пустын\", \"дюн\", \"песок\")),\n    (\"city\", (\"город\", \"небоскреб\", \"улиц\", \"дом\", \"здани\")),\n    (\"sea\", (\"море\", \"моря\", \"морск\", \"океан\", \"волн\", \"озер\", \"пляж\", \"река\")),\n    (\"mountains\", (\"гора\", \"горы\", \"гору\", \"горн\", \"горах\", \"скал\", \"вершин\")),\n    (\"forest\", (\"лес\", \"дерев\", \"елк\", \"ель\", \"ели\", \"сосн\", \"роща\")),\n    (\"heart\", (\"сердц\", \"сердечк\", \"любов\", \"валентин\")),\n    (\"flower\", (\"цветок\", \"цветы\", \"цветочк\", \"роза\", \"розу\", \"розы\", \"ромашк\", \"тюльпан\")),\n    (\"abstract\", (\"абстракц\", \"узор\", \"паттерн\", \"геометр\", \"фон\", \"обои\")),\n]\n\n_IMAGE_WORDS = re.compile(\n    r\"нарису|изобрази|картинк|изображени|рисун|логотип|нарисовать|арт\\b|обои\", re.I\n)\n# «Как сделать картинку?», «ты умеешь рисовать?» — это вопросы, а не просьбы.\n_QUESTION = re.compile(r\"^\\s*(а\\s+)?(как|ты умеешь|умеешь|можешь ли|что ты)\\b|\\bумеешь\\b\", re.I)\n\n\ndef is_image_request(text: str) -> bool:\n    return bool(_IMAGE_WORDS.search(text or \"\")) and not _QUESTION.search(text or \"\")\n\n\ndef _words(text):\n    return nlp.normalize(text).split()\n\n\ndef _has(words, prefixes):\n    return any(w.startswith(p) for w in words for p in prefixes)\n\n\ndef _mix(c1, c2, t):\n    a = [int(c1[i:i + 2], 16) for i in (1, 3, 5)]\n    b = [int(c2[i:i + 2], 16) for i in (1, 3, 5)]\n    return \"#\" + \"\".join(f\"{round(x + (y - x) * t):02x}\" for x, y in zip(a, b))\n\n\nclass _Canvas:\n    def __init__(self, rnd):\n        self.rnd = rnd\n        self.defs = []\n        self.items = []\n        self._id = 0\n\n    def uid(self, prefix):\n        self._id += 1\n        return f\"{prefix}{self._id}\"\n\n    def gradient(self, stops, vertical=True):\n        gid = self.uid(\"g\")\n        coords = 'x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"' if vertical else 'x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"'\n        body = \"\".join(f'<stop offset=\"{o}\" stop-color=\"{c}\"/>' for o, c in stops)\n        self.defs.append(f'<linearGradient id=\"{gid}\" {coords}>{body}<\/linearGradient>')\n        return f\"url(#{gid})\"\n\n    def glow(self, color):\n        gid = self.uid(\"r\")\n        self.defs.append(\n            f'<radialGradient id=\"{gid}\"><stop offset=\"0\" stop-color=\"{color}\" stop-opacity=\"0.9\"/>'\n            f'<stop offset=\"1\" stop-color=\"{color}\" stop-opacity=\"0\"/><\/radialGradient>'\n        )\n        return f\"url(#{gid})\"\n\n    def add(self, svg):\n        self.items.append(svg)\n\n    def svg(self, title):\n        return (\n            f'<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 {W} {H}\" width=\"{W}\" height=\"{H}\">'\n            f\"<title>{escape(title)}<\/title><defs>{''.join(self.defs)}<\/defs>{''.join(self.items)}<\/svg>\"\n        )\n\n\n# ------------------------------------------------------------------ элементы\n\ndef _sky(c, mode, accent):\n    skies = {\n        \"day\": [(\"0\", \"#2f7fd8\"), (\"1\", \"#bfe3ff\")],\n        \"sunset\": [(\"0\", \"#1b0b2e\"), (\"0.45\", \"#b3143a\"), (\"0.8\", \"#ff6a2a\"), (\"1\", \"#ffc15a\")],\n        \"sunrise\": [(\"0\", \"#2a3a7a\"), (\"0.55\", \"#ff8fa3\"), (\"1\", \"#ffe0a3\")],\n        \"night\": [(\"0\", \"#03040c\"), (\"1\", \"#141b3d\")],\n        \"space\": [(\"0\", \"#000000\"), (\"1\", \"#07030f\")],\n        \"winter\": [(\"0\", \"#8fb3d9\"), (\"1\", \"#eef5ff\")],\n        \"desert\": [(\"0\", \"#f39c4a\"), (\"1\", \"#ffe2a8\")],\n        \"dark\": [(\"0\", \"#0a0a0a\"), (\"1\", \"#1a0505\")],\n    }\n    stops = skies.get(mode, skies[\"day\"])\n    if accent and mode in (\"day\", \"dark\"):\n        stops = [(o, _mix(col, accent, 0.35)) for o, col in stops]\n    c.add(f'<rect width=\"{W}\" height=\"{H}\" fill=\"{c.gradient(stops)}\"/>')\n\n\ndef _stars(c, n, top=H):\n    r = c.rnd\n    parts = []\n    for _ in range(n):\n        x, y = r.uniform(0, W), r.uniform(0, top)\n        size = r.choice([0.8, 1, 1.2, 1.6, 2.2])\n        parts.append(f'<circle cx=\"{x:.0f}\" cy=\"{y:.0f}\" r=\"{size}\" fill=\"#fff\" opacity=\"{r.uniform(0.4, 1):.2f}\"/>')\n    c.add(\"\".join(parts))\n\n\ndef _sun(c, x, y, r, color):\n    c.add(f'<circle cx=\"{x}\" cy=\"{y}\" r=\"{r * 3}\" fill=\"{c.glow(color)}\"/>')\n    c.add(f'<circle cx=\"{x}\" cy=\"{y}\" r=\"{r}\" fill=\"{color}\"/>')\n\n\ndef _moon(c, x, y, r):\n    c.add(f'<circle cx=\"{x}\" cy=\"{y}\" r=\"{r * 2.6}\" fill=\"{c.glow(\"#dfe8ff\")}\"/>')\n    c.add(f'<circle cx=\"{x}\" cy=\"{y}\" r=\"{r}\" fill=\"#f4f1e6\"/>')\n    c.add(f'<circle cx=\"{x + r * 0.45}\" cy=\"{y - r * 0.2}\" r=\"{r * 0.9}\" fill=\"#0b1026\" opacity=\"0.92\"/>')\n\n\ndef _ridge(c, base, height, color, jag):\n    r = c.rnd\n    pts = [(0, H)]\n    x = 0\n    while x <= W:\n        pts.append((x, base - r.uniform(0.3, 1.0) * height))\n        x += r.uniform(60, 60 + jag)\n    pts += [(W, base - r.uniform(0.3, 1.0) * height), (W, H)]\n    c.add(f'<polygon points=\"{\" \".join(f\"{a:.0f},{b:.0f}\" for a, b in pts)}\" fill=\"{color}\"/>')\n\n\ndef _mountains(c, palette, snow):\n    for i, color in enumerate(palette):\n        base = 520 + i * 70\n        _ridge(c, base, 260 - i * 60, color, 140)\n    if snow:\n        c.add(f'<rect y=\"{H - 90}\" width=\"{W}\" height=\"90\" fill=\"#f4f8ff\"/>')\n\n\ndef _sea(c, top, color, sun_x=None, sun_color=None):\n    c.add(f'<rect y=\"{top}\" width=\"{W}\" height=\"{H - top}\" fill=\"{c.gradient([(\"0\", color), (\"1\", _mix(color, \"#000000\", 0.6))])}\"/>')\n    if sun_x is not None:\n        for i in range(10):\n            w = 160 - i * 12\n            c.add(f'<rect x=\"{sun_x - w / 2:.0f}\" y=\"{top + 12 + i * 18}\" width=\"{w}\" height=\"4\" rx=\"2\" fill=\"{sun_color}\" opacity=\"{0.7 - i * 0.05:.2f}\"/>')\n    r = c.rnd\n    for i in range(18):\n        y = top + 20 + i * (H - top) / 18\n        x = r.uniform(-50, W)\n        c.add(f'<path d=\"M{x:.0f} {y:.0f} q30 -8 60 0 t60 0\" stroke=\"#ffffff\" stroke-opacity=\"0.25\" fill=\"none\" stroke-width=\"2\"/>')\n\n\ndef _tree(c, x, ground, h, color):\n    w = h * 0.42\n    c.add(f'<rect x=\"{x - 4:.0f}\" y=\"{ground - h * 0.15:.0f}\" width=\"8\" height=\"{h * 0.15:.0f}\" fill=\"#2b1a0e\"/>')\n    for k in range(3):\n        top = ground - h + k * h * 0.22\n        c.add(f'<polygon points=\"{x:.0f},{top:.0f} {x - w * (0.6 + k * 0.2):.0f},{top + h * 0.45:.0f} '\n              f'{x + w * (0.6 + k * 0.2):.0f},{top + h * 0.45:.0f}\" fill=\"{color}\"/>')\n\n\ndef _forest(c, ground, color, snow=False):\n    r = c.rnd\n    c.add(f'<rect y=\"{ground}\" width=\"{W}\" height=\"{H - ground}\" fill=\"{\"#eef4ff\" if snow else _mix(color, \"#000000\", 0.5)}\"/>')\n    for layer, shade in ((0, 0.35), (1, 0.0)):\n        for _ in range(16):\n            h = r.uniform(120, 240) * (0.75 if layer == 0 else 1)\n            _tree(c, r.uniform(0, W), ground + layer * 30, h, _mix(color, \"#000000\", shade))\n\n\ndef _city(c, ground, night, accent):\n    r = c.rnd\n    x = 0\n    while x < W:\n        w = r.uniform(60, 130)\n        h = r.uniform(150, 460)\n        body = \"#0d0d12\" if night else \"#3b4252\"\n        c.add(f'<rect x=\"{x:.0f}\" y=\"{ground - h:.0f}\" width=\"{w - 6:.0f}\" height=\"{h:.0f}\" fill=\"{body}\"/>')\n        for wy in range(int(ground - h + 16), int(ground - 14), 26):\n            for wx in range(int(x + 10), int(x + w - 20), 20):\n                if r.random() < (0.45 if night else 0.2):\n                    c.add(f'<rect x=\"{wx}\" y=\"{wy}\" width=\"10\" height=\"14\" fill=\"{accent or (\"#ffd36b\" if night else \"#cfe7ff\")}\" opacity=\"0.9\"/>')\n        x += w\n    c.add(f'<rect y=\"{ground}\" width=\"{W}\" height=\"{H - ground}\" fill=\"#08080a\"/>')\n\n\ndef _dunes(c):\n    for i, color in enumerate((\"#e9a24f\", \"#d9863a\", \"#c46f2a\")):\n        y = 520 + i * 80\n        c.add(f'<path d=\"M0 {y} C300 {y - 90} 500 {y + 60} 800 {y - 40} S1100 {y + 30} {W} {y - 20} L{W} {H} L0 {H} Z\" fill=\"{color}\"/>')\n\n\ndef _snowfall(c):\n    r = c.rnd\n    c.add(\"\".join(\n        f'<circle cx=\"{r.uniform(0, W):.0f}\" cy=\"{r.uniform(0, H):.0f}\" r=\"{r.uniform(1.5, 4):.1f}\" fill=\"#fff\" opacity=\"0.85\"/>'\n        for _ in range(140)\n    ))\n\n\ndef _heart(c, color):\n    fill = c.gradient([(\"0\", _mix(color, \"#ffffff\", 0.25)), (\"1\", _mix(color, \"#000000\", 0.35))])\n    c.add(f'<circle cx=\"600\" cy=\"400\" r=\"330\" fill=\"{c.glow(color)}\"/>')\n    c.add(\n        f'<path d=\"M600 640 C360 480 300 360 360 280 C420 200 540 220 600 320 '\n        f'C660 220 780 200 840 280 C900 360 840 480 600 640 Z\" fill=\"{fill}\"/>'\n    )\n\n\ndef _flower(c, color):\n    c.add(f'<path d=\"M600 470 C590 560 610 650 600 800\" stroke=\"#1f7a3a\" stroke-width=\"16\" fill=\"none\"/>')\n    c.add('<ellipse cx=\"660\" cy=\"640\" rx=\"60\" ry=\"22\" fill=\"#2ecc71\" transform=\"rotate(-30 660 640)\"/>')\n    for k in range(8):\n        a = k * math.pi / 4\n        x, y = 600 + math.cos(a) * 95, 380 + math.sin(a) * 95\n        c.add(f'<ellipse cx=\"{x:.0f}\" cy=\"{y:.0f}\" rx=\"85\" ry=\"48\" fill=\"{color}\" opacity=\"0.92\" '\n              f'transform=\"rotate({math.degrees(a):.0f} {x:.0f} {y:.0f})\"/>')\n    c.add('<circle cx=\"600\" cy=\"380\" r=\"58\" fill=\"#ffd200\"/>')\n\n\ndef _abstract(c, palette):\n    r = c.rnd\n    for _ in range(26):\n        kind = r.random()\n        col = r.choice(palette)\n        op = r.uniform(0.25, 0.85)\n        if kind < 0.4:\n            c.add(f'<circle cx=\"{r.uniform(0, W):.0f}\" cy=\"{r.uniform(0, H):.0f}\" r=\"{r.uniform(30, 220):.0f}\" fill=\"{col}\" opacity=\"{op:.2f}\"/>')\n        elif kind < 0.7:\n            x, y, s = r.uniform(0, W), r.uniform(0, H), r.uniform(60, 300)\n            c.add(f'<rect x=\"{x:.0f}\" y=\"{y:.0f}\" width=\"{s:.0f}\" height=\"{s * r.uniform(0.3, 1):.0f}\" fill=\"{col}\" '\n                  f'opacity=\"{op:.2f}\" transform=\"rotate({r.uniform(0, 90):.0f} {x:.0f} {y:.0f})\"/>')\n        else:\n            c.add(f'<line x1=\"{r.uniform(0, W):.0f}\" y1=\"{r.uniform(0, H):.0f}\" x2=\"{r.uniform(0, W):.0f}\" '\n                  f'y2=\"{r.uniform(0, H):.0f}\" stroke=\"{col}\" stroke-width=\"{r.uniform(2, 14):.0f}\" opacity=\"{op:.2f}\"/>')\n\n\ndef _logo(c, name, accent):\n    accent = accent or \"#e10600\"\n    c.add(f'<rect width=\"{W}\" height=\"{H}\" fill=\"#0a0a0a\"/>')\n    c.add(f'<circle cx=\"600\" cy=\"300\" r=\"230\" fill=\"{c.glow(accent)}\"/>')\n    c.add(f'<polygon points=\"600,150 730,375 470,375\" fill=\"none\" stroke=\"{accent}\" stroke-width=\"18\"/>')\n    c.add(f'<circle cx=\"600\" cy=\"300\" r=\"36\" fill=\"{accent}\"/>')\n    text = escape(name.upper()[:18] or \"RTEAM\")\n    size = 120 if len(text) <= 8 else max(56, int(960 / len(text)))\n    c.add(f'<text x=\"600\" y=\"590\" text-anchor=\"middle\" font-family=\"Arial Black, Arial, sans-serif\" '\n          f'font-weight=\"900\" font-size=\"{size}\" fill=\"#f4f4f4\" letter-spacing=\"6\">{text}<\/text>')\n    c.add(f'<rect x=\"480\" y=\"630\" width=\"240\" height=\"8\" fill=\"{accent}\"/>')\n\n\n# ------------------------------------------------------------------ картинка\n\ndef make_image(prompt: str, seed=None) -> dict:\n    \"\"\"Нарисовать SVG по описанию. Возвращает {\"type\": \"image\", \"svg\", \"title\", \"prompt\"}.\"\"\"\n    words = _words(prompt)\n    rnd = random.Random(seed)\n    c = _Canvas(rnd)\n    found = [name for name, prefixes in SCENES if _has(words, prefixes)]\n    accent = next((col for p, col in COLORS.items() if _has(words, (p,))), None)\n    palette = [accent] if accent else []\n    palette += [\"#e10600\", \"#ff2a2a\", \"#7a0000\", \"#f2f2f2\", \"#1a1a1a\"]\n\n    if \"logo\" in found:\n        m = re.search(r\"(?:логотип\\w*|лого|эмблем\\w*|значок)\\s+(?:для\\s+|компании\\s+|команды\\s+)?(.+)\", prompt, re.I)\n        name = (m.group(1) if m else \"Rteam\").strip(\" .!?«»\\\"'\")\n        _logo(c, name, accent)\n        return {\"type\": \"image\", \"svg\": c.svg(\"Логотип \" + name), \"title\": f\"Логотип «{name}»\", \"prompt\": prompt}\n\n    if not found or found == [\"abstract\"]:\n        _sky(c, \"dark\", None)\n        _abstract(c, palette)\n        # Есть сюжет, которого нет среди сцен (например «кот»)?\n        rest = [w for w in words if len(w) > 2 and not _IMAGE_WORDS.search(w)\n                and w not in (\"что\", \"нибудь\", \"пожалуйста\", \"мне\", \"какую\", \"любую\", \"красивую\", \"сделай\", \"создай\")\n                and not any(w.startswith(p) for p in COLORS)]\n        return {\"type\": \"image\", \"svg\": c.svg(\"Абстракция\"), \"title\": \"Абстракция\", \"prompt\": prompt,\n                \"unknown\": bool(rest) and not found}\n\n    sky = next((s for s in (\"space\", \"night\", \"sunset\", \"sunrise\", \"winter\", \"desert\") if s in found), \"day\")\n    _sky(c, sky, accent)\n    if sky in (\"space\", \"night\"):\n        _stars(c, 260 if sky == \"space\" else 160, top=H if sky == \"space\" else 520)\n    if sky == \"space\":\n        for _ in range(3):\n            x, y, r = rnd.uniform(150, 1050), rnd.uniform(120, 650), rnd.uniform(30, 110)\n            col = rnd.choice(palette)\n            c.add(f'<circle cx=\"{x:.0f}\" cy=\"{y:.0f}\" r=\"{r:.0f}\" fill=\"{c.gradient([(\"0\", _mix(col, \"#ffffff\", 0.3)), (\"1\", _mix(col, \"#000000\", 0.6))], vertical=False)}\"/>')\n        c.add(f'<ellipse cx=\"600\" cy=\"400\" rx=\"520\" ry=\"120\" fill=\"{c.glow(accent or \"#b3143a\")}\" transform=\"rotate(-18 600 400)\"/>')\n\n    sun_x = rnd.choice([380, 600, 820])\n    sun_color = {\"sunset\": \"#ffb347\", \"sunrise\": \"#fff1a8\", \"desert\": \"#fff3c4\", \"day\": \"#fff6c9\"}.get(sky)\n    if sky == \"night\":\n        _moon(c, rnd.choice([250, 950]), 170, 60)\n    elif sun_color and sky not in (\"space\", \"winter\"):\n        _sun(c, sun_x, 400 if sky in (\"sunset\", \"sunrise\") else 180, 70, sun_color)\n\n    base_col = accent or {\"sunset\": \"#3a0d24\", \"sunrise\": \"#4a3a6a\", \"night\": \"#0b1026\",\n                          \"winter\": \"#9fb6cf\", \"desert\": \"#b35d2a\"}.get(sky, \"#2f5d50\")\n    if \"mountains\" in found:\n        _mountains(c, [_mix(base_col, \"#000000\", t) for t in (0.1, 0.35, 0.6)], \"winter\" in found)\n    if \"desert\" in found:\n        _dunes(c)\n    if \"city\" in found:\n        _city(c, 640 if \"sea\" in found else 700, sky in (\"night\", \"sunset\", \"space\"), accent)\n    if \"sea\" in found:\n        _sea(c, 560, accent or (\"#12213f\" if sky == \"night\" else \"#1d5f8a\" if sky == \"day\" else \"#3a1030\"),\n             sun_x if sun_color and sky in (\"sunset\", \"sunrise\", \"day\") else None, sun_color)\n    if \"forest\" in found:\n        _forest(c, 660, accent or (\"#0f3d2a\" if sky != \"winter\" else \"#1f4d3a\"), snow=\"winter\" in found)\n    if \"heart\" in found:\n        _heart(c, accent or \"#e10600\")\n    if \"flower\" in found:\n        _flower(c, accent or \"#ff2a2a\")\n    if \"abstract\" in found:\n        _abstract(c, palette)\n    if \"winter\" in found:\n        if not {\"mountains\", \"forest\"} & set(found):\n            c.add(f'<path d=\"M0 640 C300 600 700 690 {W} 620 L{W} {H} L0 {H} Z\" fill=\"#f4f8ff\"/>')\n        _snowfall(c)\n\n    names = {\"space\": \"космос\", \"night\": \"ночь\", \"sunset\": \"закат\", \"sunrise\": \"рассвет\", \"winter\": \"зима\",\n             \"desert\": \"пустыня\", \"city\": \"город\", \"sea\": \"море\", \"mountains\": \"горы\", \"forest\": \"лес\",\n             \"heart\": \"сердце\", \"flower\": \"цветок\", \"abstract\": \"абстракция\"}\n    title = \", \".join(names[f] for f in found if f in names).capitalize()\n    return {\"type\": \"image\", \"svg\": c.svg(title), \"title\": title, \"prompt\": prompt}\n\n\n# ------------------------------------------------------------------ презентация\n\n_SLIDES_WORDS = re.compile(r\"презентаци|слайд\", re.I)\n_SLIDES_FILLER = re.compile(\n    r\"\\b(пожалуйста|сделай|создай|подготовь|сгенерируй|собери|напиши|нужна|нужно|мне|презентаци\\w*|\"\n    r\"слайд\\w*|на|тему|теме|про|о|об|по|для|короткую|большую|подробную)\\b\",\n    re.I,\n)\n\n\ndef is_slides_request(text: str) -> bool:\n    return bool(_SLIDES_WORDS.search(text or \"\")) and not _QUESTION.search(text or \"\")\n\n\ndef slides_topic(text: str) -> str:\n    topic = _SLIDES_FILLER.sub(\" \", text or \"\")\n    return re.sub(r\"\\s+\", \" \", topic).strip(\" .,!?:;«»\\\"'\")\n\n\ndef _split_segments(text):\n    \"\"\"Разбить markdown-текст на блоки: (\"code\", lang, код) / (\"table\", строки) / (\"text\", строки).\"\"\"\n    segs, buf, lines = [], [], text.split(\"\\n\")\n    i = 0\n    while i < len(lines):\n        line = lines[i]\n        if line.strip().startswith(\"```\"):\n            if buf:\n                segs.append((\"text\", buf)); buf = []\n            lang = line.strip()[3:].strip()\n            code = []\n            i += 1\n            while i < len(lines) and not lines[i].strip().startswith(\"```\"):\n                code.append(lines[i]); i += 1\n            segs.append((\"code\", lang, \"\\n\".join(code)))\n        elif line.strip().startswith(\"|\"):\n            if buf:\n                segs.append((\"text\", buf)); buf = []\n            rows = []\n            while i < len(lines) and lines[i].strip().startswith(\"|\"):\n                rows.append(lines[i]); i += 1\n            segs.append((\"table\", rows))\n            continue\n        else:\n            buf.append(line)\n        i += 1\n    if buf:\n        segs.append((\"text\", buf))\n    return segs\n\n\ndef _bullets(lines):\n    items = []\n    for line in lines:\n        s = line.strip()\n        if not s:\n            continue\n        s = re.sub(r\"^([•\\-*]|\\d+[.)])\\s*\", \"\", s)\n        s = s.replace(\"**\", \"\")\n        if s.startswith(\"#\"):\n            s = s.lstrip(\"# \")\n        if len(s) > 160:\n            items += [p.strip() + (\"\" if p.strip().endswith((\".\", \"!\", \"?\")) else \".\")\n                      for p in re.split(r\"(?<=[.!?])\\s+\", s) if p.strip()]\n        else:\n            items.append(s)\n    return items\n\n\ndef _table(rows):\n    cells = []\n    for row in rows:\n        parts = [p.strip() for p in row.strip().strip(\"|\").split(\"|\")]\n        if all(re.fullmatch(r\":?-{2,}:?\", p) for p in parts if p):\n            continue\n        cells.append(parts)\n    return cells\n\n\ndef make_slides(topic: str, intents: list, max_slides: int = 6) -> dict:\n    \"\"\"Собрать презентацию по теме из статей базы знаний.\"\"\"\n    title = topic[:1].upper() + topic[1:] if topic else \"Презентация\"\n    slides = [{\"kind\": \"title\", \"title\": title, \"subtitle\": \"Rai · Rteam\"}]\n\n    for intent in intents:\n        text = intent[\"answers\"][0].replace(\"{name}\", \"\")\n        if intent.get(\"more\"):\n            text += \"\\n\\n\" + intent[\"more\"]\n        heading = intent.get(\"title\", title)\n        for seg in _split_segments(text):\n            if len(slides) >= max_slides - 1:\n                break\n            if seg[0] == \"code\" and seg[2].strip():\n                slides.append({\"kind\": \"code\", \"title\": heading + \": пример\", \"lang\": seg[1], \"code\": seg[2]})\n            elif seg[0] == \"table\":\n                cells = _table(seg[1])\n                if cells:\n                    slides.append({\"kind\": \"table\", \"title\": heading, \"rows\": cells})\n            elif seg[0] == \"text\":\n                items = [b for b in _bullets(seg[1]) if not b.endswith(\":\") or len(b) > 40]\n                for k in range(0, len(items), 5):\n                    if len(slides) >= max_slides - 1:\n                        break\n                    slides.append({\"kind\": \"bullets\", \"title\": heading, \"bullets\": items[k:k + 5]})\n\n    template = len(slides) == 1\n    if template:\n        # Нет знаний по теме — даём структуру, которую нужно заполнить своим текстом.\n        for head in (\"Введение\", \"Главная идея\", \"Примеры\", \"Выводы\"):\n            slides.append({\"kind\": \"bullets\", \"title\": head,\n                           \"bullets\": [f\"Здесь будет ваш текст о теме «{title}».\", \"Замените этот пункт своим.\"]})\n    slides.append({\"kind\": \"end\", \"title\": \"Спасибо за внимание!\", \"subtitle\": \"Вопросы?\"})\n    _decorate(slides, topic or title)\n    return {\"type\": \"slides\", \"title\": title, \"slides\": slides, \"template\": template}\n\n\nTRANSITIONS = [\"fade\", \"slide\", \"zoom\", \"wipe\"]\n\n\ndef _decorate(slides, topic):\n    \"\"\"Картинки на обложку и на слайды с текстом, переходы между слайдами.\"\"\"\n    seed = zlib.crc32(topic.encode(\"utf-8\"))\n    slides[0][\"image\"] = make_image(topic, seed=seed)[\"svg\"]\n    with_text = [s for s in slides if s[\"kind\"] == \"bullets\" and len(s[\"bullets\"]) <= 4]\n    for k, slide in enumerate(with_text[:3]):\n        slide[\"image\"] = make_image(f\"{topic} {slide['title']}\", seed=seed + k + 1)[\"svg\"]\n    for k, slide in enumerate(slides):\n        slide[\"transition\"] = TRANSITIONS[k % len(TRANSITIONS)]\n\n\n# ------------------------------------------------------------------ погода\n\ndef _cloud(c, x, y, s, color, opacity=1.0):\n    c.add(f'<g opacity=\"{opacity:.2f}\" fill=\"{color}\">'\n          f'<ellipse cx=\"{x}\" cy=\"{y}\" rx=\"{95 * s:.0f}\" ry=\"{42 * s:.0f}\"/>'\n          f'<circle cx=\"{x - 45 * s:.0f}\" cy=\"{y - 18 * s:.0f}\" r=\"{42 * s:.0f}\"/>'\n          f'<circle cx=\"{x + 20 * s:.0f}\" cy=\"{y - 38 * s:.0f}\" r=\"{55 * s:.0f}\"/>'\n          f'<circle cx=\"{x + 70 * s:.0f}\" cy=\"{y - 10 * s:.0f}\" r=\"{36 * s:.0f}\"/><\/g>')\n\n\ndef weather_card(city: str, temp: str, desc: str, kind: str, is_day: bool, extra: str = \"\") -> dict:\n    \"\"\"Картинка погоды: небо, солнце/луна, облака, дождь, снег, гроза, туман + температура.\"\"\"\n    rnd = random.Random(f\"{city}{desc}{is_day}\")\n    c = _Canvas(rnd)\n    if kind in (\"rain\", \"storm\"):\n        sky = [(\"0\", \"#1b2230\"), (\"1\", \"#3b4658\")] if kind == \"rain\" else [(\"0\", \"#120c1c\"), (\"1\", \"#2c2340\")]\n    elif kind == \"snow\":\n        sky = [(\"0\", \"#7f93ab\"), (\"1\", \"#d9e4f0\")] if is_day else [(\"0\", \"#1a2233\"), (\"1\", \"#3a4a63\")]\n    elif kind in (\"cloudy\", \"fog\"):\n        sky = [(\"0\", \"#5b6573\"), (\"1\", \"#aab3bf\")] if is_day else [(\"0\", \"#15181f\"), (\"1\", \"#2c323d\")]\n    else:\n        sky = [(\"0\", \"#1f6fd1\"), (\"1\", \"#9fd3ff\")] if is_day else [(\"0\", \"#03040c\"), (\"1\", \"#1a2150\")]\n    c.add(f'<rect width=\"{W}\" height=\"{H}\" fill=\"{c.gradient(sky)}\"/>')\n\n    if not is_day and kind in (\"clear\", \"partly\"):\n        _stars(c, 120, top=H)\n    if kind in (\"clear\", \"partly\"):\n        if is_day:\n            _sun(c, 860, 250, 95, \"#ffd54a\")\n        else:\n            _moon(c, 860, 240, 80)\n    if kind in (\"partly\", \"cloudy\", \"rain\", \"storm\", \"snow\", \"fog\"):\n        shade = \"#f2f4f7\" if kind in (\"partly\",) or (kind == \"snow\" and is_day) else \"#7d8796\" if kind == \"cloudy\" else \"#4a5262\"\n        clouds = 2 if kind == \"partly\" else 4\n        for k in range(clouds):\n            _cloud(c, 620 + k * 150 - (clouds - 2) * 60, 230 + (k % 2) * 60, 1.4 - k * 0.1, shade, 0.95)\n    if kind in (\"rain\", \"storm\"):\n        c.add(\"\".join(\n            f'<line x1=\"{x:.0f}\" y1=\"{y:.0f}\" x2=\"{x - 14:.0f}\" y2=\"{y + 38:.0f}\" stroke=\"#9cc8ff\" stroke-width=\"3\" '\n            f'stroke-linecap=\"round\" opacity=\"0.8\"/>'\n            for x, y in ((rnd.uniform(420, 1150), rnd.uniform(320, 760)) for _ in range(70))))\n    if kind == \"storm\":\n        c.add('<polygon points=\"840,300 780,450 830,450 790,590 900,410 845,410 890,300\" fill=\"#ffe14a\"/>')\n    if kind == \"snow\":\n        _snowfall(c)\n    if kind == \"fog\":\n        for k in range(7):\n            y = 330 + k * 60\n            c.add(f'<rect x=\"{rnd.uniform(-100, 300):.0f}\" y=\"{y}\" width=\"{rnd.uniform(700, 1100):.0f}\" height=\"22\" '\n                  f'rx=\"11\" fill=\"#ffffff\" opacity=\"0.35\"/>')\n\n    # панель с текстом в стиле Rai\n    c.add('<rect x=\"40\" y=\"40\" width=\"560\" height=\"720\" rx=\"28\" fill=\"#0b0b0c\" opacity=\"0.78\"/>')\n    c.add('<rect x=\"40\" y=\"740\" width=\"560\" height=\"20\" rx=\"0\" fill=\"#e10600\"/>')\n    c.add(f'<text x=\"80\" y=\"130\" font-family=\"Arial, sans-serif\" font-size=\"44\" font-weight=\"700\" fill=\"#f3f1f1\">{escape(city[:22])}<\/text>')\n    c.add(f'<text x=\"72\" y=\"400\" font-family=\"Arial Black, Arial, sans-serif\" font-size=\"210\" font-weight=\"900\" fill=\"#ffffff\">{escape(temp)}<\/text>')\n    c.add(f'<text x=\"80\" y=\"490\" font-family=\"Arial, sans-serif\" font-size=\"46\" fill=\"#ff4a4a\">{escape(desc[:26])}<\/text>')\n    c.add(f'<text x=\"80\" y=\"560\" font-family=\"Arial, sans-serif\" font-size=\"34\" fill=\"#c9c3c7\">{escape(extra[:34])}<\/text>')\n    c.add('<text x=\"80\" y=\"700\" font-family=\"Arial, sans-serif\" font-size=\"26\" fill=\"#9b9599\">Rai · погода<\/text>')\n    return {\"type\": \"image\", \"svg\": c.svg(f\"Погода: {city}\"), \"title\": f\"Погода: {city}, {temp}\", \"prompt\": desc}\n", "brain.py": "\"\"\"Движок Rai: собственный ИИ без внешних API.\n\nКак отвечает Rai:\n1. команды памяти («запомни, что …», «как меня зовут») — Pro Plus / Pro Sun;\n2. встроенные навыки (калькулятор, время, конвертер, …);\n3. поиск по базе знаний knowledge.json (+ learned.json);\n4. поиск по запомненным фактам (Pro Sun);\n5. если ничего не подошло — честно говорит и предлагает похожие темы.\n\"\"\"\n\nimport json\nimport os\nimport random\nimport re\nimport threading\nimport time\nfrom collections import OrderedDict\n\nimport creative\nimport net\nimport nlp\nimport online\nimport proglangs\nimport skills\nfrom versions import Version\n\nBASE_DIR = os.path.dirname(os.path.abspath(__file__))\nKNOWLEDGE_PATH = os.environ.get(\"RAI_KNOWLEDGE_PATH\", os.path.join(BASE_DIR, \"knowledge.json\"))\nLEARNED_PATH = os.environ.get(\"RAI_LEARNED_PATH\", os.path.join(BASE_DIR, \"learned.json\"))\nGLOSSARY_PATH = os.environ.get(\"RAI_GLOSSARY_PATH\", os.path.join(BASE_DIR, \"glossary.json\"))\n\nMAX_MESSAGE_CHARS = int(os.environ.get(\"RAI_MAX_MESSAGE_CHARS\", \"4000\"))\nMAX_FACTS = 50\nDEFAULT_CITY = os.environ.get(\"RAI_DEFAULT_CITY\", \"Москва\")\n\n_NAME_RE = re.compile(\n    r\"(?:меня зовут|мое имя|моё имя|зови меня|называй меня|my name is)\\s+([A-Za-zА-Яа-яЁё-]{2,30})\",\n    re.I,\n)\n_ASK_NAME_RE = re.compile(r\"как меня зовут|ты помнишь как меня|мое имя\\??$|моё имя\\??$|who am i\", re.I)\n_MORE_RE = re.compile(r\"^(а\\s+)?(подробнее|ещ[её]|расскажи подробнее|расскажи ещ[её]|продолжай|дальше|и\\?)[\\s?!.]*$\", re.I)\n_REMEMBER_RE = re.compile(r\"^\\s*запомни(?:,)?\\s*(?:что|:)?\\s*(.+)$\", re.I | re.S)\n_RECALL_RE = re.compile(r\"что ты (?:помнишь|запомнил|знаешь обо мне)|что я тебе говорил\", re.I)\n_FORGET_RE = re.compile(r\"^\\s*забудь (?:вс[её]|об? мне)\", re.I)\n_DEFINE_RE = re.compile(\n    r\"^\\s*(?:а\\s+)?(?:что такое|что это(?: такое)?|кто такой|кто такая|кто такие|что значит|что означает|\"\n    r\"что такое это|расскажи (?:про|о|об)|что ты знаешь (?:про|о|об)|что знаешь (?:про|о|об)|объясни(?: что такое)?)\"\n    r\"\\s+(.+?)[\\s?!.]*$|^\\s*(.+?)\\s*(?:[-—]\\s*)?это что[\\s?!.]*$\",\n    re.I,\n)\n\n\nclass RaiError(Exception):\n    \"\"\"Ошибка, текст которой можно показать пользователю.\"\"\"\n\n    def __init__(self, message: str, status: int = 400):\n        super().__init__(message)\n        self.status = status\n\n\nclass SessionStore:\n    \"\"\"Память разговоров в оперативной памяти сервера (с лимитом и сроком жизни).\"\"\"\n\n    def __init__(self, limit: int = 5000, ttl: int = 6 * 3600):\n        self.limit, self.ttl = limit, ttl\n        self._data = OrderedDict()\n        self._lock = threading.Lock()\n\n    def get(self, session_id):\n        if not session_id:\n            return {}\n        now = time.time()\n        with self._lock:\n            session = self._data.pop(session_id, None)\n            if session is None or now - session[\"_seen\"] > self.ttl:\n                session = {\"facts\": []}\n            session[\"_seen\"] = now\n            self._data[session_id] = session\n            while len(self._data) > self.limit:\n                self._data.popitem(last=False)\n            return session\n\n\ndef _clean_session_id(value):\n    if isinstance(value, str) and re.fullmatch(r\"[A-Za-z0-9_.-]{1,64}\", value):\n        return value\n    return None\n\n\nclass Brain:\n    def __init__(self, knowledge_path=KNOWLEDGE_PATH, learned_path=LEARNED_PATH, glossary_path=GLOSSARY_PATH):\n        self.knowledge_path = knowledge_path\n        self.learned_path = learned_path\n        self.glossary_path = glossary_path\n        self.sessions = SessionStore()\n        self._lock = threading.Lock()\n        self.reload()\n\n    # ------------------------------------------------------------ база знаний\n\n    def _read(self, path):\n        if not path or not os.path.exists(path):\n            return []\n        with open(path, encoding=\"utf-8\") as f:\n            return json.load(f).get(\"intents\", [])\n\n    def reload(self):\n        intents = self._read(self.knowledge_path) + self._read(self.learned_path)\n        by_id = {}\n        for intent in intents:\n            if intent.get(\"id\") and intent.get(\"patterns\") and intent.get(\"answers\"):\n                by_id[intent[\"id\"]] = intent\n        docs = [(i[\"id\"], p) for i in by_id.values() for p in i[\"patterns\"] + [i.get(\"title\", \"\")] if p]\n        indexes = {\n            \"keywords\": nlp.KeywordIndex(docs),\n            \"tfidf\": nlp.TfidfIndex(docs, fuzzy=False),\n            \"tfidf+fuzzy\": nlp.TfidfIndex(docs, fuzzy=True),\n        }\n        intent_tokens = {}\n        for key, text in docs:\n            intent_tokens.setdefault(key, set()).update(nlp.tokens(text))\n        glossary = []\n        if self.glossary_path and os.path.exists(self.glossary_path):\n            with open(self.glossary_path, encoding=\"utf-8\") as f:\n                for entry in json.load(f).get(\"terms\", []):\n                    keys = [tuple(nlp.tokens(t, keep_stopwords=True)) for t in entry[\"terms\"]]\n                    glossary.append(([k for k in keys if k], entry[\"text\"]))\n        # Слова из статей словаря тоже «известные», чтобы корректор их не «исправлял».\n        vocab = [text for _, text in docs] + [text for _, text in glossary] + [\n            \" \".join(k) for keys, _ in glossary for k in keys]\n        speller = nlp.SpellChecker(vocab)\n        with self._lock:\n            self.intents, self.indexes = by_id, indexes\n            self.intent_tokens, self.speller = intent_tokens, speller\n            self.glossary = glossary\n\n    def teach(self, patterns, answer, title=None):\n        \"\"\"Добавить знание в learned.json (админ-функция).\"\"\"\n        patterns = [p.strip() for p in patterns if isinstance(p, str) and p.strip()]\n        if not patterns or not isinstance(answer, str) or not answer.strip():\n            raise RaiError(\"Нужны patterns (список фраз) и answer (ответ).\")\n        with self._lock:\n            learned = self._read(self.learned_path)\n            intent_id = f\"learned_{len(learned) + 1}_{int(time.time())}\"\n            learned.append({\n                \"id\": intent_id,\n                \"title\": (title or patterns[0]).strip(),\n                \"patterns\": patterns,\n                \"answers\": [answer.strip()],\n            })\n            with open(self.learned_path, \"w\", encoding=\"utf-8\") as f:\n                json.dump({\"intents\": learned}, f, ensure_ascii=False, indent=2)\n        self.reload()\n        return intent_id\n\n    def define(self, version: Version, text: str, exact_only: bool = False):\n        \"\"\"Найти понятие в словаре: «что такое атом», «кто такой хакер», просто «фотосинтез».\"\"\"\n        m = _DEFINE_RE.match(text)\n        subject = (m.group(1) or m.group(2)) if m else None\n        if exact_only and not subject:\n            return None\n        target = subject if subject else text\n        if version.fuzzy:\n            target = self.speller.correct(target)\n        words = tuple(nlp.tokens(target, keep_stopwords=True))\n        if not words:\n            return None\n        best, best_len = None, 0\n        for keys, definition in self.glossary:\n            for key in keys:\n                exact = words == key\n                # «что такое X» — X может быть частью фразы («что такое оперативная память в компьютере»)\n                inside = subject and not exact_only and any(words[i:i + len(key)] == key for i in range(len(words)))\n                if (exact or inside) and len(key) > best_len:\n                    best, best_len = definition, len(key)\n        return best\n\n    def search(self, version: Version, text: str, limit: int = 5, correct: bool = True):\n        \"\"\"Найти подходящие темы: [(id, сходство)], только уверенные совпадения.\"\"\"\n        if version.fuzzy and correct:\n            text = self.speller.correct(text)\n        key = \"keywords\" if version.search == \"keywords\" else (\"tfidf+fuzzy\" if version.fuzzy else \"tfidf\")\n        results = self.indexes[key].search(text)\n        # Совпадение только по общим словам («что», «такое», «как»…) при наличии\n        # в вопросе значимых слов — не совпадение: «что такое рхп» ≠ «что такое python».\n        meaningful = set(nlp.tokens(text)) - nlp.GENERIC\n        if meaningful:\n            results = [(k, s) for k, s in results if meaningful & self.intent_tokens.get(k, set())]\n        return results[:limit]\n\n    # ------------------------------------------------------------ ответы\n\n    def answer(self, version: Version, message: str, session_id=None, history=None) -> dict:\n        message = (message or \"\").strip()\n        if not message:\n            raise RaiError(\"Пустой запрос.\")\n        if len(message) > MAX_MESSAGE_CHARS:\n            raise RaiError(f\"Запрос слишком длинный (больше {MAX_MESSAGE_CHARS} символов).\", 413)\n\n        session = self.sessions.get(_clean_session_id(session_id)) if version.context else {}\n        if version.context and not session.get(\"name\"):\n            session[\"name\"] = _name_from_history(history)\n\n        parts = [message]\n        if version.multi and not _REMEMBER_RE.match(message):\n            parts = [p.strip() for p in re.split(r\"(?<=\\?)\\s+|\\n+\", message) if p.strip()] or [message]\n\n        answers, intents, attachments = [], [], []\n        for part in parts[:5]:\n            text, intent = self._answer_one(version, part, session, attachments)\n            answers.append(text)\n            intents.append(intent)\n\n        if len(answers) > 1:\n            text = \"\\n\\n\".join(f\"**{q}**\\n\\n{a}\" for q, a in zip(parts, answers))\n        else:\n            text = answers[0]\n        return {\n            \"answer\": text,\n            \"version\": version.id,\n            \"version_name\": version.name,\n            \"intent\": intents[0] if len(intents) == 1 else intents,\n            \"attachments\": attachments,\n        }\n\n    def _answer_one(self, version: Version, text: str, session: dict, attachments: list):\n        name_match = _NAME_RE.search(text)\n        if name_match:\n            name = name_match.group(1).capitalize()\n            if version.context:\n                session[\"name\"] = name\n                return f\"Приятно познакомиться, {name}! Запомнил.\", \"set_name\"\n            return f\"Приятно познакомиться, {name}! (Запоминать имя умеют Pro Plus и Pro Sun.)\", \"set_name\"\n\n        if _ASK_NAME_RE.search(text):\n            if not version.context:\n                return \"Запоминать имя умеют Rai Pro Plus и Rai Pro Sun.\", \"get_name\"\n            if session.get(\"name\"):\n                return f\"Вас зовут {session['name']}.\", \"get_name\"\n            return \"Вы ещё не говорили, как вас зовут. Напишите: «меня зовут …».\", \"get_name\"\n\n        if _MORE_RE.match(text):\n            if not version.context:\n                return \"Продолжать тему умеют Rai Pro Plus и Rai Pro Sun. Задайте вопрос целиком.\", \"more\"\n            if session.get(\"last_intent\") in self.intents:\n                return self._more(session), \"more\"\n            return \"О чём рассказать подробнее? Задайте вопрос.\", \"more\"\n\n        if _REMEMBER_RE.match(text) or _RECALL_RE.search(text) or _FORGET_RE.match(text):\n            if not version.memory:\n                return \"Запоминать факты умеет только Rai Pro Sun.\", \"memory\"\n            return self._memory(text, session), \"memory\"\n\n        if creative.is_slides_request(text):\n            if \"slides\" not in version.skills:\n                return \"Презентации умеют делать Rai Pro Plus и Rai Pro Sun.\", \"slides\"\n            return self._slides(version, text, attachments), \"slides\"\n\n        if creative.is_image_request(text):\n            if \"image\" not in version.skills:\n                return \"Картинки умеют рисовать Rai Pro, Pro Plus и Pro Sun.\", \"image\"\n            image = creative.make_image(text)\n            attachments.append(image)\n            if image.get(\"unknown\"):\n                return (\"Такой сюжет я пока рисовать не умею, поэтому нарисовал **абстракцию**. \"\n                        \"Умею: закат, рассвет, ночь, космос, горы, море, лес, город, пустыню, зиму, \"\n                        \"сердце, цветок и логотипы.\"), \"image\"\n            return f\"Готово: **{image['title']}**. Картинку можно скачать в PNG или SVG.\", \"image\"\n\n        # ---- навыки с интернетом\n        if \"translate\" in version.skills and online.is_translate_request(text):\n            return online.translate(text), \"translate\"\n        if \"weather\" in version.skills:\n            found = online.weather(text, session, DEFAULT_CITY)\n            if found:\n                reply, extra = found\n                attachments.extend(extra)\n                return reply, \"weather\"\n        if \"currency\" in version.skills:\n            reply = online.currency(text)\n            if reply:\n                return reply, \"currency\"\n        query = online.explicit_search(text)\n        if query:\n            if \"web\" not in version.skills:\n                return \"Искать в интернете умеют Rai Pro, Pro Plus и Pro Sun.\", \"web\"\n            return self._web(query, attachments) or (f\"В интернете ничего не нашёл про «{query}».\", \"web\")\n\n        # ---- языки программирования: примеры кода и список\n        code_answer = proglangs.answer(text)\n        if code_answer and (proglangs._LIST_RE.search(text) or proglangs._CODE_RE.search(text)):\n            return code_answer, \"proglang\"\n\n        reply = skills.run(text, version.skills)\n        if reply:\n            return reply, \"skill\"\n\n        # «Что такое X», где X точно есть в словаре, — отвечаем определением.\n        # Языки программирования отвечает справочник proglangs, а не словарь.\n        definition = None if code_answer else self.define(version, text, exact_only=True)\n        if definition:\n            return definition, \"glossary\"\n\n        results = self.search(version, text)\n        best = results[0][1] if results else 0.0\n\n        if version.memory:\n            fact, score = self._find_fact(text, session)\n            if fact and score >= best:\n                return f\"Вы мне говорили: {fact}.\", \"memory\"\n\n        if best < version.threshold:\n            if code_answer:\n                return code_answer, \"proglang\"\n            definition = self.define(version, text)\n            if definition:\n                return definition, \"glossary\"\n\n        if best >= version.threshold:\n            intent = self.intents[results[0][0]]\n            if version.context:\n                # «подробнее»/«ещё» имеют смысл только для тем с продолжением.\n                if intent.get(\"more\") or intent.get(\"repeatable\"):\n                    session[\"last_intent\"] = intent[\"id\"]\n                    session[\"more_used\"] = False\n                else:\n                    session.pop(\"last_intent\", None)\n            return self._render(intent, version, session), intent[\"id\"]\n\n        note = \"\"\n        if \"web\" in version.skills and self._worth_searching(text):\n            try:\n                found = self._web(self._subject(text) or text, attachments, raise_errors=True)\n            except net.NetError:\n                found, note = None, \"\\n\\n*Поискать в интернете не получилось: нет связи.*\"\n            if found:\n                return found\n        return self._fallback(version, results, text) + note, None\n\n    @staticmethod\n    def _subject(text):\n        m = _DEFINE_RE.match(text)\n        return ((m.group(1) or m.group(2)) if m else \"\").strip()\n\n    @staticmethod\n    def _worth_searching(text):\n        \"\"\"Искать в интернете только осмысленные вопросы, а не «ок» или «ыыы».\"\"\"\n        meaningful = [w for w in nlp.tokens(text) if w not in nlp.GENERIC and len(w) > 2]\n        return bool(meaningful) and bool(re.search(r\"[а-яa-z]{3,}\", text.lower()))\n\n    def _web(self, query, attachments, raise_errors=False):\n        try:\n            found = online.web_search(query)\n        except net.NetError as e:\n            if raise_errors:\n                raise\n            return f\"Поискать в интернете не получилось: нет связи ({e}).\", \"web\"\n        if not found:\n            return None\n        reply, extra = found\n        attachments.extend(extra)\n        return reply, \"web\"\n\n    def _slides(self, version, text, attachments):\n        topic = creative.slides_topic(text)\n        results = self.search(version, topic, limit=4, correct=False) if topic else []\n        found = [self.intents[k] for k, score in results if score >= version.threshold * 0.8]\n        found = found[:4] if version.detailed else found[:2]\n        if len(found) < 2 and topic:\n            found += self._glossary_for(topic, limit=(6 if version.detailed else 3) - len(found))\n        title = topic or \"Rteam\"\n        if re.fullmatch(r\"[a-z0-9+#]{1,5}\", title, re.I):\n            title = title.upper()  # html -> HTML, php -> PHP\n        elif found and found[0].get(\"key_match\") and len(title.split()) == 1:\n            title = found[0][\"title\"]  # «котов» -> «Кошка»\n        deck = creative.make_slides(title, found, max_slides=10 if version.detailed else 6)\n        attachments.append(deck)\n        n = len(deck[\"slides\"])\n        count = f\"{n} \" + (\"слайд\" if n % 10 == 1 and n % 100 != 11 else\n                          \"слайда\" if 2 <= n % 10 <= 4 and not 12 <= n % 100 <= 14 else \"слайдов\")\n        if deck[\"template\"]:\n            return (f\"В моей базе нет материала про «{deck['title']}», поэтому я сделал **шаблон**: \"\n                    f\"{count}. Замените текст на свой.\")\n        return f\"Готово: презентация **«{deck['title']}»**, {count}. Её можно смотреть на весь экран и скачать.\"\n\n    def _glossary_for(self, topic, limit=3):\n        \"\"\"Понятия из словаря, связанные с темой, в виде статей для слайдов.\"\"\"\n        want = set(nlp.tokens(topic)) - nlp.GENERIC\n        if not want or limit <= 0:\n            return []\n        by_key, by_text = [], []\n        for keys, text in self.glossary:\n            key_words = {w for k in keys for w in k}\n            if want & key_words:\n                by_key.append((len(want & key_words), keys, text))\n            elif want & set(nlp.tokens(text)):\n                by_text.append((len(want & set(nlp.tokens(text))), keys, text))\n        # Сначала понятия, в названии которых есть тема, потом те, где она упоминается.\n        scored = [(True,) + x for x in sorted(by_key, key=lambda x: -x[0])] + \\\n                 [(False,) + x for x in sorted(by_text, key=lambda x: -x[0])]\n        out = []\n        for key_match, _, keys, text in scored[:limit]:\n            m = re.match(r\"\\*\\*(.+?)\\*\\*\", text)\n            title = m.group(1) if m else \" \".join(keys[0]).capitalize()\n            out.append({\"title\": title, \"key_match\": key_match,\n                        \"answers\": [re.sub(r\"^\\*\\*.+?\\*\\*\\s*(\\([^)]*\\)\\s*)?[—-]\\s*\", \"\", text)]})\n        return out\n\n    def _pick(self, intent, session):\n        \"\"\"Случайный вариант ответа, по возможности не тот же, что в прошлый раз.\"\"\"\n        options = [a for a in intent[\"answers\"] if a != session.get(\"last_answer\")] or intent[\"answers\"]\n        choice = random.choice(options)\n        session[\"last_answer\"] = choice\n        name = session.get(\"name\")\n        return choice.replace(\"{name}\", f\", {name}\" if name else \"\")\n\n    def _render(self, intent, version, session):\n        answer = self._pick(intent, session)\n        if version.detailed and intent.get(\"more\"):\n            answer += \"\\n\\n\" + intent[\"more\"]\n            session[\"more_used\"] = True\n        return answer\n\n    def _more(self, session):\n        intent = self.intents[session[\"last_intent\"]]\n        if intent.get(\"more\") and not session.get(\"more_used\"):\n            session[\"more_used\"] = True\n            return intent[\"more\"]\n        if len(intent[\"answers\"]) > 1:\n            return self._pick(intent, session)\n        return \"Больше по этой теме мне добавить нечего. Спросите что-нибудь ещё!\"\n\n    def _memory(self, text, session):\n        facts = session.setdefault(\"facts\", [])\n        m = _REMEMBER_RE.match(text)\n        if m:\n            fact = m.group(1).strip().rstrip(\".!\")\n            if len(facts) >= MAX_FACTS:\n                facts.pop(0)\n            facts.append(fact)\n            return f\"Запомнил: {fact}.\"\n
