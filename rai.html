<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
  /* Настройки (можно задать до этого файла через window.RAI_CONFIG):
     api     — адрес Python-сервера Rai, например "https://rai-xxxx.onrender.com".
               Не задан: если страницу отдаёт сам сервер Rai — используется он,
               иначе Rai запускается прямо в браузере (Python через Pyodide).
     pyBase  — откуда брать .py файлы в браузерном режиме (по умолчанию — рядом со страницей).
     pyodide — свой адрес Pyodide (stdlib — свой адрес python_stdlib.zip, если нужно). */
  window.RAI_CONFIG = Object.assign({
    api: null,
    pyBase: "./",
    pyodide: null
  }, window.RAI_CONFIG || {});
  /* Откуда пробовать загрузить Pyodide, по очереди: свой адрес (если задан),
     папка pyodide/ рядом со страницей (есть в репозитории), затем CDN. */
  window.RAI_PYODIDE_SOURCES = [
    "pyodide/",
    "https://cdn.jsdelivr.net/npm/pyodide@314.0.7/",
    "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/",
    "https://unpkg.com/pyodide@314.0.7/"
  ];
</script>
<style>
  /* Layout: слева список чатов, справа чат — шапка с версией, лента, строка ввода.
     Стиль: чёрный с красным, одна тёмная тема. */
  :root {
    --bg: #0b0b0c;
    --side: #0f0f11;
    --panel: #151517;
    --panel-2: #1d1d20;
    --line: #2a2a2e;
    --fg: #f3f1f1;
    --muted: #9b9599;
    --red: #e10600;
    --red-hi: #ff2a2a;
    --red-soft: #2b0b0b;
    --ink: #ffffff;
    --ok: #3ccf7a;
    --warn: #f0b23c;
    --ok-bg: #15803d;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 var(--font-body);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  button { font: inherit; color: inherit; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-columns: 280px minmax(0, 1fr); }

  /* ---------- список чатов ---------- */
  #sidebar {
    background: var(--side); border-right: 1px solid var(--line);
    display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; padding: 18px 18px 14px; }
  .logo { font: 800 26px/1 var(--font-display); letter-spacing: -0.02em; }
  .logo span { color: var(--red); }
  .byline { font: 500 11px/1.2 var(--font-mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  #newChat {
    margin: 0 14px 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 14px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--red); color: var(--ink); font-weight: 600;
  }
  #newChat:hover { background: var(--red-hi); }
  #chatList { overflow-y: auto; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
  .chat-item { position: relative; border-radius: 9px; }
  .chat-item > button.open {
    width: 100%; text-align: left; cursor: pointer; border: 0; background: transparent;
    padding: 9px 64px 9px 12px; border-radius: 9px; display: block;
  }
  .chat-item > button.open:hover { background: var(--panel); }
  .chat-item.active > button.open { background: var(--red-soft); }
  .chat-item .t { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .m { display: block; font: 400 11px/1.4 var(--font-mono); color: var(--muted); }
  .chat-item .acts { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); display: flex; gap: 2px; opacity: 0; }
  .chat-item:hover .acts, .chat-item.active .acts, .chat-item .acts:focus-within { opacity: 1; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 6px; border-radius: 8px;
  }
  .icon-btn:hover { color: var(--fg); background: var(--panel-2); }
  .chat-item input {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--red);
    background: var(--panel); color: var(--fg); font: inherit;
  }
  .confirm { padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); border-radius: 9px; }
  .confirm div { display: flex; gap: 6px; }
  .btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .btn.red { background: var(--red); border-color: var(--red); color: var(--ink); }
  .side-foot { padding: 12px 14px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .back-link { display: block; text-align: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--red);
    color: var(--fg); text-decoration: none; font-weight: 600; }
  .back-link:hover { background: var(--red-soft); }

  .photo { margin: 4px 0 0; display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
  .photo img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); background: #000; }
  .photo figcaption { font-size: 12.5px; color: var(--muted); }
  .photo a { color: var(--red-hi); }

  /* ---------- основная часть ---------- */
  main { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); min-width: 0; min-height: 0; }
  main > * { min-width: 0; }
  #chatView { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
  #chatView > * { min-width: 0; }
  #chatView[hidden] { display: none; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 24px; border-bottom: 1px solid var(--line); min-width: 0; }
  .topbar .spacer { flex: 1; }
  .modes { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); flex: none; }
  .modes button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--muted);
    padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .modes button:hover { color: var(--fg); }
  .modes button[aria-selected="true"] { background: var(--red); color: var(--ink); }
  header {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 24px 12px; border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #menuBtn { display: none; }
  #chatTitle {
    flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; cursor: pointer;
    font: 600 17px/1.3 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px 0;
  }
  .status {
    display: inline-flex; align-items: center; gap: 8px; flex: none;
    font: 500 12px/1 var(--font-mono); color: var(--muted);
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; max-width: 50%;
  }
  #statusText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .status[data-state="ready"] .dot { background: var(--ok); }
  .status[data-state="error"] .dot { background: var(--red-hi); }
  .versions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .versions button {
    cursor: pointer; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; font-size: 13px; font-weight: 500;
  }
  .versions button:hover { border-color: var(--red); }
  .versions button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--ink); }
  .versions button.top { border-color: #7a1a1a; background: linear-gradient(135deg, rgba(225, 6, 0, .16), rgba(240, 178, 60, .10)); }
  .versions button.top::after { content: " ✦"; color: var(--warn); }
  .versions button.top[aria-pressed="true"] { background: linear-gradient(135deg, var(--red), #9a0400); border-color: var(--red); }
  #features { font-size: 12.5px; color: var(--muted); margin: 0; }

  #log { overflow-y: auto; min-height: 0; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .inner { width: 100%; max-width: 860px; margin: 0 auto; }

  .welcome { display: flex; flex-direction: column; gap: 16px; padding-block: 6vh 12px; }
  .welcome h1 { margin: 0; font: 800 clamp(30px, 5vw, 44px)/1.05 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
  .welcome h1 span { color: var(--red); }
  .welcome p { margin: 0; color: var(--muted); max-width: 60ch; }
  .examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .examples button {
    text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 2px;
  }
  .examples button:hover { border-color: var(--red); }
  .examples b { font-weight: 600; }
  .examples small { color: var(--muted); font-size: 12px; }

  .msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: var(--red-soft); border: 1px solid #4a1111; padding: 10px 14px; border-radius: 14px 14px 4px 14px;
    max-width: min(640px, 92%); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.rai .bubble { max-width: 100%; min-width: 0; overflow-wrap: anywhere; }
  .msg.pending .bubble { color: var(--muted); }
  .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--red); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
  .who { font: 600 12px/1 var(--font-mono); color: var(--red-hi); letter-spacing: .04em; }
  .actions { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .actions .icon-btn { font-size: 12.5px; padding: 5px 8px; }
  .meta { font: 400 11px/1 var(--font-mono); color: var(--muted); margin-left: 6px; }

  /* markdown */
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h2, .md h3, .md h4 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; margin: 16px 0 10px; line-height: 1.25; }
  .md h2 { font-size: 20px; } .md h3 { font-size: 17px; } .md h4 { font-size: 15px; }
  .md strong { color: #fff; font-weight: 700; }
  .md mark { background: rgba(225, 6, 0, .28); color: #fff; padding: 0 3px; border-radius: 3px; }
  .md code { font: 13px/1.4 var(--font-mono); background: var(--panel-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; } .md li::marker { color: var(--red-hi); }
  .md blockquote { margin: 0 0 10px; padding: 8px 14px; border-left: 3px solid var(--red); background: var(--panel); border-radius: 0 8px 8px 0; color: #ddd; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .md a { color: var(--red-hi); }
  .table-wrap { overflow-x: auto; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  .md th { text-align: left; background: var(--panel-2); color: var(--red-hi); font-weight: 600; border-bottom: 2px solid var(--red); }
  .md th, .md td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .md tr:last-child td { border-bottom: 0; }
  .md tbody tr:nth-child(even) td { background: rgba(255, 255, 255, .02); }
  .codeblock { margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0e0e10; }
  .codehead { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px; background: var(--panel-2); font: 500 12px/1 var(--font-mono); color: var(--muted); }
  .codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
  .codeblock code { background: none; border: 0; padding: 0; font-size: 13px; color: #f0e9e9; }

  /* картинки */
  .art { margin: 4px 0 0; display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
  .art img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); display: block; background: #000; cursor: zoom-in; }

  /* код и архив */
  .code-att { margin-top: 4px; max-width: 760px; }
  .code-att .codeblock pre { max-height: 440px; overflow: auto; }
  .code-att .codehead { gap: 8px; flex-wrap: wrap; }
  .code-att .codehead .acts { display: flex; gap: 2px; flex-wrap: wrap; }
  .code-att .open-code { color: var(--fg); background: var(--red); }
  .code-att .open-code:hover { background: var(--red-hi); color: var(--ink); }
  .archive { margin-top: 4px; max-width: 520px; display: flex; gap: 14px; align-items: center; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .archive .zip-ic { width: 44px; height: 44px; border-radius: 10px; background: var(--red); color: var(--ink); display: grid; place-items: center; flex: none; }
  .archive .zip-ic svg { width: 22px; height: 22px; }
  .archive .info { flex: 1; min-width: 0; }
  .archive .info b { display: block; }
  .archive .info span { font-size: 12.5px; color: var(--muted); }
  .codeblock .to-code { color: var(--muted); }

  /* презентации */
  .deck { margin-top: 4px; max-width: 720px; display: flex; flex-direction: column; gap: 8px; }
  .stage { position: relative; aspect-ratio: 16 / 9; container-type: inline-size; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #0b0b0c; cursor: pointer; }
  .stage:fullscreen { border: 0; border-radius: 0; aspect-ratio: auto; width: 100vw; height: 100vh; display: grid; place-items: center; background: #000; }
  .stage:fullscreen .slide { position: relative; inset: auto; width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; }
  .deck-bar .count { font: 500 12px/1 var(--font-mono); color: var(--muted); padding: 0 6px; font-variant-numeric: tabular-nums; }
  .deck-bar .spacer { flex: 1; }
  .deck-bar { flex-wrap: wrap; }

  /* ---------- ввод ---------- */
  .composer { padding: 10px 24px 18px; border-top: 1px solid var(--line); }
  #listening { font: 500 12px/1.4 var(--font-mono); color: var(--red-hi); margin: 0 0 8px; }
  form { display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; min-width: 0; resize: none; max-height: 180px; min-height: 48px;
    padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font: 15px/1.4 var(--font-body);
  }
  #input:focus { border-color: var(--red); outline: none; }
  .round {
    flex: none; width: 48px; height: 48px; border-radius: 12px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg);
  }
  .round:hover { border-color: var(--red); }
  #mic.on { background: var(--red); border-color: var(--red); color: var(--ink); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(225, 6, 0, .6) } 70% { box-shadow: 0 0 0 12px rgba(225, 6, 0, 0) } 100% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0) } }
  #send { background: var(--red); border-color: var(--red); color: var(--ink); }
  #send:hover { background: var(--red-hi); }
  #send:disabled { opacity: .5; cursor: progress; }
  .hint { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }

  #toast {
    position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--red); color: var(--fg);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px);
  }
  .retry { align-self: flex-start; }
  #backdrop { display: none; }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    #sidebar {
      position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(300px, 86vw);
      padding-top: env(safe-area-inset-top, 0px); transform: translateX(-100%); transition: transform .2s;
    }
    body.menu-open #sidebar { transform: none; }
    body.menu-open #backdrop { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .6); }
    #menuBtn { display: inline-flex; }
    header, .composer, .topbar { padding-inline: 16px; }
    .modes button { padding: 7px 11px; }
    #log { padding: 16px; }
    .status { max-width: 38%; }
    .status #statusText { display: none; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sidebar { transition: none; } #mic.on, .typing span { animation: none; }
  }
</style>
<style id="slide-css">
  /* Цвета слайда — из темы презентации (--s-*), по умолчанию чёрно-красные */
  .slide { position: absolute; inset: 0; background: var(--s-bg, #0b0b0c); color: var(--s-fg, #f3f1f1); padding: 6cqw 7cqw 7cqw;
    display: flex; flex-direction: column; gap: 2.4cqw; overflow: hidden;
    font-family: "Onest", "Segoe UI", system-ui, sans-serif; }
  .slide::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .8cqw; background: linear-gradient(90deg, var(--s-accent, #e10600), var(--s-accent2, #ff6a5c)); z-index: 2; }
  .slide .kicker { font: 500 1.5cqw/1 "JetBrains Mono", Consolas, monospace; color: var(--s-accent, #ff2a2a); letter-spacing: .15em; text-transform: uppercase; position: relative; }
  .slide h2 { margin: 0; font: 800 4cqw/1.12 "Unbounded", "Arial Black", sans-serif; letter-spacing: -.01em; position: relative; text-wrap: balance; }
  .slide ul { margin: 0; padding-left: 3cqw; font-size: 2.5cqw; line-height: 1.4; display: flex; flex-direction: column; gap: 1.3cqw; }
  .slide li::marker { color: var(--s-accent, #e10600); }
  .slide code { font-family: "JetBrains Mono", Consolas, monospace; background: var(--s-surface, #1d1d20); padding: 0 .5cqw; border-radius: .5cqw; }
  .slide strong { font-weight: 800; }
  .slide mark { background: var(--s-soft, rgba(225, 6, 0, .35)); color: inherit; }
  .slide pre { margin: 0; padding: 2.2cqw; background: var(--s-surface, #151517); border: 1px solid var(--s-line, #2a2a2e); border-radius: 1cqw;
    font: 1.9cqw/1.5 "JetBrains Mono", Consolas, monospace; white-space: pre; overflow: hidden; color: var(--s-fg, #f0e9e9); }
  .slide pre code { background: none; padding: 0; }
  .slide table { border-collapse: collapse; font-size: 1.9cqw; }
  .slide th { text-align: left; color: var(--s-accent, #ff2a2a); border-bottom: .3cqw solid var(--s-accent, #e10600); }
  .slide th, .slide td { padding: .9cqw 1.6cqw; border-bottom: 1px solid var(--s-line, #2a2a2e); }
  .slide .sub { font-size: 2.4cqw; color: var(--s-muted, #9b9599); position: relative; max-width: 60cqw; }
  .slide .num { position: absolute; right: 3cqw; bottom: 2.4cqw; font: 500 1.3cqw/1 "JetBrains Mono", monospace; color: var(--s-muted, #9b9599); z-index: 2; }
  .slide > .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .6; }
  /* обложка и финал */
  .slide.cover, .slide.end { justify-content: center; }
  .slide.cover h1, .slide.end h1 { margin: 0; font: 800 6.6cqw/1.04 "Unbounded", "Arial Black", sans-serif; letter-spacing: -.02em; position: relative; max-width: 70cqw; text-wrap: balance; }
  .slide.cover h1::after { content: ""; display: block; width: 12cqw; height: .9cqw; background: var(--s-accent, #e10600); margin-top: 2.6cqw; }
