services:
  - type: web
    name: rai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: RAI_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 40211315152-jq7a91jcqrpu8hkmlqmg1poh6bthgs5j.apps.googleusercontent.com
      # Секрет вводится вручную в панели Render (Environment), в GitHub его нет.
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RAI_ADMIN_TOKEN
        sync: false
