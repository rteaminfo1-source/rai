      files.has(src.replace(/^\.\//, "")) ? `<script${a}${b}>\n${files.get(src.replace(/^\.\//, "")).replace(/<\/script/gi, "<\\/script")}\n<\/script>` : tag);
    return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (h) => h + CONSOLE_SHIM) : CONSOLE_SHIM + html;
  }
  function runHTML(file) {
    stop(true);
    clearOut();
    el.cPrevEmpty.hidden = true;
    if (previewFrame) previewFrame.remove();
    previewFrame = document.createElement("iframe");
    previewFrame.className = "preview-frame";
    previewFrame.title = "Просмотр страницы";
    previewFrame.setAttribute("sandbox", "allow-scripts allow-modals allow-forms allow-popups");
    previewFrame.srcdoc = buildPage(file);
    el.previewPane.append(previewFrame);
    out(`▶ ${file.name} открыт во вкладке «Просмотр». Сообщения console.log появятся здесь.\n`, "sys");
    showPane("preview");
  }
  window.addEventListener("message", (e) => {
    if (!previewFrame || e.source !== previewFrame.contentWindow || !e.data || !e.data.raiConsole) return;
    out(String(e.data.text), {out: "", err: "err", hint: "hint"}[e.data.kind] || "");
  });

  function run() {
    if (running) return;
    const f = active(), l = lang();
    save(true);
    if (l === "python") { clearOut(); showPane("out"); setMarks([]); runPython(); return; }
    if (l === "javascript") { clearOut(); showPane("out"); setMarks([]); runJS(); return; }
    if (l === "html") { runHTML(f); return; }
    if (l === "css" || l === "json" || l === "text") {
      const page = project.files.find((g) => langOf(g.name) === "html");
      if (page && l === "css") { runHTML(page); return; }
    }
    clearOut();
    showPane("out");
    out(`Запуск прямо в браузере есть для Python, JavaScript и HTML/CSS.\n` +
        `${NAMES[l] || l} здесь можно писать, проверять и объяснять (вкладка «ИИ-помощник»), а запускать — у себя на компьютере: ` +
        `скачайте файл кнопкой «Файл».\n`, "hint");
  }
  function stop(silent) {
    if (!running) { setRunning(false); return; }
    const r = running;
    running = null;
    setRunning(false);
    if (r.kind === "python") {
      r.worker.terminate();
      pyWorker = null;
      if (!silent) out("\n■ Остановлено.\n", "sys");
    } else if (r.kind === "js") {
      r.worker.terminate();
      jsWorker = null;
      if (!silent) out("\n■ Остановлено.\n", "sys");
    }
  }

  // ================================================================ ИИ-помощник
  const ACT_LABEL = {check: "Проверь код", fix: "Исправь ошибки", explain: "Объясни код", comment: "Добавь комментарии"};
  function aiMsg(cls, html) {
    const m = document.createElement("div");
    m.className = "ai-msg " + cls;
    if (html !== undefined) m.innerHTML = html;
    el.cAiLog.append(m);
    el.cAiLog.scrollTop = el.cAiLog.scrollHeight;
    return m;
  }
  function actionOf(text) {
    const low = text.toLowerCase();
    if (/исправ|почин|пофикс|\bfix\b/.test(low)) return "fix";
    if (/коммент/.test(low)) return "comment";
    if (/объясн|что делает|как работает|разбери|поясни/.test(low)) return "explain";
    if (/провер|найди ошиб|есть ли ошиб|почему не работает|\bбаг/.test(low)) return "check";
    return "generate";
  }
  async function ai(action, prompt) {
    const f = active();
    if (action !== "generate" && !f.text.trim()) { H.toast("Файл пустой — сначала напишите код"); return; }
    showPane("ai");
    const me = aiMsg("me");
    me.textContent = prompt || ACT_LABEL[action] + " · " + f.name;
    const pend = aiMsg("rai", `<span class="typing" aria-label="Rai думает"><span></span><span></span><span></span></span>`);
    const target = f.name, source = f.text;
    let r;
    try {
      r = await H.api(action, action === "generate" ? "" : source, action === "generate" ? (lang() === "text" ? null : lang()) : lang(), prompt || "");
    } catch (e) {
      pend.innerHTML = H.md("Не удалось получить ответ: " + (e && e.message || e));
      return;
    }
    pend.innerHTML = `<div class="md">${H.md(r.answer || r.error || "Нет ответа.")}</div>`;
    if (r.issues && project.active === target) setMarks(r.issues);
    const lines = [...new Set((r.issues || []).map((i) => i.line).filter(Boolean))].slice(0, 12);
    if (lines.length) {
      const row = document.createElement("div");
      row.className = "row";
      row.append("Перейти к строке: ");
      for (const n of lines) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "jump"; b.textContent = n;
        b.addEventListener("click", () => { if (project.active !== target) openTab(target); jumpTo(n); });
        row.append(b);
      }
      pend.append(row);
    }
    if (r.code) {
      const box = document.createElement("div");
      box.innerHTML = `<div class="codeblock ai-code"><div class="codehead"><span>${esc(r.filename || NAMES[r.lang] || r.lang || "код")}</span></div>` +
        `<pre><code>${highlight(r.code, r.lang)}</code></pre></div>`;
      const row = document.createElement("div");
      row.className = "row";
      const btn = (label, fn, red) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "tb" + (red ? " run" : ""); b.textContent = label;
        b.addEventListener("click", fn);
        row.append(b);
        return b;
      };
      if (action === "generate") {
        btn("Создать файл " + (r.filename || "main." + (r.lang || "txt")), (e) => {
          const name = addFile(r.filename || "main.py", r.code);
          e.currentTarget.textContent = "Создан: " + name;
          e.currentTarget.disabled = true;
          if (["python", "javascript", "html"].includes(langOf(name))) H.toast("Готово — нажмите «Запустить»");
        }, true);
      } else if (r.changed !== false) {
        btn("Применить к " + target, (e) => {
          const file = project.files.find((x) => x.name === target);
          if (!file) return;
          if (project.active !== target) openTab(target);
          el.ta.focus();
          el.ta.setSelectionRange(0, el.ta.value.length);
          insert(r.code);  // одним действием: Ctrl+Z вернёт как было
          el.ta.setSelectionRange(0, 0);
          el.ta.scrollTop = 0;
          e.currentTarget.textContent = "Применено";
          e.currentTarget.disabled = true;
          scheduleCheck();
        }, true);
      }
      btn("Копировать", () => H.copy(r.code));
      pend.append(box, row);
    }
    el.cAiLog.scrollTop = el.cAiLog.scrollHeight;
  }

  // ================================================================ файлы с компьютера
  async function openLocal(list) {
    let n = 0;
    for (const file of list) {
      if (file.size > 1024 * 1024) { H.toast(file.name + ": файл больше 1 МБ"); continue; }
      const text = await file.text();
      if (/\u0000/.test(text.slice(0, 2000))) { H.toast(file.name + ": это не текстовый файл"); continue; }
      addFile(file.name, text.replace(/\r\n/g, "\n"));
      n++;
    }
    if (n) H.toast("Открыто файлов: " + n);
  }

  // ================================================================ инициализация
  function init(host) {
    H = host;
    const root = document.getElementById("codeView");
    build(root);
    load();
    el.cStdin.value = project.stdin || "";
    renderFiles();
    loadEditor();

    el.ta.addEventListener("input", onInput);
    el.ta.addEventListener("keydown", onKey);
    el.ta.addEventListener("scroll", syncScroll);
    el.cStdin.addEventListener("input", () => { project.stdin = el.cStdin.value; save(); });
    el.cRun.addEventListener("click", run);
    el.cStop.addEventListener("click", () => stop(false));
    el.cDiag.addEventListener("click", () => ai("check"));
    el.cDl.addEventListener("click", () => {
      const f = active();
      H.download(f.name, new Blob([f.text], {type: "text/plain;charset=utf-8"}));
    });
    el.cZip.addEventListener("click", () => {
      H.download("rai-code.zip", H.zip(project.files.map((f) => ({name: f.name, data: f.text}))));
    });
    el.cOpen.addEventListener("click", () => el.cFile.click());
    el.cFile.addEventListener("change", () => { openLocal(Array.from(el.cFile.files || [])); el.cFile.value = ""; });
    for (const b of root.querySelectorAll(".side-tabs button")) b.addEventListener("click", () => showPane(b.dataset.pane));
    for (const b of root.querySelectorAll(".ai-quick button")) b.addEventListener("click", () => ai(b.dataset.act));
    const aiInput = el.cAiInput;
    const send = () => {
      const text = aiInput.value.trim();
      if (!text) return;
      aiInput.value = "";
      ai(actionOf(text), text);
    };
    el.cAiForm.addEventListener("submit", (e) => { e.preventDefault(); send(); });
    aiInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
    aiMsg("rai", H.md("Я — ИИ-помощник Rai для кода. **Проверю** и найду ошибки, **исправлю**, **объясню** по строкам, " +
      "**добавлю комментарии** или **напишу программу** по описанию. Горячие клавиши: `Ctrl+Enter` — запуск, " +
      "`Ctrl+/` — закомментировать, `Tab` / `Shift+Tab` — отступ."));
  }

  window.RaiCode = {
    init: init,
    addFile: addFile,
    engineReady: () => { if (el.ta) scheduleCheck(); },
    focus: () => { if (el.ta) { refresh(); el.ta.focus(); } },
    highlight: highlight,
    langOf: langOf
  };
})();
</script>
<script type="application/json" id="rai-files">{"versions.py": "\"\"\"Четыре версии Rai: Pro, Pro Fast, Pro Plus, Pro Sun.\n\nВсе версии работают на собственном движке, без внешних API.\nОтличаются набором возможностей.\n\"\"\"\n\nimport os\nfrom dataclasses import dataclass, field\nfrom typing import Optional\n\n\n@dataclass(frozen=True)\nclass Version:\n    id: str\n    name: str\n    description: str\n    search: str                 # \"keywords\" (быстро) или \"tfidf\" (по смыслу)\n    fuzzy: bool                 # понимать опечатки (буквенные триграммы)\n    skills: frozenset           # встроенные навыки\n    context: bool = False       # помнит имя и тему разговора, «подробнее»\n    memory: bool = False        # «запомни, что …» — память фактов\n    multi: bool = False         # несколько вопросов в одном сообщении\n    detailed: bool = False      # сразу даёт подробный ответ\n    suggestions: bool = False   # предлагает похожие вопросы, если не понял\n    threshold: float = 0.35     # минимальное сходство для ответа\n    code: bool = False          # режим для кода: лучше понимает код, объясняет, проверяет, пишет\n    enrich: bool = False        # дополняет короткие ответы фактами из интернета\n    slide_limit: int = 8        # сколько слайдов может быть в презентации\n    features: list = field(default_factory=list)\n\n    def public(self) -> dict:\n        return {\n            \"id\": self.id,\n            \"name\": self.name,\n            \"description\": self.description,\n            \"features\": self.features,\n        }\n\n\nONLINE = {\"weather\", \"currency\", \"translate\"}\nALL_SKILLS = frozenset({\"calc\", \"time\", \"convert\", \"random\", \"password\", \"text\", \"table\", \"capital\", \"image\", \"slides\",\n                        \"web\", \"code\"} | ONLINE)\n\nVERSIONS = {\n    \"pro\": Version(\n        id=\"pro\",\n        name=\"Rai Pro\",\n        description=\"Основная версия: понимает смысл вопроса, основные навыки.\",\n        search=\"tfidf\",\n        fuzzy=False,\n        skills=frozenset({\"calc\", \"time\", \"convert\", \"random\", \"table\", \"capital\", \"image\", \"web\"} | ONLINE),\n        slide_limit=8,\n        threshold=0.35,\n        features=[\"поиск по смыслу\", \"погода\", \"валюты\", \"перевод\", \"поиск в интернете\", \"таблицы\", \"картинки\"],\n    ),\n    \"pro-fast\": Version(\n        id=\"pro-fast\",\n        name=\"Rai Pro Fast\",\n        description=\"Самая быстрая версия: поиск по ключевым словам.\",\n        search=\"keywords\",\n        fuzzy=False,\n        skills=frozenset({\"calc\", \"time\", \"capital\"} | ONLINE),\n        threshold=0.3,\n        features=[\"поиск по ключевым словам\", \"калькулятор\", \"погода\", \"валюты\", \"перевод\"],\n    ),\n    \"pro-plus\": Version(\n        id=\"pro-plus\",\n        name=\"Rai Pro Plus\",\n        description=\"Понимает опечатки, все навыки, картинки и презентации, помнит имя.\",\n        search=\"tfidf\",\n        fuzzy=True,\n        skills=ALL_SKILLS,\n        context=True,\n        suggestions=True,\n        threshold=0.3,\n        features=[\"понимает опечатки\", \"все навыки\", \"картинки\", \"презентации\", \"помнит имя\",\n                  \"«подробнее» по теме\", \"подсказки\"],\n    ),\n    \"pro-sun\": Version(\n        id=\"pro-sun\",\n        name=\"Rai Pro Sun\",\n        description=\"Максимальная версия: память фактов, несколько вопросов сразу, подробные ответы.\",\n        search=\"tfidf\",\n        fuzzy=True,\n        skills=ALL_SKILLS,\n        context=True,\n        memory=True,\n        multi=True,\n        detailed=True,\n        suggestions=True,\n        threshold=0.27,\n        slide_limit=12,\n        features=[\"всё из Pro Plus\", \"память фактов («запомни, что …»)\",\n                  \"несколько вопросов сразу\", \"подробные ответы\", \"большие презентации\"],\n    ),\n    \"pro-quasar\": Version(\n        id=\"pro-quasar\",\n        name=\"Rai Pro Quasar\",\n        description=\"Самая сильная версия: всё из Pro Sun, режим Code, ответы с фактами из интернета, \"\n                    \"презентации до 16 слайдов.\",\n        search=\"tfidf\",\n        fuzzy=True,\n        skills=ALL_SKILLS,\n        context=True,\n        memory=True,\n        multi=True,\n        detailed=True,\n        suggestions=True,\n        threshold=0.25,\n        code=True,\n        enrich=True,\n        slide_limit=16,\n        features=[\"всё из Pro Sun\", \"вкладка Code: запуск, проверка, объяснение и исправление кода\",\n                  \"ответы дополняются фактами из интернета\", \"презентации до 16 слайдов с фото\",\n                  \"архивы ZIP\"],\n    ),\n}\n\nDEFAULT_VERSION = os.environ.get(\"RAI_DEFAULT_VERSION\", \"pro\").strip() or \"pro\"\n\n# Разные написания, которые может прислать сайт: \"Pro Fast\", \"pro_fast\", \"profast\"…\n_ALIASES = {key.replace(\"-\", \"\"): key for key in VERSIONS}\n\n\ndef resolve(version: Optional[str]) -> Optional[Version]:\n    \"\"\"Вернуть версию по id/названию или None, если такой нет.\"\"\"\n    if not version:\n        return VERSIONS.get(DEFAULT_VERSION, VERSIONS[\"pro\"])\n    key = str(version).strip().lower()\n    if key.startswith(\"rai\"):\n        key = key[3:]\n    key = key.replace(\" \", \"\").replace(\"_\", \"\").replace(\"-\", \"\")\n    return VERSIONS.get(_ALIASES.get(key, \"\")) or VERSIONS.get(_ALIASES.get(\"pro\" + key, \"\"))\n", "nlp.py": "\"\"\"Собственная обработка текста Rai: нормализация, стемминг, TF-IDF поиск.\n\nНикаких внешних библиотек и сервисов — только стандартный Python.\n\"\"\"\n\nimport math\nimport re\nfrom collections import Counter\n\n_WORD_RE = re.compile(r\"[a-zа-я0-9]+\")\n\n# Слова-«шум»: почти не несут смысла для поиска ответа.\n# Вопросительные слова (что, как, кто…) специально оставлены — они различают вопросы.\nSTOPWORDS = {\n    \"и\", \"в\", \"во\", \"на\", \"а\", \"ну\", \"же\", \"ли\", \"бы\", \"то\", \"пожалуйста\", \"плиз\",\n    \"please\", \"the\", \"a\", \"an\", \"is\", \"are\", \"to\", \"of\", \"rai\", \"рай\", \"бот\",\n    \"слушай\", \"скажи\", \"подскажи\", \"расскажи\", \"мне\", \"эй\", \"вот\", \"это\", \"у\", \"с\", \"со\",\n}\n\n# Окончания русского языка, от длинных к коротким.\n_ENDINGS = sorted(\n    \"\"\"\n    иями ями ами иях ях ах ией ией ов ев ей ий ый ой ая яя ое ее ие ые ого его ому ему\n    ыми ими ую юю ешь ете ишь ите ает яет ет ит ут ют ат ят ать ять ить еть уть ть\n    ла ло ли ил ыл ал ял ом ем ам ям ость ости ение ения ением ении иться аться ешься\n    а я о е и ы у ю ь й\n    \"\"\".split(),\n    key=len,\n    reverse=True,\n)\n_EN_ENDINGS = (\"ing\", \"ed\", \"es\", \"s\")\n\n\ndef normalize(text: str) -> str:\n    text = (text or \"\").lower().replace(\"ё\", \"е\")\n    return \" \".join(_WORD_RE.findall(text))\n\n\ndef stem(word: str) -> str:\n    \"\"\"Простой собственный стеммер: отрезает типичные окончания.\"\"\"\n    if word.isdigit() or len(word) <= 3:\n        return word\n    if re.fullmatch(r\"[a-z]+\", word):\n        for end in _EN_ENDINGS:\n            if word.endswith(end) and len(word) - len(end) >= 3:\n                return word[: -len(end)]\n        return word\n    for refl in (\"ся\", \"сь\"):\n        if word.endswith(refl) and len(word) - 2 >= 3:\n            word = word[:-2]\n            break\n    for end in _ENDINGS:\n        if word.endswith(end) and len(word) - len(end) >= 3:\n            return word[: -len(end)]\n    return word\n\n\ndef tokens(text: str, keep_stopwords: bool = False) -> list:\n    words = normalize(text).split()\n    return [stem(w) for w in words if keep_stopwords or w not in STOPWORDS]\n\n\ndef trigrams(text: str) -> list:\n    \"\"\"Буквенные триграммы — дают устойчивость к опечаткам.\"\"\"\n    grams = []\n    for w in normalize(text).split():\n        if w in STOPWORDS:\n            continue\n        w = f\"#{w}#\"\n        grams.extend(\"~\" + w[i : i + 3] for i in range(len(w) - 2))\n    return grams\n\n\ndef features(text: str, fuzzy: bool) -> Counter:\n    feats = Counter(tokens(text))\n    if fuzzy:\n        feats.update(trigrams(text))\n    return feats\n\n\nclass TfidfIndex:\n    \"\"\"Мини-поисковик: находит документ, наиболее похожий на запрос.\"\"\"\n\n    def __init__(self, docs, fuzzy: bool = False):\n        # docs: список (ключ, текст)\n        self.fuzzy = fuzzy\n        self.keys = []\n        raw = []\n        df = Counter()\n        for key, text in docs:\n            f = features(text, fuzzy)\n            if not f:\n                continue\n            self.keys.append(key)\n            raw.append(f)\n            df.update(f.keys())\n        n = max(len(raw), 1)\n        self.idf = {t: math.log((1 + n) / (1 + c)) + 1.0 for t, c in df.items()}\n        self.vectors = [self._weigh(f) for f in raw]\n\n    def _weigh(self, feats: Counter) -> dict:\n        vec = {}\n        for t, c in feats.items():\n            w = self.idf.get(t)\n            if w is None:\n                continue\n            # Слова весят больше, чем отдельные триграммы.\n            vec[t] = (1 + math.log(c)) * w * (0.35 if t.startswith(\"~\") else 1.0)\n        norm = math.sqrt(sum(v * v for v in vec.values())) or 1.0\n        return {t: v / norm for t, v in vec.items()}\n\n    def search(self, text: str, limit: int = None) -> list:\n        \"\"\"Вернуть [(ключ, сходство 0..1)], лучшее сходство на ключ.\"\"\"\n        q = self._weigh(features(text, self.fuzzy))\n        if not q:\n            return []\n        best = {}\n        for key, vec in zip(self.keys, self.vectors):\n            score = sum(w * vec.get(t, 0.0) for t, w in q.items())\n            if score > best.get(key, 0.0):\n                best[key] = score\n        return sorted(best.items(), key=lambda kv: kv[1], reverse=True)[:limit]\n\n\nclass KeywordIndex:\n    \"\"\"Самый быстрый поиск (Pro Fast): доля общих основ слов.\"\"\"\n\n    def __init__(self, docs):\n        self.docs = [(key, set(tokens(text))) for key, text in docs]\n        self.docs = [(k, s) for k, s in self.docs if s]\n\n    def search(self, text: str, limit: int = None) -> list:\n        q = set(tokens(text))\n        if not q:\n            return []\n        best = {}\n        for key, words in self.docs:\n            common = len(q & words)\n            if not common:\n                continue\n            score = common / len(q | words)\n            if score > best.get(key, 0.0):\n                best[key] = score\n        return sorted(best.items(), key=lambda kv: kv[1], reverse=True)[:limit]\n\n\n# Общие слова: на одних только них совпадение не считается уверенным.\nGENERIC = {\n    stem(w)\n    for w in \"\"\"\n    что такое такой такая как какой какая какие кто где зачем почему когда сколько\n    ты тебя тебе я меня мне мой моя мое твой есть можно нужно надо хочу сделать делать\n    этот был была будет мы вы вас нас он она они про для из от до по за над под при\n    не нет да или еще уже очень так где-то\n    \"\"\".split()\n}\n\n_EN = \"qwertyuiop[]asdfghjkl;'zxcvbnm,.`\"\n_RU = \"йцукенгшщзхъфывапролджэячсмитьбюё\"\n_LAYOUT = str.maketrans(_EN, _RU)\n\n\ndef levenshtein(a: str, b: str, limit: int = 3) -> int:\n    if abs(len(a) - len(b)) > limit:\n        return limit + 1\n    prev = list(range(len(b) + 1))\n    for i, ca in enumerate(a, 1):\n        cur = [i]\n        for j, cb in enumerate(b, 1):\n            cur.append(min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (ca != cb)))\n        if min(cur) > limit:\n            return limit + 1\n        prev = cur\n    return prev[-1]\n\n\nclass SpellChecker:\n    \"\"\"Собственный корректор: исправляет опечатки и неверную раскладку (ghbdtn → привет).\"\"\"\n\n    def __init__(self, texts):\n        self.vocab = set()\n        for t in texts:\n            self.vocab.update(normalize(t).split())\n        self.stems = {stem(w) for w in self.vocab}\n\n    def _known(self, word: str) -> bool:\n        return word in self.vocab or stem(word) in self.stems\n\n    def _closest(self, word: str):\n        limit = 1 if len(word) <= 5 else 2\n        best, best_d = None, limit + 1\n        for v in self.vocab:\n            if abs(len(v) - len(word)) > limit:\n                continue\n            d = levenshtein(word, v, limit)\n            if d < best_d:\n                best, best_d = v, d\n        return best\n\n    def correct_word(self, word: str) -> str:\n        if word.isdigit() or self._known(word):\n            return word\n        if re.fullmatch(r\"[a-z\\[\\];',.`]+\", word):\n            swapped = word.translate(_LAYOUT)\n            if self._known(swapped):\n                return swapped\n        if len(word) < 4:\n            return word\n        return self._closest(word) or word\n\n    def correct(self, text: str) -> str:\n        # Раскладку проверяем по исходному тексту: normalize() выкидывает [];',.`\n        raw = (text or \"\").lower().replace(\"ё\", \"е\").split()\n        out = []\n        for chunk in raw:\n            if re.fullmatch(r\"[a-z\\[\\];',.`]+\", chunk.strip(\"?!\")):\n                fixed = self.correct_word(chunk.strip(\"?!\"))\n                if fixed != chunk.strip(\"?!\"):\n                    out.append(fixed)\n                    continue\n            out.extend(self.correct_word(w) for w in normalize(chunk).split())\n        return \" \".join(out)\n", "skills.py": "\"\"\"Встроенные навыки Rai. Каждый навык: функция(text) -> ответ или None.\"\"\"\n\nimport ast\nimport operator\nimport os\nimport random\nimport re\nimport secrets\nimport string\nfrom datetime import datetime, timedelta, timezone\n\ntry:\n    from zoneinfo import ZoneInfo\nexcept ImportError:  # Python < 3.9\n    ZoneInfo = None\n\n\ndef _now() -> datetime:\n    tz_name = os.environ.get(\"RAI_TZ\", \"Europe/Moscow\")\n    if ZoneInfo is not None:\n        try:\n            return datetime.now(ZoneInfo(tz_name))\n        except Exception:\n            pass\n    return datetime.now(timezone(timedelta(hours=3)))\n\n\ndef _low(text: str) -> str:\n    return (text or \"\").lower().replace(\"ё\", \"е\").strip()\n\n\n# ---------------------------------------------------------------- калькулятор\n\n_OPS = {\n    ast.Add: operator.add,\n    ast.Sub: operator.sub,\n    ast.Mult: operator.mul,\n    ast.Div: operator.truediv,\n    ast.FloorDiv: operator.floordiv,\n    ast.Mod: operator.mod,\n    ast.Pow: operator.pow,\n    ast.USub: operator.neg,\n    ast.UAdd: operator.pos,\n}\n\n_WORD_OPS = [\n    (r\"умножить на|умножь на|помножить на\", \"*\"),\n    (r\"разделить на|раздели на|поделить на|делить на\", \"/\"),\n    (r\"в степени\", \"**\"),\n    (r\"плюс\", \"+\"),\n    (r\"минус\", \"-\"),\n    (r\"(?<=\\d)\\s*[хx×]\\s*(?=\\d)\", \"*\"),\n    (r\"÷|:\", \"/\"),\n    (r\"\\^\", \"**\"),\n]\n\n\ndef _eval_node(node):\n    if isinstance(node, ast.Expression):\n        return _eval_node(node.body)\n    if isinstance(node, ast.Constant) and isinstance(node.value, (int, float)):\n        return node.value\n    if isinstance(node, ast.UnaryOp) and type(node.op) in _OPS:\n        return _OPS[type(node.op)](_eval_node(node.operand))\n    if isinstance(node, ast.BinOp) and type(node.op) in _OPS:\n        left, right = _eval_node(node.left), _eval_node(node.right)\n        if isinstance(node.op, ast.Pow) and (abs(right) > 100 or abs(left) > 10**6):\n            raise ValueError(\"слишком большая степень\")\n        return _OPS[type(node.op)](left, right)\n    raise ValueError(\"недопустимое выражение\")\n\n\ndef _fmt(num) -> str:\n    if isinstance(num, float):\n        if num.is_integer() and abs(num) < 1e15:\n            return str(int(num))\n        return f\"{num:.10g}\"\n    return str(num)\n\n\ndef calculator(text: str):\n    low = _low(text)\n    sqrt = re.search(r\"(?:квадратный\\s+)?корень\\s+(?:из\\s+)?(-?\\d+(?:[.,]\\d+)?)\", low)\n    if sqrt:\n        value = float(sqrt.group(1).replace(\",\", \".\"))\n        if value < 0:\n            return \"Корень из отрицательного числа в действительных числах не существует.\"\n        return f\"√{_fmt(value)} = {_fmt(value ** 0.5)}\"\n\n    percent = re.search(r\"(\\d+(?:[.,]\\d+)?)\\s*%\\s*(?:от)\\s*(\\d+(?:[.,]\\d+)?)\", low)\n    if percent:\n        p, base = (float(x.replace(\",\", \".\")) for x in percent.groups())\n        return f\"{_fmt(p)}% от {_fmt(base)} = {_fmt(base * p / 100)}\"\n\n    expr = re.sub(r\"^(сколько будет|сколько|посчитай|вычисли|реши|calc|calculate)\\s*\", \"\", low)\n    expr = expr.rstrip(\"?=! \")\n    for pattern, repl in _WORD_OPS:\n        expr = re.sub(pattern, repl, expr)\n    expr = expr.replace(\",\", \".\")\n    if not re.fullmatch(r\"[\\d\\s.+\\-*/%()]+\", expr or \"x\"):\n        return None\n    if not re.search(r\"\\d\", expr) or not re.search(r\"\\d\\s*[+\\-*/%]\", expr):\n        return None\n    try:\n        result = _eval_node(ast.parse(expr, mode=\"eval\"))\n    except ZeroDivisionError:\n        return \"На ноль делить нельзя.\"\n    except (ValueError, SyntaxError, TypeError, OverflowError):\n        return None\n    return f\"{expr.strip()} = {_fmt(result)}\"\n\n\n# ---------------------------------------------------------------- дата и время\n\n_WEEKDAYS = [\"понедельник\", \"вторник\", \"среда\", \"четверг\", \"пятница\", \"суббота\", \"воскресенье\"]\n_MONTHS = [\n    \"января\", \"февраля\", \"марта\", \"апреля\", \"мая\", \"июня\",\n    \"июля\", \"августа\", \"сентября\", \"октября\", \"ноября\", \"декабря\",\n]\n\n\ndef date_time(text: str):\n    low = _low(text)\n    now = _now()\n    if re.search(r\"который час|сколько времени|текущее время|время сейчас|какое время\", low):\n        return f\"Сейчас {now:%H:%M}.\"\n    if re.search(r\"день недели|какой сегодня день\", low):\n        return f\"Сегодня {_WEEKDAYS[now.weekday()]}.\"\n    if re.search(r\"какое сегодня число|какое число|сегодняшняя дата|какая дата|какой сегодня год|какой год\", low):\n        return (\n            f\"Сегодня {now.day} {_MONTHS[now.month - 1]} {now.year} года, \"\n            f\"{_WEEKDAYS[now.weekday()]}.\"\n        )\n    return None\n\n\n# ---------------------------------------------------------------- конвертер\n\n_LENGTH = {\"мм\": 0.001, \"см\": 0.01, \"дм\": 0.1, \"м\": 1.0, \"км\": 1000.0,\n           \"дюйм\": 0.0254, \"фут\": 0.3048, \"ярд\": 0.9144, \"миля\": 1609.344}\n_MASS = {\"мг\": 1e-6, \"г\": 0.001, \"кг\": 1.0, \"ц\": 100.0, \"т\": 1000.0,\n         \"фунт\": 0.45359237, \"унция\": 0.028349523125}\n_SHORT = {\"миля\": \"миль\", \"дюйм\": \"дюйм.\", \"фут\": \"фут.\", \"ярд\": \"ярд.\", \"фунт\": \"фунт.\", \"унция\": \"унц.\"}\n_UNIT_ALIASES = {\n    \"миллиметр\": \"мм\", \"сантиметр\": \"см\", \"дециметр\": \"дм\", \"метр\": \"м\", \"километр\": \"км\",\n    \"дюйм\": \"дюйм\", \"фут\": \"фут\", \"ярд\": \"ярд\", \"мил\": \"миля\",\n    \"миллиграмм\": \"мг\", \"грамм\": \"г\", \"килограмм\": \"кг\", \"центнер\": \"ц\", \"тонн\": \"т\",\n    \"фунт\": \"фунт\", \"унци\": \"унция\",\n    \"цельси\": \"c\", \"фаренгейт\": \"f\", \"кельвин\": \"k\",\n}\n\n\ndef _unit(word: str):\n    word = word.strip(\". \")\n    if word in _LENGTH or word in _MASS or word in (\"c\", \"f\", \"k\", \"°c\", \"°f\"):\n        return word.lstrip(\"°\")\n    for prefix, unit in _UNIT_ALIASES.items():\n        if word.startswith(prefix):\n            return unit\n    return None\n\n\ndef converter(text: str):\n    low = _low(text)\n    m = re.search(\n        r\"(-?\\d+(?:[.,]\\d+)?)\\s*(°?[a-zа-я]+)\\.?\\s+(?:в|to|=)\\s+(°?[a-zа-я]+)\", low\n    )\n    if not m:\n        return None\n    value = float(m.group(1).replace(\",\", \".\"))\n    src, dst = _unit(m.group(2)), _unit(m.group(3))\n    if not src or not dst:\n        return None\n    for table in (_LENGTH, _MASS):\n        if src in table and dst in table:\n            result = value * table[src] / table[dst]\n            return f\"{_fmt(value)} {_SHORT.get(src, src)} = {_fmt(round(result, 6))} {_SHORT.get(dst, dst)}\"\n    temps = {\"c\", \"f\", \"k\"}\n    if src in temps and dst in temps:\n        c = {\"c\": value, \"f\": (value - 32) * 5 / 9, \"k\": value - 273.15}[src]\n        result = {\"c\": c, \"f\": c * 9 / 5 + 32, \"k\": c + 273.15}[dst]\n        names = {\"c\": \"°C\", \"f\": \"°F\", \"k\": \"K\"}\n        return f\"{_fmt(value)} {names[src]} = {_fmt(round(result, 2))} {names[dst]}\"\n    return \"Эти единицы нельзя перевести друг в друга.\"\n\n\n# ---------------------------------------------------------------- случайность\n\ndef randomness(text: str):\n    low = _low(text)\n    if re.search(r\"монет\", low) and re.search(r\"подбрось|брось|кинь|подкинь\", low):\n        return random.choice([\"Выпал орёл.\", \"Выпала решка.\"])\n    if re.search(r\"кубик\", low) and re.search(r\"брось|кинь|подкинь\", low):\n        return f\"На кубике выпало {random.randint(1, 6)}.\"\n    m = re.search(r\"случайн\\w* число(?:\\s+от\\s+(-?\\d+)\\s+до\\s+(-?\\d+))?\", low)\n    if m:\n        a, b = (int(m.group(1)), int(m.group(2))) if m.group(1) else (1, 100)\n        if a > b:\n            a, b = b, a\n        return f\"Случайное число от {a} до {b}: {random.randint(a, b)}.\"\n    m = re.search(r\"выбери\\s*(?:из|между)?\\s*:?\\s*(.+)\", low)\n    if m and re.search(r\",| или \", m.group(1)):\n        options = [o.strip(\" ?.!\") for o in re.split(r\",| или \", m.group(1)) if o.strip(\" ?.!\")]\n        if len(options) >= 2:\n            return f\"Я выбираю: {random.choice(options)}.\"\n    return None\n\n\n# ---------------------------------------------------------------- пароли\n\ndef password(text: str):\n    low = _low(text)\n    if not re.search(r\"пароль|password\", low) or not re.search(r\"сгенер|придумай|создай|generate|нов\", low):\n        return None\n    m = re.search(r\"(\\d+)\", low)\n    length = min(max(int(m.group(1)) if m else 16, 8), 64)\n    alphabet = string.ascii_letters + string.digits + \"!@#$%^&*-_\"\n    while True:\n        pwd = \"\".join(secrets.choice(alphabet) for _ in range(length))\n        if (any(c.islower() for c in pwd) and any(c.isupper() for c in pwd)\n                and any(c.isdigit() for c in pwd)):\n            return f\"Надёжный пароль ({length} символов): {pwd}\"\n\n\n# ---------------------------------------------------------------- текст\n\ndef text_tools(text: str):\n    m = re.match(r\"\\s*(сколько (?:слов|символов|букв) в|посчитай (?:слова|символы) в|переверни|\"\n                 r\"заглавными|большими буквами|маленькими буквами|строчными)\\s*(?:текст)?\\s*:?\\s*(.+)\",\n                 text, re.I | re.S)\n    if not m:\n        return None\n    cmd, body = _low(m.group(1)), m.group(2).strip().strip(\"«»\\\"'\")\n    if not body:\n        return None\n    if cmd.startswith((\"сколько\", \"посчитай\")):\n        words = len(re.findall(r\"\\w+\", body))\n        letters = sum(ch.isalpha() for ch in body)\n        return f\"Слов: {words}, символов: {len(body)}, букв: {letters}.\"\n    if cmd == \"переверни\":\n        return body[::-1]\n    if cmd in (\"заглавными\", \"большими буквами\"):\n        return body.upper()\n    return body.lower()\n\n\n# ---------------------------------------------------------------- таблицы\n\ndef times_table(text: str):\n    low = _low(text)\n    m = re.search(r\"таблиц\\w* умножения(?:\\s+(?:на|для))?\\s*(\\d+)?\", low)\n    if not m:\n        return None\n    n = int(m.group(1)) if m.group(1) else None\n    if n is not None:\n        if not 1 <= n <= 1000:\n            return None\n        rows = \"\\n\".join(f\"| {n} × {k} | **{n * k}** |\" for k in range(1, 11))\n        return f\"### Таблица умножения на {n}\\n\\n| Пример | Ответ |\\n|---|---|\\n{rows}\"\n    head = \"| × | \" + \" | \".join(str(k) for k in range(1, 10)) + \" |\"\n    sep = \"|---\" * 10 + \"|\"\n    body = \"\\n\".join(\n        f\"| **{a}** | \" + \" | \".join(str(a * b) for b in range(1, 10)) + \" |\" for a in range(1, 10)\n    )\n    return f\"### Таблица умножения\\n\\n{head}\\n{sep}\\n{body}\"\n\n\n# ---------------------------------------------------------------- столицы\n\nCAPITALS = {\n    \"россия\": \"Москва\", \"украина\": \"Киев\", \"беларусь\": \"Минск\", \"белоруссия\": \"Минск\", \"казахстан\": \"Астана\",\n    \"узбекистан\": \"Ташкент\", \"киргизия\": \"Бишкек\", \"кыргызстан\": \"Бишкек\", \"таджикистан\": \"Душанбе\",\n    \"туркменистан\": \"Ашхабад\", \"азербайджан\": \"Баку\", \"армения\": \"Ереван\", \"грузия\": \"Тбилиси\",\n    \"молдова\": \"Кишинёв\", \"молдавия\": \"Кишинёв\", \"латвия\": \"Рига\", \"литва\": \"Вильнюс\", \"эстония\": \"Таллин\",\n    \"польша\": \"Варшава\", \"германия\": \"Берлин\", \"франция\": \"Париж\", \"италия\": \"Рим\", \"испания\": \"Мадрид\",\n    \"португалия\": \"Лиссабон\", \"великобритания\": \"Лондон\", \"англия\": \"Лондон\", \"ирландия\": \"Дублин\",\n    \"нидерланды\": \"Амстердам\", \"голландия\": \"Амстердам\", \"бельгия\": \"Брюссель\", \"швейцария\": \"Берн\",\n    \"австрия\": \"Вена\", \"чехия\": \"Прага\", \"словакия\": \"Братислава\", \"венгрия\": \"Будапешт\", \"румыния\": \"Бухарест\",\n    \"болгария\": \"София\", \"сербия\": \"Белград\", \"хорватия\": \"Загреб\", \"греция\": \"Афины\", \"турция\": \"Анкара\",\n    \"швеция\": \"Стокгольм\", \"норвегия\": \"Осло\", \"финляндия\": \"Хельсинки\", \"дания\": \"Копенгаген\",\n    \"исландия\": \"Рейкьявик\", \"сша\": \"Вашингтон\", \"америка\": \"Вашингтон\", \"канада\": \"Оттава\",\n    \"мексика\": \"Мехико\", \"бразилия\": \"Бразилиа\", \"аргентина\": \"Буэнос-Айрес\", \"чили\": \"Сантьяго\",\n    \"перу\": \"Лима\", \"колумбия\": \"Богота\", \"куба\": \"Гавана\", \"китай\": \"Пекин\", \"япония\": \"Токио\",\n    \"корея\": \"Сеул\", \"южная корея\": \"Сеул\", \"северная корея\": \"Пхеньян\", \"индия\": \"Нью-Дели\",\n    \"пакистан\": \"Исламабад\", \"иран\": \"Тегеран\", \"ирак\": \"Багдад\", \"израиль\": \"Иерусалим\",\n    \"саудовская аравия\": \"Эр-Рияд\", \"оаэ\": \"Абу-Даби\", \"египет\": \"Каир\", \"египта\": \"Каир\",\n    \"марокко\": \"Рабат\", \"нигерия\": \"Абуджа\", \"кения\": \"Найроби\", \"юар\": \"Претория\",\n    \"австралия\": \"Канберра\", \"новая зеландия\": \"Веллингтон\", \"таиланд\": \"Бангкок\", \"вьетнам\": \"Ханой\",\n    \"индонезия\": \"Джакарта\", \"монголия\": \"Улан-Батор\", \"афганистан\": \"Кабул\", \"сирия\": \"Дамаск\",\n}\n\n\ndef capital(text: str):\n    low = _low(text)\n    m = re.search(r\"столиц\\w*\\s+(?:страны\\s+|государства\\s+)?([а-я -]+?)[?!.]*$\", low)\n    if not m:\n        return None\n    import nlp  # локальный импорт: skills не зависит от nlp при загрузке\n    want = [nlp.stem(w) for w in m.group(1).split()]\n    for country, city in sorted(CAPITALS.items(), key=lambda kv: -len(kv[0])):\n        parts = [nlp.stem(w) for w in country.split()]\n        if want[:len(parts)] == parts:\n            return f\"Столица — **{city}**.\"\n    return None\n\n\nSKILLS = {\n    \"calc\": calculator,\n    \"time\": date_time,\n    \"convert\": converter,\n    \"random\": randomness,\n    \"password\": password,\n    \"text\": text_tools,\n    \"table\": times_table,\n    \"capital\": capital,\n}\n\n# Порядок проверки: сначала узкие навыки, калькулятор — после конвертера.\nORDER = [\"text\", \"table\", \"capital\", \"password\", \"time\", \"convert\", \"random\", \"calc\"]\n\n\ndef run(text: str, allowed) -> str:\n    for name in ORDER:\n        if name in allowed:\n            answer = SKILLS[name](text)\n            if answer:\n                return answer\n    return None\n", "net.py": "\"\"\"Запросы в интернет для Rai: одинаково работают на сервере (urllib) и в браузере (Pyodide).\"\"\"\n\nimport json\nimport sys\nimport time\nimport urllib.parse\nimport urllib.request\n\nUSER_AGENT = \"RaiBot/1.0 (+https://github.com/rteaminfo1-source/rai)\"\nIN_BROWSER = sys.platform == \"emscripten\"\n\n_cache = {}\n\n\nclass NetError(Exception):\n    \"\"\"Не получилось получить данные из интернета.\"\"\"\n\n\ndef url(base: str, **params) -> str:\n    return base + (\"?\" + urllib.parse.urlencode(params) if params else \"\")\n\n\ndef fetch_text(address: str, timeout: float = 10) -> str:\n    try:\n        if IN_BROWSER:\n            # Синхронный запрос браузера: Python в Pyodide не умеет открывать сокеты сам.\n            from pyodide.http import open_url\n            return open_url(address).getvalue()\n        req = urllib.request.Request(address, headers={\"User-Agent\": USER_AGENT, \"Accept\": \"application/json\"})\n        with urllib.request.urlopen(req, timeout=timeout) as resp:\n            return resp.read().decode(\"utf-8\")\n    except Exception as e:  # сеть, DNS, таймаут, CORS в браузере\n        raise NetError(str(e) or e.__class__.__name__) from e\n\n\ndef fetch_json(address: str, ttl: float = 0):\n    \"\"\"Скачать JSON. ttl > 0 — хранить ответ в памяти столько секунд.\"\"\"\n    now = time.time()\n    if ttl and address in _cache and now - _cache[address][0] < ttl:\n        return _cache[address][1]\n    text = fetch_text(address)\n    try:\n        data = json.loads(text)\n    except ValueError as e:\n        raise NetError(\"сервис вернул не JSON\") from e\n    if ttl:\n        _cache[address] = (now, data)\n    return data\n", "online.py": "\"\"\"Навыки Rai, которым нужен интернет: погода, валюты, перевод, поиск.\n\nИспользуются бесплатные открытые сервисы без ключей:\n- погода — Open-Meteo (open-meteo.com);\n- курсы валют — open.er-api.com (запасной — cbr-xml-daily.ru, курсы ЦБ РФ);\n- перевод — MyMemory (mymemory.translated.net);\n- поиск — Википедия.\n\"\"\"\n\nimport re\nfrom datetime import date\n\nimport urllib.parse\n\nimport creative\nimport net\nimport nlp\n\n# ================================================================== погода\n\nWEATHER_CODES = {\n    0: (\"ясно\", \"clear\"), 1: (\"преимущественно ясно\", \"clear\"), 2: (\"переменная облачность\", \"partly\"),\n    3: (\"пасмурно\", \"cloudy\"), 45: (\"туман\", \"fog\"), 48: (\"туман с изморозью\", \"fog\"),\n    51: (\"слабая морось\", \"rain\"), 53: (\"морось\", \"rain\"), 55: (\"сильная морось\", \"rain\"),\n    56: (\"ледяная морось\", \"rain\"), 57: (\"ледяная морось\", \"rain\"),\n    61: (\"небольшой дождь\", \"rain\"), 63: (\"дождь\", \"rain\"), 65: (\"сильный дождь\", \"rain\"),\n    66: (\"ледяной дождь\", \"rain\"), 67: (\"сильный ледяной дождь\", \"rain\"),\n    71: (\"небольшой снег\", \"snow\"), 73: (\"снег\", \"snow\"), 75: (\"сильный снег\", \"snow\"), 77: (\"снежная крупа\", \"snow\"),\n    80: (\"небольшой ливень\", \"rain\"), 81: (\"ливень\", \"rain\"), 82: (\"сильный ливень\", \"rain\"),\n    85: (\"снегопад\", \"snow\"), 86: (\"сильный снегопад\", \"snow\"),\n    95: (\"гроза\", \"storm\"), 96: (\"гроза с градом\", \"storm\"), 99: (\"сильная гроза с градом\", \"storm\"),\n}\n_WEEKDAYS = [\"пн\", \"вт\", \"ср\", \"чт\", \"пт\", \"сб\", \"вс\"]\n\n_WEATHER_RE = re.compile(\n    r\"(погод\\w*|температур\\w*|прогноз\\w*|дожд\\w*|снег\\w*|холодно|жарко|тепло)\", re.I\n)\n_CITY_RE = re.compile(\n    r\"(?:\\bв|\\bво|\\bна|\\bдля|\\bпо)\\s+(?:городе\\s+|город\\s+)?([а-яёa-z][а-яёa-z\\- ]{1,40}?)\"\n    r\"(?:\\s+(?:сегодня|сейчас|завтра|на завтра|на неделю|на выходные|будет|есть))?[\\s?!.]*$\",\n    re.I,\n)\n\n\ndef is_weather_request(text: str) -> bool:\n    low = text.lower()\n    if not _WEATHER_RE.search(low):\n        return False\n    # «прогноз» без погоды и «снег»/«дождь» как тема «что такое дождь» — не про погоду\n    if re.search(r\"что такое|кто такой|нарису|презентац\", low):\n        return False\n    return bool(re.search(r\"погод|температур|будет ли|идет ли|идёт ли|холодно|жарко|тепло|прогноз погод\", low))\n\n\ndef _city_candidates(phrase: str):\n    \"\"\"«Москве» -> «Москве», «Москва», «Москв»… Open-Meteo ищет по началу названия.\"\"\"\n    phrase = phrase.strip(\" -\")\n    words = phrase.split()\n    cands = [phrase]\n    if len(words) == 1:\n        w = words[0]\n        for old, new in ((\"е\", \"а\"), (\"и\", \"ь\"), (\"и\", \"а\"), (\"е\", \"\"), (\"у\", \"а\"), (\"и\", \"я\")):\n            if w.lower().endswith(old) and len(w) > 3:\n                cands.append(w[: -len(old)] + new)\n        cands.append(nlp.stem(w.lower()))\n    else:\n        fixed = []\n        for w in words:\n            lw = w.lower()\n            if lw.endswith((\"ем\", \"ом\")) and len(lw) > 4:\n                fixed.append(w[:-2] + (\"ий\" if lw.endswith(\"ем\") else \"ый\"))\n            elif lw.endswith(\"ой\") and len(lw) > 4:\n                fixed.append(w[:-2] + \"ая\")\n            elif lw.endswith(\"е\") and len(lw) > 3:\n                fixed.append(w[:-1])\n            else:\n                fixed.append(w)\n        cands.append(\" \".join(fixed))\n    out = []\n    for c in cands:\n        if c and c.lower() not in [o.lower() for o in out]:\n            out.append(c)\n    return out[:5]\n\n\ndef geocode(phrase: str):\n    for cand in _city_candidates(phrase):\n        data = net.fetch_json(net.url(\"https://geocoding-api.open-meteo.com/v1/search\",\n                                      name=cand, count=1, language=\"ru\", format=\"json\"), ttl=86400)\n        results = data.get(\"results\") or []\n        if results:\n            return results[0]\n    return None\n\n\ndef weather(text: str, session: dict, default_city: str = \"Москва\"):\n    \"\"\"Вернуть (ответ, вложения) или None, если это не вопрос о погоде.\"\"\"\n    if not is_weather_request(text):\n        return None\n    m = _CITY_RE.search(text)\n    city_phrase = m.group(1).strip() if m else None\n    if city_phrase and re.fullmatch(r\"(сегодня|завтра|неделю|выходные|улице|дворе)\", city_phrase, re.I):\n        city_phrase = None\n    city_phrase = city_phrase or session.get(\"city\") or default_city\n    try:\n        place = geocode(city_phrase)\n        if not place:\n            return f\"Не нашёл город «{city_phrase}». Напишите, например: «погода в Казани».\", []\n        data = net.fetch_json(net.url(\n            \"https://api.open-meteo.com/v1/forecast\",\n            latitude=place[\"latitude\"], longitude=place[\"longitude\"], timezone=\"auto\", forecast_days=4,\n            wind_speed_unit=\"ms\",\n            current=\"temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day\",\n            daily=\"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max\",\n        ), ttl=600)\n    except net.NetError as e:\n        return f\"Не удалось узнать погоду: нет связи с сервисом погоды ({e}).\", []\n\n    session[\"city\"] = place.get(\"name\", city_phrase)\n    cur = data.get(\"current\", {})\n    code = int(cur.get(\"weather_code\", 0))\n    desc, kind = WEATHER_CODES.get(code, (\"без осадков\", \"cloudy\"))\n    temp = cur.get(\"temperature_2m\")\n    feels = cur.get(\"apparent_temperature\")\n    name = place.get(\"name\", city_phrase)\n    where = \", \".join(x for x in (name, place.get(\"country\")) if x)\n\n    def t(v):\n        return f\"{'+' if v is not None and round(v) > 0 else ''}{round(v)}°\" if v is not None else \"—\"\n\n    lines = [\n        f\"## Погода: {where}\",\n        f\"Сейчас **{t(temp)}**, {desc}. Ощущается как {t(feels)}.\",\n        f\"Ветер {cur.get('wind_speed_10m', '—')} м/с, влажность {cur.get('relative_humidity_2m', '—')}%.\",\n    ]\n    daily = data.get(\"daily\", {})\n    days = daily.get(\"time\", [])\n    if days:\n        lines.append(\"\\n| День | Погода | Мин | Макс | Осадки |\\n|---|---|---|---|---|\")\n        for i, day in enumerate(days[:4]):\n            d = date.fromisoformat(day)\n            label = \"сегодня\" if i == 0 else \"завтра\" if i == 1 else f\"{_WEEKDAYS[d.weekday()]}, {d.day:02d}.{d.month:02d}\"\n            dcode = int(daily.get(\"weather_code\", [0] * 4)[i])\n            prob = (daily.get(\"precipitation_probability_max\") or [None] * 4)[i]\n            lines.append(\n                f\"| {label} | {WEATHER_CODES.get(dcode, ('—',))[0]} | {t(daily['temperature_2m_min'][i])} | \"\n                f\"**{t(daily['temperature_2m_max'][i])}** | {'' if prob is None else str(prob) + '%'} |\"\n            )\n    card = creative.weather_card(name, t(temp), desc, kind, bool(cur.get(\"is_day\", 1)), f\"ощущается как {t(feels)}\")\n    return \"\\n\".join(lines), [card]\n\n\n# ================================================================== валюты\n\n# (код, слова-формы (регулярное выражение для целого слова), название)\nCURRENCIES = [\n    (\"BYN\", r\"белорусск\\w*|byn\", \"белорусский рубль\"),\n    (\"CAD\", r\"канадск\\w*|cad\", \"канадский доллар\"),\n    (\"AUD\", r\"австралийск\\w*|aud\", \"австралийский доллар\"),\n    (\"SEK\", r\"шведск\\w*|sek\", \"шведская крона\"),\n    (\"CZK\", r\"чешск\\w*|czk\", \"чешская крона\"),\n    (\"RUB\", r\"рубл\\w*|руб|rub|₽\", \"рубль\"),\n    (\"USD\", r\"доллар\\w*|бакс\\w*|usd|\\$\", \"доллар США\"),\n    (\"EUR\", r\"евро|eur|€\", \"евро\"),\n    (\"CNY\", r\"юан\\w*|cny|¥\", \"юань\"),\n    (\"GBP\", r\"фунт\\w*|стерлинг\\w*|gbp|£\", \"фунт стерлингов\"),\n    (\"JPY\", r\"[иий]ен\\w*|jpy\", \"иена\"),\n    (\"KZT\", r\"тенге|kzt|₸\", \"тенге\"),\n    (\"UAH\", r\"гривн\\w*|uah|₴\", \"гривна\"),\n    (\"TRY\", r\"лир[аыу]?|лирах\", \"турецкая лира\"),\n    (\"CHF\", r\"франк\\w*|chf\", \"швейцарский франк\"),\n    (\"KRW\", r\"вон[аыу]|krw\", \"вона\"),\n    (\"INR\", r\"рупи\\w*|inr\", \"индийская рупия\"),\n    (\"PLN\", r\"злот\\w*|pln\", \"злотый\"),\n    (\"KGS\", r\"сом(?:а|ов|ы)?|kgs\", \"сом\"),\n    (\"UZS\", r\"сум(?:ов)?|uzs\", \"сум\"),\n    (\"GEL\", r\"лари|gel\", \"лари\"),\n    (\"AMD\", r\"драм(?:ов)?|amd\", \"драм\"),\n    (\"AZN\", r\"манат\\w*|azn\", \"манат\"),\n    (\"AED\", r\"дирхам\\w*|aed\", \"дирхам ОАЭ\"),\n    (\"ILS\", r\"шекел\\w*|ils\", \"шекель\"),\n    (\"THB\", r\"бат(?:а|ов)?|thb\", \"бат\"),\n    (\"BRL\", r\"реал(?:а|ов)|brl\", \"бразильский реал\"),\n]\n# «белорусских рублей», «канадских долларов» — второе слово не отдельная валюта\n_COMPOUND = {\"BYN\": \"RUB\", \"CAD\": \"USD\", \"AUD\": \"USD\", \"SEK\": \"\", \"CZK\": \"\"}\n\n\ndef _find_currencies(text):\n    \"\"\"Найти валюты в тексте по порядку упоминания: [(позиция, код)].\"\"\"\n    low = text.lower().replace(\"ё\", \"е\")\n    found = []\n    prev_word_code = None  # валюта, найденная в предыдущем слове\n    for m in re.finditer(r\"[a-zа-я]+|[$€£¥₽₸₴]\", low):\n        word = m.group(0)\n        code = next((c for c, pattern, _ in CURRENCIES if re.fullmatch(pattern, word)), None)\n        skip = prev_word_code and code is not None and (\n            _COMPOUND.get(prev_word_code) == code or (prev_word_code in (\"SEK\", \"CZK\") and word.startswith(\"крон\")))\n        if code and not skip:\n            found.append((m.start(), code))\n        if prev_word_code in (\"SEK\", \"CZK\") and word.startswith(\"крон\"):\n            code = None\n        prev_word_code = None if skip else code\n    return found\n\n\ndef is_currency_request(text: str) -> bool:\n    low = text.lower()\n    if re.search(r\"курс\\w*\\s+валют|валют\\w*\\s+курс\", low):\n        return True\n    cur = _find_currencies(text)\n    if not cur:\n        return False\n    if re.search(r\"\\bкурс\", low):\n        return True\n    has_number = bool(re.search(r\"\\d\", low))\n    if len(cur) >= 2 and (has_number or re.search(r\"\\bв\\b|\\bto\\b|сколько\", low)):\n        return True\n    return has_number and bool(re.search(r\"сколько|стоит|это|будет\", low))\n\n\ndef rates():\n    \"\"\"Курсы к доллару: {\"USD\": 1, \"RUB\": 92.1, ...}, дата.\"\"\"\n    try:\n        data = net.fetch_json(\"https://open.er-api.com/v6/latest/USD\", ttl=3600)\n        if data.get(\"result\") == \"success\":\n            return data[\"rates\"], data.get(\"time_last_update_utc\", \"\")[:16]\n    except net.NetError:\n        pass\n    data = net.fetch_json(\"https://www.cbr-xml-daily.ru/daily_json.js\", ttl=3600)\n    rub = {\"RUB\": 1.0}\n    for code, v in data.get(\"Valute\", {}).items():\n        rub[code] = v[\"Value\"] / v[\"Nominal\"]  # рублей за 1 единицу\n    usd = rub[\"USD\"]\n    return {code: usd / value for code, value in rub.items()}, \"ЦБ РФ, \" + data.get(\"Date\", \"\")[:10]\n\n\ndef _money(v):\n    if float(v).is_integer() and abs(v) < 1e15:\n        return f\"{int(v):,}\".replace(\",\", \" \")\n    if v >= 100:\n        s = f\"{v:,.2f}\"\n    elif v >= 1:\n        s = f\"{v:,.4f}\".rstrip(\"0\").rstrip(\".\")\n    else:\n        s = f\"{v:.6f}\".rstrip(\"0\").rstrip(\".\")\n    return s.replace(\",\", \" \").replace(\".\", \",\")\n\n\ndef _name(code):\n    return next((n for c, _, n in CURRENCIES if c == code), code)\n\n\ndef currency(text: str):\n    if not is_currency_request(text):\n        return None\n    try:\n        table, updated = rates()\n    except net.NetError as e:\n        return f\"Не удалось получить курсы валют: нет связи ({e}).\"\n    found = [code for _, code in _find_currencies(text)]\n    low = text.lower()\n    if not found or re.search(r\"курс\\w*\\s+валют\", low) and len(found) < 2:\n        rows = \"\\n\".join(\n            f\"| {_name(c)} | {c} | **{_money(table['RUB'] / table[c])} ₽** |\"\n            for c in (\"USD\", \"EUR\", \"CNY\", \"GBP\", \"JPY\", \"KZT\", \"BYN\", \"TRY\") if c in table\n        )\n        return f\"## Курсы валют к рублю\\n\\n| Валюта | Код | Курс |\\n|---|---|---|\\n{rows}\\n\\nОбновлено: {updated}.\"\n    num = re.search(r\"(\\d[\\d\\s]*(?:[.,]\\d+)?)\\s*(тыс\\w*|к\\b|млн|миллион\\w*)?\", low)\n    amount = 1.0\n    if num:\n        amount = float(num.group(1).replace(\" \", \"\").replace(\",\", \".\"))\n        mult = num.group(2) or \"\"\n        amount *= 1000 if mult.startswith((\"тыс\", \"к\")) else 1_000_000 if mult.startswith((\"млн\", \"миллион\")) else 1\n    src = found[0]\n    dst = found[1] if len(found) > 1 and found[1] != src else (\"RUB\" if src != \"RUB\" else \"USD\")\n    if src not in table or dst not in table:\n        return \"Для этой валюты у меня нет курса.\"\n    value = amount * table[dst] / table[src]\n    one = table[dst] / table[src]\n    return (f\"**{_money(amount)} {src} = {_money(value)} {dst}**\\n\\n\"\n            f\"Курс: 1 {_name(src)} = {_money(one)} {dst}. Обновлено: {updated}.\")\n\n\n# ================================================================== перевод\n\nLANGS = {\n    \"en\": (\"английск\", \"английский\"), \"ru\": (\"русск\", \"русский\"), \"de\": (\"немецк\", \"немецкий\"),\n    \"fr\": (\"французск\", \"французский\"), \"es\": (\"испанск\", \"испанский\"), \"it\": (\"итальянск\", \"итальянский\"),\n    \"pt\": (\"португальск\", \"португальский\"), \"pl\": (\"польск\", \"польский\"), \"uk\": (\"украинск\", \"украинский\"),\n    \"be\": (\"белорусск\", \"белорусский\"), \"kk\": (\"казахск\", \"казахский\"), \"zh\": (\"китайск\", \"китайский\"),\n    \"ja\": (\"японск\", \"японский\"), \"ko\": (\"корейск\", \"корейский\"), \"ar\": (\"арабск\", \"арабский\"),\n    \"tr\": (\"турецк\", \"турецкий\"), \"el\": (\"греческ\", \"греческий\"), \"he\": (\"иврит\", \"иврит\"),\n    \"hi\": (\"хинди\", \"хинди\"), \"cs\": (\"чешск\", \"чешский\"), \"nl\": (\"нидерландск\", \"нидерландский\"),\n    \"sv\": (\"шведск\", \"шведский\"), \"no\": (\"норвежск\", \"норвежский\"), \"da\": (\"датск\", \"датский\"),\n    \"fi\": (\"финск\", \"финский\"), \"hu\": (\"венгерск\", \"венгерский\"), \"ro\": (\"румынск\", \"румынский\"),\n    \"bg\": (\"болгарск\", \"болгарский\"), \"sr\": (\"сербск\", \"сербский\"), \"hr\": (\"хорватск\", \"хорватский\"),\n    \"lv\": (\"латышск\", \"латышский\"), \"lt\": (\"литовск\", \"литовский\"), \"et\": (\"эстонск\", \"эстонский\"),\n    \"ka\": (\"грузинск\", \"грузинский\"), \"hy\": (\"армянск\", \"армянский\"), \"az\": (\"азербайджанск\", \"азербайджанский\"),\n    \"uz\": (\"узбекск\", \"узбекский\"), \"tt\": (\"татарск\", \"татарский\"), \"fa\": (\"персидск\", \"персидский\"),\n    \"vi\": (\"вьетнамск\", \"вьетнамский\"), \"th\": (\"тайск\", \"тайский\"), \"id\": (\"индонезийск\", \"индонезийский\"),\n    \"la\": (\"латын\", \"латынь\"), \"eo\": (\"эсперанто\", \"эсперанто\"), \"ky\": (\"киргизск\", \"киргизский\"),\n    \"tg\": (\"таджикск\", \"таджикский\"), \"mn\": (\"монгольск\", \"монгольский\"), \"sk\": (\"словацк\", \"словацкий\"),\n    \"sl\": (\"словенск\", \"словенский\"), \"ga\": (\"ирландск\", \"ирландский\"), \"is\": (\"исландск\", \"исландский\"),\n}\n_LANG_ALIAS = {\"голландск\": \"nl\", \"фарси\": \"fa\", \"по-русск\": \"ru\", \"англ\": \"en\"}\n\n_STOP = {\n    \"en\": \"the and is are you to of in it what hello how this that with for my your i we they be not have\".split(),\n    \"de\": \"und der die das ist nicht ich du ein eine wie guten danke mit für ist sie wir haben\".split(),\n    \"fr\": \"le la les et est je vous un une bonjour pas que merci avec pour nous il elle\".split(),\n    \"es\": \"el la los las y es que de hola como estás por una gracias con para muy yo\".split(),\n    \"it\": \"il lo la e è che di ciao come sono non una grazie con per io tu\".split(),\n    \"pt\": \"o a os e é que de olá você não um uma obrigado com para eu muito\".split(),\n    \"pl\": \"i w nie jest to się na cześć jak dzień dobry dziękuję ja ty\".split(),\n    \"tr\": \"ve bir bu ne merhaba nasılsın için değil ben sen teşekkür\".split(),\n    \"nl\": \"de het een en is niet ik hallo hoe dank je wij\".split(),\n    \"sv\": \"och är jag du det inte hej tack en ett\".split(),\n    \"cs\": \"a je to se na ne ahoj jak děkuji já ty\".split(),\n    \"id\": \"dan yang di ini itu apa saya kamu terima kasih\".split(),\n}\n_HINTS = [(\"es\", \"ñ¿¡\"), (\"de\", \"ßäöü\"), (\"tr\", \"ğşı\"), (\"pl\", \"łąęśźżćń\"), (\"pt\", \"ãõ\"),\n          (\"fr\", \"àâçèêëîïôœùû\"), (\"cs\", \"ěřůčšž\"), (\"ro\", \"ăîșț\"), (\"hu\", \"őű\")]\n\n\ndef detect_language(text: str) -> str:\n    \"\"\"Свой определитель языка: по алфавиту, особым буквам и частым словам.\"\"\"\n    s = text.lower()\n    scripts = [\n        (r\"[぀-ヿ]\", \"ja\"), (r\"[가-힯]\", \"ko\"), (r\"[一-鿿]\", \"zh\"),\n        (r\"[؀-ۿ]\", \"ar\"), (r\"[֐-׿]\", \"he\"), (r\"[Ͱ-Ͽ]\", \"el\"),\n        (r\"[฀-๿]\", \"th\"), (r\"[ऀ-ॿ]\", \"hi\"), (r\"[Ⴀ-ჿ]\", \"ka\"),\n        (r\"[԰-֏]\", \"hy\"),\n    ]\n    for pattern, code in scripts:\n        if re.search(pattern, s):\n            if code == \"ar\" and re.search(r\"[پچژگ]\", s):\n                return \"fa\"\n            return code\n    if re.search(r\"[а-яёіїєґўәғқңөұүһђћџјљњ]\", s):\n        if re.search(r\"[әғқңөұүһ]\", s):\n            return \"kk\"\n        if re.search(r\"[їєґ]\", s) or (re.search(r\"і\", s) and not re.search(r\"ў\", s)):\n            return \"uk\"\n        if re.search(r\"ў\", s):\n            return \"be\"\n        if re.search(r\"[ђћџјљњ]\", s):\n            return \"sr\"\n        return \"ru\"\n    words = re.findall(r\"[a-zà-ÿąęłśźżćńěřůčšžőűăîșțğşı]+\", s)\n    scores = {lang: sum(2 for w in words if w in stop) for lang, stop in _STOP.items()}\n    for lang, letters in _HINTS:\n        scores[lang] = scores.get(lang, 0) + sum(3 for ch in s if ch in letters)\n    best = max(scores, key=scores.get) if scores else \"en\"\n    return best if scores.get(best) else \"en\"\n\n\n_TRANSLATE_RE = re.compile(\n    r\"^\\s*(?:пожалуйста\\s+)?(?:переведи(?:те)?|перевод|translate|как (?:будет|сказать|пишется)|как)\\b\", re.I\n)\n\n\ndef _lang_code(word: str):\n    w = word.lower().replace(\"ё\", \"е\")\n    for alias, code in _LANG_ALIAS.items():\n        if w.startswith(alias):\n            return code\n    for code, (prefix, _) in LANGS.items():\n        if w.startswith(prefix):\n            return code\n    return None\n\n\ndef is_translate_request(text: str) -> bool:\n    low = text.lower()\n    if re.match(r\"^\\s*(?:пожалуйста\\s+)?(?:переведи|перевод|translate)\\b\", low):\n        return True\n    return bool(re.search(r\"\\bпо-[а-я]+(?:ски|цки)\\b\", low) and re.match(r\"^\\s*как\\b\", low))\n\n\ndef parse_translate(text: str):\n    \"\"\"Разобрать запрос: (текст, язык-источник или None, язык перевода или None).\"\"\"\n    src = dst = None\n    body = text.strip()\n    quoted = re.search(r\"[«\\\"“'](.+?)[»\\\"”']\", body)\n    m = re.search(r\"\\bс\\s+([а-я]+(?:ого|ого языка)?)\\s+(?:на|в)\\s+([а-я-]+)\", body, re.I)\n    if m:\n        src, dst = _lang_code(m.group(1)), _lang_code(m.group(2))\n        body = body.replace(m.group(0), \" \")\n    m = re.search(r\"\\b(?:на|в)\\s+([а-я-]+?)(?:\\s+язык)?\\b(?=[\\s:,.!?]|$)\", body, re.I)\n    if not dst and m and _lang_code(m.group(1)):\n        dst = _lang_code(m.group(1))\n        body = body.replace(m.group(0), \" \", 1)\n    m = re.search(r\"\\bпо-([а-я]+)\", body, re.I)\n    if not dst and m and _lang_code(m.group(1)):\n        dst = _lang_code(m.group(1))\n        body = body.replace(m.group(0), \" \", 1)\n    m = re.search(r\"\\b(?:to|into)\\s+([a-z]+)\\s*$\", body, re.I)\n    if not dst and m:\n        names = {\"english\": \"en\", \"russian\": \"ru\", \"german\": \"de\", \"french\": \"fr\", \"spanish\": \"es\",\n                 \"italian\": \"it\", \"chinese\": \"zh\", \"japanese\": \"ja\", \"korean\": \"ko\", \"ukrainian\": \"uk\"}\n        if m.group(1).lower() in names:\n            dst = names[m.group(1).lower()]\n            body = body[: m.start()]\n    if quoted:\n        body = quoted.group(1)\n    else:\n        body = _TRANSLATE_RE.sub(\"\", body, count=1)\n        body = re.sub(r\"^\\s*(?:текст|слово|фразу|предложение)?\\s*[:\\-—]?\\s*\", \"\", body, flags=re.I)\n        body = re.sub(r\"^\\s*(?:будет|сказать)\\s+\", \"\", body, flags=re.I)\n    return body.strip(\" \\t\\n:—-?\"), src, dst\n\n\ndef _chunks(text, size=450):\n    parts, cur = [], \"\"\n    for sentence in re.split(r\"(?<=[.!?])\\s+\", text):\n        while len(sentence) > size:\n            parts.append(sentence[:size]); sentence = sentence[size:]\n        if len(cur) + len(sentence) + 1 > size:\n            parts.append(cur); cur = \"\"\n        cur = (cur + \" \" + sentence).strip()\n    if cur:\n        parts.append(cur)\n    return parts\n\n\ndef translate(text: str):\n    if not is_translate_request(text):\n        return None\n    body, src, dst = parse_translate(text)\n    if not body:\n        return \"Что перевести? Напишите, например: «переведи на английский: доброе утро».\"\n    if len(body) > 3000:\n        return \"Текст слишком длинный для перевода — до 3000 символов за раз.\"\n    src = src or detect_language(body)\n    dst = dst or (\"en\" if src == \"ru\" else \"ru\")\n    if src == dst:\n        dst = \"en\" if src != \"en\" else \"ru\"\n    out = []\n    try:\n        for part in _chunks(body):\n            data = net.fetch_json(net.url(\"https://api.mymemory.translated.net/get\", q=part, langpair=f\"{src}|{dst}\"),\n                                  ttl=86400)\n            if int(data.get(\"responseStatus\", 200)) != 200:\n                return f\"Сервис перевода ответил: {data.get('responseDetails', 'ошибка')}.\"\n            out.append(data.get(\"responseData\", {}).get(\"translatedText\", \"\"))\n    except net.NetError as e:\n        return f\"Не удалось перевести: нет связи с сервисом перевода ({e}).\"\n    result = \" \".join(x for x in out if x).strip()\n    return (f\"**{LANGS.get(src, (None, src))[1].capitalize()} → {LANGS.get(dst, (None, dst))[1]}:**\\n\\n\"\n            f\"> {body}\\n\\n{result}\")\n\n\n# ================================================================== поиск\n\n_SEARCH_RE = re.compile(\n    r\"^\\s*(?:найди|поищи|загугли|погугли|найти|ищи|поиск)(?:\\s+(?:в\\s+интернете|в\\s+сети|в\\s+гугле|информацию))*\"\n    r\"(?:\\s+(?:про|о|об|что такое))?\\s+(.+?)[\\s?!.]*$\",\n    re.I,\n)\n\n\ndef explicit_search(text: str):\n    m = _SEARCH_RE.match(text)\n    return m.group(1) if m else None\n\n\ndef _first_sentences(text, limit=700):\n    if len(text) <= limit:\n        return text\n    cut = text[:limit]\n    end = max(cut.rfind(\". \"), cut.rfind(\"! \"), cut.rfind(\"? \"))\n    return cut[: end + 1] if end > 200 else cut.rstrip() + \"…\"\n\n\ndef web_article(query: str, langs=(\"ru\", \"en\")):\n    \"\"\"Статья из Википедии: {\"title\", \"text\", \"image\", \"link\", \"lang\"} или None.\"\"\"\n    query = query.strip(\" ?!.\")\n    if len(query) < 2:\n        return None\n    for lang in langs:\n        found = net.fetch_json(net.url(\n            f\"https://{lang}.wikipedia.org/w/api.php\", action=\"query\", list=\"search\", srsearch=query,\n            srlimit=1, format=\"json\", origin=\"*\", utf8=1), ttl=3600)\n        hits = found.get(\"query\", {}).get(\"search\", [])\n        if not hits:\n            continue\n        title = hits[0][\"title\"]\n        page = net.fetch_json(f\"https://{lang}.wikipedia.org/api/rest_v1/page/summary/\"\n                              + urllib.parse.quote(title.replace(\" \", \"_\")), ttl=3600)\n        extract = (page.get(\"extract\") or \"\").strip()\n        if not extract:\n            continue\n        return {\n            \"title\": page.get(\"title\", title), \"text\": extract, \"lang\": lang,\n            \"link\": page.get(\"content_urls\", {}).get(\"desktop\", {}).get(\"page\", \"\"),\n            \"image\": page.get(\"thumbnail\", {}).get(\"source\") or page.get(\"originalimage\", {}).get(\"source\"),\n        }\n    return None\n\n\ndef web_search(query: str):\n    \"\"\"Найти ответ в Википедии: (ответ, вложения) или None.\"\"\"\n    art = web_article(query)\n    if not art:\n        return None\n    answer = f\"**{art['title']}**\\n\\n{_first_sentences(art['text'])}\"\n    if art[\"lang\"] == \"en\":\n        answer += \"\\n\\n*(нашёл только в английской Википедии)*\"\n    answer += f\"\\n\\nИсточник: [Википедия]({art['link']})\" if art[\"link\"] else \"\"\n    attachments = []\n    if art[\"image\"]:\n        attachments.append({\"type\": \"photo\", \"url\": art[\"image\"], \"title\": art[\"title\"], \"source\": art[\"link\"]})\n    return answer, attachments\n", "proglangs.py": "\"\"\"Справочник Rai по языкам программирования: что это, для чего, пример «Hello, World».\"\"\"\n\nimport re\n\n# (название, [другие названия], год, для чего, описание, язы  return (text or \"\").lower().replace(\"ё\", \"е\")\n\n\n_NAMES = []\nfor entry in LANGUAGES:\n    for alias in [entry[0]] + entry[1]:\n        _NAMES.append((_norm(alias), entry))\n_NAMES.sort(key=lambda x: -len(x[0]))\n\n_CONTEXT = r\"(?:язык\\w*(?: программирования)?|на|про|о|об|что такое|hello world на|пример\\w* на|код\\w* на)\\s+\"\n\n\ndef find_language(text: str, strict_short=True):\n    low = _norm(text)\n    for alias, entry in _NAMES:\n        pattern = r\"(?<![\\w+#])\" + re.escape(alias) + r\"(?![\\w+#])\"\n        if len(alias) <= 2 and strict_short:\n            pattern = _CONTEXT + pattern  # «c», «r», «v», «go»: только в явном контексте\n        if re.search(pattern, low):\n            return entry\n    return None\n\n\n_LIST_RE = re.compile(r\"(какие|список|перечисли|все)\\s+(?:ты\\s+)?(?:знаешь\\s+)?языки? программирования|\"\n                      r\"языки программирования (?:ты )?знаешь|сколько языков программирования\", re.I)\n_CODE_RE = re.compile(r\"hello,? world|привет,? мир|пример\\w* кода|пример\\w* на|код на|напиши на|программ\\w* на|\"\n                      r\"как вывести|как написать\", re.I)\n_ABOUT_RE = re.compile(r\"что такое|что за|расскажи (?:про|о|об)|язык\\w*\\s|для чего|зачем\", re.I)\n\n\ndef describe(entry, with_code=True):\n    name, _, year, use, desc, lang, code = entry\n    text = f\"**{name}** ({year}) — {desc}.\\n\\n**Для чего:** {use}.\"\n    if with_code:\n        text += f\"\\n\\n**Hello, World на {name}:**\\n\\n```{lang}\\n{code}\\n```\"\n    return text\n\n\ndef answer(text: str):\n    \"\"\"Ответ про язык программирования или None.\"\"\"\n    if _LIST_RE.search(text):\n        rows = \"\\n\".join(f\"| **{e[0]}** | {e[2]} | {e[3]} |\" for e in LANGUAGES)\n        return (f\"## Языки программирования, которые я знаю ({len(LANGUAGES)})\\n\\n\"\n                f\"| Язык | Год | Для чего |\\n|---|---|---|\\n{rows}\\n\\n\"\n                \"Спросите про любой: «что такое Rust», «hello world на Go».\")\n    entry = find_language(text)\n    if not entry:\n        return None\n    if _CODE_RE.search(text):\n        name, _, _, _, _, lang, code = entry\n        return f\"**Hello, World на {name}:**\\n\\n```{lang}\\n{code}\\n```\"\n    if _ABOUT_RE.search(text) or _norm(text).strip(\" ?!.\") in [_norm(a) for a in [entry[0]] + entry[1]]:\n        return describe(entry)\n    return None\n", "creative.py": "\"\"\"Свои картинки (SVG) и презентации Rai — без внешних сервисов.\n\nКартинка собирается из «сцен» по словам в запросе: небо (день, закат, ночь, космос),\nгоры, море, лес, город, пустыня, зима, сердце, цветок, абстракция, логотип.\nПрезентация собирается из базы знаний Rai.\n\"\"\"\n\nimport math\nimport random\nimport re\nimport zlib\nfrom xml.sax.saxutils import escape\n\nimport nlp\n\nW, H = 1200, 800\n\nCOLORS = {\n    \"красн\": \"#e10600\", \"алый\": \"#ff2a2a\", \"син\": \"#1e5bff\", \"голуб\": \"#4fc3f7\",\n    \"зелен\": \"#2ecc71\", \"желт\": \"#ffd200\", \"оранж\": \"#ff7a00\", \"фиолет\": \"#8e44ad\",\n    \"розов\": \"#ff5fa2\", \"бирюз\": \"#1abc9c\", \"золот\": \"#d4af37\", \"серебр\": \"#c0c0c0\",\n    \"бел\": \"#f2f2f2\", \"черн\": \"#151515\",\n}\n\n# Сцены: имя -> начала слов, по которым их узнаём.\nSCENES = [\n    (\"logo\", (\"логотип\", \"лого\", \"эмблем\", \"значок\")),\n    (\"space\", (\"космос\", \"галактик\", \"планет\", \"вселенн\")),\n    (\"night\", (\"ноч\", \"луна\", \"луну\", \"луной\", \"звезд\")),\n    (\"sunset\", (\"закат\", \"вечер\")),\n    (\"sunrise\", (\"рассвет\", \"утро\", \"утрен\")),\n    (\"winter\", (\"зим\", \"снег\", \"снеж\", \"мороз\")),\n    (\"desert\", (\"пустын\", \"дюн\", \"песок\")),\n    (\"city\", (\"город\", \"небоскреб\", \"улиц\", \"дом\", \"здани\")),\n    (\"sea\", (\"море\", \"моря\", \"морск\", \"океан\", \"волн\", \"озер\", \"пляж\", \"река\")),\n    (\"mountains\", (\"гора\", \"горы\", \"гору\", \"горн\", \"горах\", \"скал\", \"вершин\")),\n    (\"forest\", (\"лес\", \"дерев\", \"елк\", \"ель\", \"ели\", \"сосн\", \"роща\")),\n    (\"heart\", (\"сердц\", \"сердечк\", \"любов\", \"валентин\")),\n    (\"flower\", (\"цветок\", \"цветы\", \"цветочк\", \"роза\", \"розу\", \"розы\", \"ромашк\", \"тюльпан\")),\n    (\"abstract\", (\"абстракц\", \"узор\", \"паттерн\", \"геометр\", \"фон\", \"обои\")),\n]\n\n_IMAGE_WORDS = re.compile(\n    r\"нарису|изобрази|картинк|изображени|рисун|логотип|нарисовать|арт\\b|обои\", re.I\n)\n# «Как сделать картинку?», «ты умеешь рисовать?» — это вопросы, а не просьбы.\n_QUESTION = re.compile(r\"^\\s*(а\\s+)?(как|ты умеешь|умеешь|можешь ли|что ты)\\b|\\bумеешь\\b\", re.I)\n\n\ndef is_image_request(text: str) -> bool:\n    return bool(_IMAGE_WORDS.search(text or \"\")) and not _QUESTION.search(text or \"\")\n\n\ndef _words(text):\n    return nlp.normalize(text).split()\n\n\ndef _has(words, prefixes):\n    return any(w.startswith(p) for w in words for p in prefixes)\n\n\ndef _mix(c1, c2, t):\n    a = [int(c1[i:i + 2], 16) for i in (1, 3, 5)]\n    b = [int(c2[i:i + 2], 16) for i in (1, 3, 5)]\n    return \"#\" + \"\".join(f\"{round(x + (y - x) * t):02x}\" for x, y in zip(a, b))\n\n\nclass _Canvas:\n    def __init__(self, rnd):\n        self.rnd = rnd\n        self.defs = []\n        self.items = []\n        self._id = 0\n\n    def uid(self, prefix):\n        self._id += 1\n        return f\"{prefix}{self._id}\"\n\n    def gradient(self, stops, vertical=True):\n        gid = self.uid(\"g\")\n        coords = 'x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"' if vertical else 'x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"'\n        body = \"\".join(f'<stop offset=\"{o}\" stop-color=\"{c}\"/>' for o, c in stops)\n        self.defs.append(f'<linearGradient id=\"{gid}\" {coords}>{body}<\/linearGradient>')\n        return f\"url(#{gid})\"\n\n    def glow(self, color):\n        gid = self.uid(\"r\")\n        self.defs.append(\n            f'<radialGradient id=\"{gid}\"><stop offset=\"0\" stop-color=\"{color}\" stop-opacity=\"0.9\"/>'\n            f'<stop offset=\"1\" stop-color=\"{color}\" stop-opacity=\"0\"/><\/radialGradient>'\n        )\n        return f\"url(#{gid})\"\n\n    def add(self, svg):\n        self.items.append(svg)\n\n    def svg(self, title):\n        return (\n            f'<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 {W} {H}\" width=\"{W}\" height=\"{H}\">'\n            f\"<title>{escape(title)}<\/title><defs>{''.join(self.defs)}<\/defs>{''.join(self.items)}<\/svg>\"\n        )\n\n\n# ------------------------------------------------------------------ элементы\n\ndef _sky(c, mode, accent):\n    skies = {\n        \"day\": [(\"0\", \"#2f7fd8\"), (\"1\", \"#bfe3ff\")],\n        \"sunset\": [(\"0\", \"#1b0b2e\"), (\"0.45\", \"#b3143a\"), (\"0.8\", \"#ff6a2a\"), (\"1\", \"#ffc15a\")],\n        \"sunrise\": [(\"0\", \"#2a3a7a\"), (\"0.55\", \"#ff8fa3\"), (\"1\", \"#ffe0a3\")],\n        \"night\": [(\"0\", \"#03040c\"), (\"1\", \"#141b3d\")],\n        \"space\": [(\"0\", \"#000000\"), (\"1\", \"#07030f\")],\n        \"winter\": [(\"0\", \"#8fb3d9\"), (\"1\", \"#eef5ff\")],\n        \"desert\": [(\"0\", \"#f39c4a\"), (\"1\", \"#ffe2a8\")],\n        \"dark\": [(\"0\", \"#0a0a0a\"), (\"1\", \"#1a0505\")],\n    }\n    stops = skies.get(mode, skies[\"day\"])\n    if accent and mode in (\"day\", \"dark\"):\n        stops = [(o, _mix(col, accent, 0.35)) for o, col in stops]\n    c.add(f'<rect width=\"{W}\" height=\"{H}\" fill=\"{c.gradient(stops)}\"/>')\n\n\ndef _stars(c, n, top=H):\n    r = c.rnd\n    parts = []\n    for _ in range(n):\n        x, y = r.uniform(0, W), r.uniform(0, top)\n        size = r.choice([0.8, 1, 1.2, 1.6, 2.2])\n        parts.append(f'<circle cx=\"{x:.0f}\" cy=\"{y:.0f}\" r=\"{size}\" fill=\"#fff\" opacity=\"{r.uniform(0.4, 1):.2f}\"/>')\n    c.add(\"\".join(parts))\n\n\ndef _sun(c, x, y, r, color):\n    c.add(f'<circle cx=\"{x}\" cy=\"{y}\" r=\"{r * 3}\" fill=\"{c.glow(color)}\"/>')\n    c.add(f'<circle cx=\"{x}\" cy=\"{y}\" r=\"{r}\" fill=\"{color}\"/>')\n\n\ndef _moon(c, x, y, r):\n    c.add(f'<circle cx=\"{x}\" cy=\"{y}\" r=\"{r * 2.6}\" fill=\"{c.glow(\"#dfe8ff\")}\"/>')\n    c.add(f'<circle cx=\"{x}\" cy=\"{y}\" r=\"{r}\" fill=\"#f4f1e6\"/>')\n    c.add(f'<circle cx=\"{x + r * 0.45}\" cy=\"{y - r * 0.2}\" r=\"{r * 0.9}\" fill=\"#0b1026\" opacity=\"0.92\"/>')\n\n\ndef _ridge(c, base, height, color, jag):\n    r = c.rnd\n    pts = [(0, H)]\n    x = 0\n    while x <= W:\n        pts.append((x, base - r.uniform(0.3, 1.0) * height))\n        x += r.uniform(60, 60 + jag)\n    pts += [(W, base - r.uniform(0.3, 1.0) * height), (W, H)]\n    c.add(f'<polygon points=\"{\" \".join(f\"{a:.0f},{b:.0f}\" for a, b in pts)}\" fill=\"{color}\"/>')\n\n\ndef _mountains(c, palette, snow):\n    for i, color in enumerate(palette):\n        base = 520 + i * 70\n        _ridge(c, base, 260 - i * 60, color, 140)\n    if snow:\n        c.add(f'<rect y=\"{H - 90}\" width=\"{W}\" height=\"90\" fill=\"#f4f8ff\"/>')\n\n\ndef _sea(c, top, color, sun_x=None, sun_color=None):\n    c.add(f'<rect y=\"{top}\" width=\"{W}\" height=\"{H - top}\" fill=\"{c.gradient([(\"0\", color), (\"1\", _mix(color, \"#000000\", 0.6))])}\"/>')\n    if sun_x is not None:\n        for i in range(10):\n            w = 160 - i * 12\n            c.add(f'<rect x=\"{sun_x - w / 2:.0f}\" y=\"{top + 12 + i * 18}\" width=\"{w}\" height=\"4\" rx=\"2\" fill=\"{sun_color}\" opacity=\"{0.7 - i * 0.05:.2f}\"/>')\n    r = c.rnd\n    for i in range(18):\n        y = top + 20 + i * (H - top) / 18\n        x = r.uniform(-50, W)\n        c.add(f'<path d=\"M{x:.0f} {y:.0f} q30 -8 60 0 t60 0\" stroke=\"#ffffff\" stroke-opacity=\"0.25\" fill=\"none\" stroke-width=\"2\"/>')\n\n\ndef _tree(c, x, ground, h, color):\n    w = h * 0.42\n    c.add(f'<rect x=\"{x - 4:.0f}\" y=\"{ground - h * 0.15:.0f}\" width=\"8\" height=\"{h * 0.15:.0f}\" fill=\"#2b1a0e\"/>')\n    for k in range(3):\n        top = ground - h + k * h * 0.22\n        c.add(f'<polygon points=\"{x:.0f},{top:.0f} {x - w * (0.6 + k * 0.2):.0f},{top + h * 0.45:.0f} '\n              f'{x + w * (0.6 + k * 0.2):.0f},{top + h * 0.45:.0f}\" fill=\"{color}\"/>')\n\n\ndef _forest(c, ground, color, snow=False):\n    r = c.rnd\n    c.add(f'<rect y=\"{ground}\" width=\"{W}\" height=\"{H - ground}\" fill=\"{\"#eef4ff\" if snow else _mix(color, \"#000000\", 0.5)}\"/>')\n    for layer, shade in ((0, 0.35), (1, 0.0)):\n        for _ in range(16):\n            h = r.uniform(120, 240) * (0.75 if layer == 0 else 1)\n            _tree(c, r.uniform(0, W), ground + layer * 30, h, _mix(color, \"#000000\", shade))\n\n\ndef _city(c, ground, night, accent):\n    r = c.rnd\n    x = 0\n    while x < W:\n        w = r.uniform(60, 130)\n        h = r.uniform(150, 460)\n        body = \"#0d0d12\" if night else \"#3b4252\"\n        c.add(f'<rect x=\"{x:.0f}\" y=\"{ground - h:.0f}\" width=\"{w - 6:.0f}\" height=\"{h:.0f}\" fill=\"{body}\"/>')\n        for wy in range(int(ground - h + 16), int(ground - 14), 26):\n            for wx in range(int(x + 10), int(x + w - 20), 20):\n                if r.random() < (0.45 if night else 0.2):\n                    c.add(f'<rect x=\"{wx}\" y=\"{wy}\" width=\"10\" height=\"14\" fill=\"{accent or (\"#ffd36b\" if night else \"#cfe7ff\")}\" opacity=\"0.9\"/>')\n        x += w\n    c.add(f'<rect y=\"{ground}\" width=\"{W}\" height=\"{H - ground}\" fill=\"#08080a\"/>')\n\n\ndef _dunes(c):\n    for i, color in enumerate((\"#e9a24f\", \"#d9863a\", \"#c46f2a\")):\n        y = 520 + i * 80\n        c.add(f'<path d=\"M0 {y} C300 {y - 90} 500 {y + 60} 800 {y - 40} S1100 {y + 30} {W} {y - 20} L{W} {H} L0 {H} Z\" fill=\"{color}\"/>')\n\n\ndef _snowfall(c):\n    r = c.rnd\n    c.add(\"\".join(\n        f'<circle cx=\"{r.uniform(0, W):.0f}\" cy=\"{r.uniform(0, H):.0f}\" r=\"{r.uniform(1.5, 4):.1f}\" fill=\"#fff\" opacity=\"0.85\"/>'\n        for _ in range(140)\n    ))\n\n\ndef _heart(c, color):\n    fill = c.gradient([(\"0\", _mix(color, \"#ffffff\", 0.25)), (\"1\", _mix(color, \"#000000\", 0.35))])\n    c.add(f'<circle cx=\"600\" cy=\"400\" r=\"330\" fill=\"{c.glow(color)}\"/>')\n    c.add(\n        f'<path d=\"M600 640 C360 480 300 360 360 280 C420 200 540 220 600 320 '\n        f'C660 220 780 200 840 280 C900 360 840 480 600 640 Z\" fill=\"{fill}\"/>'\n    )\n\n\ndef _flower(c, color):\n    c.add(f'<path d=\"M600 470 C590 560 610 650 600 800\" stroke=\"#1f7a3a\" stroke-width=\"16\" fill=\"none\"/>')\n    c.add('<ellipse cx=\"660\" cy=\"640\" rx=\"60\" ry=\"22\" fill=\"#2ecc71\" transform=\"rotate(-30 660 640)\"/>')\n    for k in range(8):\n        a = k * math.pi / 4\n        x, y = 600 + math.cos(a) * 95, 380 + math.sin(a) * 95\n        c.add(f'<ellipse cx=\"{x:.0f}\" cy=\"{y:.0f}\" rx=\"85\" ry=\"48\" fill=\"{color}\" opacity=\"0.92\" '\n              f'transform=\"rotate({math.degrees(a):.0f} {x:.0f} {y:.0f})\"/>')\n    c.add('<circle cx=\"600\" cy=\"380\" r=\"58\" fill=\"#ffd200\"/>')\n\n\ndef _abstract(c, palette):\n    r = c.rnd\n    for _ in range(26):\n        kind = r.random()\n        col = r.choice(palette)\n        op = r.uniform(0.25, 0.85)\n        if kind < 0.4:\n            c.add(f'<circle cx=\"{r.uniform(0, W):.0f}\" cy=\"{r.uniform(0, H):.0f}\" r=\"{r.uniform(30, 220):.0f}\" fill=\"{col}\" opacity=\"{op:.2f}\"/>')\n        elif kind < 0.7:\n            x, y, s = r.uniform(0, W), r.uniform(0, H), r.uniform(60, 300)\n            c.add(f'<rect x=\"{x:.0f}\" y=\"{y:.0f}\" width=\"{s:.0f}\" height=\"{s * r.uniform(0.3, 1):.0f}\" fill=\"{col}\" '\n                  f'opacity=\"{op:.2f}\" transform=\"rotate({r.uniform(0, 90):.0f} {x:.0f} {y:.0f})\"/>')\n        else:\n            c.add(f'<line x1=\"{r.uniform(0, W):.0f}\" y1=\"{r.uniform(0, H):.0f}\" x2=\"{r.uniform(0, W):.0f}\" '\n                  f'y2=\"{r.uniform(0, H):.0f}\" stroke=\"{col}\" stroke-width=\"{r.uniform(2, 14):.0f}\" opacity=\"{op:.2f}\"/>')\n\n\ndef _logo(c, name, accent):\n    accent = accent or \"#e10600\"\n    c.add(f'<rect width=\"{W}\" height=\"{H}\" fill=\"#0a0a0a\"/>')\n    c.add(f'<circle cx=\"600\" cy=\"300\" r=\"230\" fill=\"{c.glow(accent)}\"/>')\n    c.add(f'<polygon points=\"600,150 730,375 470,375\" fill=\"none\" stroke=\"{accent}\" stroke-width=\"18\"/>')\n    c.add(f'<circle cx=\"600\" cy=\"300\" r=\"36\" fill=\"{accent}\"/>')\n    text = escape(name.upper()[:18] or \"RTEAM\")\n    size = 120 if len(text) <= 8 else max(56, int(960 / len(text)))\n    c.add(f'<text x=\"600\" y=\"590\" text-anchor=\"middle\" font-family=\"Arial Black, Arial, sans-serif\" '\n          f'font-weight=\"900\" font-size=\"{size}\" fill=\"#f4f4f4\" letter-spacing=\"6\">{text}<\/text>')\n    c.add(f'<rect x=\"480\" y=\"630\" width=\"240\" height=\"8\" fill=\"{accent}\"/>')\n\n\n# ------------------------------------------------------------------ картинка\n\ndef make_image(prompt: str, seed=None, theme=None) -> dict:\n    \"\"\"Нарисовать SVG по описанию. Возвращает {\"type\": \"image\", \"svg\", \"title\", \"prompt\"}.\n\n    theme — цвета презентации ({\"bg\", \"accent\", \"accent2\", \"fg\"}): картинка рисуется в них.\n    \"\"\"\n    words = _words(prompt)\n    rnd = random.Random(seed)\n    c = _Canvas(rnd)\n    found = [name for name, prefixes in SCENES if _has(words, prefixes)]\n    accent = (theme or {}).get(\"accent\") or next((col for p, col in COLORS.items() if _has(words, (p,))), None)\n    if theme:\n        a, a2, bg = theme[\"accent\"], theme.get(\"accent2\") or theme[\"accent\"], theme[\"bg\"]\n        palette = [a, a2, _mix(a, \"#ffffff\", 0.35), _mix(a, \"#000000\", 0.45), _mix(bg, a, 0.25)]\n    else:\n        palette = [accent] if accent else []\n        palette += [\"#e10600\", \"#ff2a2a\", \"#7a0000\", \"#f2f2f2\", \"#1a1a1a\"]\n\n    if \"logo\" in found:\n        m = re.search(r\"(?:логотип\\w*|лого|эмблем\\w*|значок)\\s+(?:для\\s+|компании\\s+|команды\\s+)?(.+)\", prompt, re.I)\n        name = (m.group(1) if m else \"Rteam\").strip(\" .!?«»\\\"'\")\n        _logo(c, name, accent)\n        return {\"type\": \"image\", \"svg\": c.svg(\"Логотип \" + name), \"title\": f\"Логоти
