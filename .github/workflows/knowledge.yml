# Знания Rai: GitHub сам собирает энциклопедию (encyclopedia.json) — важнейшие темы Википедии, космос, Россия
# и Беларусь, «этот день в истории» и то, что читают сегодня (tools/build_encyclopedia.py), — и кладёт её в
# репозиторий. Обновляет каждый день: сайт получает свежие знания сразу (kb.php), а приложение берёт их с сайта;
# встроенная в приложение офлайн-копия пересобирается 1-го числа каждого месяца.
name: Знания Rai

on:
  push:
    branches: [main, claude/peaceful-allen-c7nn4t]
    paths:
      - "tools/build_encyclopedia.py"
      - ".github/workflows/knowledge.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: knowledge
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Собрать знания из Википедии
        run: python tools/build_encyclopedia.py -o encyclopedia.json

      - name: Сохранить в репозиторий
        id: save
        run: |
          git add encyclopedia.json
          if git diff --cached --quiet; then
            echo "Знания не изменились"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(python -c "import json; print(len(json.load(open('encyclopedia.json', encoding='utf-8'))['items']))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Знания Rai: $count тем из Википедии"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Выложить сайт (и раз в месяц — пересобрать приложение)
        if: steps.save.outputs.changed == 'true' && hashFiles('encyclopedia.py') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-hosting.yml --ref "$GITHUB_REF_NAME"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%d)" = "01" ]; then
            gh workflow run desktop.yml --ref "$GITHUB_REF_NAME"
          fi
