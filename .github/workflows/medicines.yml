# Лекарства для Rai: собрать базу препаратов из Wikidata и Википедии (tools/build_medicines.py) и сохранить
# medicines.json в репозиторий. Раз в месяц сама, а ещё вручную: Actions → «Лекарства Rai» → Run workflow.
name: Лекарства Rai

on:
  push:
    branches: [main, claude/peaceful-allen-c7nn4t]
    paths:
      - "tools/build_medicines.py"
      - ".github/workflows/medicines.yml"
  schedule:
    - cron: "41 4 3 * *"
  workflow_dispatch:

concurrency:
  group: medicines
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Собрать базу лекарств
        run: python tools/build_medicines.py -o medicines.json

      - name: Сохранить в репозиторий
        id: save
        run: |
          git add medicines.json
          if git diff --cached --quiet; then
            echo "База лекарств не изменилась"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(python -c "import json; print(len(json.load(open('medicines.json', encoding='utf-8'))['items']))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Лекарства Rai: $count препаратов из Wikidata [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Выложить сайт
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-hosting.yml --ref "$GITHUB_REF_NAME"
