services:
  - type: web
    name: rai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RAI_ADMIN_TOKEN
        sync: false
      - key: SUPPORT_AI_KEY
        sync: false
      - key: SUPPORT_SITE_URL
        value: "https://rteam.info"
      - key: RAI_SEARCH_URL
        sync: false
