"апи\",\n        \"интерфейс программирования\"\n      ],\n      \"answers\": [\n        \"API — это способ, которым одна программа общается с другой. Например, сайт Rteam отправляет мне POST-запрос с вопросом в JSON, а я возвращаю JSON с ответом.\"\n      ]\n    },\n    {\n      \"id\": \"json\",\n      \"title\": \"Что такое JSON\",\n      \"patterns\": [\n        \"что такое json\",\n        \"json\",\n        \"формат json\"\n      ],\n      \"answers\": [\n        \"**JSON** — текстовый формат обмена данными:\\n\\n```json\\n{\\\"name\\\": \\\"Rai\\\", \\\"version\\\": \\\"pro\\\", \\\"skills\\\": [\\\"calc\\\", \\\"time\\\"]}\\n```\\n\\nВ Python: `json.loads(строка)` и `json.dumps(объект)`.\"\n      ]\n    },\n    {\n      \"id\": \"http_errors\",\n      \"title\": \"Ошибки 404, 500 и другие\",\n      \"patterns\": [\n        \"ошибка 404\",\n        \"ошибка 500\",\n        \"что значит 404\",\n        \"что значит 500\",\n        \"ошибка 403\",\n        \"код ответа сервера\"\n      ],\n      \"answers\": [\n        \"## Коды ответа сервера\\n\\n| Код | Значение |\\n|---|---|\\n| **200** | всё хорошо |\\n| 301 / 302 | перенаправление |\\n| **403** | доступ запрещён |\\n| **404** | страница не найдена |\\n| **500** | ошибка в коде на сервере |\\n| 502 / 503 | сервер недоступен или перегружен |\"\n      ]\n    },\n    {\n      \"id\": \"hosting\",\n      \"title\": \"Сервер и хостинг\",\n      \"patterns\": [\n        \"что такое хостинг\",\n        \"что такое сервер\",\n        \"где разместить сайт\",\n        \"как запустить сайт\",\n        \"домен\"\n      ],\n      \"answers\": [\n        \"Хостинг — это место, где работает ваш сайт. Обычный хостинг подходит для PHP и HTML, для Python-приложений нужен хостинг с поддержкой Python (например, Render, Railway, PythonAnywhere или свой VPS). Домен — это адрес сайта, например rteam.info.\"\n      ]\n    },\n    {\n      \"id\": \"flask\",\n      \"title\": \"Что такое Flask\",\n      \"patterns\": [\n        \"что такое flask\",\n        \"flask\",\n        \"сайт на python\",\n        \"веб сервер на python\"\n      ],\n      \"answers\": [\n        \"**Flask** — лёгкий фреймворк для веб-приложений на Python. Я работаю именно на нём.\\n\\n```python\\nfrom flask import Flask\\napp = Flask(__name__)\\n\\n@app.get(\\\"/\\\")\\ndef home():\\n    return \\\"Привет!\\\"\\n```\"\n      ]\n    },\n    {\n      \"id\": \"ai\",\n      \"title\": \"Что такое искусственный интеллект\",\n      \"patterns\": [\n        \"что такое ии\",\n        \"искусственный интеллект\",\n        \"нейросеть\",\n        \"что такое нейросеть\",\n        \"машинное обучение\",\n        \"ai\"\n      ],\n      \"answers\": [\n        \"Искусственный интеллект — программы, которые решают задачи, требующие «разума»: понимать текст, распознавать картинки, делать выводы. Я — простой ИИ: ищу смысл вопроса в своей базе знаний и применяю встроенные навыки.\"\n      ]\n    },\n    {\n      \"id\": \"algorithm\",\n      \"title\": \"Что такое алгоритм\",\n      \"patterns\": [\n        \"что такое алгоритм\",\n        \"алгоритм\",\n        \"алгоритмы\"\n      ],\n      \"answers\": [\n        \"Алгоритм — точная последовательность шагов для решения задачи. Например, найти максимум в списке: взять первое число, пройти по остальным и запоминать большее.\"\n      ]\n    },\n    {\n      \"id\": \"debug\",\n      \"title\": \"Как искать ошибки в коде\",\n      \"patterns\": [\n        \"как найти ошибку\",\n        \"не работает код\",\n        \"ошибка в коде\",\n        \"баг\",\n        \"отладка\",\n        \"debug\",\n        \"почему не работает\"\n      ],\n      \"answers\": [\n        \"## Как искать ошибку\\n\\n1. Прочитайте текст ошибки **целиком** — там есть файл и строка.\\n2. Выведите значения переменных (`print` / `console.log`).\\n3. Упростите код до минимального примера, где ошибка повторяется.\\n4. Проверьте опечатки, отступы, скобки и кавычки.\\n5. Поищите текст ошибки в интернете.\"\n      ]\n    },\n    {\n      \"id\": \"learn_programming\",\n      \"title\": \"Как научиться программировать\",\n      \"patterns\": [\n        \"как научиться программировать\",\n        \"с чего начать программирование\",\n        \"как стать программистом\",\n        \"какой язык учить\",\n        \"хочу научиться кодить\"\n      ],\n      \"answers\": [\n        \"Совет: начните с **Python** — он простой и универсальный. Для сайтов параллельно изучите **HTML**, **CSS** и **JavaScript**.\\n\\nГлавное — ==практика==: каждый день пишите маленькие программы, делайте свои проекты и выкладывайте их на GitHub.\"\n      ],\n      \"more\": \"## План на первый месяц\\n\\n| Неделя | Что изучить |\\n|---|---|\\n| 1 | переменные, типы, `print`, `input` |\\n| 2 | условия и циклы |\\n| 3 | функции, списки, словари |\\n| 4 | свой маленький проект: бот, игра или сайт |\"\n    },\n    {\n      \"id\": \"security\",\n      \"title\": \"Безопасность аккаунта\",\n      \"patterns\": [\n        \"как защитить аккаунт\",\n        \"надежный пароль\",\n        \"безопасность\",\n        \"взломали аккаунт\",\n        \"как не взломали\"\n      ],\n      \"answers\": [\n        \"## Безопасность аккаунта\\n\\n- Используйте **длинные уникальные пароли** (могу сгенерировать — «сгенерируй пароль»).\\n- Включите **двухфакторную защиту**.\\n- Не переходите по подозрительным ссылкам.\\n- ==Никому не сообщайте коды из SMS.==\"\n      ]\n    },\n    {\n      \"id\": \"news\",\n      \"title\": \"Новости\",\n      \"patterns\": [\n        \"новости\",\n        \"что случилось в мире\",\n        \"последние новости\"\n      ],\n      \"answers\": [\n        \"У меня нет доступа к интернету, поэтому свежих новостей я не знаю. Новости команды смотрите в блоге Rteam.\"\n      ]\n    },\n    {\n      \"id\": \"bot_feelings\",\n      \"title\": \"Чувства Rai\",\n      \"patterns\": [\n        \"ты живой\",\n        \"у тебя есть чувства\",\n        \"ты человек\",\n        \"ты робот\",\n        \"ты умный\"\n      ],\n      \"answers\": [\n        \"Я программа, а не человек, — чувств у меня нет. Но стараюсь быть полезным.\"\n      ]\n    },\n    {\n      \"id\": \"compliment\",\n      \"title\": \"Похвала\",\n      \"patterns\": [\n        \"ты молодец\",\n        \"ты классный\",\n        \"ты крутой\",\n        \"отлично\",\n        \"супер\",\n        \"круто\",\n        \"хорошо ответил\"\n      ],\n      \"answers\": [\n        \"Спасибо{name}! Приятно.\",\n        \"Рад стараться{name}!\"\n      ]\n    },\n    {\n      \"id\": \"insult\",\n      \"title\": \"Грубость\",\n      \"patterns\": [\n        \"ты тупой\",\n        \"дурак\",\n        \"ты глупый\",\n        \"бесполезный\"\n      ],\n      \"answers\": [\n        \"Жаль, что не помог. Попробуйте переформулировать вопрос — или выберите версию Pro Plus / Pro Sun.\"\n      ]\n    },\n    {\n      \"id\": \"ok\",\n      \"title\": \"Согласие\",\n      \"patterns\": [\n        \"ок\",\n        \"окей\",\n        \"ладно\",\n        \"понятно\",\n        \"ясно\",\n        \"хорошо\",\n        \"ага\",\n        \"да\"\n      ],\n      \"answers\": [\n        \"Хорошо. Если будут вопросы — пишите.\",\n        \"Понял. Что дальше?\"\n      ]\n    },\n    {\n      \"id\": \"compare_python_php\",\n      \"title\": \"Python или PHP\",\n      \"patterns\": [\n        \"сравни python и php\",\n        \"python или php\",\n        \"чем python отличается от php\",\n        \"что лучше python или php\",\n        \"php или python\"\n      ],\n      \"answers\": [\n        \"## Python и PHP\\n\\n| | **Python** | **PHP** |\\n|---|---|---|\\n| Где работает | сервер, компьютер, данные, ИИ | сервер сайтов |\\n| Сложность | простой | простой |\\n| Хостинг | нужен с поддержкой Python | есть почти на любом |\\n| Фреймворки | Flask, Django | Laravel, WordPress |\\n| Лучше для | ботов, ИИ, автоматизации | классических сайтов |\\n\\n**Итог:** для сайта на обычном хостинге — PHP, для всего остального — Python.\"\n      ]\n    },\n    {\n      \"id\": \"formatting\",\n      \"title\": \"Форматирование\",\n      \"patterns\": [\n        \"покажи форматирование\",\n        \"пример форматирования\",\n        \"умеешь делать таблицы\",\n        \"сделай таблицу\",\n        \"покажи таблицу\",\n        \"жирный текст\",\n        \"markdown\",\n        \"маркдаун\"\n      ],\n      \"answers\": [\n        \"## Так я умею оформлять ответы\\n\\n**Жирный**, *курсив*, ==выделение==, ~~зачёркнутый~~ и `код`.\\n\\n| Возможность | Как написать |\\n|---|---|\\n| **Жирный** | `**текст**` |\\n| *Курсив* | `*текст*` |\\n| ==Выделение== | `==текст==` |\\n| Таблица | строки через `|` |\\n\\n- списки\\n- и **нумерация**\\n\\n> Любой ответ можно скопировать кнопкой «Копировать» — форматирование сохранится при вставке в Word.\"\n      ]\n    },\n    {\n      \"id\": \"voice\",\n      \"title\": \"Голосовой ввод\",\n      \"patterns\": [\n        \"как говорить голосом\",\n        \"голосовой ввод\",\n        \"можно голосом\",\n        \"микрофон\",\n        \"озвучь\",\n        \"озвучить ответ\"\n      ],\n      \"answers\": [\n        \"Нажмите кнопку с **микрофоном** рядом с полем ввода и говорите — текст появится в поле. Ещё раз нажмите, чтобы остановить. Под каждым ответом есть кнопка **«Озвучить»**.\\n\\nГолосовой ввод работает в Chrome и Edge; браузер попросит разрешить микрофон.\"\n      ]\n    },\n    {\n      \"id\": \"images_help\",\n      \"title\": \"Как попросить картинку\",\n      \"patterns\": [\n        \"какие картинки ты умеешь\",\n        \"что ты умеешь рисовать\",\n        \"ты умеешь рисовать\",\n        \"умеешь делать картинки\",\n        \"как сделать картинку\"\n      ],\n      \"answers\": [\n        \"Я рисую картинки сам, без внешних сервисов. Напишите, например:\\n\\n- «нарисуй **закат над морем**»\\n- «нарисуй **ночной город**»\\n- «нарисуй **зимний лес в горах**»\\n- «нарисуй **космос**»\\n- «нарисуй **красное сердце**»\\n- «сделай **логотип Rteam**»\\n\\nЦвет тоже можно указать: «нарисуй синюю абстракцию».\"\n      ]\n    },\n    {\n      \"id\": \"slides_help\",\n      \"title\": \"Как сделать презентацию\",\n      \"patterns\": [\n        \"как сделать презентацию\",\n        \"ты умеешь делать презентации\",\n        \"умеешь делать слайды\"\n      ],\n      \"answers\": [\n        \"Напишите «сделай презентацию про …» — например **«сделай презентацию про Python»**. Я соберу слайды из своей базы знаний. Презентацию можно смотреть на весь экран и скачать. Если темы нет в базе, сделаю шаблон для заполнения.\"\n      ]\n    }\n  ]\n}", "glossary.json": "{\n \"terms\": [\n  {\n   \"terms\": [\n    \"компьютер\",\n    \"пк\",\n    \"эвм\"\n   ],\n   \"text\": \"**Компьютер** — устройство, которое выполняет программы: принимает данные, обрабатывает их и выдаёт результат. Основные части: процессор, оперативная память, накопитель, видеокарта.\"\n  },\n  {\n   \"terms\": [\n    \"процессор\",\n    \"cpu\",\n    \"цп\"\n   ],\n   \"text\": \"**Процессор** (CPU) — «мозг» компьютера: выполняет команды программ. Скорость зависит от частоты (ГГц), числа ядер и архитектуры.\"\n  },\n  {\n   \"terms\": [\n    \"видеокарта\",\n    \"gpu\",\n    \"графический процессор\"\n   ],\n   \"text\": \"**Видеокарта** (GPU) — отвечает за вывод изображения и быстрые параллельные вычисления: игры, 3D, обучение нейросетей.\"\n  },\n  {\n   \"terms\": [\n    \"оперативная память\",\n    \"озу\",\n    \"ram\",\n    \"оперативка\"\n   ],\n   \"text\": \"**Оперативная память** (ОЗУ, RAM) — быстрая временная память, где лежат запущенные программы. После выключения очищается.\"\n  },\n  {\n   \"terms\": [\n    \"жесткий диск\",\n    \"hdd\",\n    \"ssd\",\n    \"накопитель\"\n   ],\n   \"text\": \"**Накопитель** (HDD или SSD) — постоянная память для файлов. SSD намного быстрее HDD, потому что в нём нет движущихся частей.\"\n  },\n  {\n   \"terms\": [\n    \"операционная система\",\n    \"ос\"\n   ],\n   \"text\": \"**Операционная система** — главная программа компьютера: управляет железом, файлами и запускает остальные программы. Примеры: Windows, Linux, macOS, Android.\"\n  },\n  {\n   \"terms\": [\n    \"интернет\"\n   ],\n   \"text\": \"**Интернет** — всемирная сеть компьютеров, которые обмениваются данными по общим правилам (протоколам TCP/IP). Сайты, почта, мессенджеры работают через интернет.\"\n  },\n  {\n   \"terms\": [\n    \"браузер\"\n   ],\n   \"text\": \"**Браузер** — программа для просмотра сайтов: Chrome, Edge, Firefox, Safari. Он загружает HTML, CSS и JavaScript и показывает страницу.\"\n  },\n  {\n   \"terms\": [\n    \"сайт\",\n    \"веб сайт\",\n    \"вебсайт\"\n   ],\n   \"text\": \"**Сайт** — набор веб-страниц по одному адресу (домену). Страницы пишут на HTML, CSS и JavaScript, а сервер может работать на PHP, Python и других языках.\"\n  },\n  {\n   \"terms\": [\n    \"домен\",\n    \"доменное имя\"\n   ],\n   \"text\": \"**Домен** — понятный адрес сайта, например `rteam.info`. Система DNS переводит его в IP-адрес сервера.\"\n  },\n  {\n   \"terms\": [\n    \"ip адрес\",\n    \"ip\"\n   ],\n   \"text\": \"**IP-адрес** — числовой адрес устройства в сети, например `192.168.0.1` (IPv4) или длинный IPv6.\"\n  },\n  {\n   \"terms\": [\n    \"dns\"\n   ],\n   \"text\": \"**DNS** — «телефонная книга» интернета: переводит домены (rteam.info) в IP-адреса серверов.\"\n  },\n  {\n   \"terms\": [\n    \"облако\",\n    \"облачные технологии\",\n    \"облачное хранилище\"\n   ],\n   \"text\": \"**Облако** — хранение данных и запуск программ на чужих серверах через интернет: Google Диск, Яндекс Диск, облачные хостинги.\"\n  },\n  {\n   \"terms\": [\n    \"программа\",\n    \"приложение\",\n    \"софт\"\n   ],\n   \"text\": \"**Программа** — набор инструкций для компьютера. Приложение — программа для пользователя: браузер, игра, мессенджер.\"\n  },\n  {\n   \"terms\": [\n    \"программирование\",\n    \"кодинг\"\n   ],\n   \"text\": \"**Программирование** — создание программ: человек пишет код на языке программирования, а компьютер его выполняет.\"\n  },\n  {\n   \"terms\": [\n    \"язык программирования\"\n   ],\n   \"text\": \"**Язык программирования** — формальный язык для записи программ. Популярные: Python, JavaScript, Java, C++, C#, PHP, Go.\"\n  },\n  {\n   \"terms\": [\n    \"нейросеть\",\n    \"нейронная сеть\"\n   ],\n   \"text\": \"**Нейросеть** — программа, которая учится на примерах: распознаёт картинки, речь, текст. Состоит из «слоёв» простых вычислительных элементов.\"\n  },\n  {\n   \"terms\": [\n    \"машинное обучение\",\n    \"ml\"\n   ],\n   \"text\": \"**Машинное обучение** — раздел ИИ, где программа находит закономерности в данных сама, а не по заранее написанным правилам.\"\n  },\n  {\n   \"terms\": [\n    \"робот\"\n   ],\n   \"text\": \"**Робот** — машина, которая выполняет действия автоматически по программе: заводские манипуляторы, роботы-пылесосы, марсоходы.\"\n  },\n  {\n   \"terms\": [\n    \"блокчейн\"\n   ],\n   \"text\": \"**Блокчейн** — цепочка записей (блоков), которую хранят много компьютеров сразу, поэтому её трудно подделать. На нём работают криптовалюты.\"\n  },\n  {\n   \"terms\": [\n    \"криптовалюта\",\n    \"биткоин\",\n    \"bitcoin\"\n   ],\n   \"text\": \"**Криптовалюта** — цифровые деньги на блокчейне без центрального банка. Самая известная — биткоин.\"\n  },\n  {\n   \"terms\": [\n    \"вирус компьютерный\",\n    \"компьютерный вирус\",\n    \"вредоносная программа\",\n    \"малварь\"\n   ],\n   \"text\": \"**Компьютерный вирус** — вредная программа, которая сама распространяется и может красть данные или портить файлы. Защита: антивирус, обновления, осторожность со ссылками.\"\n  },\n  {\n   \"terms\": [\n    \"антивирус\"\n   ],\n   \"text\": \"**Антивирус** — программа, которая находит и удаляет вредоносные программы.\"\n  },\n  {\n   \"terms\": [\n    \"хакер\"\n   ],\n   \"text\": \"**Хакер** — специалист, который глубоко разбирается в компьютерах и сетях. «Белые» хакеры ищут уязвимости, чтобы их закрыть, «чёрные» — взламывают ради выгоды.\"\n  },\n  {\n   \"terms\": [\n    \"пароль\"\n   ],\n   \"text\": \"**Пароль** — секретная строка для входа в аккаунт. Надёжный пароль — длинный (от 12 символов), уникальный, с буквами, цифрами и знаками.\"\n  },\n  {\n   \"terms\": [\n    \"wi fi\",\n    \"wifi\",\n    \"вайфай\"\n   ],\n   \"text\": \"**Wi-Fi** — беспроводная сеть: устройства подключаются к роутеру по радио и через него выходят в интернет.\"\n  },\n  {\n   \"terms\": [\n    \"роутер\",\n    \"маршрутизатор\"\n   ],\n   \"text\": \"**Роутер** — устройство, которое раздаёт интернет в доме и связывает устройства в одну сеть.\"\n  },\n  {\n   \"terms\": [\n    \"смартфон\",\n    \"телефон\"\n   ],\n   \"text\": \"**Смартфон** — мобильный телефон с полноценной операционной системой (Android или iOS), приложениями и интернетом.\"\n  },\n  {\n   \"terms\": [\n    \"игра\",\n    \"видеоигра\",\n    \"геймдев\"\n   ],\n   \"text\": \"**Видеоигра** — интерактивная программа для развлечения. Игры делают на движках Unity, Unreal Engine, Godot.\"\n  },\n  {\n   \"terms\": [\n    \"unity\"\n   ],\n   \"text\": \"**Unity** — популярный движок для игр на C#: 2D, 3D, мобильные и VR-игры.\"\n  },\n  {\n   \"terms\": [\n    \"minecraft\",\n    \"майнкрафт\"\n   ],\n   \"text\": \"**Minecraft** — игра-песочница из блоков: можно строить, выживать, играть с друзьями. Написана на Java, моды тоже часто пишут на Java.\"\n  },\n  {\n   \"terms\": [\n    \"linux\",\n    \"линукс\"\n   ],\n   \"text\": \"**Linux** — бесплатная операционная система с открытым кодом. На ней работает большинство серверов и Android.\"\n  },\n  {\n   \"terms\": [\n    \"github\",\n    \"гитхаб\"\n   ],\n   \"text\": \"**GitHub** — сайт для хранения кода в Git-репозиториях и совместной работы: pull request, issues, GitHub Pages.\"\n  },\n  {\n   \"terms\": [\n    \"баг\",\n    \"ошибка в программе\"\n   ],\n   \"text\": \"**Баг** — ошибка в программе, из-за которой она работает не так, как задумано. Поиск и исправление багов называется отладкой.\"\n  },\n  {\n   \"terms\": [\n    \"фреймворк\"\n   ],\n   \"text\": \"**Фреймворк** — готовый каркас для программ, в который вы добавляете свой код: Flask и Django (Python), Laravel (PHP), React (JavaScript).\"\n  },\n  {\n   \"terms\": [\n    \"библиотека программная\",\n    \"библиотека кода\"\n   ],\n   \"text\": \"**Библиотека** в программировании — готовый код, который можно подключить к своей программе, чтобы не писать всё с нуля.\"\n  },\n  {\n   \"terms\": [\n    \"сервер\"\n   ],\n   \"text\": \"**Сервер** — компьютер или программа, которые круглосуточно отвечают на запросы других: отдают сайты, хранят данные, обрабатывают сообщения.\"\n  },\n  {\n   \"terms\": [\n    \"хостинг\"\n   ],\n   \"text\": \"**Хостинг** — услуга размещения сайта на сервере, чтобы он был доступен в интернете.\"\n  },\n  {\n   \"terms\": [\n    \"атом\"\n   ],\n   \"text\": \"**Атом** — мельчайшая частица химического элемента. Состоит из ядра (протоны и нейтроны) и электронов вокруг него.\"\n  },\n  {\n   \"terms\": [\n    \"молекула\"\n   ],\n   \"text\": \"**Молекула** — несколько атомов, связанных вместе. Например, молекула воды H₂O — два атома водорода и один кислорода.\"\n  },\n  {\n   \"terms\": [\n    \"электрон\"\n   ],\n   \"text\": \"**Электрон** — отрицательно заряженная частица атома. Поток электронов — это электрический ток.\"\n  },\n  {\n   \"terms\": [\n    \"гравитация\",\n    \"сила тяжести\",\n    \"притяжение\"\n   ],\n   \"text\": \"**Гравитация** — притяжение между телами, у которых есть масса. Из-за неё предметы падают на Землю, а планеты вращаются вокруг Солнца.\"\n  },\n  {\n   \"terms\": [\n    \"фотосинтез\"\n   ],\n   \"text\": \"**Фотосинтез** — процесс, при котором растения с помощью света превращают углекислый газ и воду в сахар и кислород.\"\n  },\n  {\n   \"terms\": [\n    \"днк\"\n   ],\n   \"text\": \"**ДНК** — молекула, в которой записана наследственная информация живого организма: «инструкция» для строительства клеток.\"\n  },\n  {\n   \"terms\": [\n    \"клетка\"\n   ],\n   \"text\": \"**Клетка** — самая маленькая живая единица. Все организмы состоят из клеток: бактерия — из одной, человек — из десятков триллионов.\"\n  },\n  {\n   \"terms\": [\n    \"вирус\",\n    \"вирусы\"\n   ],\n   \"text\": \"**Вирус** (в биологии) — крошечная частица, которая размножается только внутри клеток других организмов. Вызывает грипп, ОРВИ и другие болезни.\"\n  },\n  {\n   \"terms\": [\n    \"бактерия\",\n    \"бактерии\"\n   ],\n   \"text\": \"**Бактерии** — одноклеточные микроорганизмы. Многие полезны (например, в кишечнике), некоторые вызывают болезни.\"\n  },\n  {\n   \"terms\": [\n    \"солнце\"\n   ],\n   \"text\": \"**Солнце** — звезда в центре нашей Солнечной системы. Это огромный шар горячего газа, свет от него идёт до Земли около 8 минут.\"\n  },\n  {\n   \"terms\": [\n    \"луна\"\n   ],\n   \"text\": \"**Луна** — естественный спутник Земли. Находится примерно в 384 000 км, освещена Солнцем, поэтому видны её фазы.\"\n  },\n  {\n   \"terms\": [\n    \"земля планета\",\n    \"планета земля\",\n    \"земля\"\n   ],\n   \"text\": \"**Земля** — третья планета от Солнца и единственная известная планета с жизнью. Один оборот вокруг Солнца — год, вокруг своей оси — сутки.\"\n  },\n  {\n   \"terms\": [\n    \"солнечная система\"\n   ],\n   \"text\": \"**Солнечная система** — Солнце и всё, что вокруг него вращается: 8 планет (Меркурий, Венера, Земля, Марс, Юпитер, Сатурн, Уран, Нептун), спутники, астероиды, кометы.\"\n  },\n  {\n   \"terms\": [\n    \"марс\"\n   ],\n   \"text\": \"**Марс** — четвёртая планета от Солнца, «красная планета». Холодная, с тонкой атмосферой; там работают марсоходы.\"\n  },\n  {\n   \"terms\": [\n    \"юпитер\"\n   ],\n   \"text\": \"**Юпитер** — самая большая планета Солнечной системы, газовый гигант с Большим красным пятном — огромным штормом.\"\n  },\n  {\n   \"terms\": [\n    \"звезда\"\n   ],\n   \"text\": \"**Звезда** — огромный раскалённый газовый шар, который светится за счёт термоядерных реакций. Солнце — ближайшая к нам звезда.\"\n  },\n  {\n   \"terms\": [\n    \"черная дыра\"\n   ],\n   \"text\": \"**Чёрная дыра** — область космоса с такой сильной гравитацией, что даже свет не может её покинуть.\"\n  },\n  {\n   \"terms\": [\n    \"галактика\",\n    \"млечный путь\"\n   ],\n   \"text\": \"**Галактика** — огромное скопление звёзд, газа и пыли. Наша галактика — Млечный Путь, в ней сотни миллиардов звёзд.\"\n  },\n  {\n   \"terms\": [\n    \"энергия\"\n   ],\n   \"text\": \"**Энергия** — способность совершать работу. Бывает механическая, тепловая, электрическая, химическая; переходит из одного вида в другой.\"\n  },\n  {\n   \"terms\": [\n    \"электричество\",\n    \"электрический ток\",\n    \"ток\"\n   ],\n   \"text\": \"**Электрический ток** — направленное движение заряженных частиц (обычно электронов) по проводнику.\"\n  },\n  {\n   \"terms\": [\n    \"климат\"\n   ],\n   \"text\": \"**Климат** — многолетний характерный режим погоды в местности. Погода — то, что сейчас; климат — то, что обычно.\"\n  },\n  {\n   \"terms\": [\n    \"глобальное потепление\",\n    \"изменение климата\"\n   ],\n   \"text\": \"**Глобальное потепление** — рост средней температуры Земли, в основном из-за выбросов парниковых газов от сжигания топлива.\"\n  },\n  {\n   \"terms\": [\n    \"эволюция\"\n   ],\n   \"text\": \"**Эволюция** — постепенное изменение живых организмов через поколения. Главный механизм — естественный отбор.\"\n  },\n  {\n   \"terms\": [\n    \"динозавры\",\n    \"динозавр\"\n   ],\n   \"text\": \"**Динозавры** — древние пресмыкающиеся, жившие примерно 230–66 млн лет назад. Птицы — их прямые потомки.\"\n  },\n  {\n   \"terms\": [\n    \"математика\"\n   ],\n   \"text\": \"**Математика** — наука о числах, формах, закономерностях и логике. Основа физики, программирования и экономики.\"\n  },\n  {\n   \"terms\": [\n    \"число пи\",\n    \"пи\"\n   ],\n   \"text\": \"**Число π (пи)** ≈ 3,14159 — отношение длины окружности к её диаметру. Его цифры никогда не заканчиваются и не повторяются.\"\n  },\n  {\n   \"terms\": [\n    \"теорема пифагора\",\n    \"пифагор\"\n   ],\n   \"text\": \"**Теорема Пифагора**: в прямоугольном треугольнике квадрат гипотенузы равен сумме квадратов катетов: `c² = a² + b²`.\"\n  },\n  {\n   \"terms\": [\n    \"процент\",\n    \"проценты\"\n   ],\n   \"text\": \"**Процент** — сотая часть числа. 20% от 350 = 350 × 20 / 100 = 70. Можете спросить меня: «20% от 350».\"\n  },\n  {\n   \"terms\": [\n    \"дробь\",\n    \"дроби\"\n   ],\n   \"text\": \"**Дробь** — часть целого, записывается как `a/b`: числитель сверху, знаменатель снизу. ½ — половина.\"\n  },\n  {\n   \"terms\": [\n    \"уравнение\"\n   ],\n   \"text\": \"**Уравнение** — равенство с неизвестным, которое нужно найти. Например, `2x + 3 = 7`, откуда `x = 2`.\"\n  },\n  {\n   \"terms\": [\n    \"функция математика\",\n    \"математическая функция\"\n   ],\n   \"text\": \"**Функция** в математике — правило, по которому каждому x соответствует одно значение y, например `y = 2x + 1`.\"\n  },\n  {\n   \"terms\": [\n    \"физика\"\n   ],\n   \"text\": \"**Физика** — наука о природе: движении, силах, энергии, свете, электричестве, строении вещества.\"\n  },\n  {\n   \"terms\": [\n    \"химия\"\n   ],\n   \"text\": \"**Химия** — наука о веществах, их составе и превращениях (химических реакциях).\"\n  },\n  {\n   \"terms\": [\n    \"биология\"\n   ],\n   \"text\": \"**Биология** — наука о живых организмах: как они устроены, живут, размножаются и эволюционируют.\"\n  },\n  {\n   \"terms\": [\n    \"история\"\n   ],\n   \"text\": \"**История** — наука о прошлом человечества: событиях, людях, государствах и культуре.\"\n  },\n  {\n   \"terms\": [\n    \"география\"\n   ],\n   \"text\": \"**География** — наука о Земле: материках, странах, климате, природе и населении.\"\n  },\n  {\n   \"terms\": [\n    \"грамматика\"\n   ],\n   \"text\": \"**Грамматика** — правила языка: как изменяются слова и как из них строятся предложения.\"\n  },\n  {\n   \"terms\": [\n    \"существительное\"\n   ],\n   \"text\": \"**Существительное** — часть речи, обозначающая предмет и отвечающая на вопросы «кто?» или «что?»: стол, дом, Rai.\"\n  },\n  {\n   \"terms\": [\n    \"глагол\"\n   ],\n   \"text\": \"**Глагол** — часть речи, обозначающая действие: бежать, писать, думает.\"\n  },\n  {\n   \"terms\": [\n    \"прилагательное\"\n   ],\n   \"text\": \"**Прилагательное** — часть речи, обозначающая признак предмета: красный, быстрый, умный.\"\n  },\n  {\n   \"terms\": [\n    \"экономика\"\n   ],\n   \"text\": \"**Экономика** — как люди, компании и государства производят, распределяют и тратят ресурсы и деньги.\"\n  },\n  {\n   \"terms\": [\n    \"деньги\"\n   ],\n   \"text\": \"**Деньги** — средство обмена и измерения стоимости. Сейчас в основном безналичные: карты, переводы.\"\n  },\n  {\n   \"terms\": [\n    \"инфляция\"\n   ],\n   \"text\": \"**Инфляция** — рост цен со временем: на те же деньги можно купить меньше.\"\n  },\n  {\n   \"terms\": [\n    \"бизнес\"\n   ],\n   \"text\": \"**Бизнес** — деятельность ради прибыли: продажа товаров или услуг.\"\n  },\n  {\n   \"terms\": [\n    \"стартап\"\n   ],\n   \"text\": \"**Стартап** — молодая компания, которая быстро проверяет новую идею продукта и стремится быстро расти.\"\n  },\n  {\n   \"terms\": [\n    \"демократия\"\n   ],\n   \"text\": \"**Демократия** — форма правления, при которой власть принадлежит народу и выбирается на выборах.\"\n  },\n  {\n   \"terms\": [\n    \"музыка\"\n   ],\n   \"text\": \"**Музыка** — искусство звуков: мелодия, ритм и гармония. Музыку тоже можно программировать — например, в Sonic Pi.\"\n  },\n  {\n   \"terms\": [\n    \"спорт\"\n   ],\n   \"text\": \"**Спорт** — физическая активность с правилами и соревнованием. Регулярные тренировки полезны для здоровья и настроения.\"\n  },\n  {\n   \"terms\": [\n    \"здоровье\",\n    \"здоровый образ жизни\",\n    \"зож\"\n   ],\n   \"text\": \"**Здоровый образ жизни**: сон 7–9 часов, движение ка     flush();
    return out.join("");
  }
  function plainText(md) {
    return String(md || "")
      .replace(/```[\s\S]*?```/g, " (пример кода) ")
      .replace(/^\|?\s*:?-{2,}.*$/gm, "")
      .replace(/[|*#=`~>]/g, " ")
      .replace(/\s+/g, " ").trim();
  }

  // ---------------------------------------------------------------- копирование
  async function copyRich(md, html, el) {
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        await navigator.clipboard.write([new ClipboardItem({
          "text/plain": new Blob([md], {type: "text/plain"}),
          "text/html": new Blob([html], {type: "text/html"})
        })]);
      } else {
        await navigator.clipboard.writeText(md);
      }
      toast("Скопировано");
    } catch (e) {
      try { await navigator.clipboard.writeText(md); toast("Скопировано"); }
      catch (_) {
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
        toast("Текст выделен — нажмите Ctrl+C");
      }
    }
  }

  // ---------------------------------------------------------------- озвучка
  let speakingBtn = null;
  function speak(text, btn) {
    if (!("speechSynthesis" in window)) { toast("Этот браузер не умеет озвучивать текст"); return; }
    const was = speakingBtn;
    speechSynthesis.cancel();
    if (was) { was.innerHTML = icon("speak") + "Озвучить"; speakingBtn = null; if (was === btn) return; }
    const u = new SpeechSynthesisUtterance(plainText(text));
    u.lang = "ru-RU";
    const ru = speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("ru"));
    if (ru) u.voice = ru;
    u.onend = u.onerror = () => { if (speakingBtn === btn) { btn.innerHTML = icon("speak") + "Озвучить"; speakingBtn = null; } };
    speakingBtn = btn;
    btn.innerHTML = icon("stop") + "Стоп";
    speechSynthesis.speak(u);
  }

  // ---------------------------------------------------------------- голосовой ввод
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recording = false;
  function setMic(on) {

    $("listening").hidden = !on;

  $("mic").addEventListener("click", () => {
    if (!SR) { toast("Голосовой ввод работает в Chrome и Edge"); return; }

    rec = new SR();
    rec.lang = "ru-RU";
    rec.interimResults = true;
    rec.continuous = true;
    const base = input.value.trim() ? input.value.trimEnd() + " " : "";
    rec.onresult = (e) => {
      let text = "";
      for (let k = 0; k < e.results.length; k++) text += e.results[k][0].transcript;
      input.value = base + text;

        "no-speech": "Не слышно речи. Попробуйте ещё раз.",
        "audio-capture": "Микрофон не найден.",

  // ---------------------------------------------------------------- чаты
  let chats = [], currentId = null, lastVersion = TOP_VERSION;
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({chats: chats, current: currentId, version: lastVersion, quasar: 1})); }
    catch (e) { toast("В браузере не хватает места — удалите старые чаты"); }
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (d && Array.isArray(d.chats)) {
        chats = d.chats.filter((c) => c && c.id && Array.isArray(c.messages));
        currentId = d.current;
        // Новые чаты — на самой сильной версии (один раз переключаем тех, кто был до Quasar)
        lastVersion = d.quasar ? d.version || lastVersion : TOP_VERSION;
      }
    } catch (e) { /* начнём с чистого листа */ }
    if (!chats.length) chats.push(makeChat());
    if (!chats.some((c) => c.id === currentId)) currentId = chats[0].id;

  function makeChat() {

    const c = makeChat();
    chats.unshift(c);

      `<figcaption>${esc(a.title || "")}` +

  function renderImage(a) {
    const fig = document.createElement("figure");
    fig.className = "art";
    fig.innerHTML = `<img alt="${esc(a.title || "Картинка")}" src="${svgUrl(a.svg)}">` +
      `<div class="actions"><button class="icon-btn png" type="button">${icon("down")}PNG</button>` +
      `<button class="icon-btn svg" type="button">${icon("down")}SVG</button>` +

      `<span class="meta">${esc(a.title || "")}</span></div>`;

    img.addEventListener("click", full);

      const pic = new Image();

      };

  // ---------------------------------------------------------------- презентация
  const HEX = /^#[0-9a-f]{6}$/i;
  function themeVars(t) {
    if (!t) return "";
    const v = [];
    for (const [k, name] of [["bg", "bg"], ["fg", "fg"], ["accent", "accent"], ["accent2", "accent2"], ["muted", "muted"],
                             ["surface", "surface"], ["line", "line"], ["on_accent", "on"]]) {
      if (HEX.test(t[k] || "")) v.push(`--s-${name}:${t[k]}`);
    }
    if (HEX.test(t.bg || "")) v.push(`--s-bg-a:${t.bg}8c`);
    if (HEX.test(t.accent || "")) v.push(`--s-soft:${t.accent}59`);
    return v.join(";");
  }
  function slideHTML(s, n, total, dir, theme) {
    const num = `<div class="num">${n} / ${total}</div>`;
    const t = esc(s.transition || "fade");
    const cls = `slide play t-${t}`;
    const attrs = ` data-t="${t}" style="--dir:${dir || 1};${themeVars(theme)}"`;
    const pic = (c) => s.image ? `<img class="${c}" alt="" src="${svgUrl(s.image)}">` : "";
    const items = (list, tag) => (list || []).map((x, i) => `<${tag} style="--i:${i}">` + (tag === "div" ? `<b>${i + 1}</b><span>${inline(x)}</span>` : tag === "li" && s.kind === "agenda" ? `<b>${String(i + 1).padStart(2, "0")}</b><span>${inline(x)}</span>` : inline(x)) + `</${tag}>`).join("");
    const kicker = `<div class="kicker">${String(n).padStart(2, "0")}</div>`;
    switch (s.kind) {
      case "title":
        return `<section class="${cls} cover"${attrs}>${pic("bg")}<div class="kicker">Презентация</div><h1>${esc(s.title)}</h1>` +
          (s.subtitle ? `<div class="sub">${esc(s.subtitle)}</div>` : "") + `${num}</section>`;
      case "end":
        return `<section class="${cls} end"${attrs}>${pic("bg")}<h1>${esc(s.title)}</h1><div class="sub">${esc(s.subtitle || "")}</div>${num}</section>`;
      case "photo":
        if (!/^https:\/\//.test(s.photo || "")) break;
        return `<section class="${cls} photo"${attrs}><img class="bg" alt="" src="${esc(s.photo)}" referrerpolicy="no-referrer" onerror="this.remove()">` +
          `<div class="cap"><div class="kicker">${String(n).padStart(2, "0")}</div><h2>${esc(s.title || "")}</h2>` +
          (s.caption ? `<div class="sub">${esc(s.caption)}</div>` : "") + `</div>${num}</section>`;
      case "agenda":
        return `<section class="${cls}"${attrs}>${kicker}<h2>${esc(s.title || "План")}</h2><ol class="agenda">${items(s.items, "li")}</ol>${num}</section>`;
      case "summary":
        return `<section class="${cls}"${attrs}>${kicker}<h2>${esc(s.title || "Главное")}</h2><div class="cards">` +
          (s.items || []).map((x, i) => `<div class="card" style="--i:${i}"><b>${i + 1}</b><span>${inline(x)}</span></div>`).join("") + `</div>${num}</section>`;
      case "fact": {
        const body = `<p class="fact">${inline(s.text || "")}</p>`;
        return `<section class="${cls}"${attrs}>${kicker}<h2>${esc(s.title || "")}</h2>` +
          (s.image ? `<div class="cols">${body}${pic("side")}</div>` : body) + `${num}</section>`;
      }
      case "code":
        return `<section class="${cls}"${attrs}>${kicker}<h2>${esc(s.title || "")}</h2><pre><code>${esc(s.code || "")}</code></pre>${num}</section>`;
      case "table": {
        const [head, ...rows] = s.rows && s.rows.length ? s.rows : [[]];
        return `<section class="${cls}"${attrs}>${kicker}<h2>${esc(s.title || "")}</h2><table><thead><tr>` +
          head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
          rows.map((r) => "<tr>" + head.map((_, k) => "<td>" + inline(r[k] || "") + "</td>").join("") + "</tr>").join("") +
          `</tbody></table>${num}</section>`;
      }
    }
    let body = `<ul>${items(s.bullets, "li")}</ul>`;
    if (s.image) body = `<div class="cols${s.side === "left" ? " left" : ""}">${body}${pic("side")}</div>`;
    return `<section class="${cls}"${attrs}>${kicker}<h2>${esc(s.title || "")}</h2>${body}${num}</section>`;
  }
  function renderDeck(a) {
    const deck = document.createElement("div");
    deck.className = "deck";
    deck.innerHTML = `<div class="stage" tabindex="0" aria-label="Слайды: нажмите или используйте стрелки"></div>` +
      `<div class="deck-bar actions">` +
      `<button class="icon-btn prev" type="button" aria-label="Предыдущий слайд">${icon("left")}</button>` +
      `<span class="count"></span>` +
      `<button class="icon-btn next" type="button" aria-label="Следующий слайд">${icon("right")}</button>` +
      `<span class="spacer"></span>` +
      `<button class="icon-btn full" type="button">${icon("full")}На весь экран</button>` +
      `<button class="icon-btn dl" type="button">${icon("down")}HTML</button>` +
      `<button class="icon-btn zip" type="button">${icon("zip")}ZIP</button></div>`;
    const stage = deck.querySelector(".stage");
    if (a.theme && HEX.test(a.theme.bg || "")) stage.style.background = a.theme.bg;
    let k = 0;
    const total = a.slides.length;
    const show = (dir) => {
      stage.innerHTML = slideHTML(a.slides[k], k + 1, total, dir, a.theme);
      deck.querySelector(".count").textContent = (k + 1) + " / " + total;
    };
    const go = (d) => {
      const next = Math.max(0, Math.min(total - 1, k + d));
      if (next === k) return;
      k = next; show(d < 0 ? -1 : 1);
    };
    deck.querySelector(".prev").addEventListener("click", () => go(-1));
    deck.querySelector(".next").addEventListener("click", () => go(1));
    let x0 = null;
    stage.addEventListener("pointerdown", (e) => { x0 = e.clientX; });
    stage.addEventListener("pointerup", (e) => {
      if (x0 === null) return;
      const dx = e.clientX - x0;
      x0 = null;
      go(Math.abs(dx) > 40 ? (dx < 0 ? 1 : -1) : 1);
    });
    stage.addEventListener("dblclick", (e) => e.preventDefault());
    stage.addEventListener("keydown", (e) => {
      if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(1); }
      if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
      if (e.key === "Home") { e.preventDefault(); k = 0; show(-1); }
      if (e.key === "End") { e.preventDefault(); k = total - 1; show(1); }
    });
    deck.querySelector(".full").addEventListener("click", () => {
      (stage.requestFullscreen ? stage.requestFullscreen() : Promise.reject()).then(() => stage.focus()).catch(() => toast("Полный экран недоступен"));
    });
    deck.querySelector(".dl").addEventListener("click", () =>
      download(safeName(a.title) + ".html", new Blob([deckFile(a)], {type: "text/html"})));
    deck.querySelector(".zip").addEventListener("click", () =>
      download(safeName(a.title) + ".zip", makeZip(deckFiles(a, ""))));
    show();
    return deck;
  }
  function deckFile(a) {

    const css = $("slide-css").textContent;
    const bg = a.theme && HEX.test(a.theme.bg || "") ? a.theme.bg : "#000";
    return `<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(a.title)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">

.deck .slide *{animation:none!important}}</style></head><body><div class="deck">${slides}</div><div class="bar"></div>
<script>var s=document.querySelectorAll('.slide'),k=0,bar=document.querySelector('.bar'),x0=null;
function show(d){s.forEach(function(e,i){var on=i===k;e.classList.toggle('on',on);if(on){e.classList.remove('play','t-'+e.dataset.t);e.style.setProperty('--dir',d||1);void e.offsetWidth;e.classList.add('play','t-'+e.dataset.t)}});bar.style.width=((k+1)/s.length*100)+'%'}
function go(d){var n=Math.max(0,Math.min(s.length-1,k+d));if(n!==k){k=n;show(d)}}
document.addEventListener('keydown',function(e){if(['ArrowRight','PageDown',' ','Enter'].indexOf(e.key)>=0)go(1);if(['ArrowLeft','PageUp','Backspace'].indexOf(e.key)>=0)go(-1);if(e.key==='Home'){k=0;show(-1)}if(e.key==='End'){k=s.length-1;show(1)}if(e.key==='f'&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()});
document.addEventListener('pointerdown',function(e){x0=e.clientX});
document.addEventListener('pointerup',function(e){if(x0===null)return;var dx=e.clientX-x0;x0=null;go(Math.abs(dx)>40?(dx<0?1:-1):1)});show();<\/script></body></html>`;
  }
  // Файлы презентации для ZIP: сама презентация + картинки слайдов отдельными SVG
  function deckFiles(a, dir) {
    const files = [{name: dir + safeName(a.title) + ".html", data: deckFile(a)}];
    a.slides.forEach((s, n) => {
      if (s.image) files.push({name: dir + "картинки/слайд-" + String(n + 1).padStart(2, "0") + ".svg", data: s.image});
    });
    return files;
  }

  // ---------------------------------------------------------------- код в ответе
  function renderCode(a) {
    const box = document.createElement("div");
    box.className = "code-att";
    const lang = a.lang || "text";
    const name = a.filename || "main." + (EXT_OF[lang] || "txt");
    box.innerHTML = `<div class="codeblock"><div class="codehead"><span>${esc(name)} · ${esc(LANG_NAME[lang] || lang)}</span><span class="acts">` +
      `<button class="icon-btn open-code" type="button">${icon("code")}Открыть в Code</button>` +
      `<button class="icon-btn dl" type="button">${icon("down")}Скачать</button>` +
      `<button class="icon-btn cp" type="button">${icon("copy")}Копировать</button></span></div>` +
      `<pre><code>${hl(a.code, lang)}</code></pre></div>`;
    box.querySelector(".open-code").addEventListener("click", () => openInCode(name, a.code));
    box.querySelector(".dl").addEventListener("click", () => download(name, new Blob([a.code], {type: "text/plain;charset=utf-8"})));
    box.querySelector(".cp").addEventListener("click", () => copyRich(a.code, "<pre>" + esc(a.code) + "</pre>", box.querySelector("code")));
    return box;
  }

  // ---------------------------------------------------------------- архив чата
  function archiveFiles(chat) {
    const files = [], used = new Set();
    const put = (name, data) => {
      let n = name, k = 2;
      while (used.has(n)) n = name.replace(/(\.[^./]+)?$/, "-" + (k++) + "$1");
      used.add(n);
      files.push({name: n, data: data});
      return n;
    };
    const md = ["# " + chat.title, "", "Экспорт из Rai · " + new Date().toLocaleString("ru-RU"), ""];
    let pics = 0;
    for (const m of chat.messages) {
      if (m.role === "user") { md.push("**Вы:** " + m.text, ""); continue; }
      md.push("**Rai:** " + m.text, "");
      for (const a of m.attachments || []) {
        if (a.type === "image" && a.svg) md.push("🖼 " + put("картинки/" + String(++pics).padStart(2, "0") + "-" + safeName(a.title) + ".svg", a.svg), "");
        if (a.type === "photo" && a.url) md.push("📷 [" + (a.title || "Фото") + "](" + a.url + ")", "");
        if (a.type === "code" && a.code) md.push("💾 " + put("код/" + (a.filename || "main.txt"), a.code), "");
        if (a.type === "slides" && Array.isArray(a.slides)) {
          const dir = "презентации/" + safeName(a.title) + "/";
          for (const f of deckFiles(a, dir)) put(f.name, f.data);
          md.push("📊 " + dir + safeName(a.title) + ".html", "");
        }
      }
    }
    files.unshift({name: "чат.md", data: md.join("\n")});
    return files;
  }
  function renderArchive(a, chat) {
    const box = document.createElement("div");
    box.className = "archive";
    const count = (type) => chat.messages.reduce((n, m) => n + (m.attachments || []).filter((x) => x.type === type).length, 0);
    const parts = [chat.messages.length + " сообщ."];
    if (count("image")) parts.push(count("image") + " карт.");
    if (count("slides")) parts.push(count("slides") + " презент.");
    if (count("code")) parts.push(count("code") + " файл(ов) кода");
    box.innerHTML = `<div class="zip-ic">${icon("zip")}</div><div class="info"><b>${esc(a.title || "Архив чата")}</b>` +
      `<span>${esc(parts.join(" · "))}</span></div><button class="btn red" type="button">Скачать архив</button>`;
    box.querySelector("button").addEventListener("click", () =>
      download(safeName(chat.title) + ".zip", makeZip(archiveFiles(chat))));
    return box;
  }

  // ---------------------------------------------------------------- ZIP (без сжатия, имена в UTF-8)
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(files) {
    const enc = new TextEncoder(), parts = [], central = [];
    const d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name);
      const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
      const crc = crc32(data);
      const loc = new DataView(new ArrayBuffer(30));
      loc.setUint32(0, 0x04034b50, true); loc.setUint16(4, 20, true); loc.setUint16(6, 0x0800, true);
      loc.setUint16(10, time, true); loc.setUint16(12, date, true); loc.setUint32(14, crc, true);
      loc.setUint32(18, data.length, true); loc.setUint32(22, data.length, true); loc.setUint16(26, name.length, true);
      parts.push(loc.buffer, name, data);
      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true);
      cen.setUint16(12, time, true); cen.setUint16(14, date, true); cen.setUint32(16, crc, true);
      cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true); cen.setUint16(28, name.length, true);
      cen.setUint32(42, offset, true);
      central.push(cen.buffer, name);
      offset += 30 + name.length + data.length;
    }
    const size = central.reduce((n, b) => n + b.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, size, true); end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [end.buffer]), {type: "application/zip"});
  }

  function renderChat() {
    const chat = current();
    log.textContent = "";
    $("chatTitle").textContent = chat.title;
    if (!chat.messages.length) renderWelcome();
    for (const m of chat.messages) renderMessage(m);
    log.scrollTop = log.scrollHeight;
  }
  function renderAll() { renderSidebar(); renderVersions(); renderChat(); }

  // ---------------------------------------------------------------- движки
  let engineReady = false;
  function setStatus(state, text) {
    $("status").dataset.state = state;
    $("statusText").textContent = text;
  }
  function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
  }
  function historyOf(chat) {
    return chat.messages.slice(-20).map((m) => ({role: m.role === "user" ? "user" : "assistant", content: m.text}));
  }

  function serverEngine(root) {
    return {
      mode: "server",
      root: root,
      async versions() {
        const r = await fetch(root + "api/versions");
        return (await r.json()).versions;
      },
      async ask(v, message, sessionId, history) {
        const r = await fetch(root + "api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message: message, version: v, session_id: sessionId, history: history})
        });
        return await r.json();
      },
      async code(action, code, lang, prompt) {
        const r = await fetch(root + "api/code", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({action: action, code: code, lang: lang, prompt: prompt})
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || "ошибка " + r.status);
        return data;
      }
    };
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Не удалось загрузить " + src));
      document.head.append(s);
    });
  }

  function readPyFiles() {
    return Promise.all(PY_FILES.map(async (name) => {
      // Файлы, встроенные в страницу (rai.html, собранный build_standalone.py).
      const embedded = document.getElementById("rai-files");
      if (embedded) return [name, JSON.parse(embedded.textContent)[name]];
      const r = await fetch(CFG.pyBase.replace(/\/?$/, "/") + name, {cache: "no-cache"});
      if (!r.ok) throw new Error("нет файла " + name + " (" + r.status + ")");
      return [name, await r.text()];
    }));
  }

  // Откуда Python для запуска программ во вкладке Code: сначала тот источник, что уже сработал.
  let pyodideOK = null;
  function pyodideSources() {
    const list = pyodideOK ? [pyodideOK] : [];
    for (const src of [CFG.pyodide].concat(window.RAI_PYODIDE_SOURCES)) {
      if (!src) continue;
      const url = new URL(src.replace(/\/?$/, "/"), location.href).href;
      if (list.some((x) => x.url === url)) continue;
      list.push({url: url, stdlib: CFG.stdlib && src === CFG.pyodide ? new URL(CFG.stdlib, location.href).href : undefined});
    }
    return list;
  }

  // Загрузить Pyodide: пробуем источники по очереди, каждый с ограничением по времени.
  async function loadPython(onStep) {
    const sources = [];
    for (const src of [CFG.pyodide].concat(window.RAI_PYODIDE_SOURCES)) {
      if (src && !sources.includes(src)) sources.push(src);
    }
    const problems = [];
    for (const src of sources) {
      const base = new URL(src.replace(/\/?$/, "/"), location.href).href;
      const where = new URL(base).host || "файл";
      try {
        onStep("Скачиваю Python (" + where + ")");
        if (!window.loadPyodide) await withTimeout(loadScript(base + "pyodide.js"), 20000);
        const opts = {indexURL: base};
        if (CFG.stdlib && src === CFG.pyodide) opts.stdLibURL = new URL(CFG.stdlib, location.href).href;
        const py = await withTimeout(window.loadPyodide(opts), 120000);
        pyodideOK = {url: base, stdlib: opts.stdLibURL};
        return py;
      } catch (e) {
        problems.push(where + ": " + (e && e.message === "timeout" ? "слишком долго" : (e && e.message) || e));
        try { delete window.loadPyodide; } catch (_) { window.loadPyodide = undefined; }
      }
    }
    throw new Error("не удалось загрузить Python.\n" + problems.join("\n"));
  }

  async function browserEngine() {
    const t0 = Date.now();
    let step = "Загружаю Python";
    const tick = () => setStatus("loading", step + "… " + Math.round((Date.now() - t0) / 1000) + " с");
    tick();
    const timer = setInterval(tick, 1000);
    let pyodide, files;
    try {
      [pyodide, files] = await Promise.all([
        loadPython((text) => { step = text; tick(); }),
        readPyFiles()
      ]);
      step = "Запускаю Rai";
      tick();
    } finally {
      clearInterval(timer);
    }
    pyodide.FS.mkdirTree("/home/pyodide/rai");
    for (const [name, text] of files) pyodide.FS.writeFile("/home/pyodide/rai/" + name, text);
    pyodide.runPython(`
import sys, json
sys.path.insert(0, "/home/pyodide/rai")
import brain, versions
_rai = brain.Brain(learned_path="/tmp/learned.json")

def rai_ask(version_id, message, session_id, history_json="[]"):
    v = versions.resolve(version_id)
    if v is None:
        return json.dumps({"answer": "Неизвестная версия.", "error": "unknown_version"}, ensure_ascii=False)
    try:
        history = json.loads(history_json or "[]")
        return json.dumps(_rai.answer(v, message, session_id, history), ensure_ascii=False)
    except brain.RaiError as e:
        return json.dumps({"answer": str(e), "error": "rai_error"}, ensure_ascii=False)

def rai_versions():
    return json.dumps([v.public() for v in versions.VERSIONS.values()], ensure_ascii=False)

def rai_code(action, code, lang, prompt):
    import codeai
    try:
        return json.dumps(codeai.run_action(action, code or "", lang or None, prompt or ""), ensure_ascii=False)
    except Exception as e:
        return json.dumps({"answer": "Не получилось разобрать код: " + str(e)}, ensure_ascii=False)
`);
    const pyAsk = pyodide.globals.get("rai_ask");
    const pyVersions = pyodide.globals.get("rai_versions");
    const pyCode = pyodide.globals.get("rai_code");
    return {
      mode: "browser",
      async versions() { return JSON.parse(pyVersions()); },
      async ask(v, message, sessionId, history) { return JSON.parse(pyAsk(v, message, sessionId, JSON.stringify(history))); },
      async code(action, code, lang, prompt) { return JSON.parse(pyCode(action, code || "", lang || "", prompt || "")); }
    };
  }

  async function startEngine() {
    if (CFG.api) return serverEngine(CFG.api.replace(/\/+$/, "") + "/");
    // Страницу отдаёт сам сервер Rai? Тогда рядом есть api/versions.
    if (location.protocol.startsWith("http")) {
      try {
        const r = await withTimeout(fetch("api/versions", {cache: "no-store"}), 2500);
        const ct = r.headers.get("content-type") || "";
        if (r.ok && ct.includes("json")) {
          const d = await r.json();
          if (d && Array.isArray(d.versions)) return serverEngine("");
        }
      } catch (e) { /* нет сервера — запускаем в браузере */ }
    }
    return browserEngine();
  }

  // ---------------------------------------------------------------- отправка
  let busy = false;
  async function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    if (recording && rec) rec.stop();
    busy = true;
    sendBtn.disabled = true;
    const chat = current();
    if (!chat.messages.length) {
      log.textContent = "";
      chat.title = text.length > 48 ? text.slice(0, 47) + "…" : text;
      $("chatTitle").textContent = chat.title;
    }
    const history = historyOf(chat);
    const userMsg = {role: "user", text: text};
    chat.messages.push(userMsg);
    chat.updated = Date.now();
    renderMessage(userMsg);
    input.value = "";
    autosize();
    const pending = document.createElement("div");
    pending.className = "inner msg rai pending";
    pending.innerHTML = `<div class="who">Rai</div><div class="bubble">` +
      (engineReady ? `<span class="typing" aria-label="Rai печатает"><span></span><span></span><span></span></span>` : "Rai ещё загружается, отвечу сразу после загрузки…") + `</div>`;
    log.append(pending);
    log.scrollTop = log.scrollHeight;
    save(); renderSidebar();
    let reply;
    try {
      const engine = await enginePromise;
      await new Promise((r) => setTimeout(r, 40));  // успеть показать «печатает…»
      const t0 = performance.now();
      const data = await engine.ask(chat.version, text, chat.id, history);
      const ms = Math.max(1, Math.round(performance.now() - t0));
      reply = {role: "rai", text: data.answer || "Результат не получен.", attachments: data.attachments || [],
               meta: (data.version_name || versionName(chat.version)) + " · " + ms + " мс"};
    } catch (e) {
      reply = {role: "rai", text: "Не удалось получить ответ. Попробуйте ещё раз.", meta: "ошибка"};
    }
    pending.remove();
    chat.messages.push(reply);
    chat.updated = Date.now();
    if (currentId === chat.id) renderMessage(reply);
    save(); renderSidebar();
    busy = false;
    sendBtn.disabled = false;
    log.scrollTop = log.scrollHeight;
    input.focus();
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }

  // ---------------------------------------------------------------- события
  function closeMenu() { document.body.classList.remove("menu-open"); }
  $("menuBtn").addEventListener("click", () => document.body.classList.add("menu-open"));
  $("backdrop").addEventListener("click", closeMenu);
  $("newChat").addEventListener("click", newChat);
  $("chatTitle").addEventListener("click", () => {
    const item = $("chatList").querySelector(".chat-item.active");
    if (item) { document.body.classList.add("menu-open"); startRename(item, current()); }
  });
  $("form").addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); }
  });
  input.addEventListener("input", autosize);
  log.addEventListener("click", (e) => {
    const toCode = e.target.closest(".to-code");
    if (toCode) {
      const block = toCode.closest(".codeblock");
      openInCode("main." + (EXT_OF[block.dataset.lang] || "txt"), block.querySelector("code").textContent);
      return;
    }
    const btn = e.target.closest(".copy-code");
    if (!btn) return;
    const code = btn.closest(".codeblock").querySelector("code");
    copyRich(code.textContent, "<pre>" + esc(code.textContent) + "</pre>", code);
  });

  // ---------------------------------------------------------------- режимы: Чат / Code
  let codeStarted = false;
  function startCode() {
    if (codeStarted || !window.RaiCode) return !!window.RaiCode;
    codeStarted = true;
    window.RaiCode.init({
      api: async (action, code, lang, prompt) => (await enginePromise).code(action, code, lang, prompt),
      ready: () => engineReady,
      md: renderMarkdown,
      toast: toast,
      download: download,
      zip: makeZip,
      copy: (text) => copyRich(text, "<pre>" + esc(text) + "</pre>", document.body),
      pyodideSources: pyodideSources
    });
    return true;
  }
  function setMode(mode) {
    if (mode === "code" && !startCode()) { toast("Не удалось загрузить code.js"); mode = "chat"; }
    const code = mode === "code";
    $("chatView").hidden = code;
    $("codeView").hidden = !code;
    $("modeChat").setAttribute("aria-selected", String(!code));
    $("modeCode").setAttribute("aria-selected", String(code));
    document.title = code ? "Rai Code" : "Rai";
    try { localStorage.setItem("rai_mode", mode); } catch (e) { /* не страшно */ }
    if ((location.hash === "#code") !== code) history.replaceState(null, "", code ? "#code" : location.pathname + location.search);
    if (code) window.RaiCode.focus(); else input.focus();
  }
  function openInCode(name, text) {
    startCode();
    const added = window.RaiCode.addFile(name, text);
    setMode("code");
    toast("Открыто в Code: " + added);
  }
  $("modeChat").addEventListener("click", () => setMode("chat"));
  $("modeCode").addEventListener("click", () => setMode("code"));
  window.addEventListener("hashchange", () => setMode(location.hash === "#code" ? "code" : "chat"));

  if (backUrl) $("backLink").href = backUrl;
  load();
  renderAll();
  let startMode = "chat";
  try { startMode = location.hash === "#code" ? "code" : location.hash ? "chat" : localStorage.getItem("rai_mode") || "chat"; } catch (e) { /* чат */ }
  if (startMode === "code") setMode("code");

  const enginePromise = startEngine().then(async (engine) => {
    try {
      const list = await engine.versions();
      if (Array.isArray(list) && list.length) { VERSIONS = list; renderVersions(); renderSidebar(); }
    } catch (e) { /* остаёмся со встроенным списком */ }
    engineReady = true;
    setStatus("ready", engine.mode === "server" ? "Сервер Rai" : "Rai работает в браузере");
    if (window.RaiCode) window.RaiCode.engineReady();
    return engine;
  }).catch((err) => {
    setStatus("error", "Rai не запустился");
    const box = document.createElement("div");
    box.className = "inner msg rai";
    box.innerHTML = `<div class="who">Rai</div><div class="bubble md"></div>`;
    box.querySelector(".bubble").innerHTML = renderMarkdown("**Не получилось запустить Rai:** " + err.message.replace(/\n/g, "\n\n") +
      "\n\nПроверьте интернет (или не блокирует ли антивирус загрузку) и попробуйте снова.");
    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "btn red retry";
    retry.textContent = "Попробовать снова";
    retry.addEventListener("click", () => location.reload());
    box.append(retry);
    log.append(box);
    throw err;
  });
})();
</script>
</body>
