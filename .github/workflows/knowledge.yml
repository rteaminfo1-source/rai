# Знания Rai: GitHub сам собирает энциклопедию (encyclopedia.json) — ~10 000 важнейших тем из Википедии
# (tools/build_encyclopedia.py) и кладёт её в репозиторий. Раз в месяц обновляет.
# Если знания изменились — заново собирает приложение и выкладывает сайт.
name: Знания Rai

on:
  push:
    branches: [main, claude/peaceful-allen-c7nn4t]
    paths:
      - "tools/build_encyclopedia.py"
      - ".github/workflows/knowledge.yml"
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

concurrency:
  group: knowledge
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Собрать знания из Википедии
        run: python tools/build_encyclopedia.py -o encyclopedia.json

      - name: Сохранить в репозиторий
        id: save
        run: |
          git add encyclopedia.json
          if git diff --cached --quiet; then
            echo "Знания не изменились"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(python -c "import json; print(len(json.load(open('encyclopedia.json', encoding='utf-8'))['items']))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Знания Rai: $count тем из Википедии"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Пересобрать приложение и выложить сайт
        if: steps.save.outputs.changed == 'true' && hashFiles('encyclopedia.py') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run desktop.yml --ref "$GITHUB_REF_NAME"
          gh workflow run deploy-hosting.yml --ref "$GITHUB_REF_NAME"
