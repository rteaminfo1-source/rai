<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
  /* Настройки (можно задать до этого файла через window.RAI_CONFIG):
     api     — адрес Python-сервера Rai, например "https://rai-xxxx.onrender.com".
               Не задан: если страницу отдаёт сам сервер Rai — используется он,
               иначе Rai запускается прямо в браузере (Python через Pyodide).
     pyBase  — откуда брать .py файлы в браузерном режиме (по умолчанию — рядом со страницей).
     pyodide — свой адрес Pyodide (stdlib — свой адрес python_stdlib.zip, если нужно). */
  window.RAI_CONFIG = Object.assign({
    api: null,
    pyBase: "./",
    pyodide: null
  }, window.RAI_CONFIG || {});
  /* Откуда пробовать загрузить Pyodide, по очереди: свой адрес (если задан),
     папка pyodide/ рядом со страницей (есть в репозитории), затем CDN. */
  window.RAI_PYODIDE_SOURCES = [
    "pyodide/",
    "https://cdn.jsdelivr.net/npm/pyodide@314.0.7/",
    "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/",
    "https://unpkg.com/pyodide@314.0.7/"
  ];
</script>
<style>
  /* Layout: слева список чатов, справа чат — шапка с версией, лента, строка ввода.
     Стиль: чёрный с красным, одна тёмная тема. */
  :root {
    --bg: #0b0b0c;
    --side: #0f0f11;
    --panel: #151517;
    --panel-2: #1d1d20;
    --line: #2a2a2e;
    --fg: #f3f1f1;
    --muted: #9b9599;
    --red: #e10600;
    --red-hi: #ff2a2a;
    --red-soft: #2b0b0b;
    --ink: #ffffff;
    --ok: #3ccf7a;
    --warn: #f0b23c;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 var(--font-body);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  button { font: inherit; color: inherit; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-columns: 280px minmax(0, 1fr); }

  /* ---------- список чатов ---------- */
  #sidebar {
    background: var(--side); border-right: 1px solid var(--line);
    display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; padding: 18px 18px 14px; }
  .logo { font: 800 26px/1 var(--font-display); letter-spacing: -0.02em; }
  .logo span { color: var(--red); }
  .byline { font: 500 11px/1.2 var(--font-mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  #newChat {
    margin: 0 14px 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 14px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--red); color: var(--ink); font-weight: 600;
  }
  #newChat:hover { background: var(--red-hi); }
  #chatList { overflow-y: auto; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
  .chat-item { position: relative; border-radius: 9px; }
  .chat-item > button.open {
    width: 100%; text-align: left; cursor: pointer; border: 0; background: transparent;
    padding: 9px 64px 9px 12px; border-radius: 9px; display: block;
  }
  .chat-item > button.open:hover { background: var(--panel); }
  .chat-item.active > button.open { background: var(--red-soft); }
  .chat-item .t { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .m { display: block; font: 400 11px/1.4 var(--font-mono); color: var(--muted); }
  .chat-item .acts { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); display: flex; gap: 2px; opacity: 0; }
  .chat-item:hover .acts, .chat-item.active .acts, .chat-item .acts:focus-within { opacity: 1; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 6px; border-radius: 8px;
  }
  .icon-btn:hover { color: var(--fg); background: var(--panel-2); }
  .chat-item input {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--red);
    background: var(--panel); color: var(--fg); font: inherit;
  }
  .confirm { padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); border-radius: 9px; }
  .confirm div { display: flex; gap: 6px; }
  .btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .btn.red { background: var(--red); border-color: var(--red); color: var(--ink); }
  .side-foot { padding: 12px 14px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .account { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; background: var(--red); color: var(--ink);
    display: grid; place-items: center; font-weight: 700; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .account .who-am { flex: 1; min-width: 0; }
  .account .who-am b { display: block; color: var(--fg); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .account .who-am span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #loginBtn { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--red); background: transparent; color: var(--fg); cursor: pointer; font-weight: 600; }
  #loginBtn:hover { background: var(--red-soft); }

  /* окно входа */
  dialog#authDialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--panel); color: var(--fg); width: min(420px, calc(100vw - 32px)); }
  dialog#authDialog::backdrop { background: rgba(0, 0, 0, .7); }
  .auth-card { padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 14px; }
  .auth-head { display: flex; align-items: center; justify-content: space-between; }
  .auth-head h2 { margin: 0; font: 800 20px/1.2 var(--font-display); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; }
  .tabs button { border: 0; background: transparent; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--red); color: var(--ink); }
  .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px; border-radius: 10px;
    background: #ffffff; color: #1f1f1f; font-weight: 600; text-decoration: none; border: 0; }
  .google-btn:hover { background: #f1f1f1; }
  .google-btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .auth-form { display: flex; flex-direction: column; gap: 10px; }
  .auth-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .auth-form input { padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 15px var(--font-body); }
  .auth-form input:focus { border-color: var(--red); outline: none; }
  .auth-form .btn { padding: 11px; font-size: 15px; font-weight: 600; }
  .auth-error { margin: 0; color: var(--red-hi); font-size: 13px; }
  .auth-note { margin: 0; font-size: 12.5px; color: var(--muted); }

  .photo { margin: 4px 0 0; display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
  .photo img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); background: #000; }
  .photo figcaption { font-size: 12.5px; color: var(--muted); }
  .photo a { color: var(--red-hi); }

  /* ---------- основная часть ---------- */
  main { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); min-width: 0; min-height: 0; }
  main > * { min-width: 0; }
  header {
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px 24px 12px; border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #menuBtn { display: none; }
  #chatTitle {
    flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; cursor: pointer;
    font: 600 17px/1.3 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px 0;
  }
  .status {
    display: inline-flex; align-items: center; gap: 8px; flex: none;
    font: 500 12px/1 var(--font-mono); color: var(--muted);
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; max-width: 50%;
  }
  #statusText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .status[data-state="ready"] .dot { background: var(--ok); }
  .status[data-state="error"] .dot { background: var(--red-hi); }
  .versions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .versions button {
    cursor: pointer; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; font-size: 13px; font-weight: 500;
  }
  .versions button:hover { border-color: var(--red); }
  .versions button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--ink); }
  #features { font-size: 12.5px; color: var(--muted); margin: 0; }

  #log { overflow-y: auto; min-height: 0; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .inner { width: 100%; max-width: 860px; margin: 0 auto; }

  .welcome { display: flex; flex-direction: column; gap: 16px; padding-block: 6vh 12px; }
  .welcome h1 { margin: 0; font: 800 clamp(30px, 5vw, 44px)/1.05 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
  .welcome h1 span { color: var(--red); }
  .welcome p { margin: 0; color: var(--muted); max-width: 60ch; }
  .examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .examples button {
    text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 2px;
  }
  .examples button:hover { border-color: var(--red); }
  .examples b { font-weight: 600; }
  .examples small { color: var(--muted); font-size: 12px; }

  .msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: var(--red-soft); border: 1px solid #4a1111; padding: 10px 14px; border-radius: 14px 14px 4px 14px;
    max-width: min(640px, 92%); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.rai .bubble { max-width: 100%; min-width: 0; overflow-wrap: anywhere; }
  .msg.pending .bubble { color: var(--muted); }
  .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--red); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
  .who { font: 600 12px/1 var(--font-mono); color: var(--red-hi); letter-spacing: .04em; }
  .actions { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .actions .icon-btn { font-size: 12.5px; padding: 5px 8px; }
  .meta { font: 400 11px/1 var(--font-mono); color: var(--muted); margin-left: 6px; }

  /* markdown */
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h2, .md h3, .md h4 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; margin: 16px 0 10px; line-height: 1.25; }
  .md h2 { font-size: 20px; } .md h3 { font-size: 17px; } .md h4 { font-size: 15px; }
  .md strong { color: #fff; font-weight: 700; }
  .md mark { background: rgba(225, 6, 0, .28); color: #fff; padding: 0 3px; border-radius: 3px; }
  .md code { font: 13px/1.4 var(--font-mono); background: var(--panel-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; } .md li::marker { color: var(--red-hi); }
  .md blockquote { margin: 0 0 10px; padding: 8px 14px; border-left: 3px solid var(--red); background: var(--panel); border-radius: 0 8px 8px 0; color: #ddd; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .md a { color: var(--red-hi); }
  .table-wrap { overflow-x: auto; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  .md th { text-align: left; background: var(--panel-2); color: var(--red-hi); font-weight: 600; border-bottom: 2px solid var(--red); }
  .md th, .md td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .md tr:last-child td { border-bottom: 0; }
  .md tbody tr:nth-child(even) td { background: rgba(255, 255, 255, .02); }
  .codeblock { margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0e0e10; }
  .codehead { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px; background: var(--panel-2); font: 500 12px/1 var(--font-mono); color: var(--muted); }
  .codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
  .codeblock code { background: none; border: 0; padding: 0; font-size: 13px; color: #f0e9e9; }

  /* картинки */
  .art { margin: 4px 0 0; display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
  .art img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); display: block; background: #000; cursor: zoom-in; }

  /* презентации */
  .deck { margin-top: 4px; max-width: 720px; display: flex; flex-direction: column; gap: 8px; }
  .stage { position: relative; aspect-ratio: 16 / 9; container-type: inline-size; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #0b0b0c; cursor: pointer; }
  .stage:fullscreen { border: 0; border-radius: 0; aspect-ratio: auto; width: 100vw; height: 100vh; display: grid; place-items: center; background: #000; }
  .stage:fullscreen .slide { position: relative; inset: auto; width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; }
  .deck-bar .count { font: 500 12px/1 var(--font-mono); color: var(--muted); padding: 0 6px; font-variant-numeric: tabular-nums; }
  .deck-bar .spacer { flex: 1; }

  /* ---------- ввод ---------- */
  .composer { padding: 10px 24px 18px; border-top: 1px solid var(--line); }
  #listening { font: 500 12px/1.4 var(--font-mono); color: var(--red-hi); margin: 0 0 8px; }
  form { display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; min-width: 0; resize: none; max-height: 180px; min-height: 48px;
    padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font: 15px/1.4 var(--font-body);
  }
  #input:focus { border-color: var(--red); outline: none; }
  .round {
    flex: none; width: 48px; height: 48px; border-radius: 12px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg);
  }
  .round:hover { border-color: var(--red); }
  #mic.on { background: var(--red); border-color: var(--red); color: var(--ink); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(225, 6, 0, .6) } 70% { box-shadow: 0 0 0 12px rgba(225, 6, 0, 0) } 100% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0) } }
  #send { background: var(--red); border-color: var(--red); color: var(--ink); }
  #send:hover { background: var(--red-hi); }
  #send:disabled { opacity: .5; cursor: progress; }
  .hint { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }

  #toast {
    position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--red); color: var(--fg);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px);
  }
  .retry { align-self: flex-start; }
  #backdrop { display: none; }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    #sidebar {
      position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(300px, 86vw);
      padding-top: env(safe-area-inset-top, 0px); transform: translateX(-100%); transition: transform .2s;
    }
    body.menu-open #sidebar { transform: none; }
    body.menu-open #backdrop { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .6); }
    #menuBtn { display: inline-flex; }
    header, .composer { padding-inline: 16px; }
    #log { padding: 16px; }
    .status { max-width: 42%; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sidebar { transition: none; } #mic.on, .typing span { animation: none; }
  }
</style>
<style id="slide-css">
  .slide { position: absolute; inset: 0; background: #0b0b0c; color: #f3f1f1; padding: 6cqw 7cqw 7cqw;
    display: flex; flex-direction: column; gap: 2.4cqw; overflow: hidden;
    font-family: "Onest", "Segoe UI", system-ui, sans-serif; }
  .slide::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .8cqw; background: #e10600; }
  .slide .kicker { font: 500 1.5cqw/1 "JetBrains Mono", Consolas, monospace; color: #ff2a2a; letter-spacing: .15em; text-transform: uppercase; }
  .slide h2 { margin: 0; font: 800 4cqw/1.12 "Unbounded", "Arial Black", sans-serif; letter-spacing: -.01em; }
  .slide ul { margin: 0; padding-left: 3cqw; font-size: 2.5cqw; line-height: 1.4; display: flex; flex-direction: column; gap: 1.3cqw; }
  .slide li::marker { color: #e10600; }
  .slide code { font-family: "JetBrains Mono", Consolas, monospace; background: #1d1d20; padding: 0 .5cqw; border-radius: .5cqw; }
  .slide strong { color: #fff; }
  .slide mark { background: rgba(225, 6, 0, .35); color: #fff; }
  .slide pre { margin: 0; padding: 2.2cqw; background: #151517; border: 1px solid #2a2a2e; border-radius: 1cqw;
    font: 1.9cqw/1.5 "JetBrains Mono", Consolas, monospace; white-space: pre; overflow: hidden; color: #f0e9e9; }
  .slide pre code { background: none; padding: 0; }
  .slide table { border-collapse: collapse; font-size: 1.9cqw; }
  .slide th { text-align: left; color: #ff2a2a; border-bottom: .3cqw solid #e10600; }
  .slide th, .slide td { padding: .9cqw 1.6cqw; border-bottom: 1px solid #2a2a2e; }
  .slide.cover, .slide.end { justify-content: center; }
  .slide.cover h1, .slide.end h1 { margin: 0; font: 800 7cqw/1.02 "Unbounded", "Arial Black", sans-serif; letter-spacing: -.02em; }
  .slide.cover h1::after { content: ""; display: block; width: 12cqw; height: .9cqw; background: #e10600; margin-top: 2.6cqw; }
  .slide .sub { font-size: 2.4cqw; color: #9b9599; }
  .slide .num { position: absolute; right: 3cqw; bottom: 2.4cqw; font: 500 1.3cqw/1 "JetBrains Mono", monospace; color: #9b9599; }
  .slide > .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .6; }
  .slide.cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0b0b0c 32%, rgba(11, 11, 12, .55) 70%, rgba(11, 11, 12, .2)); }
  .slide.cover > :not(.bg):not(.num) { position: relative; }
  .slide .cols { display: grid; grid-template-columns: 1.25fr .75fr; gap: 4cqw; align-items: center; flex: 1; min-height: 0; }
  .slide .side { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 1.4cqw; border: 1px solid #2a2a2e; }
  /* появление элементов */
  .slide.play .kicker, .slide.play h1, .slide.play h2, .slide.play .sub { animation: rai-rise .6s cubic-bezier(.2, .8, .2, 1) both; }
  .slide.play h1, .slide.play h2 { animation-delay: .08s; }
  .slide.play .sub { animation-delay: .3s; }
  .slide.play li { animation: rai-rise .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(.25s + var(--i, 0) * .14s); }
  .slide.play pre, .slide.play table { animation: rai-rise .6s .25s both; }
  .slide.play .side { animation: rai-pop .8s .2s cubic-bezier(.2, .8, .2, 1) both; }
  .slide.play > .bg { animation: rai-drift 14s ease-out both; }
  .slide.play.cover h1::after { transform-origin: left; animation: rai-grow .8s .5s cubic-bezier(.2, .8, .2, 1) both; }
  /* переходы между слайдами */
  .slide.t-fade { animation: rai-fade .6s both; }
  .slide.t-slide { animation: rai-slide .6s cubic-bezier(.2, .8, .2, 1) both; }
  .slide.t-zoom { animation: rai-zoom .6s cubic-bezier(.2, .8, .2, 1) both; }
  .slide.t-wipe { animation: rai-wipe .7s cubic-bezier(.6, 0, .2, 1) both; }
  @keyframes rai-rise { from { opacity: 0; transform: translateY(2.5cqw); } to { opacity: 1; transform: none; } }
  @keyframes rai-pop { from { opacity: 0; transform: scale(.9) rotate(-2deg); } to { opacity: 1; transform: none; } }
  @keyframes rai-drift { from { transform: scale(1.14); } to { transform: scale(1); } }
  @keyframes rai-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes rai-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rai-slide { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 10cqw)); } to { opacity: 1; transform: none; } }
  @keyframes rai-zoom { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: none; } }
  @keyframes rai-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @media (prefers-reduced-motion: reduce) { .slide, .slide * { animation: none !important; } }
</style>

<script>
(function () {
  "use strict";

  const CFG = window.RAI_CONFIG;
  const params = new URLSearchParams(location.search);
  if (params.get("api")) CFG.api = params.get("api");
  if (params.get("pyodide")) CFG.pyodide = params.get("pyodide");
  if (params.get("py")) CFG.pyBase = params.get("py");

  const PY_FILES = ["versions.py", "nlp.py", "skills.py", "net.py", "online.py", "proglangs.py", "creative.py", "brain.py",
                    "knowledge.json", "glossary.json"];
  const STORE_KEY = "rai_chats_v1";

  // Пока движок не загрузился — показываем версии из этого списка.
  let VERSIONS = [
    {id: "pro", name: "Rai Pro", features: ["поиск по смыслу", "погода", "валюты", "перевод", "поиск в интернете", "таблицы", "картинки"]},
    {id: "pro-fast", name: "Rai Pro Fast", features: ["поиск по ключевым словам", "калькулятор", "погода", "валюты", "перевод"]},
    {id: "pro-plus", name: "Rai Pro Plus", features: ["понимает опечатки", "все навыки", "картинки", "презентации", "помнит имя", "«подробнее» по теме", "подсказки"]},
    {id: "pro-sun", name: "Rai Pro Sun", features: ["всё из Pro Plus", "память фактов («запомни, что …»)", "несколько вопросов сразу", "подробные ответы", "большие презентации"]}
  ];
  const EXAMPLES = [
    ["Погода в Москве", "погода с картинкой"],
    ["100 долларов в рублях", "курсы валют"],
    ["Переведи на английский: доброе утро", "перевод"],
    ["Нарисуй закат над морем", "картинка"],
    ["Сделай презентацию про космос", "презентация · Pro Plus / Sun"],
    ["Hello World на Rust", "языки программирования"],
    ["Найди в интернете Эйфелева башня", "поиск в интернете"],
    ["Что ты умеешь?", "все возможности"]
  ];

  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), sendBtn = $("send");

  // ---------------------------------------------------------------- утилиты
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  }
  function icon(name) { return `<svg class="i"><use href="#i-${name}"/></svg>`; }
  function uid() { return "c" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  let toastTimer = null;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  function download(name, blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function safeName(s) { return (s || "rai").replace(/[\\/:*?"<>|«»]+/g, " ").trim().slice(0, 60) || "rai"; }

  // ---------------------------------------------------------------- markdown
  function inline(text) {
    return String(text).split(/(`[^`\n]+`)/g).map((part, i) => {
      if (i % 2 === 1) return "<code>" + esc(part.slice(1, -1)) + "</code>";
      let s = esc(part);
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      s = s.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/==([^=]+?)==/g, "<mark>$1</mark>");
      s = s.replace(/~~([^~]+?)~~/g, "<del>$1</del>");
      s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
      return s;
    }).join("");
  }
  function splitRow(line) {
    const cells = [];
    let cur = "", code = false;
    const body = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    for (const ch of body) {
      if (ch === "`") code = !code;
      if (ch === "|" && !code) { cells.push(cur.trim()); cur = ""; } else cur += ch;
    }
    cells.push(cur.trim());
    return cells;
  }
  function codeBlock(code, lang) {
    return `<div class="codeblock"><div class="codehead"><span>${esc(lang || "код")}</span>` +
      `<button class="icon-btn copy-code" type="button">${icon("copy")}Копировать</button></div>` +
      `<pre><code>${esc(code)}</code></pre></div>`;
  }
  function renderMarkdown(md) {
    const lines = String(md || "").replace(/\r/g, "").split("\n");
    const out = [];
    let para = [];
    const flush = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
    const LIST = /^([-*•]|\d+[.)])\s+/;
    let i = 0;
    while (i < lines.length) {
      const t = lines[i].trim();
      let m;
      if (t.startsWith("```")) {
        flush();
        const lang = t.slice(3).trim(), code = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith("```")) { code.push(lines[i]); i++; }
        i++;
        out.push(codeBlock(code.join("\n"), lang));
      } else if (t.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1].trim())) {
        flush();
        const head = splitRow(t), rows = [];
        i += 2;
        while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(splitRow(lines[i])); i++; }
        out.push('<div class="table-wrap"><table><thead><tr>' + head.map((c) => "<th>" + inline(c) + "</th>").join("") +
          "</tr></thead><tbody>" + rows.map((r) => "<tr>" + head.map((_, k) => "<td>" + inline(r[k] || "") + "</td>").join("") + "</tr>").join("") +
          "</tbody></table></div>");
      } else if ((m = t.match(/^(#{1,4})\s+(.*)$/))) {
        flush();
        const lvl = Math.min(m[1].length + 1, 4);
        out.push(`<h${lvl}>${inline(m[2])}</h${lvl}>`);
        i++;
      } else if (/^(-{3,}|\*{3,})$/.test(t)) {
        flush(); out.push("<hr>"); i++;
      } else if (t.startsWith(">")) {
        flush();
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith(">")) { q.push(lines[i].trim().replace(/^>\s?/, "")); i++; }
        out.push("<blockquote>" + q.map(inline).join("<br>") + "</blockquote>");
      } else if (LIST.test(t)) {
        flush();
        const ordered = /^\d/.test(t), items = [];
        while (i < lines.length && LIST.test(lines[i].trim()) && /^\d/.test(lines[i].trim()) === ordered) {
          items.push(lines[i].trim().replace(LIST, "")); i++;
        }
        const tag = ordered ? "ol" : "ul";
        out.push(`<${tag}>` + items.map((x) => "<li>" + inline(x) + "</li>").join("") + `</${tag}>`);
      } else if (!t) {
        flush(); i++;
      } else {
        para.push(lines[i]); i++;
      }
    }
    flush();
    return out.join("");
  }
  function plainText(md) {
    return String(md || "")
      .replace(/```[\s\S]*?```/g, " (пример кода) ")
      .replace(/^\|?\s*:?-{2,}.*$/gm, "")
      .replace(/[|*#=`~>]/g, " ")
      .replace(/\s+/g, " ").trim();
  }

  // ---------------------------------------------------------------- копирование
  async function copyRich(md, html, el) {
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        await navigator.clipboard.write([new ClipboardItem({
          "text/plain": new Blob([md], {type: "text/plain"}),
          "text/html": new Blob([html], {type: "text/html"})
        })]);
      } else {
        await navigator.clipboard.writeText(md);
      }
      toast("Скопировано");
    } catch (e) {
      try { await navigator.clipboard.writeText(md); toast("Скопировано"); }
      catch (_) {
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
        toast("Текст выделен — нажмите Ctrl+C");
      }
    }
  }

  // ---------------------------------------------------------------- озвучка
  let speakingBtn = null;
  function speak(text, btn) {
    if (!("speechSynthesis" in window)) { toast("Этот браузер не умеет озвучивать текст"); return; }
    const was = speakingBtn;
    speechSynthesis.cancel();
    if (was) { was.innerHTML = icon("speak") + "Озвучить"; speakingBtn = null; if (was === btn) return; }
    const u = new SpeechSynthesisUtterance(plainText(text));
    u.lang = "ru-RU";
    const ru = speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("ru"));
    if (ru) u.voice = ru;
    u.onend = u.onerror = () => { if (speakingBtn === btn) { btn.innerHTML = icon("speak") + "Озвучить"; speakingBtn = null; } };
    speakingBtn = btn;
    btn.innerHTML = icon("stop") + "Стоп";
    speechSynthesis.speak(u);
  }

  // ---------------------------------------------------------------- голосовой ввод
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recording = false;
  function setMic(on) {
    recording = on;
    $("mic").classList.toggle("on", on);
    $("mic").setAttribute("aria-label", on ? "Остановить запись" : "Голосовой ввод");
    $("listening").hidden = !on;
    $("listening").textContent = on ? "Слушаю… говорите. Нажмите микрофон ещё раз, чтобы остановить." : "";
  }
  $("mic").addEventListener("click", () => {
    if (!SR) { toast("Голосовой ввод работает в Chrome и Edge"); return; }
    if (recording && rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = "ru-RU";
    rec.interimResults = true;
    rec.continuous = true;
    const base = input.value.trim() ? input.value.trimEnd() + " " : "";
    rec.onresult = (e) => {
      let text = "";
      for (let k = 0; k < e.results.length; k++) text += e.results[k][0].transcript;
      input.value = base + text;
      autosize();
    };
    rec.onerror = (e) => {
      const msg = {
        "not-allowed": "Нет доступа к микрофону. Разрешите его в настройках браузера (значок слева от адреса).",
        "service-not-allowed": "Браузер не разрешил распознавание речи на этой странице.",
        "no-speech": "Не слышно речи. Попробуйте ещё раз.",
        "audio-capture": "Микрофон не найден.",
        "network": "Для распознавания речи браузеру нужен интернет."
      }[e.error];
      toast(msg || "Ошибка микрофона: " + e.error);
    };
    rec.onend = () => { setMic(false); input.focus(); };
    try { rec.start(); setMic(true); } catch (e) { toast("Не удалось включить микрофон"); }
  });

  // ---------------------------------------------------------------- чаты
  let chats = [], currentId = null, lastVersion = "pro";
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({chats: chats, current: currentId, version: lastVersion})); }
    catch (e) { toast("В браузере не хватает места — удалите старые чаты"); }
    schedulePush();
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (d && Array.isArray(d.chats)) {
        chats = d.chats.filter((c) => c && c.id && Array.isArray(c.messages));
        currentId = d.current;
        lastVersion = d.version || lastVersion;
      }
    } catch (e) { /* начнём с чистого листа */ }
    if (!chats.length) chats.push(makeChat());
    if (!chats.some((c) => c.id === currentId)) currentId = chats[0].id;
  }
  function makeChat() {
    return {id: uid(), title: "Новый чат", version: lastVersion, created: Date.now(), updated: Date.now(), messages: []};
  }
  function current() { return chats.find((c) => c.id === currentId); }

  function newChat() {
    const cur = current();
    if (cur && !cur.messages.length) { closeMenu(); input.focus(); return; }
    const c = makeChat();
    chats.unshift(c);
    currentId = c.id;
    save(); renderAll(); closeMenu(); input.focus();
  }
  function openChat(id) {
    currentId = id; save(); renderAll(); closeMenu();
  }
  function deleteChat(id) {
    chats = chats.filter((c) => c.id !== id);
    if (!chats.length) chats.push(makeChat());
    if (!chats.some((c) => c.id === currentId)) currentId = chats[0].id;
    save(); renderAll();
  }
  function renameChat(id, title) {
    const c = chats.find((x) => x.id === id);
    if (c && title.trim()) { c.title = title.trim().slice(0, 80); save(); }
    renderAll();
  }

  function when(ts) {
    const d = new Date(ts), now = new Date();
    return d.toDateString() === now.toDateString()
      ? d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"})
      : d.toLocaleDateString("ru-RU", {day: "numeric", month: "short"});
  }
  function versionName(id) { const v = VERSIONS.find((x) => x.id === id); return v ? v.name : id; }

  function renderSidebar() {
    const list = $("chatList");
    list.textContent = "";
    for (const c of chats.slice().sort((a, b) => b.updated - a.updated)) {
      const item = document.createElement("div");

  function startRename(item, c) {
    item.innerHTML = "";

    field.value = c.title;
    field.setAttribute("aria-label", "Название чата");
    item.append(field);
    field.focus(); field.select();
    let done = false;
    const finish = (ok) => { if (done) return; done = true; ok ? renameChat(c.id, field.value) : renderAll(); };
    field.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      if (e.key === "Escape") finish(false);
    });
    field.addEventListener("blur", () => finish(true));
  }

  // картинка
  function svgUrl(svg) { return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }
  function renderPhoto(a) {
    const fig = document.createElement("figure");
    fig.className = "photo";
    fig.innerHTML = `<img alt="${esc(a.title || "Фото")}" src="${esc(a.url)}" loading="lazy" referrerpolicy="no-referrer">` +
      `<figcaption>${esc(a.title || "")}` +
      (/^https:\/\//.test(a.source || "") ? ` · <a href="${esc(a.source)}" target="_blank" rel="noopener noreferrer">источник</a>` : "") +
      `</figcaption>`;

    return fig;

  function renderImage(a) {
    const fig = document.createElement("figure");
    fig.className = "art";
    fig.innerHTML = `<img alt="${esc(a.title || "Картинка")}" src="${svgUrl(a.svg)}">` +
      `<div class="actions"><button class="icon-btn png" type="button">${icon("down")}PNG</button>` +
      `<button class="icon-btn svg" type="button">${icon("down")}SVG</button>` +
      `<button class="icon-btn full" type="button">${icon("full")}На весь экран</button>` +
      `<span class="meta">${esc(a.title || "")}</span></div>`;
    const img = fig.querySelector("img");
    const full = () => (img.requestFullscreen ? img.requestFullscreen() : Promise.reject()).catch(() => toast("Полный экран недоступен"));
    img.addEventListener("click", full);
    fig.querySelector(".full").addEventListener("click", full);
    fig.querySelector(".svg").addEventListener("click", () =>
      download(safeName(a.title) + ".svg", new Blob([a.svg], {type: "image/svg+xml"})));
    fig.querySelector(".png").addEventListener("click", () => {
      const pic = new Image();
      pic.onload = () => {
        const cv = document.createElement("canvas");
        cv.width = pic.naturalWidth || 1200; cv.height = pic.naturalHeight || 800;
        cv.getContext("2d").drawImage(pic, 0, 0, cv.width, cv.height);
        cv.toBlob((blob) => blob ? download(safeName(a.title) + ".png", blob) : toast("Не удалось сохранить PNG"), "image/png");
      };
      pic.onerror = () => toast("Не удалось сохранить PNG");
      pic.src = svgUrl(a.svg);
    });
    return fig;
  }

  // презентация
  function slideHTML(s, n, total, dir) {
    const num = `<div class="num">${n} / ${total}</div>`;
    const cls = `slide play t-${esc(s.transition || "fade")}`;
    const attrs = ` data-t="${esc(s.transition || "fade")}" style="--dir:${dir || 1}"`;
    const pic = (c) => s.image ? `<img class="${c}" alt="" src="${svgUrl(s.image)}">` : "";
    if (s.kind === "title") return `<section class="${cls} cover"${attrs}>${pic("bg")}<div class="kicker">Презентация</div><h1>${esc(s.title)}</h1><div class="sub">${esc(s.subtitle || "")}</div>${num}</section>`;
    if (s.kind === "end") return `<section class="${cls} end"${attrs}><h1>${esc(s.title)}</h1><div class="sub">${esc(s.subtitle || "")}</div>${num}</section>`;
    let body = "";
    if (s.kind === "code") body = `<pre><code>${esc(s.code || "")}</code></pre>`;
    else if (s.kind === "table") {
      const [head, ...rows] = s.rows && s.rows.length ? s.rows : [[]];
      body = "<table><thead><tr>" + head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + head.map((_, k) => "<td>" + inline(r[k] || "") + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
    } else {
      body = "<ul>" + (s.bullets || []).map((b, i) => `<li style="--i:${i}">` + inline(b) + "</li>").join("") + "</ul>";
      if (s.image) body = `<div class="cols">${body}${pic("side")}</div>`;
    }
    return `<section class="${cls}"${attrs}><div class="kicker">${String(n).padStart(2, "0")}</div><h2>${esc(s.title || "")}</h2>${body}${num}</section>`;
  }
  function renderDeck(a) {
    const deck = document.createElement("div");
    deck.className = "deck";
    deck.innerHTML = `<div class="stage" tabindex="0" aria-label="Слайды: нажмите или используйте стрелки"></div>` +
      `<div class="deck-bar actions">` +
      `<button class="icon-btn prev" type="button" aria-label="Предыдущий слайд">${icon("left")}</button>` +
      `<span class="count"></span>` +
      `<button class="icon-btn next" type="button" aria-label="Следующий слайд">${icon("right")}</button>` +
      `<span class="spacer"></span>` +
      `<button class="icon-btn full" type="button">${icon("full")}На весь экран</button>` +
      `<button class="icon-btn dl" type="button">${icon("down")}Скачать</button></div>`;
    const stage = deck.querySelector(".stage");
    let k = 0;
    const total = a.slides.length;
    const show = (dir) => {
      stage.innerHTML = slideHTML(a.slides[k], k + 1, total, dir);
      deck.querySelector(".count").textContent = (k + 1) + " / " + total;
    };
    const go = (d) => {
      const next = Math.max(0, Math.min(total - 1, k + d));
      if (next === k) return;
      k = next; show(d < 0 ? -1 : 1);
    };
    deck.querySelector(".prev").addEventListener("click", () => go(-1));
    deck.querySelector(".next").addEventListener("click", () => go(1));
    stage.addEventListener("click", () => go(1));
    stage.addEventListener("dblclick", (e) => e.preventDefault());
    stage.addEventListener("keydown", (e) => {
      if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(1); }
      if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
    });
    deck.querySelector(".full").addEventListener("click", () => {
      (stage.requestFullscreen ? stage.requestFullscreen() : Promise.reject()).then(() => stage.focus()).catch(() => toast("Полный экран недоступен"));
    });
    deck.querySelector(".dl").addEventListener("click", () =>
      download(safeName(a.title) + ".html", new Blob([deckFile(a)], {type: "text/html"})));
    show();
    return deck;
  }
  function deckFile(a) {
    const total = a.slides.length;
    const slides = a.slides.map((s, n) => slideHTML(s, n + 1, total).replace(/class="slide play t-[a-z]+/, 'class="slide')).join("\n");
    const css = $("slide-css").textContent;
    return `<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(a.title)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>html,body{margin:0;height:100%;background:#000}
.deck{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden}
.deck .slide{display:none}.deck .slide.on{display:flex}
${css}</style></head><body><div class="deck">${slides}</div>
<script>var s=document.querySelectorAll('.slide'),k=0;
function show(d){s.forEach(function(e,i){var on=i===k;e.classList.toggle('on',on);if(on){e.classList.remove('play','t-'+e.dataset.t);e.style.setProperty('--dir',d||1);void e.offsetWidth;e.classList.add('play','t-'+e.dataset.t)}})}
function go(d){var n=Math.max(0,Math.min(s.length-1,k+d));if(n!==k){k=n;show(d)}}
document.addEventListener('keydown',function(e){if(['ArrowRight','PageDown',' '].indexOf(e.key)>=0)go(1);if(['ArrowLeft','PageUp'].indexOf(e.key)>=0)go(-1);if(e.key==='f'&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()});
document.addEventListener('click',function(){go(1)});show();<\/script></body></html>`;
  }

  function renderChat() {
    const chat = current();
    log.textContent = "";
    $("chatTitle").textContent = chat.title;

  // ---------------------------------------------------------------- движки
  let engineReady = false;
  function setStatus(state, text) {
    $("status").dataset.state = state;
    $("statusText").textContent = text;
  }
  function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
  }
  function historyOf(chat) {
    return chat.messages.slice(-20).map((m) => ({role: m.role === "user" ? "user" : "assistant", content: m.text}));
  }

  function serverEngine(root) {
    return {
      mode: "server",
      root: root,
      async versions() {
        const r = await fetch(root + "api/versions");
        return (await r.json()).versions;
      },
      async ask(v, message, sessionId, history) {
        const r = await fetch(root + "api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message: message, version: v, session_id: sessionId, history: history})
        });
        return await r.json();
      }
    };
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Не удалось загрузить " + src));
      document.head.append(s);
    });
  }

  function readPyFiles() {
    return Promise.all(PY_FILES.map(async (name) => {
      // Файлы, встроенные в страницу (rai.html, собранный build_standalone.py).
      const embedded = document.getElementById("rai-files");
      if (embedded) return [name, JSON.parse(embedded.textContent)[name]];
      const r = await fetch(CFG.pyBase.replace(/\/?$/, "/") + name, {cache: "no-cache"});
      if (!r.ok) throw new Error("нет файла " + name + " (" + r.status + ")");
      return [name, await r.text()];
    }));
  }

  // Загрузить Pyodide: пробуем источники по очереди, каждый с ограничением по времени.
  async function loadPython(onStep) {
    const sources = [];
    for (const src of [CFG.pyodide].concat(window.RAI_PYODIDE_SOURCES)) {
      if (src && !sources.includes(src)) sources.push(src);
    }
    const problems = [];
    for (const src of sources) {
      const base = new URL(src.replace(/\/?$/, "/"), location.href).href;
      const where = new URL(base).host || "файл";
      try {
        onStep("Скачиваю Python (" + where + ")");
        if (!window.loadPyodide) await withTimeout(loadScript(base + "pyodide.js"), 20000);
        const opts = {indexURL: base};
        if (CFG.stdlib && src === CFG.pyodide) opts.stdLibURL = new URL(CFG.stdlib, location.href).href;
        return await withTimeout(window.loadPyodide(opts), 120000);
      } catch (e) {
        problems.push(where + ": " + (e && e.message === "timeout" ? "слишком долго" : (e && e.message) || e));
        try { delete window.loadPyodide; } catch (_) { window.loadPyodide = undefined; }
      }
    }
    throw new Error("не удалось загрузить Python.\n" + problems.join("\n"));
  }

  async function browserEngine() {
    const t0 = Date.now();
    let step = "Загружаю Python";
    const tick = () => setStatus("loading", step + "… " + Math.round((Date.now() - t0) / 1000) + " с");
    tick();
    const timer = setInterval(tick, 1000);
    let pyodide, files;
    try {
      [pyodide, files] = await Promise.all([
        loadPython((text) => { step = text; tick(); }),
        readPyFiles()
      ]);
      step = "Запускаю Rai";
      tick();
    } finally {
      clearInterval(timer);
    }
    pyodide.FS.mkdirTree("/home/pyodide/rai");
    for (const [name, text] of files) pyodide.FS.writeFile("/home/pyodide/rai/" + name, text);
    pyodide.runPython(`
import sys, json
sys.path.insert(0, "/home/pyodide/rai")
import brain, versions
_rai = brain.Brain(learned_path="/tmp/learned.json")

def rai_ask(version_id, message, session_id, history_json="[]"):
    v = versions.resolve(version_id)
    if v is None:
        return json.dumps({"answer": "Неизвестная версия.", "error": "unknown_version"}, ensure_ascii=False)
    try:
        history = json.loads(history_json or "[]")
        return json.dumps(_rai.answer(v, message, session_id, history), ensure_ascii=False)
    except brain.RaiError as e:
        return json.dumps({"answer": str(e), "error": "rai_error"}, ensure_ascii=False)

def rai_versions():
    return json.dumps([v.public() for v in versions.VERSIONS.values()], ensure_ascii=False)
`);
    const pyAsk = pyodide.globals.get("rai_ask");
    const pyVersions = pyodide.globals.get("rai_versions");
    return {
      mode: "browser",
      async versions() { return JSON.parse(pyVersions()); },
      async ask(v, message, sessionId, history) { return JSON.parse(pyAsk(v, message, sessionId, JSON.stringify(history))); }
    };
  }

  async function startEngine() {
    if (CFG.api) return serverEngine(CFG.api.replace(/\/+$/, "") + "/");
    // Страницу отдаёт сам сервер Rai? Тогда рядом есть api/versions.
    if (location.protocol.startsWith("http")) {
      try {
        const r = await withTimeout(fetch("api/versions", {cache: "no-store"}), 2500);
        const ct = r.headers.get("content-type") || "";
        if (r.ok && ct.includes("json")) {
          const d = await r.json();
          if (d && Array.isArray(d.versions)) return serverEngine("");
        }
      } catch (e) { /* нет сервера — запускаем в браузере */ }
    }
    return browserEngine();
  }

  // ---------------------------------------------------------------- отправка
  let busy = false;
  async function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    if (recording && rec) rec.stop();
    busy = true;
    sendBtn.disabled = true;
    const chat = current();
    if (!chat.messages.length) {
      log.textContent = "";
      chat.title = text.length > 48 ? text.slice(0, 47) + "…" : text;
      $("chatTitle").textContent = chat.title;
    }
    const history = historyOf(chat);
    const userMsg = {role: "user", text: text};
    chat.messages.push(userMsg);
    chat.updated = Date.now();
    renderMessage(userMsg);
    input.value = "";
    autosize();
    const pending = document.createElement("div");
    pending.className = "inner msg rai pending";
    pending.innerHTML = `<div class="who">Rai</div><div class="bubble">` +
      (engineReady ? `<span class="typing" aria-label="Rai печатает"><span></span><span></span><span></span></span>` : "Rai ещё загружается, отвечу сразу после загрузки…") + `</div>`;
    log.append(pending);
    log.scrollTop = log.scrollHeight;
    save(); renderSidebar();
    let reply;
    try {
      const engine = await enginePromise;
      await new Promise((r) => setTimeout(r, 40));  // успеть показать «печатает…»
      const t0 = performance.now();
      const data = await engine.ask(chat.version, text, chat.id, history);
      const ms = Math.max(1, Math.round(performance.now() - t0));
      reply = {role: "rai", text: data.answer || "Результат не получен.", attachments: data.attachments || [],
               meta: (data.version_name || versionName(chat.version)) + " · " + ms + " мс"};
    } catch (e) {
      reply = {role: "rai", text: "Не удалось получить ответ. Попробуйте ещё раз.", meta: "ошибка"};
    }
    pending.remove();
    chat.messages.push(reply);
    chat.updated = Date.now();
    if (currentId === chat.id) renderMessage(reply);
    save(); renderSidebar();
    busy = false;
    sendBtn.disabled = false;
    log.scrollTop = log.scrollHeight;
    input.focus();
  }

    $("authNote").textContent = !authAvailable
      ? "Вход и регистрация работают, когда Rai запущен на своём сервере (python app.py или хостинг). Сейчас Rai работает прямо в браузере, чаты хранятся только здесь."
      : googleEnabled ? "" : "Вход через Google появится, когда на сервере задан GOOGLE_CLIENT_SECRET.";
    for (const f of dialog.querySelectorAll("input, .auth-form button")) f.disabled = !authAvailable;
    if (dialog.showModal) dialog.showModal(); else dialog.setAttribute("open", "");
  }
  function showTab(tab) {
    const reg = tab === "register";
    $("tabLogin").setAttribute("aria-selected", String(!reg));
    $("tabRegister").setAttribute("aria-selected", String(reg));
    $("loginForm").hidden = reg;
    $("registerForm").hidden = !reg;
    $("authTitle").textContent = reg ? "Регистрация" : "Вход в Rai";
  }
  $("tabLogin").addEventListener("click", () => showTab("login"));
  $("tabRegister").addEventListener("click", () => showTab("register"));
  $("authClose").addEventListener("click", () => dialog.close());

  async function authPost(path, body) {
    const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
                                 credentials: "same-origin", body: JSON.stringify(body)});
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "Ошибка " + r.status);
    return data;
  }
  async function submitAuth(e, path, body) {
    e.preventDefault();
    $("authError").hidden = true;
    try {
      const data = await authPost(path, body);
      authUser = data.user;
      dialog.close();
      renderAccount();
      toast("Здравствуйте, " + (authUser.name || authUser.login) + "!");
      await pullChats();
    } catch (err) {
      $("authError").textContent = err.message;
      $("authError").hidden = false;
    }
  }
  $("loginForm").addEventListener("submit", (e) => submitAuth(e, "auth/login",
    {login: $("loginName").value.trim(), password: $("loginPass").value}));
  $("registerForm").addEventListener("submit", (e) => submitAuth(e, "auth/register",
    {login: $("regLogin").value.trim(), name: $("regName").value.trim(), email: $("regEmail").value.trim(), password: $("regPass").value}));

  async function logout() {
    try { await authPost("auth/logout", {}); } catch (e) { /* всё равно выходим */ }
    authUser = null;
    // Чаты остаются в аккаунте; с этого устройства убираем, чтобы их не увидел следующий человек.
    chats = [makeChat()];
    currentId = chats[0].id;
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* нет доступа к хранилищу */ }
    renderAccount(); renderAll();
    toast("Вы вышли из аккаунта");
  }

  // Слияние: у каждого чата берём более свежую версию (из браузера или с сервера).
  async function pullChats() {
    if (!authUser) return;
    pulling = true;
    try {
      const r = await fetch("api/chats", {credentials: "same-origin"});
      if (!r.ok) return;
      const remote = (await r.json()).chats || [];
      const byId = new Map(remote.filter((c) => c && c.id && Array.isArray(c.messages)).map((c) => [c.id, c]));
      for (const c of chats) {
        if (!c.messages.length) continue;
        const other = byId.get(c.id);
        if (!other || (c.updated || 0) > (other.updated || 0)) byId.set(c.id, c);
      }
      if (byId.size) {
        chats = Array.from(byId.values()).sort((a, b) => b.updated - a.updated);
        if (!chats.some((c) => c.id === currentId)) currentId = chats[0].id;
      }
      renderAll();
    } finally {
      pulling = false;
    }
    save();
  }
  function schedulePush() {
    if (!authUser || pulling) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      try {
        const r = await fetch("api/chats", {method: "PUT", headers: {"Content-Type": "application/json"}, credentials: "same-origin",
                                            body: JSON.stringify({chats: chats.filter((c) => c.messages.length)})});
        if (!r.ok) toast((await r.json().catch(() => ({}))).error || "Не удалось сохранить чаты в аккаунт");
      } catch (e) { toast("Нет связи с сервером — чаты сохранены в браузере"); }
    }, 1200);
  }

  async function initAuth(engine) {
    authAvailable = engine.mode === "server" && engine.root === "";
    if (!authAvailable) return;
    try {
      const r = await fetch("auth/me", {credentials: "same-origin"});
      const d = await r.json();
      googleEnabled = !!d.google;
      authUser = d.user;
      renderAccount();
      if (authUser) await pullChats();
    } catch (e) { authAvailable = false; }
    const q = new URLSearchParams(location.search);
    const errors = {state: "Вход через Google не удался: устаревшая ссылка, попробуйте ещё раз.",
                    cancelled: "Вход через Google отменён.", google: "Google не подтвердил вход. Попробуйте ещё раз.",
                    already_linked: "Этот Google уже привязан к другому аккаунту.",
                    google_not_configured: "Вход через Google ещё не настроен на сервере."};
    if (q.get("auth") === "google" && authUser) toast("Вы вошли через Google");
    if (q.get("auth_error")) toast(errors[q.get("auth_error")] || "Не удалось войти");
    if (q.has("auth") || q.has("auth_error")) history.replaceState(null, "", location.pathname);
  }

  load();
  renderAll();
  renderAccount();

  const enginePromise = startEngine().then(async (engine) => {
    try {
      const list = await engine.versions();
      if (Array.isArray(list) && list.length) { VERSIONS = list; renderVersions(); renderSidebar(); }
    } catch (e) { /* остаёмся со встроенным списком */ }
    engineReady = true;
    setStatus("ready", engine.mode === "server" ? "Сервер Rai" : "Rai работает в браузере");
    initAuth(engine);
    return engine;
  }).catch((err) => {
    setStatus("error", "Rai не запустился");
    const box = document.createElement("div");
    box.className = "inner msg rai";
    box.innerHTML = `<div class="who">Rai</div><div class="bubble md"></div>`;
    box.querySelector(".bubble").innerHTML = renderMarkdown("**Не получилось запустить Rai:** " + err.message.replace(/\n/g, "\n\n") +
      "\n\nПроверьте интернет (или не блокирует ли антивирус загрузку) и попробуйте снова.");
    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "btn red retry";
    retry.textContent = "Попробовать снова";
    retry.addEventListener("click", () => location.reload());
    box.append(retry);
    log.append(box);
    throw err;
  });
})();
</script>
</body>
</html>
