<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
  /* Настройки (можно задать до этого файла через window.RAI_CONFIG):
     api     — адрес Python-сервера Rai, например "https://rai-xxxx.onrender.com".
               Не задан: если страницу отдаёт сам сервер Rai — используется он,
               иначе Rai запускается прямо в браузере (Python через Pyodide).
     pyBase  — откуда брать .py файлы в браузерном режиме (по умолчанию — рядом со страницей).
     pyodide — свой адрес Pyodide (stdlib — свой адрес python_stdlib.zip, если нужно). */
  window.RAI_CONFIG = Object.assign({
    api: null,
    pyBase: "./",
    pyodide: null
  }, window.RAI_CONFIG || {});
  /* Откуда пробовать загрузить Pyodide, по очереди: свой адрес (если задан),
     папка pyodide/ рядом со страницей (есть в репозитории), затем CDN. */
  window.RAI_PYODIDE_SOURCES = [
    "pyodide/",
    "https://cdn.jsdelivr.net/npm/pyodide@314.0.7/",
    "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/",
    "https://unpkg.com/pyodide@314.0.7/"
  ];
</script>
<style>
  /* Layout: слева список чатов, справа чат — шапка с версией, лента, строка ввода.
     Стиль: чёрный с красным, одна тёмная тема. */
  :root {
    --bg: #0b0b0c;
    --side: #0f0f11;
    --panel: #151517;
    --panel-2: #1d1d20;
    --line: #2a2a2e;
    --fg: #f3f1f1;
    --muted: #9b9599;
    --red: #e10600;
    --red-hi: #ff2a2a;
    --red-soft: #2b0b0b;
    --ink: #ffffff;
    --ok: #3ccf7a;
    --warn: #f0b23c;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 var(--font-body);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  button { font: inherit; color: inherit; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-columns: 280px minmax(0, 1fr); }

  /* ---------- список чатов ---------- */
  #sidebar {
    background: var(--side); border-right: 1px solid var(--line);
    display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; padding: 18px 18px 14px; }
  .logo { font: 800 26px/1 var(--font-display); letter-spacing: -0.02em; }
  .logo span { color: var(--red); }
  .byline { font: 500 11px/1.2 var(--font-mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  #newChat {
    margin: 0 14px 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 14px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--red); color: var(--ink); font-weight: 600;
  }
  #newChat:hover { background: var(--red-hi); }
  #chatList { overflow-y: auto; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
  .chat-item { position: relative; border-radius: 9px; }
  .chat-item > button.open {
    width: 100%; text-align: left; cursor: pointer; border: 0; background: transparent;
    padding: 9px 64px 9px 12px; border-radius: 9px; display: block;
  }
  .chat-item > button.open:hover { background: var(--panel); }
  .chat-item.active > button.open { background: var(--red-soft); }
  .chat-item .t { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .m { display: block; font: 400 11px/1.4 var(--font-mono); color: var(--muted); }
  .chat-item .acts { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); display: flex; gap: 2px; opacity: 0; }
  .chat-item:hover .acts, .chat-item.active .acts, .chat-item .acts:focus-within { opacity: 1; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 6px; border-radius: 8px;
  }
  .icon-btn:hover { color: var(--fg); background: var(--panel-2); }
  .chat-item input {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--red);
    background: var(--panel); color: var(--fg); font: inherit;
  }
  .confirm { padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); border-radius: 9px; }
  .confirm div { display: flex; gap: 6px; }
  .btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .btn.red { background: var(--red); border-color: var(--red); color: var(--ink); }
  .side-foot { padding: 12px 14px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .account { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; background: var(--red); color: var(--ink);
    display: grid; place-items: center; font-weight: 700; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .account .who-am { flex: 1; min-width: 0; }
  .account .who-am b { display: block; color: var(--fg); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .account .who-am span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #loginBtn { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--red); background: transparent; color: var(--fg); cursor: pointer; font-weight: 600; }
  #loginBtn:hover { background: var(--red-soft); }
  .back-link { display: block; text-align: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--red);
    color: var(--fg); text-decoration: none; font-weight: 600; }
  .back-link:hover { background: var(--red-soft); }

  /* окно входа */
  dialog#authDialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--panel); color: var(--fg); width: min(420px, calc(100vw - 32px)); }
  dialog#authDialog::backdrop { background: rgba(0, 0, 0, .7); }
  .auth-card { padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 14px; }
  .auth-head { display: flex; align-items: center; justify-content: space-between; }
  .auth-head h2 { margin: 0; font: 800 20px/1.2 var(--font-display); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; }
  .tabs button { border: 0; background: transparent; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--red); color: var(--ink); }
  .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px; border-radius: 10px;
    background: #ffffff; color: #1f1f1f; font-weight: 600; text-decoration: none; border: 0; }
  .google-btn:hover { background: #f1f1f1; }
  .google-btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .auth-form { display: flex; flex-direction: column; gap: 10px; }
  .auth-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .auth-form input { padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 15px var(--font-body); }
  .auth-form input:focus { border-color: var(--red); outline: none; }
  .auth-form .btn { padding: 11px; font-size: 15px; font-weight: 600; }
  .auth-error { margin: 0; color: var(--red-hi); font-size: 13px; }
  .auth-note { margin: 0; font-size: 12.5px; color: var(--muted); }

  .photo { margin: 4px 0 0; display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
  .photo img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); background: #000; }
  .photo figcaption { font-size: 12.5px; color: var(--muted); }
  .photo a { color: var(--red-hi); }

  /* ---------- основная часть ---------- */
  main { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); min-width: 0; min-height: 0; }
  main > * { min-width: 0; }
  header {
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px 24px 12px; border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #menuBtn { display: none; }
  #chatTitle {
    flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; cursor: pointer;
    font: 600 17px/1.3 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px 0;
  }
  .status {
    display: inline-flex; align-items: center; gap: 8px; flex: none;
    font: 500 12px/1 var(--font-mono); color: var(--muted);
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; max-width: 50%;
  }
  #statusText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .status[data-state="ready"] .dot { background: var(--ok); }
  .status[data-state="error"] .dot { background: var(--red-hi); }
  .versions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .versions button {
    cursor: pointer; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; font-size: 13px; font-weight: 500;
  }
  .versions button:hover { border-color: var(--red); }
  .versions button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--ink); }
  #features { font-size: 12.5px; color: var(--muted); margin: 0; }

  #log { overflow-y: auto; min-height: 0; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .inner { width: 100%; max-width: 860px; margin: 0 auto; }

  .welcome { display: flex; flex-direction: column; gap: 16px; padding-block: 6vh 12px; }
  .welcome h1 { margin: 0; font: 800 clamp(30px, 5vw, 44px)/1.05 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
  .welcome h1 span { color: var(--red); }
  .welcome p { margin: 0; color: var(--muted); max-width: 60ch; }
  .examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .examples button {
    text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 2px;
  }
  .examples button:hover { border-color: var(--red); }
  .examples b { font-weight: 600; }
  .examples small { color: var(--muted); font-size: 12px; }

  .msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: var(--red-soft); border: 1px solid #4a1111; padding: 10px 14px; border-radius: 14px 14px 4px 14px;
    max-width: min(640px, 92%); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.rai .bubble { max-width: 100%; min-width: 0; overflow-wrap: anywhere; }
  .msg.pending .bubble { color: var(--muted); }
  .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--red); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
  .who { font: 600 12px/1 var(--font-mono); color: var(--red-hi); letter-spacing: .04em; }
  .actions { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .actions .icon-btn { font-size: 12.5px; padding: 5px 8px; }
  .meta { font: 400 11px/1 var(--font-mono); color: var(--muted); margin-left: 6px; }

  /* markdown */
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h2, .md h3, .md h4 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; margin: 16px 0 10px; line-height: 1.25; }
  .md h2 { font-size: 20px; } .md h3 { font-size: 17px; } .md h4 { font-size: 15px; }
  .md strong { color: #fff; font-weight: 700; }
  .md mark { background: rgba(225, 6, 0, .28); color: #fff; padding: 0 3px; border-radius: 3px; }
  .md code { font: 13px/1.4 var(--font-mono); background: var(--panel-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; } .md li::marker { color: var(--red-hi); }
  .md blockquote { margin: 0 0 10px; padding: 8px 14px; border-left: 3px solid var(--red); background: var(--panel); border-radius: 0 8px 8px 0; color: #ddd; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .md a { color: var(--red-hi); }
  .table-wrap { overflow-x: auto; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  .md th { text-align: left; background: var(--panel-2); color: var(--red-hi); font-weight: 600; border-bottom: 2px solid var(--red); }
  .md th, .md td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .md tr:last-child td { border-bottom: 0; }
  .md tbody tr:nth-child(even) td { background: rgba(255, 255, 255, .02); }
  .codeblock { margin: 0 0 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0e0e10; }
  .codehead { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px; background: var(--panel-2); font: 500 12px/1 var(--font-mono); color: var(--muted); }
  .codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
  .codeblock code { background: none; border: 0; padding: 0; font-size: 13px; color: #f0e9e9; }

  /* картинки */
  .art { margin: 4px 0 0; display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
  .art img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); display: block; background: #000; cursor: zoom-in; }

  /* презентации */
  .deck { margin-top: 4px; max-width: 720px; display: flex; flex-direction: column; gap: 8px; }
  .stage { position: relative; aspect-ratio: 16 / 9; container-type: inline-size; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #0b0b0c; cursor: pointer; }
  .stage:fullscreen { border: 0; border-radius: 0; aspect-ratio: auto; width: 100vw; height: 100vh; display: grid; place-items: center; background: #000; }
  .stage:fullscreen .slide { position: relative; inset: auto; width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; }
  .deck-bar .count { font: 500 12px/1 var(--font-mono); color: var(--muted); padding: 0 6px; font-variant-numeric: tabular-nums; }
  .deck-bar .spacer { flex: 1; }

  /* ---------- ввод ---------- */
  .composer { padding: 10px 24px 18px; border-top: 1px solid var(--line); }
  #listening { font: 500 12px/1.4 var(--font-mono); color: var(--red-hi); margin: 0 0 8px; }
  form { display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; min-width: 0; resize: none; max-height: 180px; min-height: 48px;
    padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font: 15px/1.4 var(--font-body);
  }
  #input:focus { border-color: var(--red); outline: none; }
  .round {
    flex: none; width: 48px; height: 48px; border-radius: 12px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg);
  }
  .round:hover { border-color: var(--red); }
  #mic.on { background: var(--red); border-color: var(--red); color: var(--ink); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(225, 6, 0, .6) } 70% { box-shadow: 0 0 0 12px rgba(225, 6, 0, 0) } 100% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0) } }
  #send { background: var(--red); border-color: var(--red); color: var(--ink); }
  #send:hover { background: var(--red-hi); }
  #send:disabled { opacity: .5; cursor: progress; }
  .hint { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }

  #toast {
    position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--red); color: var(--fg);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px);
  }
  .retry { align-self: flex-start; }
  #backdrop { display: none; }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    #sidebar {
      position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(300px, 86vw);
      padding-top: env(safe-area-inset-top, 0px); transform: translateX(-100%); transition: transform .2s;
    }
    body.menu-open #sidebar { transform: none; }
    body.menu-open #backdrop { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .6); }
    #menuBtn { display: inline-flex; }
    header, .composer { padding-inline: 16px; }
    #log { padding: 16px; }
    .status { max-width: 42%; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sidebar { transition: none; } #mic.on, .typing span { animation: none; }
  }
</style>
<style id="slide-css">
  .slide { position: absolute; inset: 0; background: #0b0b0c; color: #f3f1f1; padding: 6cqw 7cqw 7cqw;
    display: flex; flex-direction: column; gap: 2.4cqw; overflow: hidden;
    font-family: "Onest", "Segoe UI", system-ui, sans-serif; }
  .slide::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .8cqw; background: #e10600; }
  .slide .kicker { font: 500 1.5cqw/1 "JetBrains Mono", Consolas, monospace; color: #ff2a2a; letter-spacing: .15em; text-transform: uppercase; }
  .slide h2 { margin: 0; font: 800 4cqw/1.12 "Unbounded", "Arial Black", sans-serif; letter-spacing: -.01em; }
  .slide ul { margin: 0; padding-left: 3cqw; font-size: 2.5cqw; line-height: 1.4; display: flex; flex-direction: column; gap: 1.3cqw; }
  .slide li::marker { color: #e10600; }
  .slide code { font-family: "JetBrains Mono", Consolas, monospace; background: #1d1d20; padding: 0 .5cqw; border-radius: .5cqw; }
  .slide strong { color: #fff; }
  .slide mark { background: rgba(225, 6, 0, .35); color: #fff; }
  .slide pre { margin: 0; padding: 2.2cqw; background: #151517; border: 1px solid #2a2a2e; border-radius: 1cqw;
    font: 1.9cqw/1.5 "JetBrains Mono", Consolas, monospace; white-space: pre; overflow: hidden; color: #f0e9e9; }
  .slide pre code { background: none; padding: 0; }
  .slide table { border-collapse: collapse; font-size: 1.9cqw; }
  .slide th { text-align: left; color: #ff2a2a; border-bottom: .3cqw solid #e10600; }
  .slide th, .slide td { padding: .9cqw 1.6cqw; border-bottom: 1px solid #2a2a2e; }
  .slide.cover, .slide.end { justify-content: center; }
  .slide.cover h1, .slide.end h1 { margin: 0; font: 800 7cqw/1.02 "Unbounded", "Arial Black", sans-serif; letter-spacing: -.02em; }
  .slide.cover h1::after { content: ""; display: block; width: 12cqw; height: .9cqw; background: #e10600; margin-top: 2.6cqw; }
  .slide .sub { font-size: 2.4cqw; color: #9b9599; }
  .slide .num { position: absolute; right: 3cqw; bottom: 2.4cqw; font: 500 1.3cqw/1 "JetBrains Mono", monospace; color: #9b9599; }
  .slide > .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .6; }
  .slide.cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0b0b0c 32%, rgba(11, 11, 12, .55) 70%, rgba(11, 11, 12, .2)); }
  .slide.cover > :not(.bg):not(.num) { position: relative; }
  .slide .cols { display: grid; grid-template-columns: 1.25fr .75fr; gap: 4cqw; align-items: center; flex: 1; min-height: 0; }
  .slide .side { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 1.4cqw; border: 1px solid #2a2a2e; }
  /* появление элементов */
  .slide.play .kicker, .slide.play h1, .slide.play h2, .slide.play .sub { animation: rai-rise .6s cubic-bezier(.2, .8, .2, 1) both; }
  .slide.play h1, .slide.play h2 { animation-delay: .08s; }
  .slide.play .sub { animation-delay: .3s; }
  .slide.play li { animation: rai-rise .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(.25s + var(--i, 0) * .14s); }
  .slide.play pre, .slide.play table { animation: rai-rise .6s .25s both; }
  .slide.play .side { animation: rai-pop .8s .2s cubic-bezier(.2, .8, .2, 1) both; }
  .slide.play > .bg { animation: rai-drift 14s ease-out both; }
  .slide.play.cover h1::after { transform-origin: left; animation: rai-grow .8s .5s cubic-bezier(.2, .8, .2, 1) both; }
  /* переходы между слайдами */
  .slide.t-fade { animation: rai-fade .6s both; }
  .slide.t-slide { animation: rai-slide .6s cubic-bezier(.2, .8, .2, 1) both; }
  .slide.t-zoom { animation: rai-zoom .6s cubic-bezier(.2, .8, .2, 1) both; }
  .slide.t-wipe { animation: rai-wipe .7s cubic-bezier(.6, 0, .2, 1) both; }
  @keyframes rai-rise { from { opacity: 0; transform: translateY(2.5cqw); } to { opacity: 1; transform: none; } }
  @keyframes rai-pop { from { opacity: 0; transform: scale(.9) rotate(-2deg); } to { opacity: 1; transform: none; } }
  @keyframes rai-drift { from { transform: scale(1.14); } to { transform: scale(1); } }
  @keyframes rai-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes rai-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rai-slide { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 10cqw)); } to { opacity: 1; transform: none; } }
  @keyframes rai-zoom { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: none; } }
  @keyframes rai-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @media (prefers-reduced-motion: reduce) { .slide, .slide * { animation: none !important; } }

<script type="application/json" id="rai-files">{"versions.py": "\"\"\"Четыре версии Rai: Pro, Pro Fast, Pro Plus, Pro Sun.\n\nВсе версии работают на собственном движке, без внешних API.\nОтличаются набором возможностей.\n\"\"\"\n\nimport os\nfrom dataclasses import dataclass, field\nfrom typing import Optional\n\n\n@dataclass(frozen=True)\nclass Version:\n    id: str\n    name: str\n    description: str\n    search: str                 # \"keywords\" (быстро) или \"tfidf\" (по смыслу)\n    fuzzy: bool                 # понимать опечатки (буквенные триграммы)\n    skills: frozenset           # встроенные навыки\n    context: bool = False       # помнит имя и тему разговора, «подробнее»\n    memory: bool = False        # «запомни, что …» — память фактов\n    multi: bool = False         # несколько вопросов в одном сообщении\n    detailed: bool = False      # сразу даёт подробный ответ\n    suggestions: bool = False   # предлагает похожие вопросы, если не понял\n    threshold: float = 0.35     # минимальное сходство для ответа\n    features: list = field(default_factory=list)\n\n    def public(self) -> dict:\n        return {\n            \"id\": self.id,\n            \"name\": self.name,\n            \"description\": self.description,\n            \"features\": self.features,\n        }\n\n\nONLINE = {\"weather\", \"currency\", \"translate\"}\nALL_SKILLS = frozenset({\"calc\", \"time\", \"convert\", \"random\", \"password\", \"text\", \"table\", \"capital\", \"image\", \"slides\",\n                        \"web\"} | ONLINE)\n\nVERSIONS = {\n    \"pro\": Version(\n        id=\"pro\",\n        name=\"Rai Pro\",\n        description=\"Основная версия: понимает смысл вопроса, основные навыки.\",\n        search=\"tfidf\",\n        fuzzy=False,\n        skills=frozenset({\"calc\", \"time\", \"convert\", \"random\", \"table\", \"capital\", \"image\", \"web\"} | ONLINE),\n        threshold=0.35,\n        features=[\"поиск по смыслу\", \"погода\", \"валюты\", \"перевод\", \"поиск в интернете\", \"таблицы\", \"картинки\"],\n    ),\n    \"pro-fast\": Version(\n        id=\"pro-fast\",\n        name=\"Rai Pro Fast\",\n        description=\"Самая быстрая версия: поиск по ключевым словам.\",\n        search=\"keywords\",\n        fuzzy=False,\n        skills=frozenset({\"calc\", \"time\", \"capital\"} | ONLINE),\n        threshold=0.3,\n        features=[\"поиск по ключевым словам\", \"калькулятор\", \"погода\", \"валюты\", \"перевод\"],\n    ),\n    \"pro-plus\": Version(\n        id=\"pro-plus\",\n        name=\"Rai Pro Plus\",\n        description=\"Понимает опечатки, все навыки, картинки и презентации, помнит имя.\",\n        search=\"tfidf\",\n        fuzzy=True,\n        skills=ALL_SKILLS,\n        context=True,\n        suggestions=True,\n        threshold=0.3,\n        features=[\"понимает опечатки\", \"все навыки\", \"картинки\", \"презентации\", \"помнит имя\",\n                  \"«подробнее» по теме\", \"подсказки\"],\n    ),\n    \"pro-sun\": Version(\n        id=\"pro-sun\",\n        name=\"Rai Pro Sun\",\n        description=\"Максимальная версия: память фактов, несколько вопросов сразу, подробные ответы.\",\n        search=\"tfidf\",\n        fuzzy=True,\n        skills=ALL_SKILLS,\n        context=True,\n        memory=True,\n        multi=True,\n        detailed=True,\n        suggestions=True,\n        threshold=0.27,\n        features=[\"всё из Pro Plus\", \"память фактов («запомни, что …»)\",\n                  \"несколько вопросов сразу\", \"подробные ответы\", \"большие презентации\"],\n    ),\n}\n\nDEFAULT_VERSION = os.environ.get(\"RAI_DEFAULT_VERSION\", \"pro\").strip() or \"pro\"\n\n# Разные написания, которые может прислать сайт: \"Pro Fast\", \"pro_fast\", \"profast\"…\n_ALIASES = {key.replace(\"-\", \"\"): key for key in VERSIONS}\n\n\ndef resolve(version: Optional[str]) -> Optional[Version]:\n    \"\"\"Вернуть версию по id/названию или None, если такой нет.\"\"\"\n    if not version:\n        return VERSIONS.get(DEFAULT_VERSION, VERSIONS[\"pro\"])\n    key = str(version).strip().lower()\n    if key.startswith(\"rai\"):\n        key = key[3:]\n    key = key.replace(\" \", \"\").replace(\"_\", \"\").replace(\"-\", \"\")\n    return VERSIONS.get(_ALIASES.get(key, \"\"))\n", "nlp.py": "\"\"\"Собственная обработка текста Rai: нормализация, стемминг, TF-IDF поиск.\n\nНикаких внешних библиотек и сервисов — только стандартный Python.\n\"\"\"\n\nimport math\nimport re\nfrom collections import Counter\n\n_WORD_RE = re.compile(r\"[a-zа-я0-9]+\")\n\n# Слова-«шум»: почти не несут смысла для поиска ответа.\n# Вопросительные слова (что, как, кто…) специально оставлены — они различают вопросы.\nSTOPWORDS = {\n    \"и\", \"в\", \"во\", \"на\", \"а\", \"ну\", \"же\", \"ли\", \"бы\", \"то\", \"пожалуйста\", \"плиз\",\n    \"please\", \"the\", \"a\", \"an\", \"is\", \"are\", \"to\", \"of\", \"rai\", \"рай\", \"бот\",\n    \"слушай\", \"скажи\", \"подскажи\", \"расскажи\", \"мне\", \"эй\", \"вот\", \"это\", \"у\", \"с\", \"со\",\n}\n\n# Окончания русского языка, от длинных к коротким.\n_ENDINGS = sorted(\n    \"\"\"\n    иями ями ами иях ях ах ией ией ов ев ей ий ый ой ая яя ое ее ие ые ого его ому ему\n    ыми ими ую юю ешь ете ишь ите ает яет ет ит ут ют ат ят ать ять ить еть уть ть\n    ла ло ли ил ыл ал ял ом ем ам ям ость ости ение ения ением ении иться аться ешься\n    а я о е и ы у ю ь й\n    \"\"\".split(),\n    key=len,\n    reverse=True,\n)\n_EN_ENDINGS = (\"ing\", \"ed\", \"es\", \"s\")\n\n\ndef normalize(text: str) -> str:\n    text = (text or \"\").lower().replace(\"ё\", \"е\")\n    return \" \".join(_WORD_RE.findall(text))\n\n\ndef stem(word: str) -> str:\n    \"\"\"Простой собственный стеммер: отрезает типичные окончания.\"\"\"\n    if word.isdigit() or len(word) <= 3:\n        return word\n    if re.fullmatch(r\"[a-z]+\", word):\n        for end in _EN_ENDINGS:\n            if word.endswith(end) and len(word) - len(end) >= 3:\n                return word[: -len(end)]\n        return word\n    for refl in (\"ся\", \"сь\"):\n        if word.endswith(refl) and len(word) - 2 >= 3:\n            word = word[:-2]\n            break\n    for end in _ENDINGS:\n        if word.endswith(end) and len(word) - len(end) >= 3:\n            return word[: -len(end)]\n    return word\n\n\ndef tokens(text: str, keep_stopwords: bool = False) -> list:\n    words = normalize(text).split()\n    return [stem(w) for w in words if keep_stopwords or w not in STOPWORDS]\n\n\ndef trigrams(text: str) -> list:\n    \"\"\"Буквенные триграммы — дают устойчивость к опечаткам.\"\"\"\n    grams = []\n    for w in normalize(text).split():\n        if w in STOPWORDS:\n            continue\n        w = f\"#{w}#\"\n        grams.extend(\"~\" + w[i : i + 3] for i in range(len(w) - 2))\n    return grams\n\n\ndef features(text: str, fuzzy: bool) -> Counter:\n    feats = Counter(tokens(text))\n    if fuzzy:\n        feats.update(trigrams(text))\n    return feats\n\n\nclass TfidfIndex:\n    \"\"\"Мини-поисковик: находит документ, наиболее похожий на запрос.\"\"\"\n\n    def __init__(self, docs, fuzzy: bool = False):\n        # docs: список (ключ, текст)\n        self.fuzzy = fuzzy\n        self.keys = []\n        raw = []\n        df = Counter()\n        for key, text in docs:\n            f = features(text, fuzzy)\n            if not f:\n                continue\n            self.keys.append(key)\n            raw.append(f)\n            df.update(f.keys())\n        n = max(len(raw), 1)\n        self.idf = {t: math.log((1 + n) / (1 + c)) + 1.0 for t, c in df.items()}\n        self.vectors = [self._weigh(f) for f in raw]\n\n    def _weigh(self, feats: Counter) -> dict:\n        vec = {}\n        for t, c in feats.items():\n            w = self.idf.get(t)\n            if w is None:\n                continue\n            # Слова весят больше, чем отдельные триграммы.\n            vec[t] = (1 + math.log(c)) * w * (0.35 if t.startswith(\"~\") else 1.0)\n        norm = math.sqrt(sum(v * v for v in vec.values())) or 1.0\n        return {t: v / norm for t, v in vec.items()}\n\n    def search(self, text: str, limit: int = None) -> list:\n        \"\"\"Вернуть [(ключ, сходство 0..1)], лучшее сходство на ключ.\"\"\"\n        q = self._weigh(features(text, self.fuzzy))\n        if not q:\n            return []\n        best = {}\n        for key, vec in zip(self.keys, self.vectors):\n            score = sum(w * vec.get(t, 0.0) for t, w in q.items())\n            if score > best.get(key, 0.0):\n                best[key] = score\n        return sorted(best.items(), key=lambda kv: kv[1], reverse=True)[:limit]\n\n\nclass KeywordIndex:\n    \"\"\"Самый быстрый поиск (Pro Fast): доля общих основ слов.\"\"\"\n\n    def __init__(self, docs):\n        self.docs = [(key, set(tokens(text))) for key, text in docs]\n        self.docs = [(k, s) for k, s in self.docs if s]\n\n    def search(self, text: str, limit: int = None) -> list:\n        q = set(tokens(text))\n        if not q:\n            return []\n        best = {}\n        for key, words in self.docs:\n            common = len(q & words)\n            if not common:\n                continue\n            score = common / len(q | words)\n            if score > best.get(key, 0.0):\n                best[key] = score\n        return sorted(best.items(), key=lambda kv: kv[1], reverse=True)[:limit]\n\n\n# Общие слова: на одних только них совпадение не считается уверенным.\nGENERIC = {\n    stem(w)\n    for w in \"\"\"\n    что такое такой такая как какой какая какие кто где зачем почему когда сколько\n    ты тебя тебе я меня мне мой моя мое твой есть можно нужно надо хочу сделать делать\n    этот был была будет мы вы вас нас он она они про для из от до по за над под при\n    не нет да или еще уже очень так где-то\n    \"\"\".split()\n}\n\n_EN = \"qwertyuiop[]asdfghjkl;'zxcvbnm,.`\"\n_RU = \"йцукенгшщзхъфывапролджэячсмитьбюё\"\n_LAYOUT = str.maketrans(_EN, _RU)\n\n\ndef levenshtein(a: str, b: str, limit: int = 3) -> int:\n    if abs(len(a) - len(b)) > limit:\n        return limit + 1\n    prev = list(range(len(b) + 1))\n    for i, ca in enumerate(a, 1):\n        cur = [i]\n        for j, cb in enumerate(b, 1):\n            cur.append(min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (ca != cb)))\n        if min(cur) > limit:\n            return limit + 1\n        prev = cur\n    return prev[-1]\n\n\nclass SpellChecker:\n    \"\"\"Собственный корректор: исправляет опечатки и неверную раскладку (ghbdtn → привет).\"\"\"\n\n    def __init__(self, texts):\n        self.vocab = set()\n        for t in texts:\n            self.vocab.update(normalize(t).split())\n        self.stems = {stem(w) for w in self.vocab}\n\n    def _known(self, word: str) -> bool:\n        return word in self.vocab or stem(word) in self.stems\n\n    def _closest(self, word: str):\n        limit = 1 if len(word) <= 5 else 2\n        best, best_d = None, limit + 1\n        for v in self.vocab:\n            if abs(len(v) - len(word)) > limit:\n                continue\n            d = levenshtein(word, v, limit)\n            if d < best_d:\n                best, best_d = v, d\n        return best\n\n    def correct_word(self, word: str) -> str:\n        if word.isdigit() or self._known(word):\n            return word\n        if re.fullmatch(r\"[a-z\\[\\];',.`]+\", word):\n            swapped = word.translate(_LAYOUT)\n            if self._known(swapped):\n                return swapped\n        if len(word) < 4:\n            return word\n        return self._closest(word) or word\n\n    def correct(self, text: str) -> str:\n        # Раскладку проверяем по исходному тексту: normalize() выкидывает [];',.`\n        raw = (text or \"\").lower().replace(\"ё\", \"е\").split()\n        out = []\n        for chunk in raw:\n            if re.fullmatch(r\"[a-z\\[\\];',.`]+\", chunk.strip(\"?!\")):\n                fixed = self.correct_word(chunk.strip(\"?!\"))\n                if fixed != chunk.strip(\"?!\"):\n                    out.append(fixed)\n                    continue\n            out.extend(self.correct_word(w) for w in normalize(chunk).split())\n        return \" \".join(out)\n", "skills.py": "\"\"\"Встроенные навыки Rai. Каждый навык: функция(text) -> ответ или None.\"\"\"\n\nimport ast\nimport operator\nimport os\nimport random\nimport re\nimport secrets\nimport string\nfrom datetime import datetime, timedelta, timezone\n\ntry:\n    from zoneinfo import ZoneInfo\nexcept ImportError:  # Python < 3.9\n    ZoneInfo = None\n\n\ndef _now() -> datetime:\n    tz_name = os.environ.get(\"RAI_TZ\", \"Europe/Moscow\")\n    if ZoneInfo is not None:\n        try:\n            return datetime.now(ZoneInfo(tz_name))\n        except Exception:\n            pass\n    return datetime.now(timezone(timedelta(hours=3)))\n\n\ndef _low(text: str) -> str:\n    return (text or \"\").lower().replace(\"ё\", \"е\").strip()\n\n\n# ---------------------------------------------------------------- калькулятор\n\n_OPS = {\n    ast.Add: operator.add,\n    ast.Sub: operator.sub,\n    ast.Mult: operator.mul,\n    ast.Div: operator.truediv,\n    ast.FloorDiv: operator.floordiv,\n    ast.Mod: operator.mod,\n    ast.Pow: operator.pow,\n    ast.USub: operator.neg,\n    ast.UAdd: operator.pos,\n}\n\n_WORD_OPS = [\n    (r\"умножить на|умножь на|помножить на\", \"*\"),\n    (r\"разделить на|раздели на|поделить на|делить на\", \"/\"),\n    (r\"в степени\", \"**\"),\n    (r\"плюс\", \"+\"),\n    (r\"минус\", \"-\"),\n    (r\"(?<=\\d)\\s*[хx×]\\s*(?=\\d)\", \"*\"),\n    (r\"÷|:\", \"/\"),\n    (r\"\\^\", \"**\"),\n]\n\n\ndef _eval_node(node):\n    if isinstance(node, ast.Expression):\n        return _eval_node(node.body)\n    if isinstance(node, ast.Constant) and isinstance(node.value, (int, float)):\n        return node.value\n    if isinstance(node, ast.UnaryOp) and type(node.op) in _OPS:\n        return _OPS[type(node.op)](_eval_node(node.operand))\n    if isinstance(node, ast.BinOp) and type(node.op) in _OPS:\n        left, right = _eval_node(node.left), _eval_node(node.right)\n        if isinstance(node.op, ast.Pow) and (abs(right) > 100 or abs(left) > 10**6):\n            raise ValueError(\"слишком большая степень\")\n        return _OPS[type(node.op)](left, right)\n    raise ValueError(\"недопустимое выражение\")\n\n\ndef _fmt(num) -> str:\n    if isinstance(num, float):\n        if num.is_integer() and abs(num) < 1e15:\n            return str(int(num))\n        return f\"{num:.10g}\"\n    return str(num)\n\n\ndef calculator(text: str):\n    low = _low(text)\n    sqrt = re.search(r\"(?:квадратный\\s+)?корень\\s+(?:из\\s+)?(-?\\d+(?:[.,]\\d+)?)\", low)\n    if sqrt:\n        value = float(sqrt.group(1).replace(\",\", \".\"))\n        if value < 0:\n            return \"Корень из отрицательного числа в действительных числах не существует.\"\n        return f\"√{_fmt(value)} = {_fmt(value ** 0.5)}\"\n\n    percent = re.search(r\"(\\d+(?:[.,]\\d+)?)\\s*%\\s*(?:от)\\s*(\\d+(?:[.,]\\d+)?)\", low)\n    if percent:\n        p, base = (float(x.replace(\",\", \".\")) for x in percent.groups())\n        return f\"{_fmt(p)}% от {_fmt(base)} = {_fmt(base * p / 100)}\"\n\n    expr = re.sub(r\"^(сколько будет|сколько|посчитай|вычисли|реши|calc|calculate)\\s*\", \"\", low)\n    expr = expr.rstrip(\"?=! \")\n    for pattern, repl in _WORD_OPS:\n        expr = re.sub(pattern, repl, expr)\n    expr = expr.replace(\",\", \".\")\n    if not re.fullmatch(r\"[\\d\\s.+\\-*/%()]+\", expr or \"x\"):\n        return None\n    if not re.search(r\"\\d\", expr) or not re.search(r\"\\d\\s*[+\\-*/%]\", expr):\n        return None\n    try:\n        result = _eval_node(ast.parse(expr, mode=\"eval\"))\n    except ZeroDivisionError:\n        return \"На ноль делить нельзя.\"\n    except (ValueError, SyntaxError, TypeError, OverflowError):\n        return None\n    return f\"{expr.strip()} = {_fmt(result)}\"\n\n\n# ---------------------------------------------------------------- дата и время\n\n_WEEKDAYS = [\"понедельник\", \"вторник\", \"среда\", \"четверг\", \"пятница\", \"суббота\", \"воскресенье\"]\n_MONTHS = [\n    \"января\", \"февраля\", \"марта\", \"апреля\", \"мая\", \"июня\",\n    \"июля\", \"августа\", \"сентября\", \"октября\", \"ноября\", \"декабря\",\n]\n\n\ndef date_time(text: str):\n    low = _low(text)\n    now = _now()\n    if re.search(r\"который час|сколько времени|текущее время|время сейчас|какое время\", low):\n        return f\"Сейчас {now:%H:%M}.\"\n    if re.search(r\"день недели|какой сегодня день\", low):\n        return f\"Сегодня {_WEEKDAYS[now.weekday()]}.\"\n    if re.search(r\"какое сегодня число|какое число|сегодняшняя дата|какая дата|какой сегодня год|какой год\", low):\n        return (\n            f\"Сегодня {now.day} {_MONTHS[now.month - 1]} {now.year} года, \"\n            f\"{_WEEKDAYS[now.weekday()]}.\"\n        )\n    return None\n\n\n# ---------------------------------------------------------------- конвертер\n\n_LENGTH = {\"мм\": 0.001, \"см\": 0.01, \"дм\": 0.1, \"м\": 1.0, \"км\": 1000.0,\n           \"дюйм\": 0.0254, \"фут\": 0.3048, \"ярд\": 0.9144, \"миля\": 1609.344}\n_MASS = {\"мг\": 1e-6, \"г\": 0.001, \"кг\": 1.0, \"ц\": 100.0, \"т\": 1000.0,\n         \"фунт\": 0.45359237, \"унция\": 0.028349523125}\n_SHORT = {\"миля\": \"миль\", \"дюйм\": \"дюйм.\", \"фут\": \"фут.\", \"ярд\": \"ярд.\", \"фунт\": \"фунт.\", \"унция\": \"унц.\"}\n_UNIT_ALIASES = {\n    \"миллиметр\": \"мм\", \"сантиметр\": \"см\", \"дециметр\": \"дм\", \"метр\": \"м\", \"километр\": \"км\",\n    \"дюйм\": \"дюйм\", \"фут\": \"фут\", \"ярд\": \"ярд\", \"мил\": \"миля\",\n    \"миллиграмм\": \"мг\", \"грамм\": \"г\", \"килограмм\": \"кг\", \"центнер\": \"ц\", \"тонн\": \"т\",\n    \"фунт\": \"фунт\", \"унци\": \"унция\",\n    \"цельси\": \"c\", \"фаренгейт\": \"f\", \"кельвин\": \"k\",\n}\n\n\ndef _unit(word: str):\n    word = word.strip(\". \")\n    if word in _LENGTH or word in _MASS or word in (\"c\", \"f\", \"k\", \"°c\", \"°f\"):\n        return word.lstrip(\"°\")\n    for prefix, unit in _UNIT_ALIASES.items():\n        if word.startswith(prefix):\n            return unit\n    return None\n\n\ndef converter(text: str):\n    low = _low(text)\n    m = re.search(\n        r\"(-?\\d+(?:[.,]\\d+)?)\\s*(°?[a-zа-я]+)\\.?\\s+(?:в|to|=)\\s+(°?[a-zа-я]+)\", low\n    )\n    if not m:\n        return None\n    value = float(m.group(1).replace(\",\", \".\"))\n    src, dst = _unit(m.group(2)), _unit(m.group(3))\n    if not src or not dst:\n        return None\n    for table in (_LENGTH, _MASS):\n        if src in table and dst in table:\n            result = value * table[src] / table[dst]\n            return f\"{_fmt(value)} {_SHORT.get(src, src)} = {_fmt(round(result, 6))} {_SHORT.get(dst, dst)}\"\n    temps = {\"c\", \"f\", \"k\"}\n    if src in temps and dst in temps:\n        c = {\"c\": value, \"f\": (value - 32) * 5 / 9, \"k\": value - 273.15}[src]\n        result = {\"c\": c, \"f\": c * 9 / 5 + 32, \"k\": c + 273.15}[dst]\n        names = {\"c\": \"°C\", \"f\": \"°F\", \"k\": \"K\"}\n        return f\"{_fmt(value)} {names[src]} = {_fmt(round(result, 2))} {names[dst]}\"\n    return \"Эти единицы нельзя перевести друг в друга.\"\n\n\n# ---------------------------------------------------------------- случайность\n\ndef randomness(text: str):\n    low = _low(text)\n    if re.search(r\"монет\", low) and re.search(r\"подбрось|брось|кинь|подкинь\", low):\n        return random.choice([\"Выпал орёл.\", \"Выпала решка.\"])\n    if re.search(r\"кубик\", low) and re.search(r\"брось|кинь|подкинь\", low):\n        return f\"На кубике выпало {random.randint(1, 6)}.\"\n    m = re.search(r\"случайн\\w* число(?:\\s+от\\s+(-?\\d+)\\s+до\\s+(-?\\d+))?\", low)\n    if m:\n        a, b = (int(m.group(1)), int(m.group(2))) if m.group(1) else (1, 100)\n        if a > b:\n            a, b = b, a\n        return f\"Случайное число от {a} до {b}: {random.randint(a, b)}.\"\n    m = re.search(r\"выбери\\s*(?:из|между)?\\s*:?\\s*(.+)\", low)\n    if m and re.search(r\",| или \", m.group(1)):\n        options = [o.strip(\" ?.!\") for o in re.split(r\",| или \", m.group(1)) if o.strip(\" ?.!\")]\n        if len(options) >= 2:\n            return f\"Я выбираю: {random.choice(options)}.\"\n    return None\n\n\n# ---------------------------------------------------------------- пароли\n\ndef password(text: str):\n    low = _low(text)\n    if not re.search(r\"пароль|password\", low) or not re.search(r\"сгенер|придумай|создай|generate|нов\", low):\n        return None\n    m = re.search(r\"(\\d+)\", low)\n    length = min(max(int(m.group(1)) if m else 16, 8), 64)\n    alphabet = string.ascii_letters + string.digits + \"!@#$%^&*-_\"\n    while True:\n        pwd = \"\".join(secrets.choice(alphabet) for _ in range(length))\n        if (any(c.islower() for c in pwd) and any(c.isupper() for c in pwd)\n                and any(c.isdigit() for c in pwd)):\n            return f\"Надёжный пароль ({length} символов): {pwd}\"\n\n\n# ---------------------------------------------------------------- текст\n\ndef text_tools(text: str):\n    m = re.match(r\"\\s*(сколько (?:слов|символов|букв) в|посчитай (?:слова|символы) в|переверни|\"\n                 r\"заглавными|большими буквами|маленькими буквами|строчными)\\s*(?:текст)?\\s*:?\\s*(.+)\",\n                 text, re.I | re.S)\n    if not m:\n        return None\n    cmd, body = _low(m.group(1)), m.group(2).strip().strip(\"«»\\\"'\")\n    if not body:\n        return None\n    if cmd.startswith((\"сколько\", \"посчитай\")):\n        words = len(re.findall(r\"\\w+\", body))\n        letters = sum(ch.isalpha() for ch in body)\n        return f\"Слов: {words}, символов: {len(body)}, букв: {letters}.\"\n    if cmd == \"переверни\":\n        return body[::-1]\n    if cmd in (\"заглавными\", \"большими буквами\"):\n        return body.upper()\n    return body.lower()\n\n\n# ---------------------------------------------------------------- таблицы\n\ndef times_table(text: str):\n    low = _low(text)\n    m = re.search(r\"таблиц\\w* умножения(?:\\s+(?:на|для))?\\s*(\\d+)?\", low)\n    if not m:\n        return None\n    n = int(m.group(1)) if m.group(1) else None\n    if n is not None:\n        if not 1 <= n <= 1000:\n            return None\n        rows = \"\\n\".join(f\"| {n} × {k} | **{n * k}** |\" for k in range(1, 11))\n        return f\"### Таблица умножения на {n}\\n\\n| Пример | Ответ |\\n|---|---|\\n{rows}\"\n    head = \"| × | \" + \" | \".join(str(k) for k in range(1, 10)) + \" |\"\n    sep = \"|---\" * 10 + \"|\"\n    body = \"\\n\".join(\n        f\"| **{a}** | \" + \" | \".join(str(a * b) for b in range(1, 10)) + \" |\" for a in range(1, 10)\n    )\n    return f\"### Таблица умножения\\n\\n{head}\\n{sep}\\n{body}\"\n\n\n# ---------------------------------------------------------------- столицы\n\nCAPITALS = {\n    \"россия\": \"Москва\", \"украина\": \"Киев\", \"беларусь\": \"Минск\", \"белоруссия\": \"Минск\", \"казахстан\": \"Астана\",\n    \"узбекистан\": \"Ташкент\", \"киргизия\": \"Бишкек\", \"кыргызстан\": \"Бишкек\", \"таджикистан\": \"Душанбе\",\n    \"туркменистан\": \"Ашхабад\", \"азербайджан\": \"Баку\", \"армения\": \"Ереван\", \"грузия\": \"Тбилиси\",\n    \"молдова\": \"Кишинёв\", \"молдавия\": \"Кишинёв\", \"латвия\": \"Рига\", \"литва\": \"Вильнюс\", \"эстония\": \"Таллин\",\n    \"польша\": \"Варшава\", \"германия\": \"Берлин\", \"франция\": \"Париж\", \"италия\": \"Рим\", \"испания\": \"Мадрид\",\n    \"португалия\": \"Лиссабон\", \"великобритания\": \"Лондон\", \"англия\": \"Лондон\", \"ирландия\": \"Дублин\",\n    \"нидерланды\": \"Амстердам\", \"голландия\": \"Амстердам\", \"бельгия\": \"Брюссель\", \"швейцария\": \"Берн\",\n    \"австрия\": \"Вена\", \"чехия\": \"Прага\", \"словакия\": \"Братислава\", \"венгрия\": \"Будапешт\", \"румыния\": \"Бухарест\",\n    \"болгария\": \"София\", \"сербия\": \"Белград\", \"хорватия\": \"Загреб\", \"греция\": \"Афины\", \"турция\": \"Анкара\",\n    \"швеция\": \"Стокгольм\", \"норвегия\": \"Осло\", \"финляндия\": \"Хельсинки\", \"дания\": \"Копенгаген\",\n    \"исландия\": \"Рейкьявик\", \"сша\": \"Вашингтон\", \"америка\": \"Вашингтон\", \"канада\": \"Оттава\",\n    \"мексика\": \"Мехико\", \"бразилия\": \"Бразилиа\", \"аргентина\": \"Буэнос-Айрес\", \"чили\": \"Сантьяго\",\n    \"перу\": \"Лима\", \"колумбия\": \"Богота\", \"куба\": \"Гавана\", \"китай\": \"Пекин\", \"япония\": \"Токио\",\n    \"корея\": \"Сеул\", \"южная корея\": \"Сеул\", \"северная корея\": \"Пхеньян\", \"индия\": \"Нью-Дели\",\n    \"пакистан\": \"Исламабад\", \"иран\": \"Тегеран\", \"ирак\": \"Багдад\", \"израиль\": \"Иерусалим\",\n    \"саудовская аравия\": \"Эр-Рияд\", \"оаэ\": \"Абу-Даби\", \"египет\": \"Каир\", \"египта\": \"Каир\",\n    \"марокко\": \"Рабат\", \"нигерия\": \"Абуджа\", \"кения\": \"Найроби\", \"юар\": \"Претория\",\n    \"австралия\": \"Канберра\", \"новая зеландия\": \"Веллингтон\", \"таиланд\": \"Бангкок\", \"вьетнам\": \"Ханой\",\n    \"индонезия\": \"Джакарта\", \"монголия\": \"Улан-Батор\", \"афганистан\": \"Кабул\", \"сирия\": \"Дамаск\",\n}\n\n\ndef capital(text: str):\n    low = _low(text)\n    m = re.search(r\"столиц\\w*\\s+(?:страны\\s+|государства\\s+)?([а-я -]+?)[?!.]*$\", low)\n    if not m:\n        return None\n    import nlp  # локальный импорт: skills не зависит от nlp при загрузке\n    want = [nlp.stem(w) for w in m.group(1).split()]\n    for country, city in sorted(CAPITALS.items(), key=lambda kv: -len(kv[0])):\n        parts = [nlp.stem(w) for w in country.split()]\n        if want[:len(parts)] == parts:\n            return f\"Столица — **{city}**.\"\n    return None\n\n\nSKILLS = {\n    \"calc\": calculator,\n    \"time\": date_time,\n    \"convert\": converter,\n    \"random\": randomness,\n    \"password\": password,\n    \"text\": text_tools,\n    \"table\": times_table,\n    \"capital\": capital,\n}\n\n# Порядок проверки: сначала узкие навыки, калькулятор — после конвертера.\nORDER = [\"text\", \"table\", \"capital\", \"password\", \"time\", \"convert\", \"random\", \"calc\"]\n\n\ndef run(text: str, allowed) -> str:\n    for name in ORDER:\n        if name in allowed:\n            answer = SKILLS[name](text)\n            if answer:\n                return answer\n    return None\n", "net.py": "\"\"\"Запросы в интернет для Rai: одинаково работают на сервере (urllib) и в браузере (Pyodide).\"\"\"\n\nimport json\nimport sys\nimport time\nimport urllib.parse\nimport urllib.request\n\nUSER_AGENT = \"RaiBot/1.0 (+https://github.com/rteaminfo1-source/rai)\"\nIN_BROWSER = sys.platform == \"emscripten\"\n\n_cache = {}\n\n\nclass NetError(Exception):\n    \"\"\"Не получилось получить данные из интернета.\"\"\"\n\n\ndef url(base: str, **params) -> str:\n    return base + (\"?\" + urllib.parse.urlencode(params) if params else \"\")\n\n\ndef fetch_text(address: str, timeout: float = 10) -> str:\n    try:\n        if IN_BROWSER:\n            # Синхронный запрос браузера: Python в Pyodide не умеет открывать сокеты сам.\n            from pyodide.http import open_url\n            return open_url(address).getvalue()\n        req = urllib.request.Request(address, headers={\"User-Agent\": USER_AGENT, \"Accept\": \"application/json\"})\n        with urllib.request.urlopen(req, timeout=timeout) as resp:\n            return resp.read().decode(\"utf-8\")\n    except Exception as e:  # сеть, DNS, таймаут, CORS в браузере\n        raise NetError(str(e) or e.__class__.__name__) from e\n\n\ndef fetch_json(address: str, ttl: float = 0):\n    \"\"\"Скачать JSON. ttl > 0 — хранить ответ в памяти столько секунд.\"\"\"\n    now = time.time()\n    if ttl and address in _cache and now - _cache[address][0] < ttl:\n        return _cache[address][1]\n    text = fetch_text(address)\n    try:\n        data = json.loads(text)\n    except ValueError as e:\n        raise NetError(\"сервис вернул не JSON\") from e\n    if ttl:\n        _cache[address] = (now, data)\n    return data\n", "online.py": "\"\"\"Навыки Rai, которым нужен интернет: погода, валюты, перевод, поиск.\n\nИспользуются бесплатные открытые сервисы без ключей:\n- погода — Open-Meteo (open-meteo.com);\n- курсы валют — open.er-api.com (запасной — cbr-xml-daily.ru, курсы ЦБ РФ);\n- перевод — MyMemory (mymemory.translated.net);\n- поиск — Википедия.\n\"\"\"\n\nimport re\nfrom datetime import date\n\nimport urllib.parse\n\nimport creative\nimport net\nimport nlp\n\n# ================================================================== погода\n\nWEATHER_CODES = {\n    0: (\"ясно\", \"clear\"), 1: (\"преимущественно ясно\", \"clear\"), 2: (\"переменная облачность\", \"partly\"),\n    3: (\"пасмурно\", \"cloudy\"), 45: (\"туман\", \"fog\"), 48: (\"туман с изморозью\", \"fog\"),\n    51: (\"слабая морось\", \"rain\"), 53: (\"морось\", \"rain\"), 55: (\"сильная морось\", \"rain\"),\n    56: (\"ледяная морось\", \"rain\"), 57: (\"ледяная морось\", \"rain\"),\n    61: (\"небольшой дождь\", \"rain\"), 63: (\"дождь\", \"rain\"), 65: (\"сильный дождь\", \"rain\"),\n    66: (\"ледяной дождь\", \"rain\"), 67: (\"сильный ледяной дождь\", \"rain\"),\n    71: (\"небольшой снег\", \"snow\"), 73: (\"снег\", \"snow\"), 75: (\"сильный снег\", \"snow\"), 77: (\"снежная крупа\", \"snow\"),\n    80: (\"небольшой ливень\", \"rain\"), 81: (\"ливень\", \"rain\"), 82: (\"сильный ливень\", \"rain\"),\n    85: (\"снегопад\", \"snow\"), 86: (\"сильный снегопад\", \"snow\"),\n    95: (\"гроза\", \"storm\"), 96: (\"гроза с градом\", \"storm\"), 99: (\"сильная гроза с градом\", \"storm\"),\n}\n_WEEKDAYS = [\"пн\", \"вт\", \"ср\", \"чт\", \"пт\", \"сб\", \"вс\"]\n\n_WEATHER_RE = re.compile(\n    r\"(погод\\w*|температур\\w*|прогноз\\w*|дожд\\w*|снег\\w*|холодно|жарко|тепло)\", re.I\n)\n_CITY_RE = re.compile(\n    r\"(?:\\bв|\\bво|\\bна|\\bдля|\\bпо)\\s+(?:городе\\s+|город\\s+)?([а-яёa-z][а-яёa-z\\- ]{1,40}?)\"\n    r\"(?:\\s+(?:сегодня|сейчас|завтра|на завтра|на неделю|на выходные|будет|есть))?[\\s?!.]*$\",\n    re.I,\n)\n\n\ndef is_weather_request(text: str) -> bool:\n    low = text.lower()\n    if not _WEATHER_RE.search(low):\n        return False\n    # «прогноз» без погоды и «снег»/«дождь» как тема «что такое дождь» — не про погоду\n    if re.search(r\"что такое|кто такой|нарису|презентац\", low):\n        return False\n    return bool(re.search(r\"погод|температур|будет ли|идет ли|идёт ли|холодно|жарко|тепло|прогноз погод\", low))\n\n\ndef _city_candidates(phrase: str):\n    \"\"\"«Москве» -> «Москве», «Москва», «Москв»… Open-Meteo ищет по началу названия.\"\"\"\n    phrase = phrase.strip(\" -\")\n    words = phrase.split()\n    cands = [phrase]\n    if len(words) == 1:\n        w = words[0]\n        for old, new in ((\"е\", \"а\"), (\"и\", \"ь\"), (\"и\", \"а\"), (\"е\", \"\"), (\"у\", \"а\"), (\"и\", \"я\")):\n            if w.lower().endswith(old) and len(w) > 3:\n                cands.append(w[: -len(old)] + new)\n        cands.append(nlp.stem(w.lower()))\n    else:\n        fixed = []\n        for w in words:\n            lw = w.lower()\n            if lw.endswith((\"ем\", \"ом\")) and len(lw) > 4:\n                fixed.append(w[:-2] + (\"ий\" if lw.endswith(\"ем\") else \"ый\"))\n            elif lw.endswith(\"ой\") and len(lw) > 4:\n                fixed.append(w[:-2] + \"ая\")\n            elif lw.endswith(\"е\") and len(lw) > 3:\n                fixed.append(w[:-1])\n            else:\n                fixed.append(w)\n        cands.append(\" \".join(fixed))\n    out = []\n    for c in cands:\n        if c and c.lower() not in [o.lower() for o in out]:\n            out.append(c)\n    return out[:5]\n\n\ndef geocode(phrase: str):\n    for cand in _city_candidates(phrase):\n        data = net.fetch_json(net.url(\"https://geocoding-api.open-meteo.com/v1/search\",\n                                      name=cand, count=1, language=\"ru\", format=\"json\"), ttl=86400)\n        results = data.get(\"results\") or []\n        if results:\n            return results[0]\n    return None\n\n\ndef weather(text: str, session: dict, default_city: str = \"Москва\"):\n    \"\"\"Вернуть (ответ, вложения) или None, если это не вопрос о погоде.\"\"\"\n    if not is_weather_request(text):\n        return None\n    m = _CITY_RE.search(text)\n    city_phrase = m.group(1).strip() if m else None\n    if city_phrase and re.fullmatch(r\"(сегодня|завтра|неделю|выходные|улице|дворе)\", city_phrase, re.I):\n        city_phrase = None\n    city_phrase = city_phrase or session.get(\"city\") or default_city\n    try:\n        place = geocode(city_phrase)\n        if not place:\n            return f\"Не нашёл город «{city_phrase}». Напишите, например: «погода в Казани».\", []\n        data = net.fetch_json(net.url(\n            \"https://api.open-meteo.com/v1/forecast\",\n            latitude=place[\"latitude\"], longitude=place[\"longitude\"], timezone=\"auto\", forecast_days=4,\n            wind_speed_unit=\"ms\",\n            current=\"temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day\",\n            daily=\"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max\",\n        ), ttl=600)\n    except net.NetError as e:\n        return f\"Не удалось узнать погоду: нет связи с сервисом погоды ({e}).\", []\n\n    session[\"city\"] = place.get(\"name\", city_phrase)\n    cur = data.get(\"current\", {})\n    code = int(cur.get(\"weather_code\", 0))\n    desc, kind = WEATHER_CODES.get(code, (\"без осадков\", \"cloudy\"))\n    temp = cur.get(\"temperature_2m\")\n    feels = cur.get(\"apparent_temperature\")\n    name = place.get(\"name\", city_phrase)\n    where = \", \".join(x for x in (name, place.get(\"country\")) if x)\n\n    def t(v):\n        return f\"{'+' if v is not None and round(v) > 0 else ''}{round(v)}°\" if v is not None else \"—\"\n\n    lines = [\n        f\"## Погода: {where}\",\n        f\"Сейчас **{t(temp)}**, {desc}. Ощущается как {t(feels)}.\",\n        f\"Ветер {cur.get('wind_speed_10m', '—')} м/с, влажность {cur.get('relative_humidity_2m', '—')}%.\",\n    ]\n    daily = data.get(\"daily\", {})\n    days = daily.get(\"time\", [])\n    if days:\n        lines.append(\"\\n| День | Погода | Мин | Макс | Осадки |\\n|---|---|---|---|---|\")\n        for i, day in enumerate(days[:4]):\n            d = date.fromisoformat(day)\n            label = \"сегодня\" if i == 0 else \"завтра\" if i == 1 else f\"{_WEEKDAYS[d.weekday()]}, {d.day:02d}.{d.month:02d}\"\n            dcode = int(daily.get(\"weather_code\", [0] * 4)[i])\n            prob = (daily.get(\"precipitation_probability_max\") or [None] * 4)[i]\n            lines.append(\n                f\"| {label} | {WEATHER_CODES.get(dcode, ('—',))[0]} | {t(daily['temperature_2m_min'][i])} | \"\n                f\"**{t(daily['temperature_2m_max'][i])}** | {'' if prob is None else str(prob) + '%'} |\"\n            )\n    card = creative.weather_card(name, t(temp), desc, kind, bool(cur.get(\"is_day\", 1)), f\"ощущается как {t(feels)}\")\n    return \"\\n\".join(lines), [card]\n\n\n# ================================================================== валюты\n\n# (код, слова-формы (регулярное выражение для целого слова), название)\nCURRENCIES = [\n    (\"BYN\", r\"белорусск\\w*|byn\", \"белорусский рубль\"),\n    (\"CAD\", r\"канадск\\w*|cad\", \"канадский доллар\"),\n    (\"AUD\", r\"австралийск\\w*|aud\", \"австралийский доллар\"),\n    (\"SEK\", r\"шведск\\w*|sek\", \"шведская крона\"),\n    (\"CZK\", r\"чешск\\w*|czk\", \"чешская крона\"),\n    (\"RUB\", r\"рубл\\w*|руб|rub|₽\", \"рубль\"),\n    (\"USD\", r\"доллар\\w*|бакс\\w*|usd|\\$\", \"доллар США\"),\n    (\"EUR\", r\"евро|eur|€\", \"евро\"),\n    (\"CNY\", r\"юан\\w*|cny|¥\", \"юань\"),\n    (\"GBP\", r\"фунт\\w*|стерлинг\\w*|gbp|£\", \"фунт стерлингов\"),\n    (\"JPY\", r\"[иий]ен\\w*|jpy\", \"иена\"),\n    (\"KZT\", r\"тенге|kzt|₸\", \"тенге\"),\n    (\"UAH\", r\"гривн\\w*|uah|₴\", \"гривна\"),\n    (\"TRY\", r\"лир[аыу]?|лирах\", \"турецкая лира\"),\n    (\"CHF\", r\"франк\\w*|chf\", \"швейцарский франк\"),\n    (\"KRW\", r\"вон[аыу]|krw\", \"вона\"),\n    (\"INR\", r\"рупи\\w*|inr\", \"индийская рупия\"),\n    (\"PLN\", r\"злот\\w*|pln\", \"злотый\"),\n    (\"KGS\", r\"сом(?:а|ов|ы)?|kgs\", \"сом\"),\n    (\"UZS\", r\"сум(?:ов)?|uzs\", \"сум\"),\n    (\"GEL\", r\"лари|gel\", \"лари\"),\n    (\"AMD\", r\"драм(?:ов)?|amd\", \"драм\"),\n    (\"AZN\", r\"манат\\w*|azn\", \"манат\"),\n    (\"AED\", r\"дирхам\\w*|aed\", \"дирхам ОАЭ\"),\n    (\"ILS\", r\"шекел\\w*|ils\", \"шекель\"),\n    (\"THB\", r\"бат(?:а|ов)?|thb\", \"бат\"),\n    (\"BRL\", r\"реал(?:а|ов)|brl\", \"бразильский реал\"),\n]\n# «белорусских рублей», «канадских долларов» — второе слово не отдельная валюта\n_COMPOUND = {\"BYN\": \"RUB\", \"CAD\": \"USD\", \"AUD\": \"USD\", \"SEK\": \"\", \"CZK\": \"\"}\n\n\ndef _find_currencies(text):\n    \"\"\"Найти валюты в тексте по порядку упоминания: [(позиция, код)].\"\"\"\n    low = text.lower().replace(\"ё\", \"е\")\n    found = []\n    prev_word_code = None  # валюта, найденная в предыдущем слове\n    for m in re.finditer(r\"[a-zа-я]+|[$€£¥₽₸₴]\", low):\n        word = m.group(0)\n        code = next((c for c, pattern, _ in CURRENCIES if re.fullmatch(pattern, word)), None)\n        skip = prev_word_code and code is not None and (\n            _COMPOUND.get(prev_word_code) == code or (prev_word_code in (\"SEK\", \"CZK\") and word.startswith(\"крон\")))\n        if code and not skip:\n            found.append((m.start(), code))\n        if prev_word_code in (\"SEK\", \"CZK\") and word.startswith(\"крон\"):\n            code = None\n        prev_word_code = None if skip else code\n    return found\n\n\ndef is_currency_request(text: str) -> bool:\n    low = text.lower()\n    if re.search(r\"курс\\w*\\s+валют|валют\\w*\\s+курс\", low):\n        return True\n    cur = _find_currencies(text)\n    if not cur:\n        return False\n    if re.search(r\"\\bкурс\", low):\n        return True\n    has_number = bool(re.search(r\"\\d\", low))\n    if len(cur) >= 2 and (has_number or re.search(r\"\\bв\\b|\\bto\\b|сколько\", low)):\n        return True\n    return has_number and bool(re.search(r\"сколько|стоит|это|будет\", low))\n\n\ndef rates():\n    \"\"\"Курсы к доллару: {\"USD\": 1, \"RUB\": 92.1, ...}, дата.\"\"\"\n    try:\n        data = net.fetch_json(\"https://open.er-api.com/v6/latest/USD\", ttl=3600)\n        if data.get(\"result\") == \"success\":\n            return data[\"rates\"], data.get(\"time_last_update_utc\", \"\")[:16]\n    except net.NetError:\n        pass\n    data = net.fetch_json(\"https://www.cbr-xml-daily.ru/daily_json.js\", ttl=3600)\n    rub = {\"RUB\": 1.0}\n    for code, v in data.get(\"Valute\", {}).items():\n        rub[code] = v[\"Value\"] / v[\"Nominal\"]  # рублей за 1 единицу\n    usd = rub[\"USD\"]\n    return {code: usd / value for code, value in rub.items()}, \"ЦБ РФ, \" + data.get(\"Date\", \"\")[:10]\n\n\ndef _money(v):\n    if float(v).is_integer() and abs(v) < 1e15:\n        return f\"{int(v):,}\".replace(\",\", \" \")\n    if v >= 100:\n        s = f\"{v:,.2f}\"\n    elif v >= 1:\n        s = f\"{v:,.4f}\".rstrip(\"0\").rstrip(\".\")\n    else:\n        s = f\"{v:.6f}\".rstrip(\"0\").rstrip(\".\")\n    return s.replace(\",\", \" \").replace(\".\", \",\")\n\n\ndef _name(code):\n    return next((n for c, _, n in CURRENCIES if c == code), code)\n\n\ndef currency(text: str):\n    if not is_currency_request(text):\n        return None\n    try:\n        table, updated = rates()\n    except net.NetError as e:\n        return f\"Не удалось получить курсы валют: нет связи ({e}).\"\n    found = [code for _, code in _find_currencies(text)]\n    low = text.lower()\n    if not found or re.search(r\"курс\\w*\\s+валют\", low) and len(found) < 2:\n        rows = \"\\n\".join(\n            f\"| {_name(c)} | {c} | **{_money(table['RUB'] / table[c])} ₽** |\"\n            for c in (\"USD\", \"EUR\", \"CNY\", \"GBP\", \"JPY\", \"KZT\", \"BYN\", \"TRY\") if c in table\n        )\n        return f\"## Курсы валют к рублю\\n\\n| Валюта | Код | Курс |\\n|---|---|---|\\n{rows}\\n\\nОбновлено: {updated}.\"\n    num = re.search(r\"(\\d[\\d\\s]*(?:[.,]\\d+)?)\\s*(тыс\\w*|к\\b|млн|миллион\\w*)?\", low)\n    amount = 1.0\n    if num:\n        amount = float(num.group(1).replace(\" \", \"\").replace(\",\", \".\"))\n        mult = num.group(2) or \"\"\n        amount *= 1000 if mult.startswith((\"тыс\", \"к\")) else 1_000_000 if mult.startswith((\"млн\", \"миллион\")) else 1\n    src = found[0]\n    dst = found[1] if len(found) > 1 and found[1] != src else (\"RUB\" if src != \"RUB\" else \"USD\")\n    if src not in table or dst not in table:\n        return \"Для этой валюты у меня нет курса.\"\n    value = amount * table[dst] / table[src]\n    one = table[dst] / table[src]\n    return (f\"**{_money(amount)} {src} = {_money(value)} {dst}**\\n\\n\"\n            f\"Курс: 1 {_name(src)} = {_money(one)} {dst}. Обновлено: {updated}.\")\n\n\n# ================================================================== перевод\n\nLANGS = {\n    \"en\": (\"английск\", \"английский\"), \"ru\": (\"русск\", \"русский\"), \"de\": (\"немецк\", \"немецкий\"),\n    \"fr\": (\"французск\", \"французский\"), \"es\": (\"испанск\", \"испанский\"), \"it\": (\"итальянск\", \"итальянский\"),\n    \"pt\": (\"португальск\", \"португальский\"), \"pl\": (\"польск\", \"польский\"), \"uk\": (\"украинск\", \"украинский\"),\n    \"be\": (\"белорусск\", \"белорусский\"), \"kk\": (\"казахск\", \"казахский\"), \"zh\": (\"китайск\", \"китайский\"),\n    \"ja\": (\"японск\", \"японский\"), \"ko\": (\"корейск\", \"корейский\"), \"ar\": (\"арабск\", \"арабский\"),\n    \"tr\": (\"турецк\", \"турецкий\"), \"el\": (\"греческ\", \"греческий\"), \"he\": (\"иврит\", \"иврит\"),\n    \"hi\": (\"хинди\", \"хинди\"), \"cs\": (\"чешск\", \"чешский\"), \"nl\": (\"нидерландск\", \"нидерландский\"),\n    \"sv\": (\"шведск\", \"шведский\"), \"no\": (\"норвежск\", \"норвежский\"), \"da\": (\"датск\", \"датский\"),\n    \"fi\": (\"финск\", \"финский\"), \"hu\": (\"венгерск\", \"венгерский\"), \"ro\": (\"румынск\", \"румынский\"),\n    \"bg\": (\"болгарск\", \"болгарский\"), \"sr\": (\"сербск\", \"сербский\"), \"hr\": (\"хорватск\", \"хорватский\"),\n    \"lv\": (\"латышск\", \"латышский\"), \"lt\": (\"литовск\", \"литовский\"), \"et\": (\"эстонск\", \"эстонский\"),\n    \"ka\": (\"грузинск\", \"грузинский\"), \"hy\": (\"армянск\", \"армянский\"), \"az\": (\"азербайджанск\", \"азербайджанский\"),\n    \"uz\": (\"узбекск\", \"узбекский\"), \"tt\": (\"татарск\", \"татарский\"), \"fa\": (\"персидск\", \"персидский\"),\n    \"vi\": (\"вьетнамск\", \"вьетнамский\"), \"th\": (\"тайск\", \"тайский\"), \"id\": (\"индонезийск\", \"индонезийский\"),\n    \"la\": (\"латын\", \"латынь\"), \"eo\": (\"эсперанто\", \"эсперанто\"), \"ky\": (\"киргизск\", \"киргизский\"),\n    \"tg\": (\"таджикск\", \"таджикский\"), \"mn\": (\"монгольск\", \"монгольский\"), \"sk\": (\"словацк\", \"словацкий\"),\n    \"sl\": (\"словенск\", \"словенский\"), \"ga\": (\"ирландск\", \"ирландский\"), \"is\": (\"исландск\", \"исландский\"),\n}\n_LANG_ALIAS = {\"голландск\": \"nl\", \"фарси\": \"fa\", \"по-русск\": \"ru\", \"англ\": \"en\"}\n\n_STOP = {\n    \"en\": \"the and is are you to of in it what hello how this that with for my your i we they be not have\".split(),\n    \"de\": \"und der die das ist nicht ich du ein eine wie guten danke mit für ist sie wir haben\".split(),\n    \"fr\": \"le la les et est je vous un une bonjour pas que merci avec pour nous il elle\".split(),\n    \"es\": \"el la los las y es que de hola como estás por una gracias con para muy yo\".split(),\n    \"it\": \"il lo la e è che di ciao come sono non una grazie con per io tu\".split(),\n    \"pt\": \"o a os e é que de olá você não um uma obrigado com para eu muito\".split(),\n    \"pl\": \"i w nie jest to się na cześć jak dzień dobry dziękuję ja ty\".split(),\n    \"tr\": \"ve bir bu ne merhaba nasılsın için değil ben sen teşekkür\".split(),\n    \"nl\": \"de het een en is niet ik hallo hoe dank je wij\".split(),\n    \"sv\": \"och är jag du det inte hej tack en ett\".split(),\n    \"cs\": \"a je to se na ne ahoj jak děkuji já ty\".split(),\n    \"id\": \"dan yang di ini itu apa saya kamu terima kasih\".split(),\n}\n_HINTS = [(\"es\", \"ñ¿¡\"), (\"de\", \"ßäöü\"), (\"tr\", \"ğşı\"), (\"pl\", \"łąęśźżćń\"), (\"pt\", \"ãõ\"),\n          (\"fr\", \"àâçèêëîïôœùû\"), (\"cs\", \"ěřůčšž\"), (\"ro\", \"ăîșț\"), (\"hu\", \"őű\")]\n\n\ndef detect_language(text: str) -> str:\n    \"\"\"Свой определитель языка: по алфавиту, особым буквам и частым словам.\"\"\"\n    s = text.lower()\n    scripts = [\n        (r\"[぀-ヿ]\", \"ja\"), (r\"[가-힯]\", \"ko\"), (r\"[一-鿿]\", \"zh\"),\n        (r\"[؀-ۿ]\", \"ar\"), (r\"[֐-׿]\", \"he\"), (r\"[Ͱ-Ͽ]\", \"el\"),\n        (r\"[฀-๿]\", \"th\"), (r\"[ऀ-ॿ]\", \"hi\"), (r\"[Ⴀ-ჿ]\", \"ka\"),\n        (r\"[԰-֏]\", \"hy\"),\n    ]\n    for pattern, code in scripts:\n        if re.search(pattern, s):\n            if code == \"ar\" and re.search(r\"[پچژگ]\", s):\n                return \"fa\"\n            return code\n    if re.search(r\"[а-яёіїєґўәғқңөұүһђћџјљњ]\", s):\n        if re.search(r\"[әғқңөұүһ]\", s):\n            return \"kk\"\n        if re.search(r\"[їєґ]\", s) or (re.search(r\"і\", s) and not re.search(r\"ў\", s)):\n            return \"uk\"\n        if re.search(r\"ў\", s):\n            return \"be\"\n        if re.search(r\"[ђћџјљњ]\", s):\n            return \"sr\"\n        return \"ru\"\n    words = re.findall(r\"[a-zà-ÿąęłśźżćńěřůčšžőűăîșțğşı]+\", s)\n    scores = {lang: sum(2 for w in words if w in stop) for lang, stop in _STOP.items()}\n    for lang, letters in _HINTS:\n        scores[lang] = scores.get(lang, 0) + sum(3 for ch in s if ch in letters)\n    best = max(scores, key=scores.get) if scores else \"en\"\n    return best if scores.get(best) else \"en\"\n\n\n_TRANSLATE_RE = re.compile(\n    r\"^\\s*(?:пожалуйста\\s+)?(?:переведи(?:те)?|перевод|translate|как (?:будет|сказать|пишется)|как)\\b\", re.I\n)\n\n\ndef _lang_code(word: str):\n    w = word.lower().replace(\"ё\", \"е\")\n    for alias, code in _LANG_ALIAS.items():\n        if w.startswith(alias):\n            return code\n    for code, (prefix, _) in LANGS.items():\n        if w.startswith(prefix):\n            return code\n    return None\n\n\ndef is_translate_request(text: str) -> bool:\n    low = text.lower()\n    if re.match(r\"^\\s*(?:пожалуйста\\s+)?(?:переведи|перевод|translate)\\b\", low):\n        return True\n    return bool(re.search(r\"\\bпо-[а-я]+(?:ски|цки)\\b\", low) and re.match(r\"^\\s*как\\b\", low))\n\n\ndef parse_translate(text: str):\n    \"\"\"Разобрать запрос: (текст, язык-источник или None, язык перевода или None).\"\"\"\n    src = dst = None\n    body = text.strip()\n    quoted = re.search(r\"[«\\\"“'](.+?)[»\\\"”']\", body)\n    m = re.search(r\"\\bс\\s+([а-я]+(?:ого|ого языка)?)\\s+(?:на|в)\\s+([а-я-]+)\", body, re.I)\n    if m:\n        src, dst = _lang_code(m.group(1)), _lang_code(m.group(2))\n        body = body.replace(m.group(0), \" \")\n    m = re.search(r\"\\b(?:на|в)\\s+([а-я-]+?)(?:\\s+язык)?\\b(?=[\\s:,.!?]|$)\", body, re.I)\n    if not dst and m and _lang_code(m.group(1)):\n        dst = _lang_code(m.group(1))\n        body = body.replace(m.group(0), \" \", 1)\n    m = re.search(r\"\\bпо-([а-я]+)\", body, re.I)\n    if not dst and m and _lang_code(m.group(1)):\n        dst = _lang_code(m.group(1))\n        body = body.replace(m.group(0), \" \", 1)\n    m = re.search(r\"\\b(?:to|into)\\s+([a-z]+)\\s*$\", body, re.I)\n    if not dst and m:\n        names = {\"english\": \"en\", \"russian\": \"ru\", \"german\": \"de\", \"french\": \"fr\", \"spanish\": \"es\",\n                 \"italian\": \"it\", \"chinese\": \"zh\", \"japanese\": \"ja\", \"korean\": \"ko\", \"ukrainian\": \"uk\"}\n        if m.group(1).lower() in names:\n            dst = names[m.group(1).lower()]\n            body = body[: m.start()]\n    if quoted:\n        body = quoted.group(1)\n    else:\n        body = _TRANSLATE_RE.sub(\"\", body, count=1)\n        body = re.sub(r\"^\\s*(?:текст|слово|фразу|предложение)?\\s*[:\\-—]?\\s*\", \"\", body, flags=re.I)\n        body = re.sub(r\"^\\s*(?:будет|сказать)\\s+\", \"\", body, flags=re.I)\n    return body.strip(\" \\t\\n:—-?\"), src, dst\n\n\ndef _chunks(text, size=450):\n    parts, cur = [], \"\"\n    for sentence in re.split(r\"(?<=[.!?])\\s+\", text):\n        while len(sentence) > size:\n            parts.append(sentence[:size]); sentence = sentence[size:]\n        if len(cur) + len(sentence) + 1 > size:\n            parts.append(cur); cur = \"\"\n        cur = (cur + \" \" + sentence).strip()\n    if cur:\n        parts.append(cur)\n    return parts\n\n\ndef translate(text: str):\n    if not is_translate_request(text):\n        return None\n    body, src, dst = parse_translate(text)\n    if not body:\n        return \"Что перевести? Напишите, например: «переведи на английский: доброе утро».\"\n    if len(body) > 3000:\n        return \"Текст слишком длинный для перевода — до 3000 символов за раз.\"\n    src = src or detect_language(body)\n    dst = dst or (\"en\" if src == \"ru\" else \"ru\")\n    if src == dst:\n        dst = \"en\" if src != \"en\" else \"ru\"\n    out = []\n    try:\n        for part in _chunks(body):\n            data = net.fetch_json(net.url(\"https://api.mymemory.translated.net/get\", q=part, langpair=f\"{src}|{dst}\"),\n                                  ttl=86400)\n            if int(data.get(\"responseStatus\", 200)) != 200:\n                return f\"Сервис перевода ответил: {data.get('responseDetails', 'ошибка')}.\"\n            out.append(data.get(\"responseData\", {}).get(\"translatedText\", \"\"))\n    except net.NetError as e:\n        return f\"Не удалось перевести: нет связи с сервисом перевода ({e}).\"\n    result = \" \".join(x for x in out if x).strip()\n    return (f\"**{LANGS.get(src, (None, src))[1].capitalize()} → {LANGS.get(dst, (None, dst))[1]}:**\\n\\n\"\n            f\"> {body}\\n\\n{result}\")\n\n\n# ================================================================== поиск\n\n_SEARCH_RE = re.compile(\n    r\"^\\s*(?:найди|поищи|загугли|погугли|найти|ищи|поиск)(?:\\s+(?:в\\s+интернете|в\\s+сети|в\\s+гугле|информацию))*\"\n    r\"(?:\\s+(?:про|о|об|что такое))?\\s+(.+?)[\\s?!.]*$\",\n    re.I,\n)\n\n\ndef explicit_search(text: str):\n    m = _SEARCH_RE.match(text)\n    return m.group(1) if m else None\n\n\ndef _first_sentences(text, limit=700):\n    if len(text) <= limit:\n        return text\n    cut = text[:limit]\n    end = max(cut.rfind(\". \"), cut.rfind(\"! \"), cut.rfind(\"? \"))\n    return cut[: end + 1] if end > 200 else cut.rstrip() + \"…\"\n\n\ndef web_search(query: str):\n    \"\"\"Найти ответ в Википедии: (ответ, вложения) или None.\"\"\"\n    query = query.strip(\" ?!.\")\n    if len(query) < 2:\n        return None\n    for lang in (\"ru\", \"en\"):\n        found = net.fetch_json(net.url(\n            f\"https://{lang}.wikipedia.org/w/api.php\", action=\"query\", list=\"search\", srsearch=query,\n            srlimit=1, format=\"json\", origin=\"*\", utf8=1), ttl=3600)\n        hits = found.get(\"query\", {}).get(\"search\", [])\n        if not hits:\n            continue\n        title = hits[0][\"title\"]\n        page = net.fetch_json(f\"https://{lang}.wikipedia.org/api/rest_v1/page/summary/\"\n                              + urllib.parse.quote(title.replace(\" \", \"_\")), ttl=3600)\n        extract = (page.get(\"extract\") or \"\").strip()\n        if not extract:\n            continue\n        link = page.get(\"content_urls\", {}).get(\"desktop\", {}).get(\"page\", \"\")\n        answer = f\"**{page.get('title', title)}**\\n\\n{_first_sentences(extract)}\"\n        if lang == \"en\":\n            answer += \"\\n\\n*(нашёл только в английской Википедии)*\"\n        answer += f\"\\n\\nИсточник: [Википедия]({link})\" if link else \"\"\n        attachments = []\n        t
