никальные пароли** (могу сгенерировать — «сгенерируй пароль»).\\n- Включите **двухфакторную защиту**.\\n- Не переходите по подозрительным ссылкам.\\n- ==Никому не сообщайте коды из SMS.==\"\n      ]\n    },\n    {\n      \"id\": \"news\",\n      \"title\": \"Новости\",\n      \"patterns\": [\n        \"новости\",\n        \"что случилось в мире\",\n        \"последние новости\"\n      ],\n      \"answers\": [\n        \"У меня нет доступа к интернету, поэтому свежих новостей я не знаю. Новости команды смотрите в блоге Rteam.\"\n      ]\n    },\n    {\n      \"id\": \"bot_feelings\",\n      \"title\": \"Чувства Rai\",\n      \"patterns\": [\n        \"ты живой\",\n        \"у тебя есть чувства\",\n        \"ты человек\",\n        \"ты робот\",\n        \"ты умный\"\n      ],\n      \"answers\": [\n        \"Я программа, а не человек, — чувств у меня нет. Но стараюсь быть полезным.\"\n      ]\n    },\n    {\n      \"id\": \"compliment\",\n      \"title\": \"Похвала\",\n      \"patterns\": [\n        \"ты молодец\",\n        \"ты классный\",\n        \"ты крутой\",\n        \"отлично\",\n        \"супер\",\n        \"круто\",\n        \"хорошо ответил\"\n      ],\n      \"answers\": [\n        \"Спасибо{name}! Приятно.\",\n        \"Рад стараться{name}!\"\n      ]\n    },\n    {\n      \"id\": \"insult\",\n      \"title\": \"Грубость\",\n      \"patterns\": [\n        \"ты тупой\",\n        \"дурак\",\n        \"ты глупый\",\n        \"бесполезный\"\n      ],\n      \"answers\": [\n        \"Жаль, что не помог. Попробуйте переформулировать вопрос — или выберите версию Pro Plus / Pro Sun.\"\n      ]\n    },\n    {\n      \"id\": \"ok\",\n      \"title\": \"Согласие\",\n      \"patterns\": [\n        \"ок\",\n        \"окей\",\n        \"ладно\",\n        \"понятно\",\n        \"ясно\",\n        \"хорошо\",\n        \"ага\",\n        \"да\"\n      ],\n      \"answers\": [\n        \"Хорошо. Если будут вопросы — пишите.\",\n        \"Понял. Что дальше?\"\n      ]\n    },\n    {\n      \"id\": \"compare_python_php\",\n      \"title\": \"Python или PHP\",\n      \"patterns\": [\n        \"сравни python и php\",\n        \"python или php\",\n        \"чем python отличается от php\",\n        \"что лучше python или php\",\n        \"php или python\"\n      ],\n      \"answers\": [\n        \"## Python и PHP\\n\\n| | **Python** | **PHP** |\\n|---|---|---|\\n| Где работает | сервер, компьютер, данные, ИИ | сервер сайтов |\\n| Сложность | простой | простой |\\n| Хостинг | нужен с поддержкой Python | есть почти на любом |\\n| Фреймворки | Flask, Django | Laravel, WordPress |\\n| Лучше для | ботов, ИИ, автоматизации | классических сайтов |\\n\\n**Итог:** для сайта на обычном хостинге — PHP, для всего остального — Python.\"\n      ]\n    },\n    {\n      \"id\": \"formatting\",\n      \"title\": \"Форматирование\",\n      \"patterns\": [\n        \"покажи форматирование\",\n        \"пример форматирования\",\n        \"умеешь делать таблицы\",\n        \"сделай таблицу\",\n        \"покажи таблицу\",\n        \"жирный текст\",\n        \"markdown\",\n        \"маркдаун\"\n      ],\n      \"answers\": [\n        \"## Так я умею оформлять ответы\\n\\n**Жирный**, *курсив*, ==выделение==, ~~зачёркнутый~~ и `код`.\\n\\n| Возможность | Как написать |\\n|---|---|\\n| **Жирный** | `**текст**` |\\n| *Курсив* | `*текст*` |\\n| ==Выделение== | `==текст==` |\\n| Таблица | строки через `|` |\\n\\n- списки\\n- и **нумерация**\\n\\n> Любой ответ можно скопировать кнопкой «Копировать» — форматирование сохранится при вставке в Word.\"\n      ]\n    },\n    {\n      \"id\": \"voice\",\n      \"title\": \"Голосовой ввод\",\n      \"patterns\": [\n        \"как говорить голосом\",\n        \"голосовой ввод\",\n        \"можно голосом\",\n        \"микрофон\",\n        \"озвучь\",\n        \"озвучить ответ\"\n      ],\n      \"answers\": [\n        \"Нажмите кнопку с **микрофоном** рядом с полем ввода и говорите — текст появится в поле. Ещё раз нажмите, чтобы остановить. Под каждым ответом есть кнопка **«Озвучить»**.\\n\\nГолосовой ввод работает в Chrome и Edge; браузер попросит разрешить микрофон.\"\n      ]\n    },\n    {\n      \"id\": \"images_help\",\n      \"title\": \"Как попросить картинку\",\n      \"patterns\": [\n        \"какие картинки ты умеешь\",\n        \"что ты умеешь рисовать\",\n        \"ты умеешь рисовать\",\n        \"умеешь делать картинки\",\n        \"как сделать картинку\"\n      ],\n      \"answers\": [\n        \"Я рисую картинки сам, без внешних сервисов. Напишите, например:\\n\\n- «нарисуй **закат над морем**»\\n- «нарисуй **ночной город**»\\n- «нарисуй **зимний лес в горах**»\\n- «нарисуй **космос**»\\n- «нарисуй **красное сердце**»\\n- «сделай **логотип Rteam**»\\n\\nЦвет тоже можно указать: «нарисуй синюю абстракцию».\"\n      ]\n    },\n    {\n      \"id\": \"slides_help\",\n      \"title\": \"Как сделать презентацию\",\n      \"patterns\": [\n        \"как сделать презентацию\",\n        \"ты умеешь делать презентации\",\n        \"умеешь делать слайды\"\n      ],\n      \"answers\": [\n        \"Напишите «сделай презентацию про …» — например **«сделай презентацию про Python»**. Я соберу слайды из своей базы знаний. Презентацию можно смотреть на весь экран и скачать. Если темы нет в базе, сделаю шаблон для заполнения.\"\n      ]\n    }\n  ]\n}", "glossary.json": "{\n \"terms\": [\n  {\n   \"terms\": [\n    \"компьютер\",\n    \"пк\",\n    \"эвм\"\n   ],\n   \"text\": \"**Компьютер** — устройство, которое выполняет программы: принимает данные, обрабатывает их и выдаёт результат. Основные части: процессор, оперативная память, накопитель, видеокарта.\"\n  },\n  {\n   \"terms\": [\n    \"процессор\",\n    \"cpu\",\n    \"цп\"\n   ],\n   \"text\": \"**Процессор** (CPU) — «мозг» компьютера: выполняет команды программ. Скорость зависит от частоты (ГГц), числа ядер и архитектуры.\"\n  },\n  {\n   \"terms\": [\n    \"видеокарта\",\n    \"gpu\",\n    \"графический процессор\"\n   ],\n   \"text\": \"**Видеокарта** (GPU) — отвечает за вывод изображения и быстрые параллельные вычисления: игры, 3D, обучение нейросетей.\"\n  },\n  {\n   \"terms\": [\n    \"оперативная память\",\n    \"озу\",\n    \"ram\",\n    \"оперативка\"\n   ],\n   \"text\": \"**Оперативная память** (ОЗУ, RAM) — быстрая временная память, где лежат запущенные программы. После выключения очищается.\"\n  },\n  {\n   \"terms\": [\n    \"жесткий диск\",\n    \"hdd\",\n    \"ssd\",\n    \"накопитель\"\n   ],\n   \"text\": \"**Накопитель** (HDD или SSD) — постоянная память для файлов. SSD намного быстрее HDD, потому что в нём нет движущихся частей.\"\n  },\n  {\n   \"terms\": [\n    \"операционная система\",\n    \"ос\"\n   ],\n   \"text\": \"**Операционная система** — главная программа компьютера: управляет железом, файлами и запускает остальные программы. Примеры: Windows, Linux, macOS, Android.\"\n  },\n  {\n   \"terms\": [\n    \"интернет\"\n   ],\n   \"text\": \"**Интернет** — всемирная сеть компьютеров, которые обмениваются данными по общим правилам (протоколам TCP/IP). Сайты, почта, мессенджеры работают через интернет.\"\n  },\n  {\n   \"terms\": [\n    \"браузер\"\n   ],\n   \"text\": \"**Браузер** — программа для просмотра сайтов: Chrome, Edge, Firefox, Safari. Он загружает HTML, CSS и JavaScript и показывает страницу.\"\n  },\n  {\n   \"terms\": [\n    \"сайт\",\n    \"веб сайт\",\n    \"вебсайт\"\n   ],\n   \"text\": \"**Сайт** — набор веб-страниц по одному адресу (домену). Страницы пишут на HTML, CSS и JavaScript, а сервер может работать на PHP, Python и других языках.\"\n  },\n  {\n   \"terms\": [\n    \"домен\",\n    \"доменное имя\"\n   ],\n   \"text\": \"**Домен** — понятный адрес сайта, например `rteam.info`. Система DNS переводит его в IP-адрес сервера.\"\n  },\n  {\n   \"terms\": [\n    \"ip адрес\",\n    \"ip\"\n   ],\n   \"text\": \"**IP-адрес** — числовой адрес устройства в сети, например `192.168.0.1` (IPv4) или длинный IPv6.\"\n  },\n  {\n   \"terms\": [\n    \"dns\"\n   ],\n   \"text\": \"**DNS** — «телефонная книга» интернета: переводит домены (rteam.info) в IP-адреса серверов.\"\n  },\n  {\n   \"terms\": [\n    \"облако\",\n    \"облачные технологии\",\n    \"облачное хранилище\"\n   ],\n   \"text\": \"**Облако** — хранение данных и запуск программ на чужих серверах через интернет: Google Диск, Яндекс Диск, облачные хостинги.\"\n  },\n  {\n   \"terms\": [\n    \"программа\",\n    \"приложение\",\n    \"софт\"\n   ],\n   \"text\": \"**Программа** — набор инструкций для компьютера. Приложение — программа для пользователя: браузер, игра, мессенджер.\"\n  },\n  {\n   \"terms\": [\n    \"программирование\",\n    \"кодинг\"\n   ],\n   \"text\": \"**Программирование** — создание программ: человек пишет код на языке программирования, а компьютер его выполняет.\"\n  },\n  {\n   \"terms\": [\n    \"язык программирования\"\n   ],\n   \"text\": \"**Язык программирования** — формальный язык для записи программ. Популярные: Python, JavaScript, Java, C++, C#, PHP, Go.\"\n  },\n  {\n   \"terms\": [\n    \"нейросеть\",\n    \"нейронная сеть\"\n   ],\n   \"text\": \"**Нейросеть** — программа, которая учится на примерах: распознаёт картинки, речь, текст. Состоит из «слоёв» простых вычислительных элементов.\"\n  },\n  {\n   \"terms\": [\n    \"машинное обучение\",\n    \"ml\"\n   ],\n   \"text\": \"**Машинное обучение** — раздел ИИ, где программа находит закономерности в данных сама, а не по заранее написанным правилам.\"\n  },\n  {\n   \"terms\": [\n    \"робот\"\n   ],\n   \"text\": \"**Робот** — машина, которая выполняет действия автоматически по программе: заводские манипуляторы, роботы-пылесосы, марсоходы.\"\n  },\n  {\n   \"terms\": [\n    \"блокчейн\"\n   ],\n   \"text\": \"**Блокчейн** — цепочка записей (блоков), которую хранят много компьютеров сразу, поэтому её трудно подделать. На нём работают криптовалюты.\"\n  },\n  {\n   \"terms\": [\n    \"криптовалюта\",\n    \"биткоин\",\n    \"bitcoin\"\n   ],\n   \"text\": \"**Криптовалюта** — цифровые деньги на блокчейне без центрального банка. Самая известная — биткоин.\"\n  },\n  {\n   \"terms\": [\n    \"вирус компьютерный\",\n    \"компьютерный вирус\",\n    \"вредоносная программа\",\n    \"малварь\"\n   ],\n   \"text\": \"**Компьютерный вирус** — вредная программа, которая сама распространяется и может красть данные или портить файлы. Защита: антивирус, обновления, осторожность со ссылками.\"\n  },\n  {\n   \"terms\": [\n    \"антивирус\"\n   ],\n   \"text\": \"**Антивирус** — программа, которая находит и удаляет вредоносные программы.\"\n  },\n  {\n   \"terms\": [\n    \"хакер\"\n   ],\n   \"text\": \"**Хакер** — специалист, который глубоко разбирается в компьютерах и сетях. «Белые» хакеры ищут уязвимости, чтобы их закрыть, «чёрные» — взламывают ради выгоды.\"\n  },\n  {\n   \"terms\": [\n    \"пароль\"\n   ],\n   \"text\": \"**Пароль** — секретная строка для входа в аккаунт. Надёжный пароль — длинный (от 12 символов), уникальный, с буквами, цифрами и знаками.\"\n  },\n  {\n   \"terms\": [\n    \"wi fi\",\n    \"wifi\",\n    \"вайфай\"\n   ],\n   \"text\": \"**Wi-Fi** — беспроводная сеть: устройства подключаются к роутеру по радио и через него выходят в интернет.\"\n  },\n  {\n   \"terms\": [\n    \"роутер\",\n    \"маршрутизатор\"\n   ],\n   \"text\": \"**Роутер** — устройство, которое раздаёт интернет в доме и связывает устройства в одну сеть.\"\n  },\n  {\n   \"terms\": [\n    \"смартфон\",\n    \"телефон\"\n   ],\n   \"text\": \"**Смартфон** — мобильный телефон с полноценной операционной системой (Android или iOS), приложениями и интернетом.\"\n  },\n  {\n   \"terms\": [\n    \"игра\",\n    \"видеоигра\",\n    \"геймдев\"\n   ],\n   \"text\": \"**Видеоигра** — интерактивная программа для развлечения. Игры делают на движках Unity, Unreal Engine, Godot.\"\n  },\n  {\n   \"terms\": [\n    \"unity\"\n   ],\n   \"text\": \"**Unity** — популярный движок для игр на C#: 2D, 3D, мобильные и VR-игры.\"\n  },\n  {\n   \"terms\": [\n    \"minecraft\",\n    \"майнкрафт\"\n   ],\n   \"text\": \"**Minecraft** — игра-песочница из блоков: можно строить, выживать, играть с друзьями. Написана на Java, моды тоже часто пишут на Java.\"\n  },\n  {\n   \"terms\": [\n    \"linux\",\n    \"линукс\"\n   ],\n   \"text\": \"**Linux** — бесплатная операционная система с открытым кодом. На ней работает большинство серверов и Android.\"\n  },\n  {\n   \"terms\": [\n    \"github\",\n    \"гитхаб\"\n   ],\n   \"text\": \"**GitHub** — сайт для хранения кода в Git-репозиториях и совместной работы: pull request, issues, GitHub Pages.\"\n  },\n  {\n   \"terms\": [\n    \"баг\",\n    \"ошибка в программе\"\n   ],\n   \"text\": \"**Баг** — ошибка в программе, из-за которой она работает не так, как задумано. Поиск и исправление багов называется отладкой.\"\n  },\n  {\n   \"terms\": [\n    \"фреймворк\"\n   ],\n   \"text\": \"**Фреймворк** — готовый каркас для программ, в который вы добавляете свой код: Flask и Django (Python), Laravel (PHP), React (JavaScript).\"\n  },\n  {\n   \"terms\": [\n    \"библиотека программная\",\n    \"библиотека кода\"\n   ],\n   \"text\": \"**Библиотека** в программировании — готовый код, который можно подключить к своей программе, чтобы не писать всё с нуля.\"\n  },\n  {\n   \"terms\": [\n    \"сервер\"\n   ],\n   \"text\": \"**Сервер** — компьютер или программа, которые круглосуточно отвечают на запросы других: отдают сайты, хранят данные, обрабатывают сообщения.\"\n  },\n  {\n   \"terms\": [\n    \"хостинг\"\n   ],\n   \"text\": \"**Хостинг** — услуга размещения сайта на сервере, чтобы он был доступен в интернете.\"\n  },\n  {\n   \"terms\": [\n    \"атом\"\n   ],\n   \"text\": \"**Атом** — мельчайшая частица химического элемента. Состоит из ядра (протоны и нейтроны) и электронов вокруг него.\"\n  },\n  {\n   \"terms\": [\n    \"молекула\"\n   ],\n   \"text\": \"**Молекула** — несколько атомов, связанных вместе. Например, молекула воды H₂O — два атома водорода и один кислорода.\"\n  },\n  {\n   \"terms\": [\n    \"электрон\"\n   ],\n   \"text\": \"**Электрон** — отрицательно заряженная частица атома. Поток электронов — это электрический ток.\"\n  },\n  {\n   \"terms\": [\n    \"гравитация\",\n    \"сила тяжести\",\n    \"притяжение\"\n   ],\n   \"text\": \"**Гравитация** — притяжение между телами, у которых есть масса. Из-за неё предметы падают на Землю, а планеты вращаются вокруг Солнца.\"\n  },\n  {\n   \"terms\": [\n    \"фотосинтез\"\n   ],\n   \"text\": \"**Фотосинтез** — процесс, при котором растения с помощью света превращают углекислый газ и воду в сахар и кислород.\"\n  },\n  {\n   \"terms\": [\n    \"днк\"\n   ],\n   \"text\": \"**ДНК** — молекула, в которой записана наследственная информация живого организма: «инструкция» для строительства клеток.\"\n  },\n  {\n   \"terms\": [\n    \"клетка\"\n   ],\n   \"text\": \"**Клетка** — самая маленькая живая единица. Все организмы состоят из клеток: бактерия — из одной, человек — из десятков триллионов.\"\n  },\n  {\n   \"terms\": [\n    \"вирус\",\n    \"вирусы\"\n   ],\n   \"text\": \"**Вирус** (в биологии) — крошечная частица, которая размножается только внутри клеток других организмов. Вызывает грипп, ОРВИ и другие болезни.\"\n  },\n  {\n   \"terms\": [\n    \"бактерия\",\n    \"бактерии\"\n   ],\n   \"text\": \"**Бактерии** — одноклеточные микроорганизмы. Многие полезны (например, в кишечнике), некоторые вызывают болезни.\"\n  },\n  {\n   \"terms\": [\n    \"солнце\"\n   ],\n   \"text\": \"**Солнце** — звезда в центре нашей Солнечной системы. Это огромный шар горячего газа, свет от него идёт до Земли около 8 минут.\"\n  },\n  {\n   \"terms\": [\n    \"луна\"\n   ],\n   \"text\": \"**Луна** — естественный спутник Земли. Находится примерно в 384 000 км, освещена Солнцем, поэтому видны её фазы.\"\n  },\n  {\n   \"terms\": [\n    \"земля планета\",\n    \"планета земля\",\n    \"земля\"\n   ],\n   \"text\": \"**Земля** — третья планета от Солнца и единственная известная планета с жизнью. Один оборот вокруг Солнца — год, вокруг своей оси — сутки.\"\n  },\n  {\n   \"terms\": [\n    \"солнечная система\"\n   ],\n   \"text\": \"**Солнечная система** — Солнце и всё, что вокруг него вращается: 8 планет (Меркурий, Венера, Земля, Марс, Юпитер, Сатурн, Уран, Нептун), спутники, астероиды, кометы.\"\n  },\n  {\n   \"terms\": [\n    \"марс\"\n   ],\n   \"text\": \"**Марс** — четвёртая планета от Солнца, «красная планета». Холодная, с тонкой атмосферой; там работают марсоходы.\"\n  },\n  {\n   \"terms\": [\n    \"юпитер\"\n   ],\n   \"text\": \"**Юпитер** — самая большая планета Солнечной системы, газовый гигант с Большим красным пятном — огромным штормом.\"\n  },\n  {\n   \"terms\": [\n    \"звезда\"\n   ],\n   \"text\": \"**Звезда** — огромный раскалённый газовый шар, который светится за счёт термоядерных реакций. Солнце — ближайшая к нам звезда.\"\n  },\n  {\n   \"terms\": [\n    \"черная дыра\"\n   ],\n   \"text\": \"**Чёрная дыра** — область космоса с такой сильной гравитацией, что даже свет не может её покинуть.\"\n  },\n  {\n   \"terms\": [\n    \"галактика\",\n    \"млечный путь\"\n   ],\n   \"text\": \"**Галактика** — огромное скопление звёзд, газа и пыли. Наша галактика — Млечный Путь, в ней сотни миллиардов звёзд.\"\n  },\n  {\n   \"terms\": [\n    \"энергия\"\n   ],\n   \"text\": \"**Энергия** — способность совершать работу. Бывает механическая, тепловая, электрическая, химическая; переходит из одного вида в другой.\"\n  },\n  {\n   \"terms\": [\n    \"электричество\",\n    \"электрический ток\",\n    \"ток\"\n   ],\n   \"text\": \"**Электрический ток** — направленное движение заряженных частиц (обычно электронов) по проводнику.\"\n  },\n  {\n   \"terms\": [\n    \"климат\"\n   ],\n   \"text\": \"**Климат** — многолетний характерный режим погоды в местности. Погода — то, что сейчас; климат — то, что обычно.\"\n  },\n  {\n   \"terms\": [\n    \"глобальное потепление\",\n    \"изменение климата\"\n   ],\n   \"text\": \"**Глобальное потепление** — рост средней температуры Земли, в основном из-за выбросов парниковых газов от сжигания топлива.\"\n  },\n  {\n   \"terms\": [\n    \"эволюция\"\n   ],\n   \"text\": \"**Эволюция** — постепенное изменение живых организмов через поколения. Главный механизм — естественный отбор.\"\n  },\n  {\n   \"terms\": [\n    \"динозавры\",\n    \"динозавр\"\n   ],\n   \"text\": \"**Динозавры** — древние пресмыкающиеся, жившие примерно 230–66 млн лет назад. Птицы — их прямые потомки.\"\n  },\n  {\n   \"terms\": [\n    \"математика\"\n   ],\n   \"text\": \"**Математика** — наука о числах, формах, закономерностях и логике. Основа физики, программирования и экономики.\"\n  },\n  {\n   \"terms\": [\n    \"число пи\",\n    \"пи\"\n   ],\n   \"text\": \"**Число π (пи)** ≈ 3,14159 — отношение длины окружности к её диаметру. Его цифры никогда не заканчиваются и не повторяются.\"\n  },\n  {\n   \"terms\": [\n    \"теорема пифагора\",\n    \"пифагор\"\n   ],\n   \"text\": \"**Теорема Пифагора**: в прямоугольном треугольнике квадрат гипотенузы равен сумме квадратов катетов: `c² = a² + b²`.\"\n  },\n  {\n   \"terms\": [\n    \"процент\",\n    \"проценты\"\n   ],\n   \"text\": \"**Процент** — сотая часть числа. 20% от 350 = 350 × 20 / 100 = 70. Можете спросить меня: «20% от 350».\"\n  },\n  {\n   \"terms\": [\n    \"дробь\",\n    \"дроби\"\n   ],\n   \"text\": \"**Дробь** — часть целого, записывается как `a/b`: числитель сверху, знаменатель снизу. ½ — половина.\"\n  },\n  {\n   \"terms\": [\n    \"уравнение\"\n   ],\n   \"text\": \"**Уравнение** — равенство с неизвестным, которое нужно найти. Например, `2x + 3 = 7`, откуда `x = 2`.\"\n  },\n  {\n   \"terms\": [\n    \"функция математика\",\n    \"математическая функция\"\n   ],\n   \"text\": \"**Функция** в математике — правило, по которому каждому x соответствует одно значение y, например `y = 2x + 1`.\"\n  },\n  {\n   \"terms\": [\n    \"физика\"\n   ],\n   \"text\": \"**Физика** — наука о природе: движении, силах, энергии, свете, электричестве, строении вещества.\"\n  },\n  {\n   \"terms\": [\n    \"химия\"\n   ],\n   \"text\": \"**Химия** — наука о веществах, их составе и превращениях (химических реакциях).\"\n  },\n  {\n   \"terms\": [\n    \"биология\"\n   ],\n   \"text\": \"**Биология** — наука о живых организмах: как они устроены, живут, размножаются и эволюционируют.\"\n  },\n  {\n   \"terms\": [\n    \"история\"\n   ],\n   \"text\": \"**История** — наука о прошлом человечества: событиях, людях, государствах и культуре.\"\n  },\n  {\n   \"terms\": [\n    \"география\"\n   ],\n   \"text\": \"**География** — наука о Земле: материках, странах, климате, природе и населении.\"\n  },\n  {\n   \"terms\": [\n    \"грамматика\"\n   ],\n   \"text\": \"**Грамматика** — правила языка: как изменяются слова и как из них строятся предложения.\"\n  },\n  {\n   \"terms\": [\n    \"существительное\"\n   ],\n   \"text\": \"**Существительное** — часть речи, обозначающая предмет и отвечающая на вопросы «кто?» или «что?»: стол, дом, Rai.\"\n  },\n  {\n   \"terms\": [\n    \"глагол\"\n   ],\n   \"text\": \"**Глагол** — часть речи, обозначающая действие: бежать, писать, думает.\"\n  },\n  {\n   \"terms\": [\n    \"прилагательное\"\n   ],\n   \"text\": \"**Прилагательное** — часть речи, обозначающая признак предмета: красный, быстрый, умный.\"\n  },\n  {\n   \"terms\": [\n    \"экономика\"\n   ],\n   \"text\": \"**Экономика** — как люди, компании и государства производят, распределяют и тратят ресурсы и деньги.\"\n  },\n  {\n   \"terms\": [\n    \"деньги\"\n   ],\n   \"text\": \"**Деньги** — средство обмена и измерения стоимости. Сейчас в основном безналичные: карты, переводы.\"\n  },\n  {\n   \"terms\": [\n    \"инфляция\"\n   ],\n   \"text\": \"**Инфляция** — рост цен со временем: на те же деньги можно купить меньше.\"\n  },\n  {\n   \"terms\": [\n    \"бизнес\"\n   ],\n   \"text\": \"**Бизнес** — деятельность ради прибыли: продажа товаров или услуг.\"\n  },\n  {\n   \"terms\": [\n    \"стартап\"\n   ],\n   \"text\": \"**Стартап** — молодая компания, которая быстро проверяет новую идею продукта и стремится быстро расти.\"\n  },\n  {\n   \"terms\": [\n    \"демократия\"\n   ],\n   \"text\": \"**Демократия** — форма правления, при которой власть принадлежит народу и выбирается на выборах.\"\n  },\n  {\n   \"terms\": [\n    \"музыка\"\n   ],\n   \"text\": \"**Музыка** — искусство звуков: мелодия, ритм и гармония. Музыку тоже можно программировать — например, в Sonic Pi.\"\n  },\n  {\n   \"terms\": [\n    \"спорт\"\n   ],\n   \"text\": \"**Спорт** — физическая активность с правилами и соревнованием. Регулярные тренировки полезны для здоровья и настроения.\"\n  },\n  {\n   \"terms\": [\n    \"здоровье\",\n    \"здоровый образ жизни\",\n    \"зож\"\n   ],\n   \"text\": \"**Здоровый образ жизни**: сон 7–9 часов, движение каждый день, вода, овощи и фрукты, перерывы от экрана.\"\n  },\n  {\n   \"terms\": [\n    \"сон\"\n   ],\n   \"text\": \"**Сон** — восстановление организма и мозга. Подросткам нужно 8–10 часов, взрослым 7–9.\"\n  },\n  {\n   \"terms\": [\n    \"время\"\n   ],\n   \"text\": \"**Время** — то, что измеряет последовательность событий: секунды, минуты, часы. Спросите «который час» — скажу текущее время.\"\n  },\n  {\n   \"terms\": [\n    \"любовь\"\n   ],\n   \"text\": \"**Любовь** — глубокая привязанность и забота о другом человеке. Учёные изучают её, но лучше всего её описывают поэты.\"\n  },\n  {\n   \"terms\": [\n    \"дружба\",\n    \"друг\"\n   ],\n   \"text\": \"**Дружба** — близкие отношения, основанные на доверии, поддержке и общих интересах.\"\n  },\n  {\n   \"terms\": [\n    \"смысл жизни\"\n   ],\n   \"text\": \"**Смысл жизни** у каждого свой: люди находят его в близких, творчестве, помощи другим, познании мира. Главное — чтобы он был ваш.\"\n  },\n  {\n   \"terms\": [\n    \"кот\",\n    \"кошка\",\n    \"коты\"\n   ],\n   \"text\": \"**Кошка** — домашнее животное, одомашненное около 10 000 лет назад. Спит 12–16 часов в сутки и отлично видит в темноте.\"\n  },\n  {\n   \"terms\": [\n    \"собака\",\n    \"собаки\",\n    \"пес\"\n   ],\n   \"text\": \"**Собака** — первое одомашненное животное и верный друг человека. Отлично чувствует запахи — в 10 000 раз лучше человека.\"\n  },\n  {\n   \"terms\": [\n    \"россия\"\n   ],\n   \"text\": \"**Россия** — самая большая страна мира по площади (≈17 млн км²). Столица — Москва.\"\n  },\n  {\n   \"terms\": [\n    \"москва\"\n   ],\n   \"text\": \"**Москва** — столица России и крупнейший город страны, население более 13 млн человек.\"\n  },\n  {\n   \"terms\": [\n    \"вода\"\n   ],\n   \"text\": \"**Вода** (H₂O) — жидкость, без которой нет жизни. Кипит при 100 °C, замерзает при 0 °C.\"\n  },\n  {\n   \"terms\": [\n    \"воздух\"\n   ],\n   \"text\": \"**Воздух** — смесь газов: примерно 78% азота, 21% кислорода и немного других газов.\"\n  },\n  {\n   \"terms\": [\n    \"радуга\"\n   ],\n   \"text\": \"**Радуга** — свет, разложенный каплями воды на цвета: красный, оранжевый, жёлтый, зелёный, голубой, синий, фиолетовый.\"\n  },\n  {\n   \"terms\": [\n    \"молния\",\n    \"гроза\"\n   ],\n   \"text\": \"**Молния** — гигантский электрический разряд в атмосфере. Гром — звук от резко нагретого ею воздуха.\"\n  },\n  {\n   \"terms\": [\n    \"вулкан\"\n   ],\n   \"text\": \"**Вулкан** — место, где из недр Земли на поверхность выходит расплавленная порода — магма (на поверхности — лава).\"\n  },\n  {\n   \"terms\": [\n    \"землетрясение\"\n   ],\n   \"text\": \"**Землетрясение** — колебания земной поверхности из-за сдвига плит земной коры.\"\n  },\n  {\n   \"terms\": [\n    \"океан\"\n   ],\n   \"text\": \"**Океан** — огромная масса солёной воды. На Земле пять океанов: Тихий (самый большой), Атлантический, Индийский, Южный и Северный Ледовитый.\"\n  },\n  {\n   \"terms\": [\n    \"космос\",\n    \"вселенная\"\n   ],\n   \"text\": \"**Космос** — пространство за пределами атмосферы Земли: звёзды, планеты, галактики. Граница космоса условно проходит на высоте 100 км (линия Кармана).\"\n  },\n  {\n   \"terms\": [\n    \"планета\",\n    \"планеты\"\n   ],\n   \"text\": \"**Планета** — крупное небесное тело, которое вращается вокруг звезды и очищает свою орбиту. В Солнечной системе 8 планет.\"\n  },\n  {\n   \"terms\": [\n    \"космонавт\",\n    \"астронавт\",\n    \"гагарин\"\n   ],\n   \"text\": \"**Космонавт** — человек, который летает в космос. Первым был Юрий Гагарин — 12 апреля 1961 года.\"\n  },\n  {\n   \"terms\": [\n    \"море\",\n    \"моря\"\n   ],\n   \"text\": \"**Море** — часть океана, отделённая сушей или островами. Самое солёное — Мёртвое море, самое большое — Филиппинское.\"\n  },\n  {\n   \"terms\": [\n    \"горы\",\n    \"гора\"\n   ],\n   \"text\": \"**Горы** — высокие участки суши. Самая высокая гора — Эверест (8849 м), самая высокая в России — Эльбрус (5642 м).\"\n  },\n  {\n   \"terms\": [\n    \"лес\",\n    \"леса\"\n   ],\n   \"text\": \"**Лес** — большая территория, покрытая деревьями. Леса дают кислород, хранят углерод и дом для множества животных.\"\n  },\n  {\n   \"terms\": [\n    \"город\",\n    \"города\"\n   ],\n   \"text\": \"**Город** — крупный населённый пункт с плотной застройкой. Самый населённый город мира — Токио с пригородами.\"\n  },\n  {\n   \"terms\": [\n    \"природа\"\n   ],\n   \"text\": \"**Природа** — всё, что существует без участия человека: растения, животные, горы, реки, климат.\"\n  },\n  {\n   \"terms\": [\n    \"животные\",\n    \"животное\"\n   ],\n   \"text\": \"**Животные** — живые организмы, которые питаются готовой пищей и обычно умеют двигаться: от насекомых до китов.\"\n  }\n ]\n}"}</script>
<script>
(function () {
  "use strict";

  const CFG = window.RAI_CONFIG;
  const params = new URLSearchParams(location.search);
  if (params.get("api")) CFG.api = params.get("api");
  if (params.get("pyodide")) CFG.pyodide = params.get("pyodide");
  if (params.get("py")) CFG.pyBase = params.get("py");
  // Ссылка «назад на сайт»: chat.php на хостинге передаёт ?back=https://ваш-сайт/
  let backUrl = null;
  try {
    const b = params.get("back");
    if (b && /^https?:\/\/[^\s]+$/i.test(b)) localStorage.setItem("rai_back", b);
    backUrl = localStorage.getItem("rai_back");
  } catch (e) {
    const b = params.get("back");
    backUrl = b && /^https?:\/\/[^\s]+$/i.test(b) ? b : null;
  }

  const PY_FILES = ["versions.py", "nlp.py", "skills.py", "net.py", "online.py", "proglangs.py", "creative.py", "brain.py",
                    "knowledge.json", "glossary.json"];
  const STORE_KEY = "rai_chats_v1";

  // Пока движок не загрузился — показываем версии из этого списка.
  let VERSIONS = [
    {id: "pro", name: "Rai Pro", features: ["поиск по смыслу", "погода", "валюты", "перевод", "поиск в интернете", "таблицы", "картинки"]},
    {id: "pro-fast", name: "Rai Pro Fast", features: ["поиск по ключевым словам", "калькулятор", "погода", "валюты", "перевод"]},
    {id: "pro-plus", name: "Rai Pro Plus", features: ["понимает опечатки", "все навыки", "картинки", "презентации", "помнит имя", "«подробнее» по теме", "подсказки"]},
    {id: "pro-sun", name: "Rai Pro Sun", features: ["всё из Pro Plus", "память фактов («запомни, что …»)", "несколько вопросов сразу", "подробные ответы", "большие презентации"]}
  ];
  const EXAMPLES = [
    ["Погода в Москве", "погода с картинкой"],
    ["100 долларов в рублях", "курсы валют"],
    ["Переведи на английский: доброе утро", "перевод"],
    ["Нарисуй закат над морем", "картинка"],
    ["Сделай презентацию про космос", "презентация · Pro Plus / Sun"],
    ["Hello World на Rust", "языки программирования"],
    ["Найди в интернете Эйфелева башня", "поиск в интернете"],
    ["Что ты умеешь?", "все возможности"]
  ];

  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), sendBtn = $("send");

  // ---------------------------------------------------------------- утилиты
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  }
  function icon(name) { return `<svg class="i"><use href="#i-${name}"/></svg>`; }
  function uid() { return "c" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  let toastTimer = null;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  function download(name, blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function safeName(s) { return (s || "rai").replace(/[\\/:*?"<>|«»]+/g, " ").trim().slice(0, 60) || "rai"; }

  // ---------------------------------------------------------------- markdown
  function inline(text) {
    return String(text).split(/(`[^`\n]+`)/g).map((part, i) => {
      if (i % 2 === 1) return "<code>" + esc(part.slice(1, -1)) + "</code>";
      let s = esc(part);
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      s = s.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/==([^=]+?)==/g, "<mark>$1</mark>");
      s = s.replace(/~~([^~]+?)~~/g, "<del>$1</del>");
      s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
      return s;
    }).join("");
  }
  function splitRow(line) {
    const cells = [];
    let cur = "", code = false;
    const body = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    for (const ch of body) {
      if (ch === "`") code = !code;
      if (ch === "|" && !code) { cells.push(cur.trim()); cur = ""; } else cur += ch;
    }
    cells.push(cur.trim());
    return cells;
  }
  function codeBlock(code, lang) {
    return `<div class="codeblock"><div class="codehead"><span>${esc(lang || "код")}</span>` +
      `<button class="icon-btn copy-code" type="button">${icon("copy")}Копировать</button></div>` +
      `<pre><code>${esc(code)}</code></pre></div>`;
  }
  function renderMarkdown(md) {
    const lines = String(md || "").replace(/\r/g, "").split("\n");
    const out = [];
    let para = [];
    const flush = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
    const LIST = /^([-*•]|\d+[.)])\s+/;
    let i = 0;
    while (i < lines.length) {
      const t = lines[i].trim();
      let m;
      if (t.startsWith("```")) {
        flush();
        const lang = t.slice(3).trim(), code = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith("```")) { code.push(lines[i]); i++; }
        i++;
        out.push(codeBlock(code.join("\n"), lang));
      } else if (t.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1].trim())) {
        flush();
        const head = splitRow(t), rows = [];
        i += 2;
        while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(splitRow(lines[i])); i++; }
        out.push('<div class="table-wrap"><table><thead><tr>' + head.map((c) => "<th>" + inline(c) + "</th>").join("") +
          "</tr></thead><tbody>" + rows.map((r) => "<tr>" + head.map((_, k) => "<td>" + inline(r[k] || "") + "</td>").join("") + "</tr>").join("") +
          "</tbody></table></div>");
      } else if ((m = t.match(/^(#{1,4})\s+(.*)$/))) {
        flush();
        const lvl = Math.min(m[1].length + 1, 4);
        out.push(`<h${lvl}>${inline(m[2])}</h${lvl}>`);
        i++;
      } else if (/^(-{3,}|\*{3,})$/.test(t)) {
        flush(); out.push("<hr>"); i++;
      } else if (t.startsWith(">")) {
        flush();
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith(">")) { q.push(lines[i].trim().replace(/^>\s?/, "")); i++; }
        out.push("<blockquote>" + q.map(inline).join("<br>") + "</blockquote>");
      } else if (LIST.test(t)) {
        flush();
        const ordered = /^\d/.test(t), items = [];
        while (i < lines.length && LIST.test(lines[i].trim()) && /^\d/.test(lines[i].trim()) === ordered) {
          items.push(lines[i].trim().replace(LIST, "")); i++;
        }
        const tag = ordered ? "ol" : "ul";
        out.push(`<${tag}>` + items.map((x) => "<li>" + inline(x) + "</li>").join("") + `</${tag}>`);
      } else if (!t) {
        flush(); i++;
      } else {
        para.push(lines[i]); i++;
      }
    }
    flush();
    return out.join("");
  }
  function plainText(md) {
    return String(md || "")
      .replace(/```[\s\S]*?```/g, " (пример кода) ")
      .replace(/^\|?\s*:?-{2,}.*$/gm, "")
      .replace(/[|*#=`~>]/g, " ")
      .replace(/\s+/g, " ").trim();
  }

  // ---------------------------------------------------------------- копирование
  async function copyRich(md, html, el) {
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        await navigator.clipboard.write([new ClipboardItem({
          "text/plain": new Blob([md], {type: "text/plain"}),
          "text/html": new Blob([html], {type: "text/html"})
        })]);
      } else {
        await navigator.clipboard.writeText(md);
      }
      toast("Скопировано");
    } catch (e) {
      try { await navigator.clipboard.writeText(md); toast("Скопировано"); }
      catch (_) {
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
        toast("Текст выделен — нажмите Ctrl+C");
      }
    }
  }

  // ---------------------------------------------------------------- озвучка
  let speakingBtn = null;
  function speak(text, btn) {
    if (!("speechSynthesis" in window)) { toast("Этот браузер не умеет озвучивать текст"); return; }
    const was = speakingBtn;
    speechSynthesis.cancel();
    if (was) { was.innerHTML = icon("speak") + "Озвучить"; speakingBtn = null; if (was === btn) return; }
    const u = new SpeechSynthesisUtterance(plainText(text));
    u.lang = "ru-RU";
    const ru = speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("ru"));
    if (ru) u.voice = ru;
    u.onend = u.onerror = () => { if (speakingBtn === btn) { btn.innerHTML = icon("speak") + "Озвучить"; speakingBtn = null; } };
    speakingBtn = btn;
    btn.innerHTML = icon("stop") + "Стоп";
    speechSynthesis.speak(u);
  }

  // ---------------------------------------------------------------- голосовой ввод
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recording = false;
  function setMic(on) {
    recording = on;
    $("mic").classList.toggle("on", on);
    $("mic").setAttribute("aria-label", on ? "Остановить запись" : "Голосовой ввод");
    $("listening").hidden = !on;
    $("listening").textContent = on ? "Слушаю… говорите. Нажмите микрофон ещё раз, чтобы остановить." : "";
  }
  $("mic").addEventListener("click", () => {
    if (!SR) { toast("Голосовой ввод работает в Chrome и Edge"); return; }
    if (recording && rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = "ru-RU";
    rec.interimResults = true;
    rec.continuous = true;
    const base = input.value.trim() ? input.value.trimEnd() + " " : "";
    rec.onresult = (e) => {
      let text = "";
      for (let k = 0; k < e.results.length; k++) text += e.results[k][0].transcript;
      input.value = base + text;
      autosize();
    };
    rec.onerror = (e) => {
      const msg = {
        "not-allowed": "Нет доступа к микрофону. Разрешите его в настройках браузера (значок слева от адреса).",
        "service-not-allowed": "Браузер не разрешил распознавание речи на этой странице.",
        "no-speech": "Не слышно речи. Попробуйте ещё раз.",
        "audio-capture": "Микрофон не найден.",
        "network": "Для распознавания речи браузеру нужен интернет."
      }[e.error];
      toast(msg || "Ошибка микрофона: " + e.error);
    };
    rec.onend = () => { setMic(false); input.focus(); };
    try { rec.start(); setMic(true); } catch (e) { toast("Не удалось включить микрофон"); }
  });

  // ---------------------------------------------------------------- чаты
  let chats = [], currentId = null, lastVersion = "pro";
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({chats: chats, current: currentId, version: lastVersion})); }
    catch (e) { toast("В браузере не хватает места — удалите старые чаты"); }
    schedulePush();
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (d && Array.isArray(d.chats)) {
        chats = d.chats.filter((c) => c && c.id && Array.isArray(c.messages));
        currentId = d.current;
        lastVersion = d.version || lastVersion;
      }
    } catch (e) { /* начнём с чистого листа */ }
    if (!chats.length) chats.push(makeChat());
    if (!chats.some((c) => c.id === currentId)) currentId = chats[0].id;
  }
  function makeChat() {
    return {id: uid(), title: "Новый чат", version: lastVersion, created: Date.now(), updated: Date.now(), messages: []};
  }
  function current() { return chats.find((c) => c.id === currentId); }

  function newChat() {
    const cur = current();
    if (cur && !cur.messages.length) { closeMenu(); input.focus(); return; }
    const c = makeChat();
    chats.unshift(c);
    currentId = c.id;
    save(); renderAll(); closeMenu(); input.focus();
  }
  function openChat(id) {
    currentId = id; save(); renderAll(); closeMenu();
  }
  function deleteChat(id) {
    chats = chats.filter((c) => c.id !== id);
    if (!chats.length) chats.push(makeChat());
    if (!chats.some((c) => c.id === currentId)) currentId = chats[0].id;
    save(); renderAll();
  }
  function renameChat(id, title) {
    const c = chats.find((x) => x.id === id);
    if (c && title.trim()) { c.title = title.trim().slice(0, 80); save(); }
    renderAll();
  }

  function when(ts) {
    const d = new Date(ts), now = new Date();
    return d.toDateString() === now.toDateString()
      ? d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"})
      : d.toLocaleDateString("ru-RU", {day: "numeric", month: "short"});
  }
  function versionName(id) { const v = VERSIONS.find((x) => x.id === id); return v ? v.name : id; }

  function renderSidebar() {
    const list = $("chatList");
    list.textContent = "";
    for (const c of chats.slice().sort((a, b) => b.updated - a.updated)) {
      const item = document.createElement("div");
      item.className = "chat-item" + (c.id === currentId ? " active" : "");
      item.innerHTML = `<button class="open" type="button"><span class="t">${esc(c.title)}</span>` +
        `<span class="m">${esc(versionName(c.version).replace(/^Rai /, ""))} · ${esc(when(c.updated))}</span></button>` +
        `<div class="acts"><button class="icon-btn ren" type="button" aria-label="Переименовать">${icon("edit")}</button>` +
        `<button class="icon-btn del" type="button" aria-label="Удалить">${icon("trash")}</button></div>`;
      item.querySelector(".open").addEventListener("click", () => openChat(c.id));
      item.querySelector(".ren").addEventListener("click", () => startRename(item, c));
      item.querySelector(".del").addEventListener("click", () => {
        item.innerHTML = `<div class="confirm"><span>Удалить «${esc(c.title)}»?</span><div>` +
          `<button class="btn red yes" type="button">Удалить</button><button class="btn no" type="button">Отмена</button></div></div>`;
        item.querySelector(".yes").addEventListener("click", () => deleteChat(c.id));
        item.querySelector(".no").addEventListener("click", renderSidebar);
      });
      list.append(item);
    }
  }
  function startRename(item, c) {
    item.innerHTML = "";
    const field = document.createElement("input");
    field.value = c.title;
    field.setAttribute("aria-label", "Название чата");
    item.append(field);
    field.focus(); field.select();
    let done = false;
    const finish = (ok) => { if (done) return; done = true; ok ? renameChat(c.id, field.value) : renderAll(); };
    field.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      if (e.key === "Escape") finish(false);
    });
    field.addEventListener("blur", () => finish(true));
  }

  function renderVersions() {
    const chat = current();
    const box = $("versions");
    box.textContent = "";
    for (const v of VERSIONS) {
      const b = document.createElement("button");
      b.type = "button";
      b.id = "ver-" + v.id;
      b.textContent = v.name.replace(/^Rai\s+/, "");
      b.title = v.description || v.name;
      b.setAttribute("aria-pressed", String(v.id === chat.version));
      b.addEventListener("click", () => {
        chat.version = lastVersion = v.id;
        save(); renderVersions(); renderSidebar();
      });
      box.append(b);
    }
    const cur = VERSIONS.find((v) => v.id === chat.version);
    $("features").textContent = cur ? cur.name + ": " + (cur.features || []).join(" · ") : "";
  }

  // ---------------------------------------------------------------- сообщения
  function renderWelcome() {
    const w = document.createElement("div");
    w.className = "inner welcome";
    w.innerHTML = `<h1>Чем займёмся<span>?</span></h1>` +
      `<p>Rai отвечает на вопросы, считает, делает таблицы, рисует картинки и собирает презентации. Можно писать или говорить голосом.</p>` +
      `<div class="examples"></div>`;

  function renderMessage(m) {
    const wrap = document.createElement("div");
    wrap.className = "inner msg " + (m.role === "user" ? "user" : "rai");
    if (m.role === "user") {
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = m.text;
      wrap.append(b);
      log.append(wrap);
      return wrap;
    }
    wrap.innerHTML = `<div class="who">Rai</div><div class="bubble md"></div>`;
    const bubble = wrap.querySelector(".bubble");
    bubble.innerHTML = renderMarkdown(m.text);
    for (const a of m.attachments || []) {
      if (a.type === "image" && a.svg) wrap.append(renderImage(a));
      if (a.type === "photo" && /^https:\/\//.test(a.url || "")) wrap.append(renderPhoto(a));

      (m.meta ? `<span class="meta">${esc(m.meta)}</span>` : "");
    acts.querySelector(".copy").addEventListener("click", () => copyRich(m.text, bubble.innerHTML, bubble));
    acts.querySelector(".speak").addEventListener("click", (e) => speak(m.text, e.currentTarget));

  // картинка
  function svgUrl(svg) { return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }
  function renderPhoto(a) {
    const fig = document.createElement("figure");
    fig.className = "photo";
    fig.innerHTML = `<img alt="${esc(a.title || "Фото")}" src="${esc(a.url)}" loading="lazy" referrerpolicy="no-referrer">` +
      `<figcaption>${esc(a.title || "")}` +
      (/^https:\/\//.test(a.source || "") ? ` · <a href="${esc(a.source)}" target="_blank" rel="noopener noreferrer">источник</a>` : "") +
      `</figcaption>`;
    fig.querySelector("img").addEventListener("error", () => fig.remove());
    return fig;
  }

  function renderImage(a) {
    const fig = document.createElement("figure");
    fig.className = "art";
    fig.innerHTML = `<img alt="${esc(a.title || "Картинка")}" src="${svgUrl(a.svg)}">` +
      `<div class="actions"><button class="icon-btn png" type="button">${icon("down")}PNG</button>` +
      `<button class="icon-btn svg" type="button">${icon("down")}SVG</button>` +
      `<button class="icon-btn full" type="button">${icon("full")}На весь экран</button>` +
      `<span class="meta">${esc(a.title || "")}</span></div>`;
    const img = fig.querySelector("img");
    const full = () => (img.requestFullscreen ? img.requestFullscreen() : Promise.reject()).catch(() => toast("Полный экран недоступен"));
    img.addEventListener("click", full);
    fig.querySelector(".full").addEventListener("click", full);
    fig.querySelector(".svg").addEventListener("click", () =>
      download(safeName(a.title) + ".svg", new Blob([a.svg], {type: "image/svg+xml"})));
    fig.querySelector(".png").addEventListener("click", () => {
      const pic = new Image();
      pic.onload = () => {
        const cv = document.createElement("canvas");
        cv.width = pic.naturalWidth || 1200; cv.height = pic.naturalHeight || 800;
        cv.getContext("2d").drawImage(pic, 0, 0, cv.width, cv.height);
        cv.toBlob((blob) => blob ? download(safeName(a.title) + ".png", blob) : toast("Не удалось сохранить PNG"), "image/png");
      };
      pic.onerror = () => toast("Не удалось сохранить PNG");
      pic.src = svgUrl(a.svg);
    });
    return fig;
  }

  // презентация
  function slideHTML(s, n, total, dir) {
    const num = `<div class="num">${n} / ${total}</div>`;
    const cls = `slide play t-${esc(s.transition || "fade")}`;
    const attrs = ` data-t="${esc(s.transition || "fade")}" style="--dir:${dir || 1}"`;
    const pic = (c) => s.image ? `<img class="${c}" alt="" src="${svgUrl(s.image)}">` : "";
    if (s.kind === "title") return `<section class="${cls} cover"${attrs}>${pic("bg")}<div class="kicker">Презентация</div><h1>${esc(s.title)}</h1><div class="sub">${esc(s.subtitle || "")}</div>${num}</section>`;
    if (s.kind === "end") return `<section class="${cls} end"${attrs}><h1>${esc(s.title)}</h1><div class="sub">${esc(s.subtitle || "")}</div>${num}</section>`;
    let body = "";
    if (s.kind === "code") body = `<pre><code>${esc(s.code || "")}</code></pre>`;
    else if (s.kind === "table") {
      const [head, ...rows] = s.rows && s.rows.length ? s.rows : [[]];
      body = "<table><thead><tr>" + head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + head.map((_, k) => "<td>" + inline(r[k] || "") + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
    } else {
      body = "<ul>" + (s.bullets || []).map((b, i) => `<li style="--i:${i}">` + inline(b) + "</li>").join("") + "</ul>";
      if (s.image) body = `<div class="cols">${body}${pic("side")}</div>`;
    }
    return `<section class="${cls}"${attrs}><div class="kicker">${String(n).padStart(2, "0")}</div><h2>${esc(s.title || "")}</h2>${body}${num}</section>`;
  }
  function renderDeck(a) {
    const deck = document.createElement("div");
    deck.className = "deck";
    deck.innerHTML = `<div class="stage" tabindex="0" aria-label="Слайды: нажмите или используйте стрелки"></div>` +
      `<div class="deck-bar actions">` +
      `<button class="icon-btn prev" type="button" aria-label="Предыдущий слайд">${icon("left")}</button>` +
      `<span class="count"></span>` +
      `<button class="icon-btn next" type="button" aria-label="Следующий слайд">${icon("right")}</button>` +
      `<span class="spacer"></span>` +
      `<button class="icon-btn full" type="button">${icon("full")}На весь экран</button>` +
      `<button class="icon-btn dl" type="button">${icon("down")}Скачать</button></div>`;
    const stage = deck.querySelector(".stage");
    let k = 0;
    const total = a.slides.length;
    const show = (dir) => {
      stage.innerHTML = slideHTML(a.slides[k], k + 1, total, dir);
      deck.querySelector(".count").textContent = (k + 1) + " / " + total;
    };
    const go = (d) => {
      const next = Math.max(0, Math.min(total - 1, k + d));
      if (next === k) return;
      k = next; show(d < 0 ? -1 : 1);
    };
    deck.querySelector(".prev").addEventListener("click", () => go(-1));
    deck.querySelector(".next").addEventListener("click", () => go(1));
    stage.addEventListener("click", () => go(1));
    stage.addEventListener("dblclick", (e) => e.preventDefault());
    stage.addEventListener("keydown", (e) => {
      if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(1); }
      if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
    });
    deck.querySelector(".full").addEventListener("click", () => {
      (stage.requestFullscreen ? stage.requestFullscreen() : Promise.reject()).then(() => stage.focus()).catch(() => toast("Полный экран недоступен"));
    });
    deck.querySelector(".dl").addEventListener("click", () =>
      download(safeName(a.title) + ".html", new Blob([deckFile(a)], {type: "text/html"})));
    show();
    return deck;
  }
  function deckFile(a) {
    const total = a.slides.length;
    const slides = a.slides.map((s, n) => slideHTML(s, n + 1, total).replace(/class="slide play t-[a-z]+/, 'class="slide')).join("\n");
    const css = $("slide-css").textContent;
    return `<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(a.title)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>html,body{margin:0;height:100%;background:#000}
.deck{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden}
.deck .slide{display:none}.deck .slide.on{display:flex}
${css}</style></head><body><div class="deck">${slides}</div>
<script>var s=document.querySelectorAll('.slide'),k=0;
function show(d){s.forEach(function(e,i){var on=i===k;e.classList.toggle('on',on);if(on){e.classList.remove('play','t-'+e.dataset.t);e.style.setProperty('--dir',d||1);void e.offsetWidth;e.classList.add('play','t-'+e.dataset.t)}})}
function go(d){var n=Math.max(0,Math.min(s.length-1,k+d));if(n!==k){k=n;show(d)}}
document.addEventListener('keydown',function(e){if(['ArrowRight','PageDown',' '].indexOf(e.key)>=0)go(1);if(['ArrowLeft','PageUp'].indexOf(e.key)>=0)go(-1);if(e.key==='f'&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()});
document.addEventListener('click',function(){go(1)});show();<\/script></body></html>`;
  }

  function renderChat() {
    const chat = current();
    log.textContent = "";
    $("chatTitle").textContent = chat.title;
    if (!chat.messages.length) renderWelcome();
    for (const m of chat.messages) renderMessage(m);
    log.scrollTop = log.scrollHeight;
  }
  function renderAll() { renderSidebar(); renderVersions(); renderChat(); }

  // ---------------------------------------------------------------- движки
  let engineReady = false;
  function setStatus(state, text) {
    $("status").dataset.state = state;
    $("statusText").textContent = text;
  }
  function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
  }
  function historyOf(chat) {
    return chat.messages.slice(-20).map((m) => ({role: m.role === "user" ? "user" : "assistant", content: m.text}));
  }

  function serverEngine(root) {
    return {
      mode: "server",
      root: root,
      async versions() {
        const r = await fetch(root + "api/versions");
        return (await r.json()).versions;
      },
      async ask(v, message, sessionId, history) {
        const r = await fetch(root + "api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message: message, version: v, session_id: sessionId, history: history})
        });
        return await r.json();
      }
    };
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Не удалось загрузить " + src));
      document.head.append(s);
    });
  }

  function readPyFiles() {
    return Promise.all(PY_FILES.map(async (name) => {
      // Файлы, встроенные в страницу (rai.html, собранный build_standalone.py).
      const embedded = document.getElementById("rai-files");
      if (embedded) return [name, JSON.parse(embedded.textContent)[name]];
      const r = await fetch(CFG.pyBase.replace(/\/?$/, "/") + name, {cache: "no-cache"});
      if (!r.ok) throw new Error("нет файла " + name + " (" + r.status + ")");
      return [name, await r.text()];
    }));
  }

  // Загрузить Pyodide: пробуем источники по очереди, каждый с ограничением по времени.
  async function loadPython(onStep) {
    const sources = [];
    for (const src of [CFG.pyodide].concat(window.RAI_PYODIDE_SOURCES)) {
      if (src && !sources.includes(src)) sources.push(src);
    }
    const problems = [];
    for (const src of sources) {
      const base = new URL(src.replace(/\/?$/, "/"), location.href).href;
      const where = new URL(base).host || "файл";
      try {
        onStep("Скачиваю Python (" + where + ")");
        if (!window.loadPyodide) await withTimeout(loadScript(base + "pyodide.js"), 20000);
        const opts = {indexURL: base};
        if (CFG.stdlib && src === CFG.pyodide) opts.stdLibURL = new URL(CFG.stdlib, location.href).href;
        return await withTimeout(window.loadPyodide(opts), 120000);
      } catch (e) {
        problems.push(where + ": " + (e && e.message === "timeout" ? "слишком долго" : (e && e.message) || e));
        try { delete window.loadPyodide; } catch (_) { window.loadPyodide = undefined; }
      }
    }
    throw new Error("не удалось загрузить Python.\n" + problems.join("\n"));
  }

  async function browserEngine() {
    const t0 = Date.now();
    let step = "Загружаю Python";
    const tick = () => setStatus("loading", step + "… " + Math.round((Date.now() - t0) / 1000) + " с");
    tick();
    const timer = setInterval(tick, 1000);
    let pyodide, files;
    try {
      [pyodide, files] = await Promise.all([
        loadPython((text) => { step = text; tick(); }),
        readPyFiles()
      ]);
      step = "Запускаю Rai";
      tick();
    } finally {
      clearInterval(timer);
    }
    pyodide.FS.mkdirTree("/home/pyodide/rai");
    for (const [name, text] of files) pyodide.FS.writeFile("/home/pyodide/rai/" + name, text);
    pyodide.runPython(`
import sys, json
sys.path.insert(0, "/home/pyodide/rai")
import brain, versions
_rai = brain.Brain(learned_path="/tmp/learned.json")

def rai_ask(version_id, message, session_id, history_json="[]"):
    v = versions.resolve(version_id)
    if v is None:
        return json.dumps({"answer": "Неизвестная версия.", "error": "unknown_version"}, ensure_ascii=False)
    try:
        history = json.loads(history_json or "[]")
        return json.dumps(_rai.answer(v, message, session_id, history), ensure_ascii=False)
    except brain.RaiError as e:
        return json.dumps({"answer": str(e), "error": "rai_error"}, ensure_ascii=False)

def rai_versions():
    return json.dumps([v.public() for v in versions.VERSIONS.values()], ensure_ascii=False)
`);
    const pyAsk = pyodide.globals.get("rai_ask");
    const pyVersions = pyodide.globals.get("rai_versions");
    return {
      mode: "browser",
      async versions() { return JSON.parse(pyVersions()); },
      async ask(v, message, sessionId, history) { return JSON.parse(pyAsk(v, message, sessionId, JSON.stringify(history))); }
    };
  }

  async function startEngine() {
    if (CFG.api) return serverEngine(CFG.api.replace(/\/+$/, "") + "/");
    // Страницу отдаёт сам сервер Rai? Тогда рядом есть api/versions.
    if (location.protocol.startsWith("http")) {
      try {
        const r = await withTimeout(fetch("api/versions", {cache: "no-store"}), 2500);
        const ct = r.headers.get("content-type") || "";
        if (r.ok && ct.includes("json")) {
          const d = await r.json();
          if (d && Array.isArray(d.versions)) return serverEngine("");
        }
      } catch (e) { /* нет сервера — запускаем в браузере */ }
    }
    return browserEngine();
  }

  // ---------------------------------------------------------------- отправка
  let busy = false;
  async function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    if (recording && rec) rec.stop();
    busy = true;
    sendBtn.disabled = true;
    const chat = current();
    if (!chat.messages.length) {
      log.textContent = "";
      chat.title = text.length > 48 ? text.slice(0, 47) + "…" : text;
      $("chatTitle").textContent = chat.title;
    }
    const history = historyOf(chat);
    const userMsg = {role: "user", text: text};
    chat.messages.push(userMsg);
    chat.updated = Date.now();
    renderMessage(userMsg);
    input.value = "";
    autosize();
    const pending = document.createElement("div");
    pending.className = "inner msg rai pending";
    pending.innerHTML = `<div class="who">Rai</div><div class="bubble">` +
      (engineReady ? `<span class="typing" aria-label="Rai печатает"><span></span><span></span><span></span></span>` : "Rai ещё загружается, отвечу сразу после загрузки…") + `</div>`;
    log.append(pending);
    log.scrollTop = log.scrollHeight;
    save(); renderSidebar();
    let reply;
    try {
      const engine = await enginePromise;
      await new Promise((r) => setTimeout(r, 40));  // успеть показать «печатает…»
      const t0 = performance.now();
      const data = await engine.ask(chat.version, text, chat.id, history);
      const ms = Math.max(1, Math.round(performance.now() - t0));
      reply = {role: "rai", text: data.answer || "Результат не получен.", attachments: data.attachments || [],
               meta: (data.version_name || versionName(chat.version)) + " · " + ms + " мс"};
    } catch (e) {
      reply = {role: "rai", text: "Не удалось получить ответ. Попробуйте ещё раз.", meta: "ошибка"};
    }
    pending.remove();
    chat.messages.push(reply);
    chat.updated = Date.now();
    if (currentId === chat.id) renderMessage(reply);
    save(); renderSidebar();
    busy = false;
    sendBtn.disabled = false;
    log.scrollTop = log.scrollHeight;
    input.focus();
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }

  // ---------------------------------------------------------------- события
  function closeMenu() { document.body.classList.remove("menu-open"); }
  $("menuBtn").addEventListener("click", () => document.body.classList.add("menu-open"));
  $("backdrop").addEventListener("click", closeMenu);
  $("newChat").addEventListener("click", newChat);
  $("chatTitle").addEventListener("click", () => {
    const item = $("chatList").querySelector(".chat-item.active");
    if (item) { document.body.classList.add("menu-open"); startRename(item, current()); }
  });
  $("form").addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); }
  });
  input.addEventListener("input", autosize);
  log.addEventListener("click", (e) => {
    const btn = e.target.closest(".copy-code");
    if (!btn) return;
    const code = btn.closest(".codeblock").querySelector("code");
    copyRich(code.textContent, "<pre>" + esc(code.textContent) + "</pre>", code);
  });

  // ---------------------------------------------------------------- аккаунт
  let authUser = null, authAvailable = false, googleEnabled = false, pushTimer = null, pulling = false;
  const dialog = $("authDialog");

  function renderAccount() {
    const box = $("account");
    if (authUser) {
      const initial = esc((authUser.name || authUser.login || "?").trim().charAt(0).toUpperCase());
      box.className = "account";
      box.innerHTML = `<div class="avatar">${authUser.avatar ? `<img alt="" src="${esc(authUser.avatar)}" referrerpolicy="no-referrer">` : initial}</div>` +
        `<div class="who-am"><b>${esc(authUser.name || authUser.login)}</b><span>${esc(authUser.email || "@" + authUser.login)}</span></div>` +
        `<button class="icon-btn" type="button" id="logoutBtn">Выйти</button>`;
      $("logoutBtn").addEventListener("click", logout);
      $("storeNote").textContent = "Чаты сохраняются в вашем аккаунте.";
    } else {
      box.className = "";
      if (backUrl && !authAvailable) {
        // Пришли с сайта Rteam: вход уже был там, показываем дорогу назад.
        box.className = "";
        box.innerHTML = `<a class="back-link" href="${esc(backUrl)}">← На сайт Rteam</a>`;
        $("storeNote").textContent = "Чаты хранятся в этом браузере.";
        return;
      }
      box.innerHTML = `<button id="loginBtn" type="button">Войти или зарегистрироваться</button>`;
      $("loginBtn").addEventListener("click", () => openAuth("login"));
      $("storeNote").textContent = "Чаты хранятся в этом браузере.";
    }
  }

  function openAuth(tab) {
    showTab(tab);
    $("authError").hidden = true;
    $("googleBtn").setAttribute("aria-disabled", String(!(authAvailable && googleEnabled)));
    $("authNote").textContent = !authAvailable
      ? "Вход и регистрация работают, когда Rai запущен на своём сервере (python app.py или хостинг). Сейчас Rai работает прямо в браузере, чаты хранятся только здесь."
      : googleEnabled ? "" : "Вход через Google появится, когда на сервере задан GOOGLE_CLIENT_SECRET.";
    for (const f of dialog.querySelectorAll("input, .auth-form button")) f.disabled = !authAvailable;
    if (dialog.showModal) dialog.showModal(); else dialog.setAttribute("open", "");
  }
  function showTab(tab) {
    const reg = tab === "register";
    $("tabLogin").setAttribute("aria-selected", String(!reg));
    $("tabRegister").setAttribute("aria-selected", String(reg));
    $("loginForm").hidden = reg;
    $("registerForm").hidden = !reg;
    $("authTitle").textContent = reg ? "Регистрация" : "Вход в Rai";
  }
  $("tabLogin").addEventListener("click", () => showTab("login"));
  $("tabRegister").addEventListener("click", () => showTab("register"));
  $("authClose").addEventListener("click", () => dialog.close());

  async function authPost(path, body) {
    const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
                                 credentials: "same-origin", body: JSON.stringify(body)});
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "Ошибка " + r.status);
    return data;
  }
  async function submitAuth(e, path, body) {
    e.preventDefault();
    $("authError").hidden = true;
    try {
      const data = await authPost(path, body);
      authUser = data.user;
      dialog.close();
      renderAccount();
      toast("Здравствуйте, " + (authUser.name || authUser.login) + "!");
      await pullChats();
    } catch (err) {
      $("authError").textContent = err.message;
      $("authError").hidden = false;
    }
  }
  $("loginForm").addEventListener("submit", (e) => submitAuth(e, "auth/login",
    {login: $("loginName").value.trim(), password: $("loginPass").value}));
  $("registerForm").addEventListener("submit", (e) => submitAuth(e, "auth/register",
    {login: $("regLogin").value.trim(), name: $("regName").value.trim(), email: $("regEmail").value.trim(), password: $("regPass").value}));

  async function logout() {
    try { await authPost("auth/logout", {}); } catch (e) { /* всё равно выходим */ }
    authUser = null;
    // Чаты остаются в аккаунте; с этого устройства убираем, чтобы их не увидел следующий человек.
    chats = [makeChat()];
    currentId = chats[0].id;
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* нет доступа к хранилищу */ }
    renderAccount(); renderAll();
    toast("Вы вышли из аккаунта");
  }

  // Слияние: у каждого чата берём более свежую версию (из браузера или с сервера).
  async function pullChats() {
    if (!authUser) return;
    pulling = true;
    try {
      const r = await fetch("api/chats", {credentials: "same-origin"});
      if (!r.ok) return;
      const remote = (await r.json()).chats || [];
      const byId = new Map(remote.filter((c) => c && c.id && Array.isArray(c.messages)).map((c) => [c.id, c]));
      for (const c of chats) {
        if (!c.messages.length) continue;
        const other = byId.get(c.id);
        if (!other || (c.updated || 0) > (other.updated || 0)) byId.set(c.id, c);
      }
      if (byId.size) {
        chats = Array.from(byId.values()).sort((a, b) => b.updated - a.updated);
        if (!chats.some((c) => c.id === currentId)) currentId = chats[0].id;
      }
      renderAll();
    } finally {
      pulling = false;
    }
    save();
  }
  function schedulePush() {
    if (!authUser || pulling) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      try {
        const r = await fetch("api/chats", {method: "PUT", headers: {"Content-Type": "application/json"}, credentials: "same-origin",
                                            body: JSON.stringify({chats: chats.filter((c) => c.messages.length)})});
        if (!r.ok) toast((await r.json().catch(() => ({}))).error || "Не удалось сохранить чаты в аккаунт");
      } catch (e) { toast("Нет связи с сервером — чаты сохранены в браузере"); }
    }, 1200);
  }

  async function initAuth(engine) {
    authAvailable = engine.mode === "server" && engine.root === "";
    if (!authAvailable) return;
    try {
      const r = await fetch("auth/me", {credentials: "same-origin"});
      const d = await r.json();
      googleEnabled = !!d.google;
      authUser = d.user;
      renderAccount();
      if (authUser) await pullChats();
    } catch (e) { authAvailable = false; }
    const q = new URLSearchParams(location.search);
    const errors = {state: "Вход через Google не удался: устаревшая ссылка, попробуйте ещё раз.",
                    cancelled: "Вход через Google отменён.", google: "Google не подтвердил вход. Попробуйте ещё раз.",
                    already_linked: "Этот Google уже привязан к другому аккаунту.",
                    google_not_configured: "Вход через Google ещё не настроен на сервере."};
    if (q.get("auth") === "google" && authUser) toast("Вы вошли через Google");
    if (q.get("auth_error")) toast(errors[q.get("auth_error")] || "Не удалось войти");
    if (q.has("auth") || q.has("auth_error")) history.replaceState(null, "", location.pathname);
  }

  load();
  renderAll();
  renderAccount();

  const enginePromise = startEngine().then(async (engine) => {
    try {
      const list = await engine.versions();
      if (Array.isArray(list) && list.length) { VERSIONS = list; renderVersions(); renderSidebar(); }
    } catch (e) { /* остаёмся со встроенным списком */ }
    engineReady = true;
    setStatus("ready", engine.mode === "server" ? "Сервер Rai" : "Rai работает в браузере");
    initAuth(engine);
    return engine;
  }).catch((err) => {
    setStatus("error", "Rai не запустился");
    const box = document.createElement("div");
    box.className = "inner msg rai";
    box.innerHTML = `<div class="who">Rai</div><div class="bubble md"></div>`;
    box.querySelector(".bubble").innerHTML = renderMarkdown("**Не получилось запустить Rai:** " + err.message.replace(/\n/g, "\n\n") +
      "\n\nПроверьте интернет (или не блокирует ли антивирус загрузку) и попробуйте снова.");
    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "btn red retry";
    retry.textContent = "Попробовать снова";
    retry.addEventListener("click", () => location.reload());
    box.append(retry);
    log.append(box);
    throw err;
  });
})();
</script>
</body>
</html>
