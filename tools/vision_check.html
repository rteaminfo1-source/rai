<!DOCTYPE html>
<!-- Проверка зрения Rai в настоящем браузере (workflow «Проверка зрения»): vision.js + модель CLIP + vision_labels.json
     + тысячи конкретных вещей (vision_topics.json.gz) + признаки картинки + разбор по частям -->
<meta charset="utf-8">
<script>window.RAI_VISION_URL = "../vision_labels.json"; window.RAI_VISION_TOPICS_URL = "../vision_topics.json.gz";</script>
<script src="../vision.js"></script>
<script>
async function asDataUrl(url) {
  const blob = await (await fetch(url)).blob();
  return await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
}
window.check = async (items) => {
  const out = [];
  for (const [title, lang] of items) {
    const page = await (await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/` + encodeURIComponent(title))).json();
    const src = page.thumbnail && page.thumbnail.source;
    if (!src) { out.push({title: title, error: "нет картинки"}); continue; }
    const seen = await window.RaiVision.look(await asDataUrl(src), (s) => console.log(s), {detail: true});
    out.push({title: title, ms: seen.ms, labels: seen.labels.slice(0, 4).map((l) => l.ru + " " + Math.round(l.p * 100) + "%"),
              attrs: (seen.attrs || []).map((a) => a.ru + ": " + a.value + " " + Math.round(a.p * 100) + "%"),
              known: (seen.known || []).map((k) => k.title + " (" + k.by + " " + k.score + ")"),
              regions: (seen.regions || []).map((r) => r.where + ": " + r.ru),
              colors: seen.colors.map((c) => c.name), tone: seen.tone, light: seen.light});
  }
  return out;
};
</script>
