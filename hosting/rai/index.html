<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rai — ИИ Rteam</title>
<meta name="description" content="Rai — собственный ИИ-ассистент команды Rteam: вопросы, погода, валюты, перевод, картинки, презентации и Code для программирования.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Onest:wght@500;600&display=swap">
<style>
  /* rai.rteam.info: тонкая шапка + чат Rai с GitHub Pages на всю страницу */
  :root { --bg: #0b0b0c; --fg: #f3f1f1; --muted: #9b9599; --line: #2a2a2e; --red: #e10600; --red-hi: #ff2a2a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 500 14px/1.4 "Onest", "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); }
  header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font: 800 18px/1 "Unbounded", "Arial Black", sans-serif; color: var(--fg); text-decoration: none; }
  .brand span { color: var(--red); }
  nav { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; }
  nav a { color: var(--fg); text-decoration: none; }
  nav a:hover, nav a:focus-visible { color: var(--red-hi); }
  nav a.cta { color: #fff; background: var(--red); padding: 6px 12px; border-radius: 8px; }
  nav a.cta:hover { background: var(--red-hi); color: #fff; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  noscript { padding: 16px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">R<span>ai</span></a>
  <nav>
    <a href="#code" id="codeLink">Code</a>
    <a class="cta" href="https://aistudio.rteam.info/sso_start.php">AI Studio</a>
    <a href="https://rteam.info/account.php">Кабинет</a>
    <a href="https://github.com/rteaminfo1-source/rai" rel="noopener">GitHub</a>
  </nav>
</header>
<!-- Сам чат Rai живёт на GitHub Pages; здесь он встроен в страницу. -->
<iframe id="rai" src="https://rteaminfo1-source.github.io/rai/?back=https%3A%2F%2Frteam.info%2F"
        title="Чат Rai" allow="microphone; clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  // rai.rteam.info/#code — сразу открыть вкладку Code
  (function () {
    var frame = document.getElementById("rai"), base = frame.src.split("#")[0];
    function sync() { frame.src = base + (location.hash === "#code" ? "#code" : "#chat"); }
    if (location.hash === "#code") sync();
    window.addEventListener("hashchange", sync);
  })();
</script>
</body>
</html>
